<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>A person can stop, mankind cannot</title>

<rect x="0.5" y="0.5" width="759" height="439" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">A person can stop, mankind cannot</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Two scales of one system, and the two voices that spoke to them.</text>
<text x="334.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">one person</text>
<text x="602.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">mankind</text>
<line x1="28.0" y1="118.0" x2="736.0" y2="118.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="148.0" font-size="13.5" fill="#0b0b0b" font-weight="600">can it stop</text>
<text x="34.0" y="165.0" font-size="11" fill="#8a8985">the forum, 2013</text>
<rect x="205.0" y="124.0" width="258.0" height="54.0" rx="6" fill="#e6f4ea"/>
<text x="334.0" y="147.0" font-size="12" fill="#008300" text-anchor="middle">yes, and it is paid for:</text>
<text x="334.0" y="163.0" font-size="12" fill="#008300" text-anchor="middle">the one who stopped falls behind</text>
<rect x="473.0" y="124.0" width="258.0" height="54.0" rx="6" fill="#fbe3e2"/>
<text x="602.0" y="147.0" font-size="12" fill="#b3302f" text-anchor="middle">no: whoever has not stopped</text>
<text x="602.0" y="163.0" font-size="12" fill="#b3302f" text-anchor="middle">gains, and the rest follow him</text>
<line x1="28.0" y1="184.0" x2="736.0" y2="184.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="214.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">what a word</tspan><tspan x="34.0" dy="16.9">does to it</tspan></text>
<rect x="205.0" y="190.0" width="258.0" height="54.0" rx="6" fill="#e6f4ea"/>
<text x="334.0" y="213.0" font-size="12" fill="#008300" text-anchor="middle">one of the causes</text>
<text x="334.0" y="229.0" font-size="12" fill="#008300" text-anchor="middle">of what he does next</text>
<rect x="473.0" y="190.0" width="258.0" height="54.0" rx="6" fill="#efeeea"/>
<text x="602.0" y="213.0" font-size="12" fill="#52514e" text-anchor="middle">moves no setpoint</text>
<text x="602.0" y="229.0" font-size="12" fill="#52514e" text-anchor="middle">of the whole</text>
<line x1="28.0" y1="250.0" x2="736.0" y2="250.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="288.0" font-size="13.5" fill="#0b0b0b" font-weight="600">who spoke to it</text>
<text x="334.0" y="279.0" font-size="12" fill="#0b0b0b" text-anchor="middle">the late pages,</text>
<text x="334.0" y="295.0" font-size="12" fill="#0b0b0b" text-anchor="middle">2023–2025</text>
<text x="602.0" y="279.0" font-size="12" fill="#0b0b0b" text-anchor="middle">the blog and the fire,</text>
<text x="602.0" y="295.0" font-size="12" fill="#0b0b0b" text-anchor="middle">2011–2012</text>
<line x1="28.0" y1="316.0" x2="736.0" y2="316.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="346.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">where he stepped</tspan><tspan x="34.0" dy="16.9">over the line</tspan></text>
<rect x="205.0" y="322.0" width="258.0" height="54.0" rx="6" fill="#fdf3d7"/>
<text x="334.0" y="345.0" font-size="12" fill="#8a6200" text-anchor="middle">“if every generation…”:</text>
<text x="334.0" y="361.0" font-size="12" fill="#8a6200" text-anchor="middle">a hope for mankind</text>
<rect x="473.0" y="322.0" width="258.0" height="54.0" rx="6" fill="#fdf3d7"/>
<text x="602.0" y="345.0" font-size="12" fill="#8a6200" text-anchor="middle">“so I propose nothing”:</text>
<text x="602.0" y="361.0" font-size="12" fill="#8a6200" text-anchor="middle">a verdict on the person</text>
<line x1="28.0" y1="382.0" x2="736.0" y2="382.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="408.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">The evening's reading. Green: holds on this scale. Red: does not hold. Grey: no effect found.</tspan><tspan x="28.0" dy="14.4">Yellow: a conclusion carried from one scale to the other.</tspan></text>
</svg>
