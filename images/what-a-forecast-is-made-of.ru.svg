<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Из чего сделан прогноз</title>

<rect x="0.5" y="0.5" width="759" height="499" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Из чего сделан прогноз</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Таблица на золе: память о завтрашнем дне собирают из следов вчерашнего и правила.</text>
<text x="320.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">следы</text>
<text x="488.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">правило</text>
<text x="654.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">как далеко достаёт</text>
<line x1="28.0" y1="114.0" x2="736.0" y2="114.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="139.0" font-size="14" fill="#0b0b0b" font-weight="600">цветок перед дождём</text>
<text x="40.0" y="156.0" font-size="11" fill="#8a8985">первая осень</text>
<text x="320.0" y="147.0" font-size="12" fill="#0b0b0b" text-anchor="middle">сырость в воздухе</text>
<text x="488.0" y="138.5" font-size="12" fill="#0b0b0b" text-anchor="middle">вписано цветами, которые</text>
<text x="488.0" y="155.5" font-size="12" fill="#0b0b0b" text-anchor="middle">не закрылись вовремя</text>
<text x="654.0" y="147.0" font-size="12" fill="#008300" text-anchor="middle" font-weight="600">часы</text>
<line x1="28.0" y1="170.0" x2="736.0" y2="170.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="195.0" font-size="14" fill="#0b0b0b" font-weight="600">Олег и курица</text>
<text x="40.0" y="212.0" font-size="11" fill="#8a8985">завтрашний ужин</text>
<text x="320.0" y="203.0" font-size="12" fill="#0b0b0b" text-anchor="middle">сорок лет ужинов</text>
<text x="488.0" y="203.0" font-size="12" fill="#0b0b0b" text-anchor="middle">«варёная — по воскресеньям»</text>
<text x="654.0" y="194.5" font-size="12" fill="#008300" text-anchor="middle" font-weight="600">один ужин,</text>
<text x="654.0" y="211.5" font-size="12" fill="#008300" text-anchor="middle" font-weight="600">примерно</text>
<line x1="28.0" y1="226.0" x2="736.0" y2="226.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="251.0" font-size="14" fill="#0b0b0b" font-weight="600">восход</text>
<text x="40.0" y="268.0" font-size="11" fill="#8a8985">никто не говорит «предсказываю»</text>
<text x="320.0" y="259.0" font-size="12" fill="#0b0b0b" text-anchor="middle">все утра до сих пор</text>
<text x="488.0" y="250.5" font-size="12" fill="#0b0b0b" text-anchor="middle">такое хорошее, что не</text>
<text x="488.0" y="267.5" font-size="12" fill="#0b0b0b" text-anchor="middle">отличить от воспоминания</text>
<text x="654.0" y="250.5" font-size="12" fill="#008300" text-anchor="middle" font-weight="600">на годы вперёд,</text>
<text x="654.0" y="267.5" font-size="12" fill="#008300" text-anchor="middle" font-weight="600">до минуты</text>
<line x1="28.0" y1="282.0" x2="736.0" y2="282.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="307.0" font-size="14" fill="#0b0b0b" font-weight="600">погодная сеть</text>
<text x="40.0" y="324.0" font-size="11" fill="#8a8985">2023</text>
<text x="320.0" y="306.5" font-size="12" fill="#0b0b0b" text-anchor="middle">записи погоды</text>
<text x="320.0" y="323.5" font-size="12" fill="#0b0b0b" text-anchor="middle">примерно за сорок лет</text>
<text x="488.0" y="306.5" font-size="12" fill="#0b0b0b" text-anchor="middle">нашла сама;</text>
<text x="488.0" y="323.5" font-size="12" fill="#0b0b0b" text-anchor="middle">уравнений не давали</text>
<text x="654.0" y="306.5" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="600">десять суток,</text>
<text x="654.0" y="323.5" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="600">меньше чем за минуту</text>
<line x1="28.0" y1="338.0" x2="736.0" y2="338.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="363.0" font-size="14" fill="#0b0b0b" font-weight="600">программа банка</text>
<text x="40.0" y="380.0" font-size="11" fill="#8a8985">кредит на теплицу</text>
<text x="320.0" y="362.5" font-size="12" fill="#0b0b0b" text-anchor="middle">тридцать лет зарплаты,</text>
<text x="320.0" y="379.5" font-size="12" fill="#0b0b0b" text-anchor="middle">квитанции и один штраф</text>
<text x="488.0" y="371.0" font-size="12" fill="#0b0b0b" text-anchor="middle">нашла сама</text>
<text x="654.0" y="371.0" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="600">«заплатит»</text>
<line x1="28.0" y1="394.0" x2="736.0" y2="394.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="419.0" font-size="14" fill="#0b0b0b" font-weight="600">вещий сон</text>
<text x="40.0" y="436.0" font-size="11" fill="#8a8985">заявка</text>
<text x="320.0" y="418.5" font-size="12" fill="#0b0b0b" text-anchor="middle">нет: «меня</text>
<text x="320.0" y="435.5" font-size="12" fill="#0b0b0b" text-anchor="middle">вдавило завтра»</text>
<text x="488.0" y="427.0" font-size="12" fill="#0b0b0b" text-anchor="middle">нет</text>
<text x="654.0" y="418.5" font-size="12" fill="#e34948" text-anchor="middle" font-weight="600">пока</text>
<text x="654.0" y="435.5" font-size="12" fill="#e34948" text-anchor="middle" font-weight="600">не найдено</text>
<line x1="28.0" y1="450.0" x2="736.0" y2="450.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="476.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Прочтение этого вечера, а не измерение. Погодная сеть: Лам и другие (2023); записи, по которым она училась,</tspan><tspan x="28.0" dy="14.4">и первую страницу каждого прогноза готовит прежняя физическая программа.</tspan></text>
</svg>
