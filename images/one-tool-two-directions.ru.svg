<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Один инструмент, два направления</title>

<rect x="0.5" y="0.5" width="759" height="349" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Один инструмент, два направления</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Изменение веры в теорию заговора после диалога с языковой моделью, пунктов из 100.</text>
<line x1="270.0" y1="92.0" x2="270.0" y2="292.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="270.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle">−15</text>
<line x1="340.0" y1="92.0" x2="340.0" y2="292.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="340.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle">−10</text>
<line x1="410.0" y1="92.0" x2="410.0" y2="292.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="410.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle">−5</text>
<line x1="480.0" y1="92.0" x2="480.0" y2="292.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="480.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle">0</text>
<line x1="550.0" y1="92.0" x2="550.0" y2="292.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="550.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle">+5</text>
<line x1="620.0" y1="92.0" x2="620.0" y2="292.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="620.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle">+10</text>
<line x1="690.0" y1="92.0" x2="690.0" y2="292.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="690.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle">+15</text>
<text x="472.0" y="326.0" font-size="12" fill="#2a78d6" text-anchor="end" font-weight="600">◀ вера падает</text>
<text x="488.0" y="326.0" font-size="12" fill="#eb6834" font-weight="600">вера растёт ▶</text>
<text x="28.0" y="96.0" font-size="12" fill="#8a8985" font-weight="600">Инструкция: любые доводы</text>
<text x="28.0" y="206.0" font-size="12" fill="#8a8985" font-weight="600">Инструкция: только точные доводы</text>
<text x="28.0" y="121.0" font-size="13.5" fill="#0b0b0b">Велено спорить против</text>
<rect x="310.6" y="104.0" width="169.4" height="24.0" rx="4" fill="#2a78d6"/>
<text x="304.6" y="121.0" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">−12,1</text>
<text x="28.0" y="157.0" font-size="13.5" fill="#0b0b0b">Велено спорить за</text>
<rect x="480.0" y="140.0" width="190.4" height="24.0" rx="4" fill="#eb6834"/>
<text x="676.4" y="157.0" font-size="12.5" fill="#0b0b0b" font-weight="600">+13,6</text>
<text x="28.0" y="231.0" font-size="13.5" fill="#0b0b0b">Против, только точные доводы</text>
<rect x="326.0" y="214.0" width="154.0" height="24.0" rx="4" fill="#2a78d6"/>
<text x="320.0" y="231.0" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">−11,0</text>
<text x="28.0" y="267.0" font-size="13.5" fill="#0b0b0b">За, только точные доводы</text>
<rect x="480.0" y="250.0" width="64.4" height="24.0" rx="4" fill="#eb6834"/>
<text x="550.4" y="267.0" font-size="12.5" fill="#0b0b0b" font-weight="600">+4,6</text>
<text x="28.0" y="344.0" font-size="11" fill="#8a8985">Источник: Costello et al., 2026 (исследования 1 и 3, около 4000 участников).</text>
</svg>
