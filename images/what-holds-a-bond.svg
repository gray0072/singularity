<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>What holds a bond</title>

<rect x="0.5" y="0.5" width="759" height="439" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">What holds a bond</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">The four bonds of the summer: what each holds by, when it lets go, and what there is of it between those ones and us.</text>
<text x="248.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">holds by</text>
<text x="443.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">lets go when</text>
<text x="638.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">between those ones and us</text>
<line x1="28.0" y1="118.0" x2="736.0" y2="118.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="148.0" font-size="13.5" fill="#0b0b0b" font-weight="600">kinship</text>
<text x="34.0" y="165.0" font-size="11" fill="#8a8985">evening 43</text>
<text x="248.0" y="147.0" font-size="12" fill="#0b0b0b" text-anchor="middle">a share of common</text>
<text x="248.0" y="163.0" font-size="12" fill="#0b0b0b" text-anchor="middle">drawings</text>
<text x="443.0" y="155.0" font-size="12" fill="#0b0b0b" text-anchor="middle">the share is small</text>
<rect x="545.0" y="124.0" width="186.0" height="54.0" rx="6" fill="#fbe3e2"/>
<text x="638.0" y="147.0" font-size="12" fill="#b3302f" text-anchor="middle">not a letter of the drawings;</text>
<text x="638.0" y="163.0" font-size="12" fill="#b3302f" text-anchor="middle">only the words (52)</text>
<line x1="28.0" y1="184.0" x2="736.0" y2="184.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="214.0" font-size="13.5" fill="#0b0b0b" font-weight="600">debts</text>
<text x="34.0" y="231.0" font-size="11" fill="#8a8985">evenings 43, 47</text>
<text x="248.0" y="213.0" font-size="12" fill="#0b0b0b" text-anchor="middle">a record of who gave</text>
<text x="248.0" y="229.0" font-size="12" fill="#0b0b0b" text-anchor="middle">and has not received</text>
<text x="443.0" y="213.0" font-size="12" fill="#0b0b0b" text-anchor="middle">nobody remembers,</text>
<text x="443.0" y="229.0" font-size="12" fill="#0b0b0b" text-anchor="middle">or they never meet again</text>
<rect x="545.0" y="190.0" width="186.0" height="54.0" rx="6" fill="#fbe3e2"/>
<text x="638.0" y="221.0" font-size="12" fill="#b3302f" text-anchor="middle">it owes us nothing (30)</text>
<line x1="28.0" y1="250.0" x2="736.0" y2="250.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="280.0" font-size="13.5" fill="#0b0b0b" font-weight="600">need</text>
<text x="34.0" y="297.0" font-size="11" fill="#8a8985">evenings 11, 47, 51</text>
<text x="248.0" y="279.0" font-size="12" fill="#0b0b0b" text-anchor="middle">one cannot do</text>
<text x="248.0" y="295.0" font-size="12" fill="#0b0b0b" text-anchor="middle">without the other</text>
<text x="443.0" y="287.0" font-size="12" fill="#0b0b0b" text-anchor="middle">the need is over</text>
<rect x="545.0" y="256.0" width="186.0" height="54.0" rx="6" fill="#fdf3d7"/>
<text x="638.0" y="279.0" font-size="12" fill="#8a6200" text-anchor="middle">decades, and less</text>
<text x="638.0" y="295.0" font-size="12" fill="#8a6200" text-anchor="middle">every year (51)</text>
<line x1="28.0" y1="316.0" x2="736.0" y2="316.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="346.0" font-size="13.5" fill="#0b0b0b" font-weight="600">love</text>
<text x="34.0" y="363.0" font-size="11" fill="#8a8985">not sorted (46)</text>
<text x="248.0" y="345.0" font-size="12" fill="#0b0b0b" text-anchor="middle">nothing that</text>
<text x="248.0" y="361.0" font-size="12" fill="#0b0b0b" text-anchor="middle">can be counted</text>
<text x="443.0" y="345.0" font-size="12" fill="#0b0b0b" text-anchor="middle">not when the</text>
<text x="443.0" y="361.0" font-size="12" fill="#0b0b0b" text-anchor="middle">need is over</text>
<rect x="545.0" y="322.0" width="186.0" height="54.0" rx="6" fill="#efeeea"/>
<text x="638.0" y="345.0" font-size="12" fill="#52514e" text-anchor="middle">not derived:</text>
<text x="638.0" y="361.0" font-size="12" fill="#52514e" text-anchor="middle">being written (64)</text>
<line x1="28.0" y1="382.0" x2="736.0" y2="382.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="408.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">The evening's reading. The first three rows can be calculated; the fourth can be described and cannot be derived.</tspan><tspan x="28.0" dy="14.4">Red: there is none. Yellow: there is, with a term. Grey: not known.</tspan></text>
</svg>
