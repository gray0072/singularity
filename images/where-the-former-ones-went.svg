<svg xmlns="http://www.w3.org/2000/svg" width="760" height="498" viewBox="0 0 760 498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Where the former ones went</title>

<rect x="0.5" y="0.5" width="759" height="497" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Where the former ones went</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">A page of Oleg's notebook: what the former masters of the planet kept, what they paid, on what it hangs.</text>
<text x="304.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">kept</text>
<text x="464.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">paid</text>
<text x="646.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">it lasts</text>
<line x1="28.0" y1="114.0" x2="736.0" y2="114.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="139.0" font-size="14" fill="#0b0b0b" font-weight="600">a niche</text>
<text x="40.0" y="156.0" font-size="11" fill="#8a8985">those that cannot stand oxygen</text>
<text x="304.0" y="139.0" font-size="12" fill="#0b0b0b" text-anchor="middle"><tspan x="304.0" dy="0.0">everything,</tspan><tspan x="304.0" dy="15.0">as it was</tspan></text>
<text x="464.0" y="139.0" font-size="12" fill="#0b0b0b" text-anchor="middle"><tspan x="464.0" dy="0.0">the planet, the say</tspan><tspan x="464.0" dy="15.0">in what the air will be</tspan></text>
<text x="646.0" y="139.0" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600"><tspan x="646.0" dy="0.0">while the place</tspan><tspan x="646.0" dy="15.0">is not needed</tspan></text>
<line x1="28.0" y1="170.0" x2="736.0" y2="170.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="195.0" font-size="14" fill="#0b0b0b" font-weight="600">an organelle</text>
<text x="40.0" y="212.0" font-size="11" fill="#8a8985">the swallowed bacterium</text>
<text x="304.0" y="203.0" font-size="12" fill="#0b0b0b" text-anchor="middle">one job</text>
<text x="464.0" y="203.0" font-size="12" fill="#0b0b0b" text-anchor="middle">everything else</text>
<text x="646.0" y="195.0" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600"><tspan x="646.0" dy="0.0">while the job</tspan><tspan x="646.0" dy="15.0">is needed</tspan></text>
<line x1="28.0" y1="226.0" x2="736.0" y2="226.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="251.0" font-size="14" fill="#0b0b0b" font-weight="600">livestock, a pet</text>
<text x="40.0" y="268.0" font-size="11" fill="#8a8985">the dog, the wheat, the horse</text>
<text x="304.0" y="251.0" font-size="12" fill="#0b0b0b" text-anchor="middle"><tspan x="304.0" dy="0.0">the numbers,</tspan><tspan x="304.0" dy="15.0">the feed</tspan></text>
<text x="464.0" y="251.0" font-size="12" fill="#0b0b0b" text-anchor="middle"><tspan x="464.0" dy="0.0">the head, the say</tspan><tspan x="464.0" dy="15.0">in who is born</tspan></text>
<text x="646.0" y="251.0" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600"><tspan x="646.0" dy="0.0">while the feeder</tspan><tspan x="646.0" dy="15.0">wants</tspan></text>
<line x1="28.0" y1="282.0" x2="736.0" y2="282.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="307.0" font-size="14" fill="#0b0b0b" font-weight="600">a descendant</text>
<text x="40.0" y="324.0" font-size="11" fill="#8a8985">the birds</text>
<text x="304.0" y="315.0" font-size="12" fill="#0b0b0b" text-anchor="middle">the line</text>
<text x="464.0" y="307.0" font-size="12" fill="#0b0b0b" text-anchor="middle"><tspan x="464.0" dy="0.0">the size, the role,</tspan><tspan x="464.0" dy="15.0">the name</tspan></text>
<text x="646.0" y="307.0" font-size="12" fill="#008300" text-anchor="middle" font-weight="600"><tspan x="646.0" dy="0.0">hangs on nobody:</tspan><tspan x="646.0" dy="15.0">needs little</tspan></text>
<line x1="28.0" y1="338.0" x2="736.0" y2="338.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="363.0" font-size="14" fill="#0b0b0b" font-weight="600">fuel</text>
<text x="40.0" y="380.0" font-size="11" fill="#8a8985">the coal forest</text>
<text x="304.0" y="371.0" font-size="12" fill="#0b0b0b" text-anchor="middle">nothing</text>
<text x="464.0" y="371.0" font-size="12" fill="#0b0b0b" text-anchor="middle">everything</text>
<text x="646.0" y="363.0" font-size="12" fill="#52514e" text-anchor="middle"><tspan x="646.0" dy="0.0">burned:</tspan><tspan x="646.0" dy="15.0">not asked</tspan></text>
<line x1="28.0" y1="394.0" x2="736.0" y2="394.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="40.0" y="419.0" font-size="14" fill="#8a8985" font-weight="600">a print in stone</text>
<text x="40.0" y="436.0" font-size="11" fill="#8a8985">the trilobites</text>
<text x="304.0" y="427.0" font-size="12" fill="#8a8985" text-anchor="middle">nothing</text>
<text x="464.0" y="427.0" font-size="12" fill="#8a8985" text-anchor="middle">everything</text>
<text x="646.0" y="427.0" font-size="12" fill="#8a8985" text-anchor="middle">—</text>
<line x1="28.0" y1="450.0" x2="736.0" y2="450.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="474.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Rows 1–3 were written on the evenings 38, 42 and 48. The page as a whole is Andrey's reading: a list of what</tspan><tspan x="28.0" dy="14.4">has already happened, not of what can happen. Three rows of the five hang on the new master.</tspan></text>
</svg>
