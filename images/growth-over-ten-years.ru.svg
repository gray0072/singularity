<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Рост за десять лет</title>

<rect x="0.5" y="0.5" width="759" height="269" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Рост за десять лет</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Во сколько раз величина вырастает за десятилетие, логарифмическая шкала.</text>
<line x1="300.0" y1="88.0" x2="300.0" y2="222.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="240.0" font-size="11.5" fill="#52514e" text-anchor="middle">1</text>
<line x1="370.0" y1="88.0" x2="370.0" y2="222.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="370.0" y="240.0" font-size="11.5" fill="#52514e" text-anchor="middle">10</text>
<line x1="440.0" y1="88.0" x2="440.0" y2="222.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="440.0" y="240.0" font-size="11.5" fill="#52514e" text-anchor="middle">100</text>
<line x1="510.0" y1="88.0" x2="510.0" y2="222.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="510.0" y="240.0" font-size="11.5" fill="#52514e" text-anchor="middle">1000</text>
<line x1="580.0" y1="88.0" x2="580.0" y2="222.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="580.0" y="240.0" font-size="11.5" fill="#52514e" text-anchor="middle">10 000</text>
<line x1="650.0" y1="88.0" x2="650.0" y2="222.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="650.0" y="240.0" font-size="11.5" fill="#52514e" text-anchor="middle">100 000</text>
<line x1="720.0" y1="88.0" x2="720.0" y2="222.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="720.0" y="240.0" font-size="11.5" fill="#52514e" text-anchor="middle">1 000 000</text>
<text x="288.0" y="113.0" font-size="14" fill="#0b0b0b" text-anchor="end">Вычисления для обучения передовых ИИ</text>
<rect x="300.0" y="97.0" width="421.4" height="22.0" rx="4" fill="#2a78d6"/>
<text x="713.4" y="113.0" font-size="12.5" fill="#ffffff" text-anchor="end" font-weight="600">в 4–5 раз в год → ≈ в 1 000 000 раз</text>
<text x="288.0" y="155.0" font-size="14" fill="#0b0b0b" text-anchor="end">Закон Мура</text>
<rect x="300.0" y="139.0" width="105.4" height="22.0" rx="4" fill="#8a8985"/>
<text x="413.4" y="155.0" font-size="12.5" fill="#52514e">вдвое за два года → ≈ в 32 раза</text>
<text x="288.0" y="197.0" font-size="14" fill="#0b0b0b" text-anchor="end">Интеллект человека</text>
<circle cx="300.0" cy="192.0" r="5.0" fill="#eb6834"/>
<text x="312.0" y="197.0" font-size="12.5" fill="#52514e">1: не растёт</text>
<text x="28.0" y="258.0" font-size="11.5" fill="#8a8985">Источники: Epoch AI (2024); Мур (1975).</text>
</svg>
