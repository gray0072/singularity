<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Как быстро работают носители разума</title>

<rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Как быстро работают носители разума</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Логарифмическая шкала. Разум на быстрой платформе прожил бы год нашего мышления за несколько секунд.</text>
<text x="28.0" y="96.0" font-size="12" fill="#8a8985" font-weight="600">Переключения, раз в секунду</text>
<text x="28.0" y="206.0" font-size="12" fill="#8a8985" font-weight="600">Скорость сигнала, метров в секунду</text>
<text x="248.0" y="121.0" font-size="13.5" fill="#0b0b0b" text-anchor="end">Нейрон срабатывает</text>
<rect x="260.0" y="107.0" width="89.7" height="22.0" rx="4" fill="#eb6834"/>
<text x="357.7" y="123.0" font-size="12.5" fill="#0b0b0b" font-weight="600">≈ 200</text>
<text x="248.0" y="153.0" font-size="13.5" fill="#0b0b0b" text-anchor="end">Транзистор переключается</text>
<rect x="260.0" y="139.0" width="369.6" height="22.0" rx="4" fill="#2a78d6"/>
<text x="637.6" y="155.0" font-size="12.5" fill="#0b0b0b" font-weight="600">≈ 3 млрд</text>
<text x="248.0" y="231.0" font-size="13.5" fill="#0b0b0b" text-anchor="end">Нервный импульс</text>
<rect x="260.0" y="217.0" width="78.0" height="22.0" rx="4" fill="#eb6834"/>
<text x="346.0" y="233.0" font-size="12.5" fill="#0b0b0b" font-weight="600">≈ 100</text>
<text x="248.0" y="263.0" font-size="13.5" fill="#0b0b0b" text-anchor="end">Свет в оптоволокне</text>
<rect x="260.0" y="249.0" width="323.7" height="22.0" rx="4" fill="#2a78d6"/>
<text x="591.7" y="265.0" font-size="12.5" fill="#0b0b0b" font-weight="600">≈ 200 млн</text>
<text x="732.0" y="140.0" font-size="13" fill="#2a78d6" text-anchor="end" font-weight="600">≈ × 10 млн</text>
<text x="732.0" y="250.0" font-size="13" fill="#2a78d6" text-anchor="end" font-weight="600">≈ × 2 млн</text>
<line x1="260.0" y1="280.0" x2="260.0" y2="286.0" stroke="#52514e" stroke-width="1" stroke-linecap="round"/>
<text x="260.0" y="302.0" font-size="11.5" fill="#52514e" text-anchor="middle">10⁰</text>
<line x1="338.0" y1="280.0" x2="338.0" y2="286.0" stroke="#52514e" stroke-width="1" stroke-linecap="round"/>
<text x="338.0" y="302.0" font-size="11.5" fill="#52514e" text-anchor="middle">10²</text>
<line x1="416.0" y1="280.0" x2="416.0" y2="286.0" stroke="#52514e" stroke-width="1" stroke-linecap="round"/>
<text x="416.0" y="302.0" font-size="11.5" fill="#52514e" text-anchor="middle">10⁴</text>
<line x1="494.0" y1="280.0" x2="494.0" y2="286.0" stroke="#52514e" stroke-width="1" stroke-linecap="round"/>
<text x="494.0" y="302.0" font-size="11.5" fill="#52514e" text-anchor="middle">10⁶</text>
<line x1="572.0" y1="280.0" x2="572.0" y2="286.0" stroke="#52514e" stroke-width="1" stroke-linecap="round"/>
<text x="572.0" y="302.0" font-size="11.5" fill="#52514e" text-anchor="middle">10⁸</text>
<line x1="650.0" y1="280.0" x2="650.0" y2="286.0" stroke="#52514e" stroke-width="1" stroke-linecap="round"/>
<text x="650.0" y="302.0" font-size="11.5" fill="#52514e" text-anchor="middle">10¹⁰</text>
<line x1="260.0" y1="283.0" x2="650.0" y2="283.0" stroke="#52514e" stroke-width="1" stroke-linecap="round"/>
</svg>
