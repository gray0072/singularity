<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>The price of being fed</title>

<rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">The price of being fed</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">The brain of a domestic animal against its wild ancestor of the same body weight.</text>
<text x="560.0" y="96.0" font-size="11.5" fill="#8a8985" text-anchor="end">the wild ancestor = 100%</text>
<text x="40.0" y="124.0" font-size="15" fill="#0b0b0b" font-weight="600">the pig</text>
<text x="40.0" y="141.0" font-size="11.5" fill="#8a8985">against the wild boar</text>
<rect x="230.0" y="108.0" width="330.0" height="30.0" rx="3" fill="#e9e8e4"/>
<rect x="230.0" y="108.0" width="217.8" height="30.0" rx="3" fill="#2a78d6"/>
<line x1="451.8" y1="123.0" x2="556.0" y2="123.0" stroke="#eb6834" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="574.0" y="128.0" font-size="13" fill="#eb6834" font-weight="600">about 34% less</text>
<text x="40.0" y="180.0" font-size="15" fill="#0b0b0b" font-weight="600">the dog</text>
<text x="40.0" y="197.0" font-size="11.5" fill="#8a8985">against the wolf</text>
<rect x="230.0" y="164.0" width="330.0" height="30.0" rx="3" fill="#e9e8e4"/>
<rect x="230.0" y="164.0" width="234.3" height="30.0" rx="3" fill="#2a78d6"/>
<line x1="468.3" y1="179.0" x2="556.0" y2="179.0" stroke="#eb6834" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="574.0" y="184.0" font-size="13" fill="#eb6834" font-weight="600">about 29% less</text>
<text x="40.0" y="236.0" font-size="15" fill="#0b0b0b" font-weight="600">the sheep</text>
<text x="40.0" y="253.0" font-size="11.5" fill="#8a8985">against the wild sheep</text>
<rect x="230.0" y="220.0" width="330.0" height="30.0" rx="3" fill="#e9e8e4"/>
<rect x="230.0" y="220.0" width="250.8" height="30.0" rx="3" fill="#2a78d6"/>
<line x1="484.8" y1="235.0" x2="556.0" y2="235.0" stroke="#eb6834" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="574.0" y="240.0" font-size="13" fill="#eb6834" font-weight="600">about 24% less</text>
<line x1="230.0" y1="102.0" x2="230.0" y2="258.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="290.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Rounded figures after D. Kruska's weighings (1988 and later). The measurements are old, and the choice</tspan><tspan x="28.0" dy="14.4">of wild animals for comparison is argued over. The foxes of Novosibirsk have lost nothing in 60 years.</tspan></text>
</svg>
