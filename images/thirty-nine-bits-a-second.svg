<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>How wide the road is</title>

<rect x="0.5" y="0.5" width="759" height="399" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">How wide the road is</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Bits a second, logarithmic scale: every step to the right is a hundred times more.</text>
<line x1="290.0" y1="96.0" x2="290.0" y2="290.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="290.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle">1</text>
<line x1="356.0" y1="96.0" x2="356.0" y2="290.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="356.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle">100</text>
<line x1="422.0" y1="96.0" x2="422.0" y2="290.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="422.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle">10⁴</text>
<line x1="488.0" y1="96.0" x2="488.0" y2="290.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="488.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle">10⁶</text>
<line x1="554.0" y1="96.0" x2="554.0" y2="290.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="554.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle">10⁸</text>
<line x1="620.0" y1="96.0" x2="620.0" y2="290.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="620.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle">10¹⁰</text>
<text x="28.0" y="128.0" font-size="14" fill="#0b0b0b" font-weight="600">human speech</text>
<text x="28.0" y="146.0" font-size="11.5" fill="#8a8985">any of 17 languages</text>
<rect x="290.0" y="114.0" width="52.5" height="28.0" rx="3" fill="#eb6834"/>
<text x="350.5" y="133.0" font-size="13.5" fill="#0b0b0b" font-weight="600">39</text>
<text x="28.0" y="190.0" font-size="14" fill="#0b0b0b" font-weight="600">Oleg's first modem</text>
<text x="28.0" y="208.0" font-size="11.5" fill="#8a8985">early 1990s</text>
<rect x="290.0" y="176.0" width="111.5" height="28.0" rx="3" fill="#52514e"/>
<text x="409.5" y="195.0" font-size="13.5" fill="#0b0b0b" font-weight="600">2,400</text>
<text x="28.0" y="252.0" font-size="14" fill="#0b0b0b" font-weight="600">a line between machine halls</text>
<text x="28.0" y="270.0" font-size="11.5" fill="#8a8985">today, and more</text>
<rect x="290.0" y="238.0" width="330.0" height="28.0" rx="3" fill="#2a78d6"/>
<text x="628.0" y="257.0" font-size="13.5" fill="#0b0b0b" font-weight="600">10 billion</text>
<text x="28.0" y="336.0" font-size="12.5" fill="#0b0b0b"><tspan x="28.0" dy="0.0">Forty years of talk at four hours a day come to about 8 billion bits: one gigabyte.</tspan><tspan x="28.0" dy="15.6">The line carries that in about a second, and the whole of a large talking machine in minutes.</tspan></text>
<text x="28.0" y="384.0" font-size="11.5" fill="#8a8985">Speech: Coupé, Oh, Dediu and Pellegrino (2019), an average over 17 languages. The other two rows are round figures.</text>
</svg>
