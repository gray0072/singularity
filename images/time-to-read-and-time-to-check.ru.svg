<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Сколько длится чтение и сколько проверка</title>

<rect x="0.5" y="0.5" width="759" height="469" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Сколько длится чтение и сколько проверка</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Логарифмическая шкала времени, от минуты до века.</text>
<line x1="330.0" y1="90.0" x2="330.0" y2="372.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="330.0" y="390.0" font-size="11" fill="#8a8985" text-anchor="middle">минута</text>
<line x1="419.8" y1="90.0" x2="419.8" y2="372.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="419.8" y="390.0" font-size="11" fill="#8a8985" text-anchor="middle">час</text>
<line x1="489.5" y1="90.0" x2="489.5" y2="372.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="489.5" y="390.0" font-size="11" fill="#8a8985" text-anchor="middle">сутки</text>
<line x1="564.5" y1="90.0" x2="564.5" y2="372.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="564.5" y="390.0" font-size="11" fill="#8a8985" text-anchor="middle">месяц</text>
<line x1="619.0" y1="90.0" x2="619.0" y2="372.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="619.0" y="390.0" font-size="11" fill="#8a8985" text-anchor="middle">год</text>
<line x1="669.5" y1="90.0" x2="669.5" y2="372.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="669.5" y="390.0" font-size="11" fill="#8a8985" text-anchor="middle">10 лет</text>
<line x1="720.0" y1="90.0" x2="720.0" y2="372.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="720.0" y="390.0" font-size="11" fill="#8a8985" text-anchor="middle">100 лет</text>
<text x="28.0" y="115.0" font-size="13" fill="#0b0b0b" font-weight="600">самая быстрая проверяющая программа</text>
<text x="28.0" y="131.0" font-size="11" fill="#8a8985">17 миллионов строк, ноябрь 2026</text>
<rect x="330.0" y="106.0" width="25.9" height="20.0" rx="3" fill="#2a78d6"/>
<text x="363.9" y="121.0" font-size="12" fill="#0b0b0b" font-weight="600">3 мин 15 с</text>
<text x="28.0" y="161.0" font-size="13" fill="#0b0b0b" font-weight="600">самая медленная и придирчивая</text>
<text x="28.0" y="177.0" font-size="11" fill="#8a8985">те же строки</text>
<rect x="330.0" y="152.0" width="183.7" height="20.0" rx="3" fill="#2a78d6"/>
<text x="521.7" y="167.0" font-size="12" fill="#0b0b0b" font-weight="600">3 суток</text>
<text x="28.0" y="207.0" font-size="13" fill="#0b0b0b" font-weight="600">двенадцать рецензентов и апельсины</text>
<text x="28.0" y="223.0" font-size="11" fill="#8a8985">250 страниц; «уверены на 99%», не подтвердили</text>
<rect x="330.0" y="198.0" width="319.4" height="20.0" rx="3" fill="#eb6834"/>
<text x="641.4" y="213.0" font-size="12" fill="#ffffff" text-anchor="end" font-weight="600">4 года</text>
<text x="28.0" y="253.0" font-size="13" fill="#0b0b0b" font-weight="600">апельсины, переписанные для программы</text>
<text x="28.0" y="269.0" font-size="11" fill="#8a8985">2003–2014, после чего принято</text>
<rect x="330.0" y="244.0" width="342.7" height="20.0" rx="3" fill="#eb6834"/>
<text x="664.7" y="259.0" font-size="12" fill="#ffffff" text-anchor="end" font-weight="600">11 лет</text>
<text x="28.0" y="299.0" font-size="13" fill="#0b0b0b" font-weight="600">гипотеза 2012 года</text>
<text x="28.0" y="315.0" font-size="11" fill="#8a8985">около 700 страниц; согласия нет до сих пор</text>
<rect x="330.0" y="290.0" width="346.9" height="20.0" rx="3" fill="#eb6834"/>
<text x="668.9" y="305.0" font-size="12" fill="#ffffff" text-anchor="end" font-weight="600">14 лет</text>
<text x="28.0" y="345.0" font-size="13" fill="#0b0b0b" font-weight="600">один читатель, десять страниц в день</text>
<text x="28.0" y="361.0" font-size="11" fill="#8a8985">те же 17 миллионов строк как 250 000 страниц</text>
<rect x="330.0" y="336.0" width="381.7" height="20.0" rx="3" fill="#8a8985" fill-opacity="0.55"/>
<text x="703.7" y="351.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">68 лет</text>
<rect x="28.0" y="408.0" width="14.0" height="12.0" rx="2" fill="#2a78d6"/>
<text x="48.0" y="418.0" font-size="12" fill="#52514e">программы</text>
<rect x="132.8" y="408.0" width="14.0" height="12.0" rx="2" fill="#eb6834"/>
<text x="152.8" y="418.0" font-size="12" fill="#52514e">люди</text>
<rect x="201.6" y="408.0" width="14.0" height="12.0" rx="2" fill="#8a8985" fill-opacity="0.55"/>
<text x="221.6" y="418.0" font-size="12" fill="#52514e">счёт Олега на обороте листа</text>
<text x="28.0" y="452.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Проверки: страница с файлами проверки (Э. Сазерленд, MIT). Апельсины: Nature 424 (2003) и формальное доказательство (2017).</tspan><tspan x="28.0" dy="14.4">Последняя строка — оценка, а не измерение: никто не пробовал.</tspan></text>
</svg>
