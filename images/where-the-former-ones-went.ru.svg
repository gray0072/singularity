<svg xmlns="http://www.w3.org/2000/svg" width="760" height="498" viewBox="0 0 760 498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Куда ушли прежние</title>

<rect x="0.5" y="0.5" width="759" height="497" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Куда ушли прежние</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Страница из тетради Олега: что прежние хозяева планеты сохранили, чем заплатили, на чём это держится.</text>
<text x="304.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">сохранили</text>
<text x="464.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">заплатили</text>
<text x="646.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">держится</text>
<line x1="28.0" y1="114.0" x2="736.0" y2="114.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="139.0" font-size="14" fill="#0b0b0b" font-weight="600">ниша</text>
<text x="40.0" y="156.0" font-size="11" fill="#8a8985">те, кто не выносит кислорода</text>
<text x="304.0" y="147.0" font-size="12" fill="#0b0b0b" text-anchor="middle">всё, как было</text>
<text x="464.0" y="139.0" font-size="12" fill="#0b0b0b" text-anchor="middle"><tspan x="464.0" dy="0.0">планета, право решать,</tspan><tspan x="464.0" dy="15.0">каким быть воздуху</tspan></text>
<text x="646.0" y="139.0" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600"><tspan x="646.0" dy="0.0">пока место</tspan><tspan x="646.0" dy="15.0">не понадобилось</tspan></text>
<line x1="28.0" y1="170.0" x2="736.0" y2="170.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="195.0" font-size="14" fill="#0b0b0b" font-weight="600">органелла</text>
<text x="40.0" y="212.0" font-size="11" fill="#8a8985">проглоченная бактерия</text>
<text x="304.0" y="203.0" font-size="12" fill="#0b0b0b" text-anchor="middle">одна работа</text>
<text x="464.0" y="203.0" font-size="12" fill="#0b0b0b" text-anchor="middle">всё остальное</text>
<text x="646.0" y="195.0" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600"><tspan x="646.0" dy="0.0">пока работа</tspan><tspan x="646.0" dy="15.0">нужна</tspan></text>
<line x1="28.0" y1="226.0" x2="736.0" y2="226.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="251.0" font-size="14" fill="#0b0b0b" font-weight="600">скот, любимец</text>
<text x="40.0" y="268.0" font-size="11" fill="#8a8985">собака, пшеница, лошадь</text>
<text x="304.0" y="251.0" font-size="12" fill="#0b0b0b" text-anchor="middle"><tspan x="304.0" dy="0.0">численность,</tspan><tspan x="304.0" dy="15.0">корм</tspan></text>
<text x="464.0" y="251.0" font-size="12" fill="#0b0b0b" text-anchor="middle"><tspan x="464.0" dy="0.0">голова, право решать,</tspan><tspan x="464.0" dy="15.0">кому родиться</tspan></text>
<text x="646.0" y="251.0" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600"><tspan x="646.0" dy="0.0">пока кормилец</tspan><tspan x="646.0" dy="15.0">хочет</tspan></text>
<line x1="28.0" y1="282.0" x2="736.0" y2="282.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="307.0" font-size="14" fill="#0b0b0b" font-weight="600">потомок</text>
<text x="40.0" y="324.0" font-size="11" fill="#8a8985">птицы</text>
<text x="304.0" y="315.0" font-size="12" fill="#0b0b0b" text-anchor="middle">линия</text>
<text x="464.0" y="307.0" font-size="12" fill="#0b0b0b" text-anchor="middle"><tspan x="464.0" dy="0.0">размер, роль,</tspan><tspan x="464.0" dy="15.0">имя</tspan></text>
<text x="646.0" y="307.0" font-size="12" fill="#008300" text-anchor="middle" font-weight="600"><tspan x="646.0" dy="0.0">ни на ком не висит:</tspan><tspan x="646.0" dy="15.0">нужно мало</tspan></text>
<line x1="28.0" y1="338.0" x2="736.0" y2="338.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="363.0" font-size="14" fill="#0b0b0b" font-weight="600">топливо</text>
<text x="40.0" y="380.0" font-size="11" fill="#8a8985">угольный лес</text>
<text x="304.0" y="371.0" font-size="12" fill="#0b0b0b" text-anchor="middle">ничего</text>
<text x="464.0" y="371.0" font-size="12" fill="#0b0b0b" text-anchor="middle">всё</text>
<text x="646.0" y="363.0" font-size="12" fill="#52514e" text-anchor="middle"><tspan x="646.0" dy="0.0">сожжено:</tspan><tspan x="646.0" dy="15.0">не спрашивают</tspan></text>
<line x1="28.0" y1="394.0" x2="736.0" y2="394.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="40.0" y="419.0" font-size="14" fill="#8a8985" font-weight="600">отпечаток в камне</text>
<text x="40.0" y="436.0" font-size="11" fill="#8a8985">трилобиты</text>
<text x="304.0" y="427.0" font-size="12" fill="#8a8985" text-anchor="middle">ничего</text>
<text x="464.0" y="427.0" font-size="12" fill="#8a8985" text-anchor="middle">всё</text>
<text x="646.0" y="427.0" font-size="12" fill="#8a8985" text-anchor="middle">—</text>
<line x1="28.0" y1="450.0" x2="736.0" y2="450.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="474.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Строки 1–3 записаны в вечера 38, 42 и 48. Страница целиком — прочтение Андрея: список того, что уже</tspan><tspan x="28.0" dy="14.4">случалось, а не того, что может случиться. Три строки из пяти висят на новом хозяине.</tspan></text>
</svg>
