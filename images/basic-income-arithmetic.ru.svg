<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Базовый доход для Америки на коленке</title>

<rect x="0.5" y="0.5" width="759" height="289" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Базовый доход для Америки на коленке</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Триллионов долларов в год, 2025.</text>
<text x="288.0" y="104.0" font-size="13.5" fill="#0b0b0b" text-anchor="end">Вся экономика (ВВП)</text>
<rect x="300.0" y="89.0" width="338.8" height="24.0" rx="4" fill="#8a8985"/>
<text x="646.8" y="106.0" font-size="12.5" fill="#0b0b0b" font-weight="600">30,8 трлн</text>
<text x="288.0" y="148.0" font-size="13.5" fill="#0b0b0b" text-anchor="end">Все федеральные расходы</text>
<rect x="300.0" y="133.0" width="77.0" height="24.0" rx="4" fill="#8a8985"/>
<text x="385.0" y="150.0" font-size="12.5" fill="#0b0b0b" font-weight="600">7,0 трлн</text>
<text x="288.0" y="192.0" font-size="13.5" fill="#0b0b0b" text-anchor="end">$1000 в месяц × 260 млн взрослых</text>
<rect x="300.0" y="177.0" width="34.1" height="24.0" rx="4" fill="#eb6834"/>
<text x="342.1" y="194.0" font-size="12.5" fill="#0b0b0b" font-weight="600">3,1 трлн</text>
<text x="300.0" y="224.0" font-size="12.5" fill="#eb6834">≈ десятая часть экономики, почти половина бюджета</text>
<text x="28.0" y="276.0" font-size="11" fill="#8a8985">Источники: BEA, CBO (2025 финансовый год); сумма эксперимента OpenResearch, 2020–2023.</text>
</svg>
