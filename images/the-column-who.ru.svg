<svg xmlns="http://www.w3.org/2000/svg" width="760" height="378" viewBox="0 0 760 378" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Бланк с графой «кто»</title>

<rect x="0.5" y="0.5" width="759" height="377" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Бланк с графой «кто»</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Фраза — бланк, в котором графа «кто» напечатана заранее. С пустой графой его не принимают.</text>
<text x="40.0" y="98.0" font-size="12" fill="#8a8985" font-weight="600">что сказано</text>
<text x="232.0" y="98.0" font-size="12" fill="#8a8985" font-weight="600">графа «кто»</text>
<text x="430.0" y="98.0" font-size="12" fill="#8a8985" font-weight="600">что там есть</text>
<line x1="28.0" y1="112.0" x2="732.0" y2="112.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="40.0" y="139.0" font-size="14" fill="#0b0b0b" font-style="italic">«Моросило»</text>
<rect x="224.0" y="120.0" width="176.0" height="28.0" rx="4" fill="#fcfcfb" stroke="#e34948" stroke-width="1.4"/>
<text x="312.0" y="139.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">оно (в окончании)</text>
<text x="430.0" y="139.0" font-size="13" fill="#52514e">никого: пустое место</text>
<line x1="28.0" y1="156.0" x2="732.0" y2="156.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="40.0" y="183.0" font-size="14" fill="#0b0b0b" font-style="italic">«Ветер дует»</text>
<rect x="224.0" y="164.0" width="176.0" height="28.0" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.4"/>
<text x="312.0" y="183.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">ветер</text>
<text x="430.0" y="183.0" font-size="13" fill="#52514e">само дутьё, названное дважды</text>
<line x1="28.0" y1="200.0" x2="732.0" y2="200.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="40.0" y="227.0" font-size="14" fill="#0b0b0b" font-style="italic">«Солнце садится»</text>
<rect x="224.0" y="208.0" width="176.0" height="28.0" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.4"/>
<text x="312.0" y="227.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">солнце</text>
<text x="430.0" y="227.0" font-size="13" fill="#52514e">поворачивается Земля</text>
<line x1="28.0" y1="244.0" x2="732.0" y2="244.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="40.0" y="271.0" font-size="14" fill="#0b0b0b" font-style="italic">«Кризис ударил»</text>
<rect x="224.0" y="252.0" width="176.0" height="28.0" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.4"/>
<text x="312.0" y="271.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">кризис</text>
<text x="430.0" y="271.0" font-size="13" fill="#52514e">миллионы сделок, и никого, кто ударил</text>
<line x1="28.0" y1="288.0" x2="732.0" y2="288.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="40.0" y="315.0" font-size="14" fill="#0b0b0b" font-style="italic">«Я решил»</text>
<rect x="224.0" y="296.0" width="176.0" height="28.0" rx="4" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.4"/>
<text x="312.0" y="315.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">я</text>
<text x="430.0" y="315.0" font-size="13" fill="#52514e">отчёт, составленный после дела</text>
<line x1="28.0" y1="332.0" x2="732.0" y2="332.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="28.0" y="356.0" font-size="11.5" fill="#8a8985">Первые три строки — грамматика. Последние две — прочтение Андрея; где кончается доказательство, сказано в тексте.</text>
</svg>
