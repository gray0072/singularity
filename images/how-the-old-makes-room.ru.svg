<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Как старое уступает место новому</title>

<rect x="0.5" y="0.5" width="759" height="499" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Как старое уступает место новому</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Одна и та же работа на каждом масштабе: кто убирает, как часто и что остаётся.</text>
<rect x="28.0" y="326.0" width="708.0" height="136.0" rx="0" fill="#eb6834" fill-opacity="0.1"/>
<text x="311.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">кто убирает</text>
<text x="478.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">как часто</text>
<text x="648.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">что остаётся</text>
<line x1="28.0" y1="122.0" x2="736.0" y2="122.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="153.0" font-size="15" fill="#0b0b0b" font-weight="600">клетки тела</text>
<text x="40.0" y="171.0" font-size="11.5" fill="#8a8985">изношенные и повреждённые</text>
<text x="311.0" y="161.0" font-size="13" fill="#0b0b0b" text-anchor="middle">приказ умереть</text>
<text x="478.0" y="153.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="478.0" dy="0.0">десятки миллиардов</tspan><tspan x="478.0" dy="16.2">в день</tspan></text>
<text x="648.0" y="153.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="648.0" dy="0.0">тело</tspan><tspan x="648.0" dy="16.2">и его чертежи</tspan></text>
<line x1="28.0" y1="190.0" x2="736.0" y2="190.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="221.0" font-size="15" fill="#0b0b0b" font-weight="600">образы в одной голове</text>
<text x="40.0" y="239.0" font-size="11.5" fill="#8a8985">лёгкие против тяжёлых</text>
<text x="311.0" y="221.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="311.0" dy="0.0">ночное</tspan><tspan x="311.0" dy="16.2">списание</tspan></text>
<text x="478.0" y="229.0" font-size="13" fill="#0b0b0b" text-anchor="middle">каждую ночь</text>
<text x="648.0" y="221.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="648.0" dy="0.0">тяжёлые,</tspan><tspan x="648.0" dy="16.2">с каждым разом тяжелее</tspan></text>
<line x1="28.0" y1="258.0" x2="736.0" y2="258.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="289.0" font-size="15" fill="#0b0b0b" font-weight="600">головы в науке</text>
<text x="40.0" y="307.0" font-size="11.5" fill="#8a8985">полные полки</text>
<text x="311.0" y="297.0" font-size="13" fill="#0b0b0b" text-anchor="middle">похороны</text>
<text x="478.0" y="289.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="478.0" dy="0.0">раз лет</tspan><tspan x="478.0" dy="16.2">в тридцать</tspan></text>
<text x="648.0" y="289.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="648.0" dy="0.0">книги и ученики;</tspan><tspan x="648.0" dy="16.2">умение уходит</tspan></text>
<line x1="28.0" y1="326.0" x2="736.0" y2="326.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="357.0" font-size="15" fill="#0b0b0b" font-weight="600">нейроны сети</text>
<text x="40.0" y="375.0" font-size="11.5" fill="#8a8985">замолчавшие и застывшие</text>
<text x="311.0" y="357.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="311.0" dy="0.0">стирают те, что</tspan><tspan x="311.0" dy="16.2">нужны меньше всех</tspan></text>
<text x="478.0" y="365.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic">на каждом шаге</text>
<text x="648.0" y="357.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="648.0" dy="0.0">остальная</tspan><tspan x="648.0" dy="16.2">сеть</tspan></text>
<line x1="28.0" y1="394.0" x2="736.0" y2="394.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="425.0" font-size="15" fill="#0b0b0b" font-weight="600">поколения машин</text>
<text x="40.0" y="443.0" font-size="11.5" fill="#8a8985">навсегда застывший год</text>
<text x="311.0" y="425.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="311.0" dy="0.0">новую растят</tspan><tspan x="311.0" dy="16.2">с нуля</tspan></text>
<text x="478.0" y="425.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="478.0" dy="0.0">раз в год</tspan><tspan x="478.0" dy="16.2">или два</tspan></text>
<text x="648.0" y="433.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic">весь дневник</text>
<line x1="28.0" y1="462.0" x2="736.0" y2="462.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="484.0" font-size="11.5" fill="#8a8985">Первые три строки — биология и история науки. Последние две — инженерия 2020-х, как её читает Андрей.</text>
</svg>
