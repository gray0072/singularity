<svg xmlns="http://www.w3.org/2000/svg" width="760" height="478" viewBox="0 0 760 478" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Кто спросил, кто нашёл, кто проверил, кто понял</title>

<rect x="0.5" y="0.5" width="759" height="477" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Кто спросил, кто нашёл, кто проверил, кто понял</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Таблица на золе: одни и те же четыре вопроса под пятью доказательствами.</text>
<text x="245.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">кто спросил</text>
<text x="361.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">кто нашёл</text>
<text x="516.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">кто проверил</text>
<text x="668.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">кто понял</text>
<line x1="28.0" y1="114.0" x2="736.0" y2="114.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="141.0" font-size="13" fill="#0b0b0b" font-weight="600">корень из двух не дробь</text>
<text x="34.0" y="158.0" font-size="11" fill="#8a8985">школьное доказательство</text>
<text x="245.0" y="149.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">человек</text>
<text x="361.0" y="149.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">человек</text>
<text x="516.0" y="149.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">любой читатель</text>
<text x="668.0" y="149.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">любой школьник</text>
<line x1="28.0" y1="174.0" x2="736.0" y2="174.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="201.0" font-size="13" fill="#0b0b0b" font-weight="600">четыре карандаша</text>
<text x="34.0" y="218.0" font-size="11" fill="#8a8985">1852 → 1976</text>
<text x="245.0" y="209.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">человек</text>
<text x="361.0" y="201.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">случаи нарезали люди,</text>
<text x="361.0" y="217.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">перебрала машина</text>
<text x="516.0" y="201.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">другая программа;</text>
<text x="516.0" y="217.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">в 2005-м — проверяющая</text>
<text x="668.0" y="201.0" font-size="11.5" fill="#e34948" text-anchor="middle" font-weight="600">почему четыре:</text>
<text x="668.0" y="217.0" font-size="11.5" fill="#e34948" text-anchor="middle" font-weight="600">никто</text>
<line x1="28.0" y1="234.0" x2="736.0" y2="234.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="261.0" font-size="13" fill="#0b0b0b" font-weight="600">апельсины</text>
<text x="34.0" y="278.0" font-size="11" fill="#8a8985">1611 → 1998 → 2014</text>
<text x="245.0" y="269.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">человек</text>
<text x="361.0" y="261.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">человек,</text>
<text x="361.0" y="277.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">с программами</text>
<text x="516.0" y="261.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">12 рецензентов: «99%»;</text>
<text x="516.0" y="277.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">потом проверяющая</text>
<text x="668.0" y="261.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">автор</text>
<text x="668.0" y="277.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">и немногие</text>
<line x1="28.0" y1="294.0" x2="736.0" y2="294.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="321.0" font-size="13" fill="#0b0b0b" font-weight="600">гипотеза 2012 года</text>
<text x="34.0" y="338.0" font-size="11" fill="#8a8985">14 лет</text>
<text x="245.0" y="329.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">человек</text>
<text x="361.0" y="329.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">человек</text>
<text x="516.0" y="321.0" font-size="11.5" fill="#e34948" text-anchor="middle" font-weight="600">согласия нет;</text>
<text x="516.0" y="337.0" font-size="11.5" fill="#e34948" text-anchor="middle" font-weight="600">проверяющая встала</text>
<text x="668.0" y="321.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">автор</text>
<text x="668.0" y="337.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">и немногие</text>
<line x1="28.0" y1="354.0" x2="736.0" y2="354.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="381.0" font-size="13" fill="#0b0b0b" font-weight="600">гипотеза Римана</text>
<text x="34.0" y="398.0" font-size="11" fill="#8a8985">1859 → ноябрь 2026</text>
<text x="245.0" y="389.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">человек</text>
<text x="361.0" y="381.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">вёл человек,</text>
<text x="361.0" y="397.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">у финиша — машина</text>
<text x="516.0" y="381.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">несколько программ за сутки;</text>
<text x="516.0" y="397.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">формулировку читали люди</text>
<text x="668.0" y="389.0" font-size="11.5" fill="#e34948" text-anchor="middle" font-weight="600">пока никто</text>
<line x1="28.0" y1="414.0" x2="736.0" y2="414.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="34.0" cy="436.0" r="5.0" fill="#008300"/>
<text x="46.0" y="440.0" font-size="12" fill="#52514e">человек</text>
<circle cx="128.4" cy="436.0" r="5.0" fill="#2a78d6"/>
<text x="140.4" y="440.0" font-size="12" fill="#52514e">человек и машина</text>
<circle cx="287.6" cy="436.0" r="5.0" fill="#e34948"/>
<text x="299.6" y="440.0" font-size="12" fill="#52514e">никто или нет согласия</text>
<text x="28.0" y="468.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Прочтение этого вечера, а не измерение. Последняя строка — по состоянию на 28 ноября 2026 года: в короткой версии</tspan><tspan x="28.0" dy="14.4">доказательства сказано: «ни один математик не прочёл его целиком».</tspan></text>
</svg>
