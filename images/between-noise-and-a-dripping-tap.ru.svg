<circle cx="128.2" cy="283.6" r="5.5" fill="#8a8985"/>
<text x="94.0" y="200.0" font-size="12.5" fill="#52514e"><tspan x="94.0" dy="0.0">первый раз:</tspan><tspan x="94.0" dy="15.6">шум</tspan></text>
<circle cx="437.9" cy="117.3" r="6.5" fill="#eb6834"/>
<text x="437.9" y="147.3" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600"><tspan x="437.9" dy="0.0">пятый:</tspan><tspan x="437.9" dy="15.6">напеваю, к своему стыду</tspan></text>
<circle cx="678.1" cy="287.1" r="5.5" fill="#8a8985"/>
<text x="710.0" y="200.0" font-size="12.5" fill="#52514e" text-anchor="end"><tspan x="710.0" dy="0.0">пятисотый:</tspan><tspan x="710.0" dy="15.6">капающий кран</tspan></text>
<text x="400.0" y="82.0" font-size="13" fill="#2a78d6" text-anchor="middle" font-weight="600"><tspan x="400.0" dy="0.0">почти всё сбывается,</tspan><tspan x="400.0" dy="16.2">с отмеренной дозой обмана</tspan></text>
<line x1="273.6" y1="344.0" x2="526.4" y2="344.0" stroke="#eb6834" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-eb6834)"/>
<text x="400.0" y="362.0" font-size="12" fill="#52514e" text-anchor="middle" font-style="italic">каждое прослушивание сдвигает песню сюда</text>
<text x="28.0" y="384.0" font-size="11.5" fill="#8a8985">Схема, а не данные. Психологи знают этот горб как кривую Вундта (Берлайн, 1971); для аккордов его посчитали Чён и др. (2019).</text>
</svg>
