<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Между шумом и капающим краном</title>
<defs><marker id="arrow-52514e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#52514e"/></marker><marker id="arrow-eb6834" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#eb6834"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="399" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Между шумом и капающим краном</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Насколько приятен мотив в зависимости от того, какую его часть ухо угадывает заранее.</text>
<line x1="84.0" y1="300.0" x2="724.0" y2="300.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<line x1="84.0" y1="300.0" x2="84.0" y2="98.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="76.0" y="90.0" font-size="11.5" fill="#52514e">насколько приятно</text>
<text x="84.0" y="320.0" font-size="11.5" fill="#52514e">не угадано ничего</text>
<text x="716.0" y="320.0" font-size="11.5" fill="#52514e" text-anchor="end">угадано всё</text>
