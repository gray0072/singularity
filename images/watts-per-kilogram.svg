<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>How much flow passes through a kilogram</title>

<rect x="0.5" y="0.5" width="759" height="419" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">How much flow passes through a kilogram</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Watts per kilogram of the thing the flow passes through. The scale is logarithmic.</text>
<line x1="250.0" y1="92.0" x2="250.0" y2="346.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="250.0" y="364.0" font-size="11.5" fill="#8a8985" text-anchor="middle">0.0001</text>
<line x1="322.0" y1="92.0" x2="322.0" y2="346.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="322.0" y="364.0" font-size="11.5" fill="#8a8985" text-anchor="middle">0.01</text>
<line x1="394.0" y1="92.0" x2="394.0" y2="346.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="394.0" y="364.0" font-size="11.5" fill="#8a8985" text-anchor="middle">1</text>
<line x1="466.0" y1="92.0" x2="466.0" y2="346.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="466.0" y="364.0" font-size="11.5" fill="#8a8985" text-anchor="middle">100</text>
<line x1="538.0" y1="92.0" x2="538.0" y2="346.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="538.0" y="364.0" font-size="11.5" fill="#8a8985" text-anchor="middle">10,000</text>
<line x1="610.0" y1="92.0" x2="610.0" y2="346.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="610.0" y="364.0" font-size="11.5" fill="#8a8985" text-anchor="middle">1,000,000</text>
<text x="656.0" y="364.0" font-size="11.5" fill="#8a8985">W/kg</text>
<text x="236.0" y="123.0" font-size="13" fill="#0b0b0b" text-anchor="end">the Sun</text>
<rect x="250.0" y="106.0" width="10.8" height="24.0" rx="3" fill="#eda100" fill-opacity="0.85"/>
<text x="268.8" y="123.0" font-size="13" fill="#0b0b0b" font-weight="600">0.0002 W/kg</text>
<text x="236.0" y="173.0" font-size="13" fill="#0b0b0b" text-anchor="end">a human body</text>
<rect x="250.0" y="156.0" width="150.3" height="24.0" rx="3" fill="#1baf7a" fill-opacity="0.85"/>
<text x="408.3" y="173.0" font-size="13" fill="#0b0b0b" font-weight="600">1.5 W/kg</text>
<text x="236.0" y="223.0" font-size="13" fill="#0b0b0b" text-anchor="end">a human brain</text>
<rect x="250.0" y="206.0" width="185.3" height="24.0" rx="3" fill="#1baf7a" fill-opacity="0.85"/>
<text x="443.3" y="223.0" font-size="13" fill="#0b0b0b" font-weight="600">14 W/kg</text>
<text x="236.0" y="264.0" font-size="13" fill="#0b0b0b" text-anchor="end"><tspan x="236.0" dy="0.0">a server with eight graphics</tspan><tspan x="236.0" dy="16.2">processors, the whole of it</tspan></text>
<rect x="250.0" y="256.0" width="211.5" height="24.0" rx="3" fill="#2a78d6" fill-opacity="0.85"/>
<text x="469.5" y="273.0" font-size="13" fill="#0b0b0b" font-weight="600">about 75 W/kg</text>
<text x="236.0" y="314.0" font-size="13" fill="#0b0b0b" text-anchor="end"><tspan x="236.0" dy="0.0">the silicon crystal of</tspan><tspan x="236.0" dy="16.2">a graphics processor</tspan></text>
<rect x="250.0" y="306.0" width="334.8" height="24.0" rx="3" fill="#2a78d6" fill-opacity="0.85"/>
<text x="592.8" y="323.0" font-size="13" fill="#0b0b0b" font-weight="600">about 200,000 W/kg</text>
<line x1="250.0" y1="92.0" x2="250.0" y2="346.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="392.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Rough arithmetic: the Sun 3.8·10²⁶ W / 2·10³⁰ kg; a body 120 W / 80 kg; a brain 20 W / 1.4 kg; a server 10 kW / 130 kg;</tspan><tspan x="28.0" dy="14.4">a crystal: several hundred watts / a gram or two. The measure is E. Chaisson's energy rate density; it is not a measure of mind.</tspan></text>
</svg>
