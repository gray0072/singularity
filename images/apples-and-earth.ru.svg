<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Яблоко и Земля</title>
<defs><marker id="arrow-008300" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#008300"/></marker><marker id="arrow-2a78d6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#2a78d6"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Яблоко и Земля</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Они притягивают друг друга. Оба движутся к общему центру масс; сильнее движется более лёгкий.</text>
<circle cx="85.0" cy="175.0" r="34.0" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
<circle cx="220.0" cy="175.0" r="9.2" fill="#eaf5e6" stroke="#008300" stroke-width="2"/>
<text x="85.0" y="180.0" font-size="12" fill="#0b0b0b" text-anchor="middle">Земля</text>
<text x="220.0" y="157.8" font-size="11.5" fill="#008300" text-anchor="middle">яблоки</text>
<line x1="87.6" y1="123.0" x2="87.6" y2="227.0" stroke="#eb6834" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="93.6" y="131.0" font-size="11.5" fill="#eb6834">общий центр</text>
<circle cx="87.6" cy="175.0" r="4.0" fill="#eb6834"/>
<circle cx="85.0" cy="223.0" r="2.5" fill="#2a78d6"/>
<line x1="220.0" y1="207.0" x2="151.4" y2="207.0" stroke="#008300" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-008300)"/>
<text x="152.0" y="280.0" font-size="12.5" fill="#52514e" text-anchor="middle"><tspan x="152.0" dy="0.0">Одно яблоко: Земля</tspan><tspan x="152.0" dy="15.6">почти не движется</tspan></text>
<circle cx="330.0" cy="175.0" r="34.0" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
<circle cx="465.0" cy="175.0" r="27.0" fill="#eaf5e6" stroke="#008300" stroke-width="2"/>
<text x="330.0" y="180.0" font-size="12" fill="#0b0b0b" text-anchor="middle">Земля</text>
<text x="465.0" y="179.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">яблоки</text>
<line x1="375.0" y1="123.0" x2="375.0" y2="227.0" stroke="#eb6834" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/>
<circle cx="375.0" cy="175.0" r="4.0" fill="#eb6834"/>
<line x1="330.0" y1="223.0" x2="353.3" y2="223.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-2a78d6)"/>
<line x1="465.0" y1="216.0" x2="418.3" y2="216.0" stroke="#008300" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-008300)"/>
<text x="397.0" y="280.0" font-size="12.5" fill="#52514e" text-anchor="middle"><tspan x="397.0" dy="0.0">Куча: заметно</tspan><tspan x="397.0" dy="15.6">движутся обе</tspan></text>
<circle cx="575.0" cy="175.0" r="34.0" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
<circle cx="710.0" cy="175.0" r="49.0" fill="#eaf5e6" stroke="#008300" stroke-width="2"/>
<text x="575.0" y="180.0" font-size="12" fill="#0b0b0b" text-anchor="middle">Земля</text>
<text x="710.0" y="179.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">яблоки</text>
<line x1="676.2" y1="123.0" x2="676.2" y2="227.0" stroke="#eb6834" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/>
<circle cx="676.2" cy="175.0" r="4.0" fill="#eb6834"/>
<line x1="575.0" y1="223.0" x2="627.5" y2="223.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-2a78d6)"/>
<line x1="710.0" y1="238.0" x2="692.5" y2="238.0" stroke="#008300" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-008300)"/>
<text x="642.0" y="280.0" font-size="12.5" fill="#52514e" text-anchor="middle"><tspan x="642.0" dy="0.0">Куча тяжелее Земли:</tspan><tspan x="642.0" dy="15.6">Земля движется сильнее</tspan></text>
<text x="732.0" y="318.0" font-size="12" fill="#52514e" text-anchor="end" font-style="italic">А привычка всё ещё говорит: главная тут Земля.</text>
</svg>
