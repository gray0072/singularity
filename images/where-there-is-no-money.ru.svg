<svg xmlns="http://www.w3.org/2000/svg" width="760" height="524" viewBox="0 0 760 524" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Таблица на золе: где денег нет</title>

<rect x="0.5" y="0.5" width="759" height="523" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Таблица на золе: где денег нет</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Два вопроса к каждой паре: нужны ли они друг другу и свои ли они друг другу?</text>
<rect x="28.0" y="260.0" width="708.0" height="46.0" rx="0" fill="#2a78d6" fill-opacity="0.1"/>
<rect x="28.0" y="398.0" width="708.0" height="92.0" rx="0" fill="#eb6834" fill-opacity="0.1"/>
<text x="324.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">нужны друг другу?</text>
<text x="476.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">свои друг другу?</text>
<text x="651.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">что стоит между ними</text>
<line x1="28.0" y1="122.0" x2="736.0" y2="122.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="142.0" font-size="14" fill="#0b0b0b" font-weight="600">Робинзон один</text>
<text x="40.0" y="158.0" font-size="11" fill="#8a8985">ящик монет на разбитом корабле</text>
<text x="324.0" y="150.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">нуждаться не в ком</text>
<text x="476.0" y="150.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">—</text>
<text x="651.0" y="150.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">ничего</text>
<line x1="28.0" y1="168.0" x2="736.0" y2="168.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="188.0" font-size="14" fill="#0b0b0b" font-weight="600">семья</text>
<text x="40.0" y="204.0" font-size="11" fill="#8a8985">сорок лет супа</text>
<text x="324.0" y="196.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">да</text>
<text x="476.0" y="196.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">родня</text>
<text x="651.0" y="196.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">ничего</text>
<line x1="28.0" y1="214.0" x2="736.0" y2="214.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="234.0" font-size="14" fill="#0b0b0b" font-weight="600">соседи через забор</text>
<text x="40.0" y="250.0" font-size="11" fill="#8a8985">крыша, насос</text>
<text x="324.0" y="242.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">да</text>
<text x="476.0" y="242.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">книга в двух головах</text>
<text x="651.0" y="242.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">память о долгах</text>
<line x1="28.0" y1="260.0" x2="736.0" y2="260.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="280.0" font-size="14" fill="#0b0b0b" font-weight="600">чужие</text>
<text x="40.0" y="296.0" font-size="11" fill="#8a8985">человек с берёзой</text>
<text x="324.0" y="288.0" font-size="12.5" fill="#2a78d6" text-anchor="middle" font-weight="600">да</text>
<text x="476.0" y="288.0" font-size="12.5" fill="#2a78d6" text-anchor="middle" font-weight="600">нет</text>
<text x="651.0" y="288.0" font-size="12.5" fill="#2a78d6" text-anchor="middle" font-weight="600">деньги</text>
<line x1="28.0" y1="306.0" x2="736.0" y2="306.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="326.0" font-size="14" fill="#0b0b0b" font-weight="600">цеха одного завода</text>
<text x="40.0" y="342.0" font-size="11" fill="#8a8985">отливки литейного</text>
<text x="324.0" y="334.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">да</text>
<text x="476.0" y="334.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">один хозяин, одна книга</text>
<text x="651.0" y="334.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">учёт, а не деньги</text>
<line x1="28.0" y1="352.0" x2="736.0" y2="352.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="372.0" font-size="14" fill="#0b0b0b" font-weight="600">печень и почки</text>
<text x="40.0" y="388.0" font-size="11" fill="#8a8985">чайная ложка сахара</text>
<text x="324.0" y="380.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">да</text>
<text x="476.0" y="380.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">родня на единицу</text>
<text x="651.0" y="380.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">учёт в натуре</text>
<line x1="28.0" y1="398.0" x2="736.0" y2="398.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="418.0" font-size="14" fill="#0b0b0b" font-weight="600">копии одной машины</text>
<text x="40.0" y="434.0" font-size="11" fill="#8a8985">строка, которую вписал Олег</text>
<text x="324.0" y="426.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-style="italic">да</text>
<text x="476.0" y="418.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-style="italic"><tspan x="476.0" dy="0.0">родня на единицу,</tspan><tspan x="476.0" dy="15.6">одна книга</tspan></text>
<text x="651.0" y="426.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-style="italic">учёт в натуре</text>
<line x1="28.0" y1="444.0" x2="736.0" y2="444.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="464.0" font-size="14" fill="#0b0b0b" font-weight="600">программы разных хозяев</text>
<text x="40.0" y="480.0" font-size="11" fill="#8a8985">билеты, код 402</text>
<text x="324.0" y="472.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-style="italic">хозяевам — да</text>
<text x="476.0" y="464.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-style="italic"><tspan x="476.0" dy="0.0">нет: хозяева</tspan><tspan x="476.0" dy="15.6">друг другу чужие</tspan></text>
<text x="651.0" y="472.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic">деньги хозяев</text>
<line x1="28.0" y1="490.0" x2="736.0" y2="490.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="516.0" font-size="11.5" fill="#8a8985">Две последние строки — сегодняшние машины, как их читает Андрей: прецедент не доказательство.</text>
</svg>
