<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>What stands where the word “observer” stands</title>

<rect x="0.5" y="0.5" width="759" height="439" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">What stands where the word “observer” stands</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">A table in the ash: four places in science, what the sentence says and what is actually there.</text>
<text x="299.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">the sentence says</text>
<text x="468.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">what is there</text>
<text x="648.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">an example</text>
<line x1="28.0" y1="114.0" x2="736.0" y2="114.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="145.0" font-size="14" fill="#0b0b0b" font-weight="600">relativity</text>
<text x="40.0" y="162.0" font-size="11" fill="#8a8985">since 1905</text>
<text x="299.0" y="144.5" font-size="12" fill="#0b0b0b" text-anchor="middle">an observer</text>
<text x="299.0" y="161.5" font-size="12" fill="#0b0b0b" text-anchor="middle">on the platform</text>
<text x="468.0" y="153.0" font-size="12" fill="#0b0b0b" text-anchor="middle">a clock and a ruler</text>
<text x="648.0" y="144.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">four atomic clocks</text>
<text x="648.0" y="161.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">in aeroplane seats, 1971</text>
<line x1="28.0" y1="182.0" x2="736.0" y2="182.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="213.0" font-size="14" fill="#0b0b0b" font-weight="600">engineering</text>
<text x="40.0" y="230.0" font-size="11" fill="#8a8985">since 1964</text>
<text x="299.0" y="212.5" font-size="12" fill="#0b0b0b" text-anchor="middle">an observer</text>
<text x="299.0" y="229.5" font-size="12" fill="#0b0b0b" text-anchor="middle">of the state</text>
<text x="468.0" y="212.5" font-size="12" fill="#0b0b0b" text-anchor="middle">a formula that works out</text>
<text x="468.0" y="229.5" font-size="12" fill="#0b0b0b" text-anchor="middle">what cannot be measured</text>
<text x="648.0" y="212.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">in the computer of the ship</text>
<text x="648.0" y="229.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">that flew to the Moon</text>
<line x1="28.0" y1="250.0" x2="736.0" y2="250.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="281.0" font-size="14" fill="#0b0b0b" font-weight="600">quantum mechanics</text>
<text x="40.0" y="298.0" font-size="11" fill="#8a8985">since the 1920s</text>
<text x="299.0" y="280.5" font-size="12" fill="#0b0b0b" text-anchor="middle">the electron</text>
<text x="299.0" y="297.5" font-size="12" fill="#0b0b0b" text-anchor="middle">is observed</text>
<text x="468.0" y="280.5" font-size="12" fill="#0b0b0b" text-anchor="middle">something keeps a trace</text>
<text x="468.0" y="297.5" font-size="12" fill="#0b0b0b" text-anchor="middle">of the path</text>
<text x="648.0" y="280.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">light that went</text>
<text x="648.0" y="297.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">into the wall, 2004</text>
<line x1="28.0" y1="318.0" x2="736.0" y2="318.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="349.0" font-size="14" fill="#0b0b0b" font-weight="600">cosmology</text>
<text x="40.0" y="366.0" font-size="11" fill="#8a8985">since 1973</text>
<text x="299.0" y="348.5" font-size="12" fill="#0b0b0b" text-anchor="middle">a universe</text>
<text x="299.0" y="365.5" font-size="12" fill="#0b0b0b" text-anchor="middle">fit for observers</text>
<text x="468.0" y="348.5" font-size="12" fill="#0b0b0b" text-anchor="middle">whoever is there</text>
<text x="468.0" y="365.5" font-size="12" fill="#0b0b0b" text-anchor="middle">to ask the question</text>
<text x="648.0" y="348.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">everybody at a class</text>
<text x="648.0" y="365.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">reunion is alive</text>
<line x1="28.0" y1="386.0" x2="736.0" y2="386.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="410.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">In every row the word can be taken out and the thing put in, and not one formula changes.</tspan><tspan x="28.0" dy="14.4">The rows are the evening's reading of Einstein (1905), Luenberger (1964), Zeh (1970) and Carter (1973).</tspan></text>
</svg>
