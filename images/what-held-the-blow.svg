<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>What held the blow back</title>

<rect x="0.5" y="0.5" width="759" height="371" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">What held the blow back</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Three supports of the balance between the weapon and the brake, and what is happening to each.</text>
<text x="334.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">rests on</text>
<text x="481.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">holds</text>
<text x="646.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">what happens to it</text>
<line x1="28.0" y1="114.0" x2="736.0" y2="114.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="145.0" font-size="14" fill="#0b0b0b" font-weight="600">the return blow</text>
<text x="40.0" y="162.0" font-size="11" fill="#8a8985">the wolf's brake</text>
<text x="334.0" y="144.5" font-size="12" fill="#0b0b0b" text-anchor="middle">each saves</text>
<text x="334.0" y="161.5" font-size="12" fill="#0b0b0b" text-anchor="middle">his own skin</text>
<text x="481.0" y="153.0" font-size="12" fill="#0b0b0b" text-anchor="middle">between the armed</text>
<text x="646.0" y="144.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">holds; has never</text>
<text x="646.0" y="161.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">covered the unarmed</text>
<line x1="28.0" y1="182.0" x2="736.0" y2="182.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="213.0" font-size="14" fill="#0b0b0b" font-weight="600">the need</text>
<text x="40.0" y="230.0" font-size="11" fill="#8a8985">people's need for people</text>
<text x="334.0" y="212.5" font-size="12" fill="#0b0b0b" text-anchor="middle">nobody beats</text>
<text x="334.0" y="229.5" font-size="12" fill="#0b0b0b" text-anchor="middle">the one he needs</text>
<text x="481.0" y="212.5" font-size="12" fill="#0b0b0b" text-anchor="middle">between those who</text>
<text x="481.0" y="229.5" font-size="12" fill="#0b0b0b" text-anchor="middle">need each other</text>
<text x="646.0" y="212.5" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600">goes together</text>
<text x="646.0" y="229.5" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600">with the need</text>
<line x1="28.0" y1="250.0" x2="736.0" y2="250.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="281.0" font-size="14" fill="#0b0b0b" font-weight="600">the hands</text>
<text x="40.0" y="298.0" font-size="11" fill="#8a8985">those between the wish and the blow</text>
<text x="334.0" y="280.5" font-size="12" fill="#0b0b0b" text-anchor="middle">a thousand heads,</text>
<text x="334.0" y="297.5" font-size="12" fill="#0b0b0b" text-anchor="middle">a brake in each</text>
<text x="481.0" y="280.5" font-size="12" fill="#0b0b0b" text-anchor="middle">wherever</text>
<text x="481.0" y="297.5" font-size="12" fill="#0b0b0b" text-anchor="middle">a face is seen</text>
<text x="646.0" y="280.5" font-size="12" fill="#e34948" text-anchor="middle" font-weight="600">fewer hands for one blow</text>
<text x="646.0" y="297.5" font-size="12" fill="#e34948" text-anchor="middle" font-weight="600">with every new weapon</text>
<line x1="28.0" y1="318.0" x2="736.0" y2="318.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="342.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Supports 1 and 2 are Oleg's objection, which Andrey accepts (the second is the evenings 47 and 49). Support 3 is</tspan><tspan x="28.0" dy="14.4">the reading of this evening, not a measurement: a thing that carries out takes the place of those who had to look.</tspan></text>
</svg>
