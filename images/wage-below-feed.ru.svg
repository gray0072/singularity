<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Плата есть всегда; она может не окупить корм</title>
<defs><marker id="arrow-52514e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#52514e"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="389" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Плата есть всегда; она может не окупить корм</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Рисунок Андрея на золе: сколько стоит день работы лошади и во что обходится лошадь.</text>
<rect x="336.3" y="92.0" width="383.7" height="204.0" rx="0" fill="#e9e8e4" fill-opacity="0.5"/>
<line x1="90.0" y1="296.0" x2="720.0" y2="296.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<line x1="90.0" y1="296.0" x2="90.0" y2="92.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="336.3" y1="296.0" x2="336.3" y2="92.0" stroke="#8a8985" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="40.0" y="198.0" font-size="12.5" fill="#52514e" text-anchor="middle" transform="rotate(-90 40.0 198.0)">деньги за день работы</text>
<line x1="90.0" y1="207.8" x2="712.0" y2="207.8" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round"/>
<path d="M90.0,119.6 L100.4,125.0 L110.7,130.3 L121.1,135.3 L131.5,140.2 L141.8,144.9 L152.2,149.4 L162.6,153.8 L172.9,158.0 L183.3,162.1 L193.7,166.0 L204.0,169.8 L214.4,173.5 L224.8,177.0 L235.1,180.4 L245.5,183.7 L255.9,186.8 L266.2,189.9 L276.6,192.8 L287.0,195.6 L297.3,198.4 L307.7,201.0 L318.1,203.5 L328.4,206.0 L338.8,208.4 L349.2,210.6 L359.5,212.8 L369.9,215.0 L380.3,217.0 L390.6,219.0 L401.0,220.9 L411.4,222.7 L421.7,224.5 L432.1,226.2 L442.5,227.8 L452.8,229.4 L463.2,231.0 L473.6,232.4 L483.9,233.9 L494.3,235.2 L504.7,236.5 L515.0,237.8 L525.4,239.1 L535.8,240.2 L546.1,241.4 L556.5,242.5 L566.9,243.6 L577.2,244.6 L587.6,245.6 L598.0,246.5 L608.3,247.5 L618.7,248.4 L629.1,249.2 L639.4,250.0 L649.8,250.8 L660.2,251.6 L670.5,252.3 L680.9,253.1 L691.3,253.8 L701.6,254.4 L712.0,255.1" stroke="#2a78d6" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="336.3" cy="207.8" r="5.0" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/>
<text x="102.0" y="227.8" font-size="12.5" fill="#eb6834" font-weight="600">корм: овёс, сено, конюшня</text>
<text x="352.3" y="123.5" font-size="12.5" fill="#2a78d6" font-weight="600"><tspan x="352.3" dy="0.0">сколько стоит день работы лошади:</tspan><tspan x="352.3" dy="15.6">не дороже той же работы, сделанной мотором</tspan></text>
<text x="213.2" y="318.0" font-size="12.5" fill="#52514e" text-anchor="middle"><tspan x="213.2" dy="0.0">работа окупает корм:</tspan><tspan x="213.2" dy="15.6">жеребят растят</tspan></text>
<text x="528.2" y="318.0" font-size="12.5" fill="#52514e" text-anchor="middle"><tspan x="528.2" dy="0.0">плата ещё есть, но она ниже корма:</tspan><tspan x="528.2" dy="15.6">жеребят не растят</tspan></text>
<text x="28.0" y="376.0" font-size="11.5" fill="#8a8985">Схема, а не измеренные данные. По Г. Кларку (2007) и Олмстеду и Роуду (2001).</text>
</svg>
