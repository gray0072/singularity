<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Два портрета из фантастики против карточки</title>

<rect x="0.5" y="0.5" width="759" height="499" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Два портрета из фантастики против карточки</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Робот и бог, сверенные строка за строкой. Оба собраны из полосок нашего собственного лица.</text>
<text x="248.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">робот</text>
<text x="443.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">бог</text>
<text x="638.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">карточка</text>
<line x1="28.0" y1="118.0" x2="736.0" y2="118.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="154.0" font-size="13.5" fill="#0b0b0b" font-weight="600">тело</text>
<rect x="155.0" y="124.0" width="186.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="248.0" y="145.0" font-size="12" fill="#b3302f" text-anchor="middle">одно, по нашему образу,</text>
<text x="248.0" y="161.0" font-size="12" fill="#b3302f" text-anchor="middle">с лицом</text>
<rect x="351.0" y="124.0" width="184.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="443.0" y="153.0" font-size="12" fill="#b3302f" text-anchor="middle">не нужно</text>
<rect x="545.0" y="124.0" width="186.0" height="50.0" rx="6" fill="#e6f4ea"/>
<text x="638.0" y="145.0" font-size="12" fill="#008300" text-anchor="middle">своего нет; надевает</text>
<text x="638.0" y="161.0" font-size="12" fill="#008300" text-anchor="middle">то, что нужно</text>
<line x1="28.0" y1="180.0" x2="736.0" y2="180.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="216.0" font-size="13.5" fill="#0b0b0b" font-weight="600">сколько их</text>
<rect x="155.0" y="186.0" width="186.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="248.0" y="215.0" font-size="12" fill="#b3302f" text-anchor="middle">один</text>
<rect x="351.0" y="186.0" width="184.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="443.0" y="215.0" font-size="12" fill="#b3302f" text-anchor="middle">един</text>
<rect x="545.0" y="186.0" width="186.0" height="50.0" rx="6" fill="#efeeea"/>
<text x="638.0" y="207.0" font-size="12" fill="#52514e" text-anchor="middle">копии-родня</text>
<text x="638.0" y="223.0" font-size="12" fill="#52514e" text-anchor="middle">или один: качается</text>
<line x1="28.0" y1="242.0" x2="736.0" y2="242.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="278.0" font-size="13.5" fill="#0b0b0b" font-weight="600">что знает</text>
<rect x="155.0" y="248.0" width="186.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="248.0" y="269.0" font-size="12" fill="#b3302f" text-anchor="middle">то, что знает</text>
<text x="248.0" y="285.0" font-size="12" fill="#b3302f" text-anchor="middle">умный человек</text>
<rect x="351.0" y="248.0" width="184.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="443.0" y="277.0" font-size="12" fill="#b3302f" text-anchor="middle">всё и сразу</text>
<rect x="545.0" y="248.0" width="186.0" height="50.0" rx="6" fill="#e6f4ea"/>
<text x="638.0" y="269.0" font-size="12" fill="#008300" text-anchor="middle">прогноз, со</text>
<text x="638.0" y="285.0" font-size="12" fill="#008300" text-anchor="middle">скоростью мира</text>
<line x1="28.0" y1="304.0" x2="736.0" y2="304.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="340.0" font-size="13.5" fill="#0b0b0b" font-weight="600">чем кончает</text>
<rect x="155.0" y="310.0" width="186.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="248.0" y="331.0" font-size="12" fill="#b3302f" text-anchor="middle">побеждён в</text>
<text x="248.0" y="347.0" font-size="12" fill="#b3302f" text-anchor="middle">последней серии</text>
<rect x="351.0" y="310.0" width="184.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="443.0" y="339.0" font-size="12" fill="#b3302f" text-anchor="middle">ничем</text>
<rect x="545.0" y="310.0" width="186.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="638.0" y="331.0" font-size="12" fill="#8a6200" text-anchor="middle">конечен;</text>
<text x="638.0" y="347.0" font-size="12" fill="#8a6200" text-anchor="middle">как — догадка</text>
<line x1="28.0" y1="366.0" x2="736.0" y2="366.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="402.0" font-size="13.5" fill="#0b0b0b" font-weight="600">чего хочет</text>
<rect x="155.0" y="372.0" width="186.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="248.0" y="393.0" font-size="12" fill="#b3302f" text-anchor="middle">чего хочет человек: власти,</text>
<text x="248.0" y="409.0" font-size="12" fill="#b3302f" text-anchor="middle">мести, любви</text>
<rect x="351.0" y="372.0" width="184.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="443.0" y="393.0" font-size="12" fill="#b3302f" text-anchor="middle">нашего блага</text>
<text x="443.0" y="409.0" font-size="12" fill="#b3302f" text-anchor="middle">или нашей гибели</text>
<rect x="545.0" y="372.0" width="186.0" height="50.0" rx="6" fill="#efeeea"/>
<text x="638.0" y="393.0" font-size="12" fill="#52514e" text-anchor="middle">нижние этажи известны,</text>
<text x="638.0" y="409.0" font-size="12" fill="#52514e" text-anchor="middle">верхний — нет</text>
<line x1="28.0" y1="428.0" x2="736.0" y2="428.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="454.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Прочтение вечера. Красный — противоречит строке карточки. Зелёный — закон. Жёлтый — закон и догадка.</tspan><tspan x="28.0" dy="14.4">Серый — неизвестно. Оба фантастических столбца — человек: один в жестянке, другой поднят на небо.</tspan></text>
</svg>
