<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Построено за пять миллиардов, продано за двадцать пять миллионов</title>

<rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Построено за пять миллиардов, продано за двадцать пять миллионов</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Спутниковая система «Иридиум» до и после банкротства 1999 года. Шкала линейная.</text>
<text x="202.0" y="118.0" font-size="13" fill="#0b0b0b" text-anchor="end"><tspan x="202.0" dy="0.0">построено</tspan><tspan x="202.0" dy="16.2">(связь открыта в 1998 году)</tspan></text>
<rect x="216.0" y="104.0" width="500.0" height="30.0" rx="2" fill="#2a78d6" fill-opacity="0.85"/>
<text x="230.0" y="124.0" font-size="13.5" fill="#ffffff" font-weight="600">около 5000 миллионов долларов</text>
<text x="202.0" y="184.0" font-size="13" fill="#0b0b0b" text-anchor="end"><tspan x="202.0" dy="0.0">продано при</tspan><tspan x="202.0" dy="16.2">банкротстве</tspan></text>
<rect x="216.0" y="170.0" width="3.0" height="30.0" rx="2" fill="#e34948" fill-opacity="0.85"/>
<text x="229.0" y="190.0" font-size="13.5" fill="#0b0b0b" font-weight="600">25 миллионов долларов: полцента с доллара</text>
<line x1="216.0" y1="94.0" x2="216.0" y2="216.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="252.0" font-size="12.5" fill="#0b0b0b"><tspan x="28.0" dy="0.0">66 спутников до и после продажи одни и те же.</tspan><tspan x="28.0" dy="15.6">Инвесторы потеряли деньги, сотрудники работу; система работает с тех пор.</tspan></text>
<text x="28.0" y="310.0" font-size="11.5" fill="#8a8985">Цифры округлены. В 2017–2019 годах спутники заменили новым поколением.</text>
</svg>
