<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Сколько весит один новый факт</title>

<rect x="0.5" y="0.5" width="759" height="419" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Сколько весит один новый факт</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Ум, который судит по среднему из всего виденного: насколько следующий факт сдвигает среднее.</text>
