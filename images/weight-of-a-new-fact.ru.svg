<text x="74.0" y="215.0" font-size="11.5" fill="#52514e" text-anchor="end">50%</text>
<line x1="84.0" y1="100.0" x2="716.0" y2="100.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="74.0" y="104.0" font-size="11.5" fill="#52514e" text-anchor="end">100%</text>
<line x1="84.0" y1="322.0" x2="84.0" y2="327.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="84.0" y="342.0" font-size="11.5" fill="#52514e" text-anchor="middle">1</text>
<line x1="242.0" y1="322.0" x2="242.0" y2="327.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="242.0" y="342.0" font-size="11.5" fill="#52514e" text-anchor="middle">10</text>
<line x1="400.0" y1="322.0" x2="400.0" y2="327.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="400.0" y="342.0" font-size="11.5" fill="#52514e" text-anchor="middle">100</text>
<line x1="558.0" y1="322.0" x2="558.0" y2="327.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="558.0" y="342.0" font-size="11.5" fill="#52514e" text-anchor="middle">1000</text>
<line x1="716.0" y1="322.0" x2="716.0" y2="327.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="716.0" y="342.0" font-size="11.5" fill="#52514e" text-anchor="middle">10 000</text>
<text x="716.0" y="362.0" font-size="11.5" fill="#52514e" text-anchor="end">в который раз видишь</text>
