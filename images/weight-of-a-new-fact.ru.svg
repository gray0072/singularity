<circle cx="400.0" cy="319.8" r="4.8" fill="#eb6834"/>
<text x="400.0" y="281.8" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600"><tspan x="400.0" dy="0.0">100-й:</tspan><tspan x="400.0" dy="15.6">сотая</tspan></text>
