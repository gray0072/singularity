<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>One order and all the rest</title>

<rect x="0.5" y="0.5" width="759" height="399" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">One order and all the rest</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">A deck of thirty-six cards on a logarithmic scale: every step to the right is a hundred thousand times more.</text>
<line x1="300.0" y1="90.0" x2="300.0" y2="246.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="264.0" font-size="11" fill="#8a8985" text-anchor="middle">0</text>
<line x1="344.4" y1="90.0" x2="344.4" y2="246.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="344.4" y="264.0" font-size="11" fill="#8a8985" text-anchor="middle">5</text>
<line x1="388.9" y1="90.0" x2="388.9" y2="246.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="388.9" y="264.0" font-size="11" fill="#8a8985" text-anchor="middle">10</text>
<line x1="433.3" y1="90.0" x2="433.3" y2="246.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="433.3" y="264.0" font-size="11" fill="#8a8985" text-anchor="middle">15</text>
<line x1="477.8" y1="90.0" x2="477.8" y2="246.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="477.8" y="264.0" font-size="11" fill="#8a8985" text-anchor="middle">20</text>
<line x1="522.2" y1="90.0" x2="522.2" y2="246.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="522.2" y="264.0" font-size="11" fill="#8a8985" text-anchor="middle">25</text>
<line x1="566.7" y1="90.0" x2="566.7" y2="246.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="566.7" y="264.0" font-size="11" fill="#8a8985" text-anchor="middle">30</text>
<line x1="611.1" y1="90.0" x2="611.1" y2="246.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="611.1" y="264.0" font-size="11" fill="#8a8985" text-anchor="middle">35</text>
<line x1="655.6" y1="90.0" x2="655.6" y2="246.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="655.6" y="264.0" font-size="11" fill="#8a8985" text-anchor="middle">40</text>
<line x1="700.0" y1="90.0" x2="700.0" y2="246.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="700.0" y="264.0" font-size="11" fill="#8a8985" text-anchor="middle">45</text>
<text x="300.0" y="282.0" font-size="11" fill="#8a8985">number of noughts</text>
<text x="28.0" y="116.0" font-size="13" fill="#0b0b0b" font-weight="600">“by suits”</text>
<text x="28.0" y="133.0" font-size="11" fill="#8a8985">one way</text>
<circle cx="300.0" cy="118.0" r="5.0" fill="#008300"/>
<text x="310.0" y="123.0" font-size="12" fill="#0b0b0b" font-weight="600">1</text>
<text x="28.0" y="166.0" font-size="13" fill="#0b0b0b" font-weight="600">seconds since the beginning of the world</text>
<text x="28.0" y="183.0" font-size="11" fill="#8a8985">13.8 billion years</text>
<rect x="300.0" y="158.0" width="156.8" height="20.0" rx="3" fill="#52514e"/>
<text x="466.8" y="173.0" font-size="12" fill="#0b0b0b" font-weight="600">4 with 17 noughts</text>
<text x="28.0" y="216.0" font-size="13" fill="#0b0b0b" font-weight="600">ways thirty-six cards can lie in a row</text>
<text x="28.0" y="233.0" font-size="11" fill="#8a8985">36 × 35 × 34 × … × 1</text>
<rect x="300.0" y="208.0" width="369.5" height="20.0" rx="3" fill="#2a78d6"/>
<text x="659.5" y="223.0" font-size="12" fill="#ffffff" text-anchor="end" font-weight="600">37 with 40 noughts</text>
<text x="28.0" y="306.0" font-size="13" fill="#0b0b0b" font-weight="600"><tspan x="28.0" dy="0.0">Shuffling once a second since the beginning, one would have gone through</tspan><tspan x="28.0" dy="16.2">one part in a million billion billion of the ways.</tspan></text>
<text x="28.0" y="348.0" font-size="12" fill="#52514e"><tspan x="28.0" dy="0.0">With two cards the order comes back on every second shuffle: a bead in water can run the wrong way</tspan><tspan x="28.0" dy="15.0">for a moment. A cup and the floor under it hold more molecules than a 1 with 25 noughts.</tspan></text>
<text x="28.0" y="386.0" font-size="11.5" fill="#8a8985">An exact count: 36! ≈ 3.72·10⁴¹; 13.8 billion years ≈ 4.35·10¹⁷ seconds. The bead: Wang and others (2002).</text>
</svg>
