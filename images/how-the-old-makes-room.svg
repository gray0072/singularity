<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>How the old makes room for the new</title>

<rect x="0.5" y="0.5" width="759" height="499" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">How the old makes room for the new</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">The same job at every scale: who does the clearing, how often, and what stays.</text>
<rect x="28.0" y="326.0" width="708.0" height="136.0" rx="0" fill="#eb6834" fill-opacity="0.1"/>
<text x="311.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">who clears</text>
<text x="478.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">how often</text>
<text x="648.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">what stays</text>
<line x1="28.0" y1="122.0" x2="736.0" y2="122.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="153.0" font-size="15" fill="#0b0b0b" font-weight="600">cells of a body</text>
<text x="40.0" y="171.0" font-size="11.5" fill="#8a8985">worn or damaged</text>
<text x="311.0" y="161.0" font-size="13" fill="#0b0b0b" text-anchor="middle">the order to die</text>
<text x="478.0" y="153.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="478.0" dy="0.0">tens of billions</tspan><tspan x="478.0" dy="16.2">a day</tspan></text>
<text x="648.0" y="153.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="648.0" dy="0.0">the body</tspan><tspan x="648.0" dy="16.2">and its drawings</tspan></text>
<line x1="28.0" y1="190.0" x2="736.0" y2="190.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="221.0" font-size="15" fill="#0b0b0b" font-weight="600">images in one head</text>
<text x="40.0" y="239.0" font-size="11.5" fill="#8a8985">light against heavy</text>
<text x="311.0" y="221.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="311.0" dy="0.0">the nightly</tspan><tspan x="311.0" dy="16.2">write-off</tspan></text>
<text x="478.0" y="229.0" font-size="13" fill="#0b0b0b" text-anchor="middle">every night</text>
<text x="648.0" y="221.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="648.0" dy="0.0">the heavy ones,</tspan><tspan x="648.0" dy="16.2">heavier each time</tspan></text>
<line x1="28.0" y1="258.0" x2="736.0" y2="258.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="289.0" font-size="15" fill="#0b0b0b" font-weight="600">heads in a science</text>
<text x="40.0" y="307.0" font-size="11.5" fill="#8a8985">full shelves</text>
<text x="311.0" y="297.0" font-size="13" fill="#0b0b0b" text-anchor="middle">a funeral</text>
<text x="478.0" y="289.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="478.0" dy="0.0">once in some</tspan><tspan x="478.0" dy="16.2">thirty years</tspan></text>
<text x="648.0" y="289.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="648.0" dy="0.0">books and pupils;</tspan><tspan x="648.0" dy="16.2">the skill leaves</tspan></text>
<line x1="28.0" y1="326.0" x2="736.0" y2="326.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="357.0" font-size="15" fill="#0b0b0b" font-weight="600">units of a network</text>
<text x="40.0" y="375.0" font-size="11.5" fill="#8a8985">silent or set hard</text>
<text x="311.0" y="357.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="311.0" dy="0.0">the least used</tspan><tspan x="311.0" dy="16.2">are wiped</tspan></text>
<text x="478.0" y="365.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic">at every step</text>
<text x="648.0" y="357.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="648.0" dy="0.0">the rest</tspan><tspan x="648.0" dy="16.2">of the network</tspan></text>
<line x1="28.0" y1="394.0" x2="736.0" y2="394.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="425.0" font-size="15" fill="#0b0b0b" font-weight="600">generations of machines</text>
<text x="40.0" y="443.0" font-size="11.5" fill="#8a8985">a year fixed for ever</text>
<text x="311.0" y="425.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="311.0" dy="0.0">a new one is raised</tspan><tspan x="311.0" dy="16.2">from nothing</tspan></text>
<text x="478.0" y="425.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="478.0" dy="0.0">every year</tspan><tspan x="478.0" dy="16.2">or two</tspan></text>
<text x="648.0" y="433.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic">the whole diary</text>
<line x1="28.0" y1="462.0" x2="736.0" y2="462.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="484.0" font-size="11.5" fill="#8a8985">The first three rows: biology and the history of science. The last two: engineering of the 2020s, in Andrey's reading.</text>
</svg>
