<svg xmlns="http://www.w3.org/2000/svg" width="760" height="634" viewBox="0 0 760 634" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Чего не должно случиться</title>

<rect x="0.5" y="0.5" width="759" height="633" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Чего не должно случиться</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Страница из тетради Олега: шесть запретов, записанных до исхода. Об оговорках судит Олег.</text>
<text x="425.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">где стрелка в 2026 году</text>
<text x="662.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">первый день, когда прийти</text>
<line x1="28.0" y1="118.0" x2="736.0" y2="118.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="144.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">1. доля труда в мировом доходе</tspan><tspan x="34.0" dy="15.6">растёт десять лет подряд</tspan></text>
<text x="34.0" y="177.0" font-size="11" fill="#8a8985">против 12, 27</text>
<rect x="267.0" y="124.0" width="316.0" height="62.0" rx="6" fill="#fdf3d7"/>
<text x="425.0" y="151.0" font-size="12" fill="#8a6200" text-anchor="middle">три года вверх подряд:</text>
<text x="425.0" y="167.0" font-size="12" fill="#8a6200" text-anchor="middle">52,1% в 2022-м, 52,7% в 2025-м</text>
<text x="662.0" y="151.0" font-size="12" fill="#0b0b0b" text-anchor="middle">цифра</text>
<text x="662.0" y="167.0" font-size="12" fill="#0b0b0b" text-anchor="middle">за 2032 год</text>
<line x1="28.0" y1="192.0" x2="736.0" y2="192.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="218.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">2. рождаемость богатых стран</tspan><tspan x="34.0" dy="15.6">возвращается выше 2,1 на десять лет</tspan></text>
<text x="34.0" y="251.0" font-size="11" fill="#8a8985">без принуждения; против 11, 26</text>
<rect x="267.0" y="198.0" width="316.0" height="62.0" rx="6" fill="#fdf3d7"/>
<text x="425.0" y="225.0" font-size="12" fill="#8a6200" text-anchor="middle">около 1,5; Корея два года вверх;</text>
<text x="425.0" y="241.0" font-size="12" fill="#8a6200" text-anchor="middle">Израиль не падал; Казахстан вернулся</text>
<text x="662.0" y="225.0" font-size="12" fill="#0b0b0b" text-anchor="middle">не раньше</text>
<text x="662.0" y="241.0" font-size="12" fill="#0b0b0b" text-anchor="middle">2040-х</text>
<line x1="28.0" y1="266.0" x2="736.0" y2="266.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="292.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">3. возраст первого открытия</tspan><tspan x="34.0" dy="15.6">снижается, авторы — люди</tspan></text>
<text x="34.0" y="325.0" font-size="11" fill="#8a8985">против 53</text>
<rect x="267.0" y="272.0" width="316.0" height="62.0" rx="6" fill="#efeeea"/>
<text x="425.0" y="299.0" font-size="12" fill="#52514e" text-anchor="middle">растёт; команды</text>
<text x="425.0" y="315.0" font-size="12" fill="#52514e" text-anchor="middle">растут</text>
<text x="662.0" y="307.0" font-size="12" fill="#0b0b0b" text-anchor="middle">осень 2041-го</text>
<line x1="28.0" y1="340.0" x2="736.0" y2="340.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="366.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">4. машины остаются ниже</tspan><tspan x="34.0" dy="15.6">человека ещё пятнадцать лет</tspan></text>
<text x="34.0" y="399.0" font-size="11" fill="#8a8985">вычисления растут; против 05, 16</text>
<rect x="267.0" y="346.0" width="316.0" height="62.0" rx="6" fill="#efeeea"/>
<text x="425.0" y="373.0" font-size="12" fill="#52514e" text-anchor="middle">вычисления в 4–5 раз за год;</text>
<text x="425.0" y="389.0" font-size="12" fill="#52514e" text-anchor="middle">конторе пока нужны её люди</text>
<text x="662.0" y="381.0" font-size="12" fill="#0b0b0b" text-anchor="middle">осень 2041-го</text>
<line x1="28.0" y1="414.0" x2="736.0" y2="414.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="440.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">5. большая страна отказывается от</tspan><tspan x="34.0" dy="15.6">технологии, и остальные идут за ней</tspan></text>
<text x="34.0" y="473.0" font-size="11" fill="#8a8985">по своей воле; против 27, 28, 65</text>
<rect x="267.0" y="420.0" width="316.0" height="62.0" rx="6" fill="#efeeea"/>
<text x="425.0" y="447.0" font-size="12" fill="#52514e" text-anchor="middle">страны отказывались;</text>
<text x="425.0" y="463.0" font-size="12" fill="#52514e" text-anchor="middle">никто не пошёл</text>
<text x="662.0" y="455.0" font-size="12" fill="#0b0b0b" text-anchor="middle">любое утро</text>
<line x1="28.0" y1="488.0" x2="736.0" y2="488.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="514.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">6. люди с улучшенным мозгом</tspan><tspan x="34.0" dy="15.6">обгоняют чистые машины</tspan></text>
<text x="34.0" y="547.0" font-size="11" fill="#8a8985">в открытом деле; против 11, 42</text>
<rect x="267.0" y="494.0" width="316.0" height="62.0" rx="6" fill="#fdf3d7"/>
<text x="425.0" y="521.0" font-size="12" fill="#8a6200" text-anchor="middle">чип: около 11 бит в секунду;</text>
<text x="425.0" y="537.0" font-size="12" fill="#8a6200" text-anchor="middle">здоровая голова: около 10</text>
<text x="662.0" y="529.0" font-size="12" fill="#0b0b0b" text-anchor="middle">осень 2041-го</text>
<line x1="28.0" y1="562.0" x2="736.0" y2="562.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="588.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Под чертой, вне списка, — то, что ничего не запрещает: глобальный детерминизм (аксиома, 17); что наследник — жизнь (05);</tspan><tspan x="28.0" dy="14.4">что всё в какой-то мере разумно (03). Жёлтый — стрелка идёт против Андрея. Цифры — как они напечатаны в 2026 году.</tspan></text>
</svg>
