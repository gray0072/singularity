<svg xmlns="http://www.w3.org/2000/svg" width="760" height="524" viewBox="0 0 760 524" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>The table in the ash: where there is no money</title>

<rect x="0.5" y="0.5" width="759" height="523" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">The table in the ash: where there is no money</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Two questions about each pair: do they need one another, and are they one another's own?</text>
<rect x="28.0" y="260.0" width="708.0" height="46.0" rx="0" fill="#2a78d6" fill-opacity="0.1"/>
<rect x="28.0" y="398.0" width="708.0" height="92.0" rx="0" fill="#eb6834" fill-opacity="0.1"/>
<text x="324.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">need one another?</text>
<text x="476.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">one another's own?</text>
<text x="651.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">what stands between them</text>
<line x1="28.0" y1="122.0" x2="736.0" y2="122.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="142.0" font-size="14" fill="#0b0b0b" font-weight="600">Robinson alone</text>
<text x="40.0" y="158.0" font-size="11" fill="#8a8985">a drawer of coins on the wreck</text>
<text x="324.0" y="150.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">nobody to need</text>
<text x="476.0" y="150.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">—</text>
<text x="651.0" y="150.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">nothing</text>
<line x1="28.0" y1="168.0" x2="736.0" y2="168.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="188.0" font-size="14" fill="#0b0b0b" font-weight="600">a family</text>
<text x="40.0" y="204.0" font-size="11" fill="#8a8985">forty years of soup</text>
<text x="324.0" y="196.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">yes</text>
<text x="476.0" y="196.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">kin</text>
<text x="651.0" y="196.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">nothing</text>
<line x1="28.0" y1="214.0" x2="736.0" y2="214.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="234.0" font-size="14" fill="#0b0b0b" font-weight="600">neighbours across the fence</text>
<text x="40.0" y="250.0" font-size="11" fill="#8a8985">the roof, the pump</text>
<text x="324.0" y="242.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">yes</text>
<text x="476.0" y="242.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">a book in two heads</text>
<text x="651.0" y="242.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">the memory of debts</text>
<line x1="28.0" y1="260.0" x2="736.0" y2="260.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="280.0" font-size="14" fill="#0b0b0b" font-weight="600">strangers</text>
<text x="40.0" y="296.0" font-size="11" fill="#8a8985">the man with the birch</text>
<text x="324.0" y="288.0" font-size="12.5" fill="#2a78d6" text-anchor="middle" font-weight="600">yes</text>
<text x="476.0" y="288.0" font-size="12.5" fill="#2a78d6" text-anchor="middle" font-weight="600">no</text>
<text x="651.0" y="288.0" font-size="12.5" fill="#2a78d6" text-anchor="middle" font-weight="600">money</text>
<line x1="28.0" y1="306.0" x2="736.0" y2="306.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="326.0" font-size="14" fill="#0b0b0b" font-weight="600">shops of one plant</text>
<text x="40.0" y="342.0" font-size="11" fill="#8a8985">the foundry's castings</text>
<text x="324.0" y="334.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">yes</text>
<text x="476.0" y="334.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">one owner, one book</text>
<text x="651.0" y="334.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">an account, not money</text>
<line x1="28.0" y1="352.0" x2="736.0" y2="352.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="372.0" font-size="14" fill="#0b0b0b" font-weight="600">the liver and the kidneys</text>
<text x="40.0" y="388.0" font-size="11" fill="#8a8985">a teaspoon of sugar</text>
<text x="324.0" y="380.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">yes</text>
<text x="476.0" y="380.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">kin of one</text>
<text x="651.0" y="380.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">an account in kind</text>
<line x1="28.0" y1="398.0" x2="736.0" y2="398.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="418.0" font-size="14" fill="#0b0b0b" font-weight="600">copies of one machine</text>
<text x="40.0" y="434.0" font-size="11" fill="#8a8985">the row Oleg wrote in</text>
<text x="324.0" y="426.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-style="italic">yes</text>
<text x="476.0" y="426.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-style="italic">kin of one, one book</text>
<text x="651.0" y="426.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-style="italic">an account in kind</text>
<line x1="28.0" y1="444.0" x2="736.0" y2="444.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="464.0" font-size="14" fill="#0b0b0b" font-weight="600">programs of different owners</text>
<text x="40.0" y="480.0" font-size="11" fill="#8a8985">the tickets, the code 402</text>
<text x="324.0" y="472.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-style="italic">their owners do</text>
<text x="476.0" y="464.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-style="italic"><tspan x="476.0" dy="0.0">no: the owners</tspan><tspan x="476.0" dy="15.6">are strangers</tspan></text>
<text x="651.0" y="472.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic">the owners' money</text>
<line x1="28.0" y1="490.0" x2="736.0" y2="490.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="516.0" font-size="11.5" fill="#8a8985">The last two rows are today's machines in Andrey's reading: a precedent is not a proof.</text>
</svg>
