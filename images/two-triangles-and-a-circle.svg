<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Two triangles and a circle</title>
<defs><marker id="arrow-52514e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#52514e"/></marker><marker id="arrow-e34948" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#e34948"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="355" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Two triangles and a circle</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">A film of 1944: cardboard shapes moved over glass. The viewers were asked what happened.</text>
<path d="M230,150 L230,112 L70,112 L70,214 L230,214 L230,188" stroke="#52514e" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="230.0" y1="150.0" x2="262.0" y2="170.0" stroke="#52514e" stroke-width="2.2" stroke-linecap="round"/>
<path d="M326,214 L404,214 L365,144 Z" stroke="#52514e" stroke-width="1.5" fill="#52514e" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M508,214 L546,214 L527,180 Z" stroke="#eb6834" stroke-width="1.5" fill="#eb6834" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="604.0" cy="202.0" r="12.0" fill="#2a78d6"/>
<line x1="414.0" y1="190.0" x2="494.0" y2="196.0" stroke="#e34948" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#arrow-e34948)"/>
<text x="454.0" y="178.0" font-size="12" fill="#e34948" text-anchor="middle" font-style="italic">“chases them”</text>
<line x1="626.0" y1="198.0" x2="700.0" y2="184.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#arrow-52514e)"/>
<text x="668.0" y="172.0" font-size="12" fill="#52514e" text-anchor="middle" font-style="italic">“they run away”</text>
<text x="150.0" y="248.0" font-size="12.5" fill="#52514e" text-anchor="middle">a rectangle with a flap</text>
<text x="150.0" y="272.0" font-size="14.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">“a house with a door”</text>
<text x="365.0" y="248.0" font-size="12.5" fill="#52514e" text-anchor="middle">a large triangle</text>
<text x="365.0" y="272.0" font-size="14.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">“a bully”</text>
<text x="566.0" y="248.0" font-size="12.5" fill="#52514e" text-anchor="middle">a small triangle and a small circle</text>
<text x="566.0" y="272.0" font-size="14.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">“a couple”</text>
<text x="28.0" y="316.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Upper line: what was on the screen. Lower line: what 33 of the 34 viewers wrote.</tspan><tspan x="28.0" dy="14.4">One viewer described triangles and a circle. Heider and Simmel, 1944.</tspan></text>
</svg>
