<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Три вещи в одной купюре</title>

<rect x="0.5" y="0.5" width="759" height="399" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Три вещи в одной купюре</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Что есть в купюре, на чём каждая вещь держится и что бывает, когда этого не стало.</text>
<rect x="28.0" y="274.0" width="708.0" height="76.0" rx="0" fill="#1baf7a" fill-opacity="0.1"/>
<text x="335.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">на чём держится</text>
<text x="588.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">когда этого не стало</text>
<line x1="28.0" y1="122.0" x2="736.0" y2="122.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="148.0" font-size="15" fill="#0b0b0b" font-weight="600">запись</text>
<text x="40.0" y="167.0" font-size="11.5" fill="#52514e" font-style="italic"><tspan x="40.0" dy="0.0">«предъявитель дал</tspan><tspan x="40.0" dy="14.4">и ещё не получил»</tspan></text>
<text x="335.0" y="157.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="335.0" dy="0.0">чужие: ни родства,</tspan><tspan x="335.0" dy="16.2">ни общей книги</tspan></text>
<text x="588.0" y="157.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="588.0" dy="0.0">запись не нужна: семья, фирма</tspan><tspan x="588.0" dy="16.2">внутри, тело, копии одной машины</tspan></text>
<line x1="28.0" y1="198.0" x2="736.0" y2="198.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="224.0" font-size="15" fill="#0b0b0b" font-weight="600">её ценность</text>
<text x="40.0" y="243.0" font-size="11.5" fill="#52514e" font-style="italic"><tspan x="40.0" dy="0.0">за неё кто-нибудь</tspan><tspan x="40.0" dy="14.4">что-нибудь даст</tspan></text>
<text x="335.0" y="233.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="335.0" dy="0.0">потребность людей</tspan><tspan x="335.0" dy="16.2">друг в друге</tspan></text>
<text x="588.0" y="233.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="588.0" dy="0.0">запись ничего не стоит: кто никому</tspan><tspan x="588.0" dy="16.2">не нужен, тот её не заработает</tspan></text>
<line x1="28.0" y1="274.0" x2="736.0" y2="274.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="300.0" font-size="15" fill="#0b0b0b" font-weight="600">мера</text>
<text x="40.0" y="319.0" font-size="11.5" fill="#52514e" font-style="italic"><tspan x="40.0" dy="0.0">сколько всего остального</tspan><tspan x="40.0" dy="14.4">надо отдать</tspan></text>
<text x="335.0" y="309.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="335.0" dy="0.0">чего-то не хватает,</tspan><tspan x="335.0" dy="16.2">и его можно пустить на разное</tspan></text>
<text x="588.0" y="309.0" font-size="13" fill="#1baf7a" text-anchor="middle" font-weight="600"><tspan x="588.0" dy="0.0">не исчезает: число выпадает из задачи</tspan><tspan x="588.0" dy="16.2">без базара; учёт в натуре</tspan></text>
<line x1="28.0" y1="350.0" x2="736.0" y2="350.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="376.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Строка 2 — определение автора 2017 года. Строка 3 — оценки Канторовича; что от денег наследнику</tspan><tspan x="28.0" dy="14.4">останется одна мера — прочтение Андрея.</tspan></text>
</svg>
