<text x="94.4" y="222.1" font-size="12.5" fill="#008300" text-anchor="middle" font-weight="600">walks</text>
<text x="239.6" y="213.9" font-size="12.5" fill="#eb6834" text-anchor="middle" font-weight="600"><tspan x="239.6" dy="0.0">is carried</tspan><tspan x="239.6" dy="15.6">in a basket</tspan></text>
<text x="168.0" y="358.0" font-size="11.5" fill="#8a8985" text-anchor="middle">a drum with striped walls</text>
<text x="566.0" y="104.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">walked</text>
<text x="668.0" y="104.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600">was carried</text>
<line x1="336.0" y1="120.0" x2="732.0" y2="120.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="340.0" y="145.0" font-size="12.5" fill="#0b0b0b"><tspan x="340.0" dy="0.0">puts out its paws</tspan><tspan x="340.0" dy="15.6">to meet a surface</tspan></text>
<text x="566.0" y="153.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">all 8</text>
<text x="668.0" y="153.0" font-size="13" fill="#e34948" text-anchor="middle" font-weight="600">none of 8</text>
<line x1="336.0" y1="178.0" x2="732.0" y2="178.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="340.0" y="203.0" font-size="12.5" fill="#0b0b0b"><tspan x="340.0" dy="0.0">blinks at a hand</tspan><tspan x="340.0" dy="15.6">coming at its face</tspan></text>
<text x="566.0" y="211.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">yes</text>
<text x="668.0" y="211.0" font-size="13" fill="#e34948" text-anchor="middle" font-weight="600">no</text>
<line x1="336.0" y1="236.0" x2="732.0" y2="236.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="340.0" y="261.0" font-size="12.5" fill="#0b0b0b"><tspan x="340.0" dy="0.0">steps off the glass over a drop</tspan><tspan x="340.0" dy="15.6">on the shallow side</tspan></text>
<text x="566.0" y="269.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">12 times of 12</text>
<text x="668.0" y="269.0" font-size="13" fill="#e34948" text-anchor="middle" font-weight="600">4 to 8 of 12</text>
<line x1="336.0" y1="294.0" x2="732.0" y2="294.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="388.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="28.0" dy="0.0">The carried kittens were not blind: the pupil narrowed, the eye followed a moving hand.</tspan><tspan x="28.0" dy="15.6">After two days of running free in a lit room they passed the same tests.</tspan></text>
<text x="28.0" y="432.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Held and Hein (1963): eight pairs reared in the dark to the age of 8–12 weeks, then three hours a day in the</tspan><tspan x="28.0" dy="14.4">apparatus, 9 to 63 hours in all (about 30 on average); a pair was tested when its walking kitten first put out its paws.</tspan></text>
