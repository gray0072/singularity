<svg xmlns="http://www.w3.org/2000/svg" width="760" height="668" viewBox="0 0 760 668" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Two columns of odds</title>

<rect x="0.5" y="0.5" width="759" height="667" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Two columns of odds</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">The same marks: the odds Andrey gave at the fire, and the odds of the one who wrote his lines.</text>
<text x="425.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">Andrey, at the fire</text>
<text x="628.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">the writer, 28 November 2026</text>
<line x1="28.0" y1="118.0" x2="736.0" y2="118.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="138.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">a machine alone finishes four of</tspan><tspan x="34.0" dy="15.6">five month-long tasks</tspan></text>
<text x="34.0" y="171.0" font-size="11" fill="#8a8985">autumn 2031 · the mark of 30</text>
<text x="425.0" y="153.0" font-size="12" fill="#0b0b0b" text-anchor="middle">three to one</text>
<rect x="525.0" y="124.0" width="206.0" height="50.0" rx="6" fill="#e6f4ea"/>
<text x="628.0" y="153.0" font-size="12" fill="#008300" text-anchor="middle">four to one</text>
<line x1="28.0" y1="180.0" x2="736.0" y2="180.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="200.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">labour's share of world income</tspan><tspan x="34.0" dy="15.6">below 51.5%</tspan></text>
<text x="34.0" y="233.0" font-size="11" fill="#8a8985">autumn 2031 · the mark of 27 and 30</text>
<text x="425.0" y="215.0" font-size="12" fill="#0b0b0b" text-anchor="middle">three to one</text>
<rect x="525.0" y="186.0" width="206.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="628.0" y="215.0" font-size="12" fill="#8a6200" text-anchor="middle">one in three</text>
<line x1="28.0" y1="242.0" x2="736.0" y2="242.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="262.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">machines sold to everybody learn</tspan><tspan x="34.0" dy="15.6">on the run, in the head</tspan></text>
<text x="34.0" y="295.0" font-size="11" fill="#8a8985">autumn 2031 · the mark of 64</text>
<text x="425.0" y="277.0" font-size="12" fill="#0b0b0b" text-anchor="middle">even</text>
<rect x="525.0" y="248.0" width="206.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="628.0" y="277.0" font-size="12" fill="#8a6200" text-anchor="middle">one in three</text>
<line x1="28.0" y1="304.0" x2="736.0" y2="304.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="324.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">the young (22–25) in exposed jobs</tspan><tspan x="34.0" dy="15.6">behind their peers by over a quarter</tspan></text>
<text x="34.0" y="357.0" font-size="11" fill="#8a8985">autumn 2031 · the writer's own; over a tenth now (16)</text>
<text x="425.0" y="339.0" font-size="12" fill="#0b0b0b" text-anchor="middle">no mark</text>
<rect x="525.0" y="310.0" width="206.0" height="50.0" rx="6" fill="#efeeea"/>
<text x="628.0" y="339.0" font-size="12" fill="#52514e" text-anchor="middle">two to one</text>
<line x1="28.0" y1="366.0" x2="736.0" y2="366.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="386.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">labour's share of world income</tspan><tspan x="34.0" dy="15.6">below 50%</tspan></text>
<text x="34.0" y="419.0" font-size="11" fill="#8a8985">autumn 2036 · the mark of 27 and 30</text>
<text x="425.0" y="401.0" font-size="12" fill="#0b0b0b" text-anchor="middle">two to one</text>
<rect x="525.0" y="372.0" width="206.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="628.0" y="401.0" font-size="12" fill="#8a6200" text-anchor="middle">one in three</text>
<line x1="28.0" y1="428.0" x2="736.0" y2="428.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="448.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">a million general-purpose robots</tspan><tspan x="34.0" dy="15.6">made in a single year</tspan></text>
<text x="34.0" y="481.0" font-size="11" fill="#8a8985">autumn 2036 · the mark of 27 and 30</text>
<text x="425.0" y="463.0" font-size="12" fill="#0b0b0b" text-anchor="middle">two to one</text>
<rect x="525.0" y="434.0" width="206.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="628.0" y="463.0" font-size="12" fill="#8a6200" text-anchor="middle">even</text>
<line x1="28.0" y1="490.0" x2="736.0" y2="490.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="510.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">a Millennium Prize Problem solved</tspan><tspan x="34.0" dy="15.6">mainly by a machine</tspan></text>
<text x="34.0" y="543.0" font-size="11" fill="#8a8985">autumn 2036 · the mark of 30</text>
<text x="425.0" y="525.0" font-size="12" fill="#0b0b0b" text-anchor="middle">one in two</text>
<rect x="525.0" y="496.0" width="206.0" height="50.0" rx="6" fill="#e6f4ea"/>
<text x="628.0" y="525.0" font-size="12" fill="#008300" text-anchor="middle">three to two</text>
<line x1="28.0" y1="552.0" x2="736.0" y2="552.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="572.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">outsiders find a planted want every</tspan><tspan x="34.0" dy="15.6">time, in a blind trial on a model on sale</tspan></text>
<text x="34.0" y="605.0" font-size="11" fill="#8a8985">autumn 2036 · the writer's own; Oleg's half tick of 63</text>
<text x="425.0" y="587.0" font-size="12" fill="#0b0b0b" text-anchor="middle">no odds</text>
<rect x="525.0" y="558.0" width="206.0" height="50.0" rx="6" fill="#efeeea"/>
<text x="628.0" y="587.0" font-size="12" fill="#52514e" text-anchor="middle">one in four</text>
<line x1="28.0" y1="614.0" x2="736.0" y2="614.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="640.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Green: the writer puts the odds higher. Yellow: lower. Grey: a mark of the writer's own. Andrey's marks stay as they are;</tspan><tspan x="28.0" dy="14.4">the second column uses the same figures and is to be checked beside the first.</tspan></text>
</svg>
