<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>A city twice as large</title>

<rect x="0.5" y="0.5" width="759" height="349" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">A city twice as large</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">What changes per inhabitant at every doubling, by the rounded exponents of the 2007 count.</text>
<line x1="330.0" y1="88.0" x2="330.0" y2="278.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="330.0" y="296.0" font-size="11.5" fill="#8a8985" text-anchor="middle">−20%</text>
<line x1="400.0" y1="88.0" x2="400.0" y2="278.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="400.0" y="296.0" font-size="11.5" fill="#8a8985" text-anchor="middle">−10%</text>
<line x1="540.0" y1="88.0" x2="540.0" y2="278.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="540.0" y="296.0" font-size="11.5" fill="#8a8985" text-anchor="middle">+10%</text>
<line x1="610.0" y1="88.0" x2="610.0" y2="278.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="610.0" y="296.0" font-size="11.5" fill="#8a8985" text-anchor="middle">+20%</text>
<text x="470.0" y="296.0" font-size="11.5" fill="#8a8985" text-anchor="middle">0</text>
<text x="644.0" y="296.0" font-size="11.5" fill="#8a8985">per inhabitant</text>
<text x="28.0" y="116.0" font-size="13.5" fill="#0b0b0b" font-weight="600">the pipes</text>
<text x="28.0" y="134.0" font-size="12" fill="#52514e">petrol stations, cables, roads</text>
<rect x="379.0" y="104.0" width="91.0" height="26.0" rx="3" fill="#1baf7a" fill-opacity="0.85"/>
<text x="480.0" y="116.0" font-size="13" fill="#0b0b0b" font-weight="600">about 13% less</text>
<text x="480.0" y="133.0" font-size="11.5" fill="#52514e">exponent ≈ 0.8</text>
<text x="28.0" y="178.0" font-size="13.5" fill="#0b0b0b" font-weight="600">a person's own needs</text>
<text x="28.0" y="196.0" font-size="12" fill="#52514e">housing, jobs, water at home</text>
<rect x="468.0" y="166.0" width="4.0" height="26.0" rx="1" fill="#8a8985"/>
<text x="480.0" y="178.0" font-size="13" fill="#0b0b0b" font-weight="600">the same</text>
<text x="480.0" y="195.0" font-size="11.5" fill="#52514e">exponent ≈ 1</text>
<text x="28.0" y="240.0" font-size="13.5" fill="#0b0b0b" font-weight="600">what happens between people</text>
<text x="28.0" y="258.0" font-size="12" fill="#52514e">wages, patents, serious crime</text>
<rect x="470.0" y="228.0" width="105.0" height="26.0" rx="3" fill="#eb6834" fill-opacity="0.85"/>
<text x="583.0" y="240.0" font-size="13" fill="#0b0b0b" font-weight="600">about 15% more</text>
<text x="583.0" y="257.0" font-size="11.5" fill="#52514e">exponent ≈ 1.2</text>
<line x1="470.0" y1="88.0" x2="470.0" y2="278.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="322.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Bettencourt, Lobo, Helbing, Kühnert, West (2007): 2^(0.8 − 1) = 0.87, 2^(1.2 − 1) = 1.15. The exponents differ from measure</tspan><tspan x="28.0" dy="14.4">to measure and move with the edge of the city (Arcaute and others, 2015).</tspan></text>
</svg>
