<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Вена и остров, 1919 год</title>

<rect x="0.5" y="0.5" width="759" height="371" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Вена и остров, 1919 год</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Две теории одного года, и что каждая делала с любым исходом, какой можно придумать.</text>
<text x="28.0" y="100.0" font-size="14.5" fill="#0b0b0b" font-weight="600">чувство неполноценности</text>
<text x="28.0" y="120.0" font-size="12" fill="#8a8985" font-style="italic">человек…</text>
<line x1="28.0" y1="132.0" x2="368.0" y2="132.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="32.0" y="160.0" font-size="13" fill="#0b0b0b">толкнул ребёнка в воду</text>
<rect x="246.0" y="141.0" width="118.0" height="28.0" rx="6" fill="#efeeea"/>
<text x="305.0" y="159.0" font-size="12" fill="#52514e" text-anchor="middle">объяснено</text>
<line x1="28.0" y1="178.0" x2="368.0" y2="178.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="32.0" y="206.0" font-size="13" fill="#0b0b0b">отдал жизнь, спасая ребёнка</text>
<rect x="246.0" y="187.0" width="118.0" height="28.0" rx="6" fill="#efeeea"/>
<text x="305.0" y="205.0" font-size="12" fill="#52514e" text-anchor="middle">объяснено</text>
<line x1="28.0" y1="224.0" x2="368.0" y2="224.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="32.0" y="252.0" font-size="13" fill="#0b0b0b">ничего не сделал</text>
<rect x="246.0" y="233.0" width="118.0" height="28.0" rx="6" fill="#efeeea"/>
<text x="305.0" y="251.0" font-size="12" fill="#52514e" text-anchor="middle">объяснено</text>
<line x1="28.0" y1="270.0" x2="368.0" y2="270.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="298.0" font-size="14" fill="#e34948" font-weight="600">не запрещает ничего</text>
<text x="392.0" y="100.0" font-size="14.5" fill="#0b0b0b" font-weight="600">тяготение, затмение 29 мая</text>
<text x="392.0" y="120.0" font-size="12" fill="#8a8985" font-style="italic">свет звезды у края Солнца отклоняется на…</text>
<line x1="392.0" y1="132.0" x2="732.0" y2="132.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="396.0" y="160.0" font-size="13" fill="#0b0b0b">нисколько</text>
<rect x="610.0" y="141.0" width="118.0" height="28.0" rx="6" fill="#fbe3e2"/>
<text x="669.0" y="159.0" font-size="12" fill="#b3302f" text-anchor="middle">опровергнута</text>
<line x1="392.0" y1="178.0" x2="732.0" y2="178.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="396.0" y="206.0" font-size="13" fill="#0b0b0b">0,87 угловой секунды</text>
<rect x="610.0" y="187.0" width="118.0" height="28.0" rx="6" fill="#fbe3e2"/>
<text x="669.0" y="205.0" font-size="12" fill="#b3302f" text-anchor="middle">опровергнута</text>
<line x1="392.0" y1="224.0" x2="732.0" y2="224.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="396.0" y="252.0" font-size="13" fill="#0b0b0b">1,75 угловой секунды</text>
<rect x="610.0" y="233.0" width="118.0" height="28.0" rx="6" fill="#e6f4ea"/>
<text x="669.0" y="251.0" font-size="12" fill="#008300" text-anchor="middle">устояла</text>
<line x1="392.0" y1="270.0" x2="732.0" y2="270.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="392.0" y="298.0" font-size="14" fill="#008300" font-weight="600">запрещает два исхода из трёх</text>
<text x="28.0" y="332.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Двое у воды и «тысяча-и-однократный опыт» — лекция Поппера 1953 года. Третьего человека слева</tspan><tspan x="28.0" dy="14.4">добавил вечер. Пластинки зачитали в Лондоне 6 ноября 1919 года.</tspan></text>
</svg>
