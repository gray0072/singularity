<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Чем держится связь</title>

<rect x="0.5" y="0.5" width="759" height="439" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Чем держится связь</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Четыре связи этого лета: чем каждая держится, когда отпускает и сколько её между теми и нами.</text>
<text x="248.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">чем держится</text>
<text x="443.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">когда отпускает</text>
<text x="638.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">между теми и нами</text>
<line x1="28.0" y1="118.0" x2="736.0" y2="118.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="148.0" font-size="13.5" fill="#0b0b0b" font-weight="600">родство</text>
<text x="34.0" y="165.0" font-size="11" fill="#8a8985">вечер 43</text>
<text x="248.0" y="147.0" font-size="12" fill="#0b0b0b" text-anchor="middle">доля общих</text>
<text x="248.0" y="163.0" font-size="12" fill="#0b0b0b" text-anchor="middle">чертежей</text>
<text x="443.0" y="155.0" font-size="12" fill="#0b0b0b" text-anchor="middle">доля мала</text>
<rect x="545.0" y="124.0" width="186.0" height="54.0" rx="6" fill="#fbe3e2"/>
<text x="638.0" y="147.0" font-size="12" fill="#b3302f" text-anchor="middle">ни буквы чертежей;</text>
<text x="638.0" y="163.0" font-size="12" fill="#b3302f" text-anchor="middle">только слова (52)</text>
<line x1="28.0" y1="184.0" x2="736.0" y2="184.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="214.0" font-size="13.5" fill="#0b0b0b" font-weight="600">долги</text>
<text x="34.0" y="231.0" font-size="11" fill="#8a8985">вечера 43, 47</text>
<text x="248.0" y="213.0" font-size="12" fill="#0b0b0b" text-anchor="middle">запись о том, кто дал</text>
<text x="248.0" y="229.0" font-size="12" fill="#0b0b0b" text-anchor="middle">и ещё не получил</text>
<text x="443.0" y="213.0" font-size="12" fill="#0b0b0b" text-anchor="middle">никто не помнит</text>
<text x="443.0" y="229.0" font-size="12" fill="#0b0b0b" text-anchor="middle">или больше не встретятся</text>
<rect x="545.0" y="190.0" width="186.0" height="54.0" rx="6" fill="#fbe3e2"/>
<text x="638.0" y="213.0" font-size="12" fill="#b3302f" text-anchor="middle">она нам ничего</text>
<text x="638.0" y="229.0" font-size="12" fill="#b3302f" text-anchor="middle">не должна (30)</text>
<line x1="28.0" y1="250.0" x2="736.0" y2="250.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="280.0" font-size="13.5" fill="#0b0b0b" font-weight="600">нужда</text>
<text x="34.0" y="297.0" font-size="11" fill="#8a8985">вечера 11, 47, 51</text>
<text x="248.0" y="279.0" font-size="12" fill="#0b0b0b" text-anchor="middle">одному не обойтись</text>
<text x="248.0" y="295.0" font-size="12" fill="#0b0b0b" text-anchor="middle">без другого</text>
<text x="443.0" y="287.0" font-size="12" fill="#0b0b0b" text-anchor="middle">нужда кончилась</text>
<rect x="545.0" y="256.0" width="186.0" height="54.0" rx="6" fill="#fdf3d7"/>
<text x="638.0" y="279.0" font-size="12" fill="#8a6200" text-anchor="middle">десятилетия, и с каждым</text>
<text x="638.0" y="295.0" font-size="12" fill="#8a6200" text-anchor="middle">годом меньше (51)</text>
<line x1="28.0" y1="316.0" x2="736.0" y2="316.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="346.0" font-size="13.5" fill="#0b0b0b" font-weight="600">любовь</text>
<text x="34.0" y="363.0" font-size="11" fill="#8a8985">не разобрано (46)</text>
<text x="248.0" y="345.0" font-size="12" fill="#0b0b0b" text-anchor="middle">ничем, что можно</text>
<text x="248.0" y="361.0" font-size="12" fill="#0b0b0b" text-anchor="middle">сосчитать</text>
<text x="443.0" y="345.0" font-size="12" fill="#0b0b0b" text-anchor="middle">не тогда, когда</text>
<text x="443.0" y="361.0" font-size="12" fill="#0b0b0b" text-anchor="middle">кончилась нужда</text>
<rect x="545.0" y="322.0" width="186.0" height="54.0" rx="6" fill="#efeeea"/>
<text x="638.0" y="345.0" font-size="12" fill="#52514e" text-anchor="middle">не выведено:</text>
<text x="638.0" y="361.0" font-size="12" fill="#52514e" text-anchor="middle">пишется (64)</text>
<line x1="28.0" y1="382.0" x2="736.0" y2="382.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="408.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Прочтение вечера. Первые три строки считаются; четвёртую можно описать и нельзя вывести.</tspan><tspan x="28.0" dy="14.4">Красный — её нет. Жёлтый — есть, со сроком. Серый — неизвестно.</tspan></text>
</svg>
