<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>What understanding changes, and what it does not</title>

<rect x="0.5" y="0.5" width="759" height="349" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">What understanding changes, and what it does not</text>
<rect x="28.0" y="64.0" width="250.0" height="236.0" rx="10" fill="#eeeeec" stroke="#8a8985" stroke-width="1.5"/>
<rect x="292.0" y="64.0" width="440.0" height="236.0" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="44.0" y="90.0" font-size="15" fill="#52514e" font-weight="600">Does not change</text>
<text x="308.0" y="90.0" font-size="15" fill="#2a78d6" font-weight="600">Changes</text>
<text x="44.0" y="124.0" font-size="13" fill="#52514e">— the trend</text>
<text x="44.0" y="170.0" font-size="13" fill="#52514e">— the order of the steps</text>
<text x="44.0" y="216.0" font-size="13" fill="#52514e">— the outcome for humanity</text>
<text x="44.0" y="262.0" font-size="13" fill="#52514e"><tspan x="44.0" dy="0.0">— the wants of eight</tspan><tspan x="44.0" dy="16.2">   billion people</tspan></text>
<text x="308.0" y="124.0" font-size="13" fill="#0b0b0b"><tspan x="308.0" dy="0.0">— whom you trust: sellers of salvation,</tspan><tspan x="308.0" dy="16.2">   your own wants, the hunt for enemies</tspan></text>
<text x="308.0" y="170.0" font-size="13" fill="#0b0b0b"><tspan x="308.0" dy="0.0">— what you stake your</tspan><tspan x="308.0" dy="16.2">   family's life on</tspan></text>
<text x="308.0" y="216.0" font-size="13" fill="#0b0b0b"><tspan x="308.0" dy="0.0">— how you keep your bonds with people:</tspan><tspan x="308.0" dy="16.2">   by habit, not by need</tspan></text>
<text x="308.0" y="262.0" font-size="13" fill="#0b0b0b">— how you meet the end: calmly</text>
<text x="28.0" y="330.0" font-size="12.5" fill="#52514e" font-style="italic">Determinism, not fatalism: your decisions are among the causes of your own family's outcome.</text>
</svg>
