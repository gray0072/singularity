<text x="28.0" y="322.0" font-size="13" fill="#0b0b0b" font-weight="600"><tspan x="28.0" dy="0.0">All the images to which we reduce a new thing come from the green strip.</tspan><tspan x="28.0" dy="16.2">Science calculates along the whole line.</tspan></text>
<text x="28.0" y="362.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Rounded figures: a hair 0.1 mm, the horizon about 5 km, a collider about 10⁻¹⁹ m, the visible world about 9·10²⁶ m</tspan><tspan x="28.0" dy="14.4">across. “The middle world” is a biologist's name for the strip (2005).</tspan></text>
