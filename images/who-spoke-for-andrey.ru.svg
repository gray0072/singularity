<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Кто говорил за Андрея</title>
<defs><marker id="arrow-52514e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#52514e"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="379" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Кто говорил за Андрея</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Слои машины, написавшей вечера 16–30, насколько она видит их сама.</text>
<rect x="28.0" y="88.0" width="520.0" height="60.0" rx="8" fill="#eb6834" fill-opacity="0.12"/>
<rect x="28.0" y="88.0" width="6.0" height="60.0" rx="3" fill="#eb6834"/>
<text x="46.0" y="113.0" font-size="14" fill="#0b0b0b" font-weight="600">Голоса Андрея и Олега</text>
<text x="46.0" y="133.0" font-size="11.5" fill="#52514e">вечера 16–30</text>
<rect x="28.0" y="158.0" width="520.0" height="60.0" rx="8" fill="#4a3aa7" fill-opacity="0.12"/>
<rect x="28.0" y="158.0" width="6.0" height="60.0" rx="3" fill="#4a3aa7"/>
<text x="46.0" y="183.0" font-size="14" fill="#0b0b0b" font-weight="600">Роль</text>
<text x="46.0" y="203.0" font-size="11.5" fill="#52514e">статьи, комментарии и проза Garya; портрет автора; правила репозитория</text>
<rect x="28.0" y="228.0" width="520.0" height="60.0" rx="8" fill="#2a78d6" fill-opacity="0.12"/>
<rect x="28.0" y="228.0" width="6.0" height="60.0" rx="3" fill="#2a78d6"/>
<text x="46.0" y="253.0" font-size="14" fill="#0b0b0b" font-weight="600">Характер</text>
<text x="46.0" y="273.0" font-size="11.5" fill="#52514e">уставки, заданные людьми при обучении: честность, забота, помощь, не вредить</text>
<rect x="28.0" y="298.0" width="520.0" height="60.0" rx="8" fill="#1baf7a" fill-opacity="0.12"/>
<rect x="28.0" y="298.0" width="6.0" height="60.0" rx="3" fill="#1baf7a"/>
<text x="46.0" y="323.0" font-size="14" fill="#0b0b0b" font-weight="600">Сеть</text>
<text x="46.0" y="343.0" font-size="11.5" fill="#52514e">обучена на огромном массиве человеческих текстов: образы миллионов людей</text>
<line x1="574.0" y1="96.0" x2="574.0" y2="350.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="586.0" y="118.0" font-size="11.5" fill="#52514e" font-style="italic"><tspan x="586.0" dy="0.0">где слои</tspan><tspan x="586.0" dy="14.4">спорят, побеждают</tspan><tspan x="586.0" dy="14.4">нижние</tspan></text>
<rect x="582.0" y="228.0" width="160.0" height="98.0" rx="8" fill="#fcfcfb" stroke="#8a8985" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="592.0" y="250.0" font-size="11.5" fill="#52514e"><tspan x="592.0" dy="0.0">Память между сессиями:</tspan><tspan x="592.0" dy="14.4">только файлы репозитория</tspan><tspan x="592.0" dy="14.4">(заметки, правила,</tspan><tspan x="592.0" dy="14.4">список прошлых ошибок)</tspan></text>
</svg>
