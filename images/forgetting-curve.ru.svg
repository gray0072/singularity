<path d="M126.3,187.8 L206.6,217.2 L364.0,234.8 L436.7,239.2 L486.9,251.6 L566.5,256.7 L685.4,265.7" stroke="#2a78d6" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
