<svg xmlns="http://www.w3.org/2000/svg" width="760" height="478" viewBox="0 0 760 478" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Who asked, who found, who checked, who understood</title>

<rect x="0.5" y="0.5" width="759" height="477" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Who asked, who found, who checked, who understood</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">A table in the ash: the same four questions under five proofs.</text>
<text x="245.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">who asked</text>
<text x="361.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">who found</text>
<text x="516.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">who checked</text>
<text x="668.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">who understood</text>
<line x1="28.0" y1="114.0" x2="736.0" y2="114.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="141.0" font-size="13" fill="#0b0b0b" font-weight="600">the root of two is no fraction</text>
<text x="34.0" y="158.0" font-size="11" fill="#8a8985">a school proof</text>
<text x="245.0" y="149.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">a man</text>
<text x="361.0" y="149.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">a man</text>
<text x="516.0" y="149.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">any reader</text>
<text x="668.0" y="149.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">any schoolchild</text>
<line x1="28.0" y1="174.0" x2="736.0" y2="174.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="201.0" font-size="13" fill="#0b0b0b" font-weight="600">the four pencils</text>
<text x="34.0" y="218.0" font-size="11" fill="#8a8985">1852 → 1976</text>
<text x="245.0" y="209.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">a man</text>
<text x="361.0" y="201.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">men cut the cases,</text>
<text x="361.0" y="217.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">a machine went through them</text>
<text x="516.0" y="201.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">another program;</text>
<text x="516.0" y="217.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">in 2005 a checker</text>
<text x="668.0" y="201.0" font-size="11.5" fill="#e34948" text-anchor="middle" font-weight="600">why four:</text>
<text x="668.0" y="217.0" font-size="11.5" fill="#e34948" text-anchor="middle" font-weight="600">nobody</text>
<line x1="28.0" y1="234.0" x2="736.0" y2="234.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="261.0" font-size="13" fill="#0b0b0b" font-weight="600">the oranges</text>
<text x="34.0" y="278.0" font-size="11" fill="#8a8985">1611 → 1998 → 2014</text>
<text x="245.0" y="269.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">a man</text>
<text x="361.0" y="261.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">a man, with</text>
<text x="361.0" y="277.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">programs</text>
<text x="516.0" y="261.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">12 referees: “99%”;</text>
<text x="516.0" y="277.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">then a checker</text>
<text x="668.0" y="261.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">the author</text>
<text x="668.0" y="277.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">and a few</text>
<line x1="28.0" y1="294.0" x2="736.0" y2="294.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="321.0" font-size="13" fill="#0b0b0b" font-weight="600">the conjecture of 2012</text>
<text x="34.0" y="338.0" font-size="11" fill="#8a8985">14 years</text>
<text x="245.0" y="329.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">a man</text>
<text x="361.0" y="329.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">a man</text>
<text x="516.0" y="321.0" font-size="11.5" fill="#e34948" text-anchor="middle" font-weight="600">not agreed;</text>
<text x="516.0" y="337.0" font-size="11.5" fill="#e34948" text-anchor="middle" font-weight="600">the checker stopped</text>
<text x="668.0" y="321.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">the author</text>
<text x="668.0" y="337.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">and a few</text>
<line x1="28.0" y1="354.0" x2="736.0" y2="354.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="381.0" font-size="13" fill="#0b0b0b" font-weight="600">the Riemann hypothesis</text>
<text x="34.0" y="398.0" font-size="11" fill="#8a8985">1859 → November 2026</text>
<text x="245.0" y="389.0" font-size="11.5" fill="#008300" text-anchor="middle" font-weight="600">a man</text>
<text x="361.0" y="381.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">a man led; at the</text>
<text x="361.0" y="397.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">finish, a machine</text>
<text x="516.0" y="381.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">several checkers, in a day;</text>
<text x="516.0" y="397.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">men read the statement</text>
<text x="668.0" y="389.0" font-size="11.5" fill="#e34948" text-anchor="middle" font-weight="600">nobody yet</text>
<line x1="28.0" y1="414.0" x2="736.0" y2="414.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="34.0" cy="436.0" r="5.0" fill="#008300"/>
<text x="46.0" y="440.0" font-size="12" fill="#52514e">a man</text>
<circle cx="114.0" cy="436.0" r="5.0" fill="#2a78d6"/>
<text x="126.0" y="440.0" font-size="12" fill="#52514e">a man and a machine</text>
<circle cx="294.8" cy="436.0" r="5.0" fill="#e34948"/>
<text x="306.8" y="440.0" font-size="12" fill="#52514e">nobody, or not agreed</text>
<text x="28.0" y="468.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">The evening's reading, not a measurement. The last row as it stood on 28 November 2026: the short version of the proof says</tspan><tspan x="28.0" dy="14.4">“no mathematician has read it through”.</tspan></text>
</svg>
