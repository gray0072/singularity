<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>With a machine helper: faster or slower?</title>

<rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">With a machine helper: faster or slower?</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Change in the time a task takes, randomised experiments.</text>
<line x1="380.0" y1="88.0" x2="380.0" y2="286.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="380.0" y="302.0" font-size="11.5" fill="#52514e" text-anchor="middle">−60%</text>
<line x1="440.0" y1="88.0" x2="440.0" y2="286.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="440.0" y="302.0" font-size="11.5" fill="#52514e" text-anchor="middle">−40%</text>
<line x1="500.0" y1="88.0" x2="500.0" y2="286.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="500.0" y="302.0" font-size="11.5" fill="#52514e" text-anchor="middle">−20%</text>
<line x1="560.0" y1="88.0" x2="560.0" y2="286.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="560.0" y="302.0" font-size="11.5" fill="#52514e" text-anchor="middle">0</text>
<line x1="620.0" y1="88.0" x2="620.0" y2="286.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="620.0" y="302.0" font-size="11.5" fill="#52514e" text-anchor="middle">+20%</text>
<text x="552.0" y="320.0" font-size="12" fill="#2a78d6" text-anchor="end" font-weight="600">◀ faster</text>
<text x="568.0" y="320.0" font-size="12" fill="#eb6834" font-weight="600">slower ▶</text>
<text x="28.0" y="113.0" font-size="13.5" fill="#0b0b0b">Writing letters and reports</text>
<text x="28.0" y="130.0" font-size="11" fill="#8a8985">Noy &amp; Zhang 2023</text>
<rect x="440.0" y="100.0" width="120.0" height="24.0" rx="4" fill="#2a78d6"/>
<text x="434.0" y="117.0" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">−40%</text>
<text x="28.0" y="160.0" font-size="13.5" fill="#0b0b0b">A small web server</text>
<text x="28.0" y="177.0" font-size="11" fill="#8a8985">Peng et al. 2023</text>
<rect x="392.0" y="147.0" width="168.0" height="24.0" rx="4" fill="#2a78d6"/>
<text x="386.0" y="164.0" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">−56%</text>
<text x="28.0" y="207.0" font-size="13.5" fill="#0b0b0b">Consulting tasks inside the frontier</text>
<text x="28.0" y="224.0" font-size="11" fill="#8a8985">Dell'Acqua et al. 2023</text>
<rect x="485.0" y="194.0" width="75.0" height="24.0" rx="4" fill="#2a78d6"/>
<text x="479.0" y="211.0" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">−25%</text>
<text x="28.0" y="254.0" font-size="13.5" fill="#0b0b0b"><tspan x="28.0" dy="0.0">Experienced programmers,</tspan><tspan x="28.0" dy="16.9">their own large projects</tspan></text>
<text x="28.0" y="287.0" font-size="11" fill="#8a8985">METR 2025</text>
<rect x="560.0" y="241.0" width="57.0" height="24.0" rx="4" fill="#eb6834"/>
<text x="623.0" y="258.0" font-size="12.5" fill="#0b0b0b" font-weight="600">+19%</text>
</svg>
