<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Город вдвое больше</title>

<rect x="0.5" y="0.5" width="759" height="349" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Город вдвое больше</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Что меняется в расчёте на жителя при каждом удвоении, по округлённым показателям подсчёта 2007 года.</text>
<line x1="330.0" y1="88.0" x2="330.0" y2="278.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="330.0" y="296.0" font-size="11.5" fill="#8a8985" text-anchor="middle">−20%</text>
<line x1="400.0" y1="88.0" x2="400.0" y2="278.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="400.0" y="296.0" font-size="11.5" fill="#8a8985" text-anchor="middle">−10%</text>
<line x1="540.0" y1="88.0" x2="540.0" y2="278.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="540.0" y="296.0" font-size="11.5" fill="#8a8985" text-anchor="middle">+10%</text>
<line x1="610.0" y1="88.0" x2="610.0" y2="278.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="610.0" y="296.0" font-size="11.5" fill="#8a8985" text-anchor="middle">+20%</text>
<text x="470.0" y="296.0" font-size="11.5" fill="#8a8985" text-anchor="middle">0</text>
<text x="644.0" y="296.0" font-size="11.5" fill="#8a8985">на жителя</text>
<text x="28.0" y="116.0" font-size="13.5" fill="#0b0b0b" font-weight="600">трубы</text>
<text x="28.0" y="134.0" font-size="12" fill="#52514e">заправки, кабели, дороги</text>
<rect x="379.0" y="104.0" width="91.0" height="26.0" rx="3" fill="#1baf7a" fill-opacity="0.85"/>
<text x="480.0" y="116.0" font-size="13" fill="#0b0b0b" font-weight="600">примерно на 13% меньше</text>
<text x="480.0" y="133.0" font-size="11.5" fill="#52514e">показатель ≈ 0,8</text>
<text x="28.0" y="178.0" font-size="13.5" fill="#0b0b0b" font-weight="600">собственные нужды человека</text>
<text x="28.0" y="196.0" font-size="12" fill="#52514e">жильё, рабочие места, вода в квартире</text>
<rect x="468.0" y="166.0" width="4.0" height="26.0" rx="1" fill="#8a8985"/>
<text x="480.0" y="178.0" font-size="13" fill="#0b0b0b" font-weight="600">столько же</text>
<text x="480.0" y="195.0" font-size="11.5" fill="#52514e">показатель ≈ 1</text>
<text x="28.0" y="240.0" font-size="13.5" fill="#0b0b0b" font-weight="600">то, что происходит между людьми</text>
<text x="28.0" y="258.0" font-size="12" fill="#52514e">зарплаты, патенты, тяжкие преступления</text>
<rect x="470.0" y="228.0" width="105.0" height="26.0" rx="3" fill="#eb6834" fill-opacity="0.85"/>
<text x="583.0" y="240.0" font-size="13" fill="#0b0b0b" font-weight="600">примерно на 15% больше</text>
<text x="583.0" y="257.0" font-size="11.5" fill="#52514e">показатель ≈ 1,2</text>
<line x1="470.0" y1="88.0" x2="470.0" y2="278.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="322.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Беттенкур, Лобо, Хелбинг, Кюнерт, Уэст (2007): 2^(0,8 − 1) = 0,87, 2^(1,2 − 1) = 1,15. Показатели разные у разных величин</tspan><tspan x="28.0" dy="14.4">и сдвигаются вместе с границей города (Аркауте и др., 2015).</tspan></text>
</svg>
