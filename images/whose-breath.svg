<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Who breathes out on this planet</title>

<rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Who breathes out on this planet</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Carbon dioxide given out in a year, billion tonnes. The scale is linear.</text>
<text x="202.0" y="118.0" font-size="13" fill="#0b0b0b" text-anchor="end"><tspan x="202.0" dy="0.0">all people,</tspan><tspan x="202.0" dy="16.2">8.2 billion</tspan></text>
<rect x="216.0" y="104.0" width="40.5" height="30.0" rx="2" fill="#1baf7a" fill-opacity="0.85"/>
<text x="266.5" y="124.0" font-size="13.5" fill="#0b0b0b" font-weight="600">about 3</text>
<text x="202.0" y="184.0" font-size="13" fill="#0b0b0b" text-anchor="end"><tspan x="202.0" dy="0.0">chimneys and</tspan><tspan x="202.0" dy="16.2">exhaust pipes</tspan></text>
<rect x="216.0" y="170.0" width="500.0" height="30.0" rx="2" fill="#e34948" fill-opacity="0.85"/>
<text x="230.0" y="190.0" font-size="13.5" fill="#ffffff" font-weight="600">about 37 (2024): twelve times more</text>
<line x1="216.0" y1="94.0" x2="216.0" y2="216.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="252.0" font-size="12.5" fill="#0b0b0b"><tspan x="28.0" dy="0.0">The carbon in our breath was taken from the air by last year's harvest: a circle.</tspan><tspan x="28.0" dy="15.6">The carbon from the chimneys is from under the ground.</tspan></text>
<text x="28.0" y="310.0" font-size="11.5" fill="#8a8985">Arithmetic on the knee: about a kilogram of carbon dioxide per person a day. Fuel and cement: Global Carbon Budget 2024.</text>
</svg>
