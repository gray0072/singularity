<svg xmlns="http://www.w3.org/2000/svg" width="760" height="388" viewBox="0 0 760 388" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>The same pace, eighteen times the people</title>

<rect x="0.5" y="0.5" width="759" height="387" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">The same pace, eighteen times the people</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Researchers needed to keep the number of transistors on a chip doubling every two years (1971 = 1).</text>
<text x="82.0" y="110.0" font-size="13" fill="#0b0b0b" text-anchor="end">1971</text>
<rect x="96.0" y="96.0" width="34.4" height="30.0" rx="2" fill="#8a8985" fill-opacity="0.85"/>
<text x="140.4" y="116.0" font-size="13.5" fill="#0b0b0b" font-weight="600">1</text>
<text x="82.0" y="164.0" font-size="13" fill="#0b0b0b" text-anchor="end">2014</text>
<rect x="96.0" y="150.0" width="620.0" height="30.0" rx="2" fill="#eb6834" fill-opacity="0.85"/>
<text x="110.0" y="170.0" font-size="13.5" fill="#ffffff" font-weight="600">18: the doubling is the same, the people are eighteen times more</text>
<line x1="96.0" y1="86.0" x2="96.0" y2="184.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="28.0" y1="208.0" x2="732.0" y2="208.0" stroke="#e9e8e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="234.0" font-size="13" fill="#52514e" font-weight="600">Three more signs of the same thing</text>
<circle cx="36.0" cy="257.0" r="3.5" fill="#eb6834"/>
<text x="50.0" y="262.0" font-size="13" fill="#0b0b0b">the age at a first patent</text>
<text x="300.0" y="262.0" font-size="13" fill="#0b0b0b" font-weight="600">+ ⅔ of a year every ten years (1985–1999)</text>
<circle cx="36.0" cy="285.0" r="3.5" fill="#eb6834"/>
<text x="50.0" y="290.0" font-size="13" fill="#0b0b0b">inventors on one patent</text>
<text x="300.0" y="290.0" font-size="13" fill="#0b0b0b" font-weight="600">1.73 → 2.33 (1975–1999)</text>
<circle cx="36.0" cy="313.0" r="3.5" fill="#eb6834"/>
<text x="50.0" y="318.0" font-size="13" fill="#0b0b0b">the age of the great work</text>
<text x="300.0" y="318.0" font-size="13" fill="#0b0b0b" font-weight="600">+ about 6 years over the twentieth century</text>
<text x="28.0" y="364.0" font-size="11.5" fill="#8a8985">Bloom, Jones, Van Reenen &amp; Webb (2020); Jones (2009, 2010). The United States; the scale of the bars is linear.</text>
</svg>
