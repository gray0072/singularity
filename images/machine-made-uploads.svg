<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Every second new song</title>

<rect x="0.5" y="0.5" width="759" height="399" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Every second new song</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">The share of tracks made wholly by a machine among those delivered to Deezer every day.</text>
<line x1="84.0" y1="300.0" x2="700.0" y2="300.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="74.0" y="304.0" font-size="11.5" fill="#52514e" text-anchor="end">0%</text>
<line x1="84.0" y1="233.3" x2="700.0" y2="233.3" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="74.0" y="237.3" font-size="11.5" fill="#52514e" text-anchor="end">20%</text>
<line x1="84.0" y1="166.7" x2="700.0" y2="166.7" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="74.0" y="170.7" font-size="11.5" fill="#52514e" text-anchor="end">40%</text>
<line x1="84.0" y1="133.3" x2="700.0" y2="133.3" stroke="#e34948" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="90.0" y="126.3" font-size="11.5" fill="#e34948">half</text>
<line x1="84.0" y1="300.0" x2="84.0" y2="305.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="84.0" y="320.0" font-size="11.5" fill="#52514e" text-anchor="middle">Jan</text>
<line x1="186.7" y1="300.0" x2="186.7" y2="305.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="186.7" y="320.0" font-size="11.5" fill="#52514e" text-anchor="middle">Apr</text>
<line x1="289.3" y1="300.0" x2="289.3" y2="305.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="289.3" y="320.0" font-size="11.5" fill="#52514e" text-anchor="middle">Jul</text>
<line x1="392.0" y1="300.0" x2="392.0" y2="305.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="392.0" y="320.0" font-size="11.5" fill="#52514e" text-anchor="middle">Oct</text>
<line x1="494.7" y1="300.0" x2="494.7" y2="305.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="494.7" y="320.0" font-size="11.5" fill="#52514e" text-anchor="middle">Jan</text>
<line x1="597.3" y1="300.0" x2="597.3" y2="305.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="597.3" y="320.0" font-size="11.5" fill="#52514e" text-anchor="middle">Apr</text>
<line x1="700.0" y1="300.0" x2="700.0" y2="305.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="700.0" y="320.0" font-size="11.5" fill="#52514e" text-anchor="middle">Jul</text>
<text x="84.0" y="338.0" font-size="11.5" fill="#8a8985" text-anchor="middle">2025</text>
<text x="494.7" y="338.0" font-size="11.5" fill="#8a8985" text-anchor="middle">2026</text>
<path d="M84.0,266.7 L186.7,240.0 L357.8,206.7 L426.2,186.7 L597.3,153.3 L665.8,130.0" stroke="#eb6834" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="84.0" cy="266.7" r="4.8" fill="#eb6834"/>
<circle cx="186.7" cy="240.0" r="4.8" fill="#eb6834"/>
<circle cx="357.8" cy="206.7" r="4.8" fill="#eb6834"/>
<circle cx="426.2" cy="186.7" r="4.8" fill="#eb6834"/>
<circle cx="597.3" cy="153.3" r="4.8" fill="#eb6834"/>
<circle cx="665.8" cy="130.0" r="4.8" fill="#eb6834"/>
<text x="178.7" y="230.0" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">18%</text>
<text x="349.8" y="196.7" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">28%</text>
<text x="418.2" y="176.7" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">34%</text>
<text x="589.3" y="143.3" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">44%</text>
<text x="96.0" y="286.7" font-size="12.5" fill="#0b0b0b" font-weight="600">10%: about ten thousand tracks a day</text>
<text x="653.8" y="104.0" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600"><tspan x="653.8" dy="0.0">more than 50%:</tspan><tspan x="653.8" dy="15.6">about ninety thousand a day</tspan></text>
<text x="28.0" y="358.0" font-size="12.5" fill="#0b0b0b" font-style="italic">And of all the plays these tracks get one to three in a hundred.</text>
<text x="28.0" y="384.0" font-size="11.5" fill="#8a8985">The service's own announcements, January 2025 – July 2026; the last point is the peak of June 2026.</text>
</svg>
