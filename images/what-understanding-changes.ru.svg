<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Что понимание меняет, а что нет</title>

<rect x="0.5" y="0.5" width="759" height="349" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Что понимание меняет, а что нет</text>
<rect x="28.0" y="64.0" width="250.0" height="236.0" rx="10" fill="#eeeeec" stroke="#8a8985" stroke-width="1.5"/>
<rect x="292.0" y="64.0" width="440.0" height="236.0" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="44.0" y="90.0" font-size="15" fill="#52514e" font-weight="600">Не меняет</text>
<text x="308.0" y="90.0" font-size="15" fill="#2a78d6" font-weight="600">Меняет</text>
<text x="44.0" y="124.0" font-size="13" fill="#52514e">— тренд</text>
<text x="44.0" y="170.0" font-size="13" fill="#52514e">— порядок шагов</text>
<text x="44.0" y="216.0" font-size="13" fill="#52514e">— исход для человечества</text>
<text x="44.0" y="262.0" font-size="13" fill="#52514e"><tspan x="44.0" dy="0.0">— хотелки восьми</tspan><tspan x="44.0" dy="16.2">   миллиардов людей</tspan></text>
<text x="308.0" y="124.0" font-size="13" fill="#0b0b0b"><tspan x="308.0" dy="0.0">— кому ты веришь: продавцам спасения,</tspan><tspan x="308.0" dy="16.2">   своим хотелкам, охоте на врагов</tspan></text>
<text x="308.0" y="170.0" font-size="13" fill="#0b0b0b"><tspan x="308.0" dy="0.0">— на что ты ставишь</tspan><tspan x="308.0" dy="16.2">   жизнь своей семьи</tspan></text>
<text x="308.0" y="216.0" font-size="13" fill="#0b0b0b"><tspan x="308.0" dy="0.0">— как держишь связи с людьми:</tspan><tspan x="308.0" dy="16.2">   привычкой, а не нуждой</tspan></text>
<text x="308.0" y="262.0" font-size="13" fill="#0b0b0b">— как встречаешь конец: спокойно</text>
<text x="28.0" y="330.0" font-size="12.5" fill="#52514e" font-style="italic">Детерминизм, а не фатализм: твои решения — среди причин исхода для твоей собственной семьи.</text>
</svg>
