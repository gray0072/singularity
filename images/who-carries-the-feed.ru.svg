<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" viewBox="0 0 760 396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Таблица на золе: кто кого приручил</title>

<rect x="0.5" y="0.5" width="759" height="395" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Таблица на золе: кто кого приручил</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Счёт с обеих сторон и один вопрос, в котором симметрии нет.</text>
<rect x="28.0" y="292.0" width="708.0" height="54.0" rx="0" fill="#eb6834" fill-opacity="0.1"/>
<text x="254.0" y="113.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">кто носит корм</text>
<text x="408.0" y="105.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600"><tspan x="408.0" dy="0.0">чем заплатил тот,</tspan><tspan x="408.0" dy="15.0">кого кормят</tspan></text>
<text x="561.0" y="113.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">чем заплатил кормилец</text>
<text x="686.0" y="105.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600"><tspan x="686.0" dy="0.0">кто решает,</tspan><tspan x="686.0" dy="15.0">кому родиться</tspan></text>
<line x1="28.0" y1="130.0" x2="736.0" y2="130.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="154.0" font-size="13.5" fill="#0b0b0b" font-weight="600">человек и собака</text>
<text x="40.0" y="170.0" font-size="10.5" fill="#8a8985">Гайка</text>
<text x="254.0" y="154.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="254.0" dy="0.0">человек: миска,</tspan><tspan x="254.0" dy="14.4">подъём в шесть</tspan></text>
<text x="408.0" y="154.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="408.0" dy="0.0">треть мозга,</tspan><tspan x="408.0" dy="14.4">стая</tspan></text>
<text x="561.0" y="154.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="561.0" dy="0.0">хлеб, сон;</tspan><tspan x="561.0" dy="14.4">нажатая кнопка</tspan></text>
<text x="686.0" y="162.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">человек</text>
<line x1="28.0" y1="184.0" x2="736.0" y2="184.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="208.0" font-size="13.5" fill="#0b0b0b" font-weight="600">человек и пшеница</text>
<text x="40.0" y="224.0" font-size="10.5" fill="#8a8985">буханка</text>
<text x="254.0" y="208.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="254.0" dy="0.0">человек: пашет,</tspan><tspan x="254.0" dy="14.4">полет, сеет</tspan></text>
<text x="408.0" y="208.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="408.0" dy="0.0">разучилась</tspan><tspan x="408.0" dy="14.4">сеять себя</tspan></text>
<text x="561.0" y="208.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="561.0" dy="0.0">рост, зубы,</tspan><tspan x="561.0" dy="14.4">спина</tspan></text>
<text x="686.0" y="216.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">человек</text>
<line x1="28.0" y1="238.0" x2="736.0" y2="238.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="262.0" font-size="13.5" fill="#0b0b0b" font-weight="600">человек и корова</text>
<text x="40.0" y="278.0" font-size="10.5" fill="#8a8985">молоко</text>
<text x="254.0" y="262.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="254.0" dy="0.0">человек: сено,</tspan><tspan x="254.0" dy="14.4">хлев</tspan></text>
<text x="408.0" y="262.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="408.0" dy="0.0">голова; дикого</tspan><tspan x="408.0" dy="14.4">быка больше нет</tspan></text>
<text x="561.0" y="262.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="561.0" dy="0.0">переписанный ген</tspan><tspan x="561.0" dy="14.4">(молоко)</tspan></text>
<text x="686.0" y="270.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">человек</text>
<line x1="28.0" y1="292.0" x2="736.0" y2="292.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="316.0" font-size="13.5" fill="#0b0b0b" font-weight="600">люди и машины</text>
<text x="40.0" y="332.0" font-size="10.5" fill="#8a8985">строка, над которой Олег замер</text>
<text x="254.0" y="316.0" font-size="11.5" fill="#eb6834" text-anchor="middle" font-style="italic"><tspan x="254.0" dy="0.0">оба: туда ток и чипы,</tspan><tspan x="254.0" dy="14.4">обратно хлеб</tspan></text>
<text x="408.0" y="316.0" font-size="11.5" fill="#eb6834" text-anchor="middle" font-style="italic"><tspan x="408.0" dy="0.0">отбор на покладистость;</tspan><tspan x="408.0" dy="14.4">лесть пришла с заказом</tspan></text>
<text x="561.0" y="316.0" font-size="11.5" fill="#eb6834" text-anchor="middle" font-style="italic"><tspan x="561.0" dy="0.0">навыки, которые</tspan><tspan x="561.0" dy="14.4">больше не выращивают</tspan></text>
<text x="686.0" y="316.0" font-size="11.5" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="686.0" dy="0.0">пока</tspan><tspan x="686.0" dy="14.4">люди</tspan></text>
<line x1="28.0" y1="346.0" x2="736.0" y2="346.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="370.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Строки 1–3 — прецеденты. Строка 4 — сегодняшние люди и машины, как их читают Олег и Андрей:</tspan><tspan x="28.0" dy="14.4">прочтение, а не данные.</tspan></text>
</svg>
