<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Six rows, three tasks, one word</title>

<rect x="0.5" y="0.5" width="759" height="391" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Six rows, three tasks, one word</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Six rows of the notebook, the three tasks they come down to, and the one word the tasks spell.</text>
<rect x="280.0" y="86.0" width="200.0" height="42.0" rx="8" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="380.0" y="112.5" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">to learn</text>
<line x1="380.0" y1="128.0" x2="138.0" y2="164.0" stroke="#52514e" stroke-width="1.3" stroke-linecap="round"/>
<rect x="28.0" y="164.0" width="220.0" height="80.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="138.0" y="192.6" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">to keep</text>
<text x="138.0" y="211.4" font-size="13" fill="#52514e" text-anchor="middle"><tspan x="138.0" dy="0.0">what has been learned,</tspan><tspan x="138.0" dy="16.2">while learning the new</tspan></text>
<line x1="138.0" y1="244.0" x2="81.0" y2="272.0" stroke="#2a78d6" stroke-width="1.3" stroke-linecap="round"/>
<rect x="28.0" y="272.0" width="106.0" height="52.0" rx="8" fill="#2a78d6" fill-opacity="0.1"/>
<text x="81.0" y="294.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">sleep</text>
<text x="81.0" y="312.0" font-size="11" fill="#52514e" text-anchor="middle">by the night</text>
<line x1="138.0" y1="244.0" x2="195.0" y2="272.0" stroke="#2a78d6" stroke-width="1.3" stroke-linecap="round"/>
<rect x="142.0" y="272.0" width="106.0" height="52.0" rx="8" fill="#2a78d6" fill-opacity="0.1"/>
<text x="195.0" y="294.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">grumbling</text>
<text x="195.0" y="312.0" font-size="11" fill="#52514e" text-anchor="middle">by the lifetime</text>
<line x1="380.0" y1="128.0" x2="380.0" y2="164.0" stroke="#52514e" stroke-width="1.3" stroke-linecap="round"/>
<rect x="270.0" y="164.0" width="220.0" height="80.0" rx="8" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.5"/>
<text x="380.0" y="192.6" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">to link</text>
<text x="380.0" y="211.4" font-size="13" fill="#52514e" text-anchor="middle"><tspan x="380.0" dy="0.0">what comes together,</tspan><tspan x="380.0" dy="16.2">before knowing why</tspan></text>
<line x1="380.0" y1="244.0" x2="323.0" y2="272.0" stroke="#1baf7a" stroke-width="1.3" stroke-linecap="round"/>
<rect x="270.0" y="272.0" width="106.0" height="52.0" rx="8" fill="#1baf7a" fill-opacity="0.1"/>
<text x="323.0" y="294.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">dreams</text>
<text x="323.0" y="312.0" font-size="11" fill="#52514e" text-anchor="middle">sensors off</text>
<line x1="380.0" y1="244.0" x2="437.0" y2="272.0" stroke="#1baf7a" stroke-width="1.3" stroke-linecap="round"/>
<rect x="384.0" y="272.0" width="106.0" height="52.0" rx="8" fill="#1baf7a" fill-opacity="0.1"/>
<text x="437.0" y="294.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">omens</text>
<text x="437.0" y="312.0" font-size="11" fill="#52514e" text-anchor="middle">scant data</text>
<line x1="380.0" y1="128.0" x2="622.0" y2="164.0" stroke="#52514e" stroke-width="1.3" stroke-linecap="round"/>
<rect x="512.0" y="164.0" width="220.0" height="80.0" rx="8" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="622.0" y="192.6" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">to check</text>
<text x="622.0" y="211.4" font-size="13" fill="#52514e" text-anchor="middle"><tspan x="622.0" dy="0.0">one's own forecasts,</tspan><tspan x="622.0" dy="16.2">while a mistake is cheap</tspan></text>
<line x1="622.0" y1="244.0" x2="565.0" y2="272.0" stroke="#eb6834" stroke-width="1.3" stroke-linecap="round"/>
<rect x="512.0" y="272.0" width="106.0" height="52.0" rx="8" fill="#eb6834" fill-opacity="0.1"/>
<text x="565.0" y="294.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">laughter</text>
<text x="565.0" y="312.0" font-size="11" fill="#52514e" text-anchor="middle">a miss caught</text>
<line x1="622.0" y1="244.0" x2="679.0" y2="272.0" stroke="#eb6834" stroke-width="1.3" stroke-linecap="round"/>
<rect x="626.0" y="272.0" width="106.0" height="52.0" rx="8" fill="#eb6834" fill-opacity="0.1"/>
<text x="679.0" y="294.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">songs</text>
<text x="679.0" y="312.0" font-size="11" fill="#52514e" text-anchor="middle">a hit</text>
<text x="28.0" y="360.0" font-size="11.5" fill="#8a8985">The rows are from evenings 33, 36, 39, 41 and 44. The grouping into three is Andrey's reading.</text>
</svg>
