<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Lost a fifth, won a fifth</title>
<defs><marker id="arrow-52514e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#52514e"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="355" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Lost a fifth, won a fifth</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">One loss and one win each, on a fair coin. The stake is a fifth of the poorer heap.</text>
<text x="40.0" y="146.0" font-size="14" fill="#0b0b0b" font-weight="600">the poorer one</text>
<rect x="200.0" y="118.0" width="96.0" height="46.0" rx="8" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="248.0" y="146.5" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">100</text>
<rect x="400.0" y="118.0" width="96.0" height="46.0" rx="8" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="448.0" y="146.5" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">80</text>
<rect x="600.0" y="118.0" width="96.0" height="46.0" rx="8" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="648.0" y="146.5" font-size="17" fill="#eb6834" text-anchor="middle" font-weight="600">96</text>
<line x1="302.0" y1="141.0" x2="392.0" y2="141.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="347.0" y="106.0" font-size="11.5" fill="#52514e" text-anchor="middle"><tspan x="347.0" dy="0.0">lost a fifth</tspan><tspan x="347.0" dy="14.4">of 100: −20</tspan></text>
<line x1="502.0" y1="141.0" x2="592.0" y2="141.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="547.0" y="106.0" font-size="11.5" fill="#52514e" text-anchor="middle"><tspan x="547.0" dy="0.0">won a fifth</tspan><tspan x="547.0" dy="14.4">of 80: +16</tspan></text>
<text x="648.0" y="182.0" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600">96% is left</text>
<text x="40.0" y="240.0" font-size="14" fill="#0b0b0b" font-weight="600">the richer one</text>
<rect x="200.0" y="212.0" width="96.0" height="46.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="248.0" y="240.5" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">1,000</text>
<rect x="400.0" y="212.0" width="96.0" height="46.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="448.0" y="240.5" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">1,020</text>
<rect x="600.0" y="212.0" width="96.0" height="46.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="648.0" y="240.5" font-size="17" fill="#2a78d6" text-anchor="middle" font-weight="600">1,004</text>
<line x1="302.0" y1="235.0" x2="392.0" y2="235.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="347.0" y="200.0" font-size="11.5" fill="#52514e" text-anchor="middle"><tspan x="347.0" dy="0.0">won the same</tspan><tspan x="347.0" dy="14.4">20 matches</tspan></text>
<line x1="502.0" y1="235.0" x2="592.0" y2="235.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="547.0" y="200.0" font-size="11.5" fill="#52514e" text-anchor="middle"><tspan x="547.0" dy="0.0">lost the same</tspan><tspan x="547.0" dy="14.4">16 matches</tspan></text>
<text x="648.0" y="276.0" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="600">four matches came over</text>
<text x="28.0" y="316.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">The same twenty matches are a fifth of one heap and a fiftieth of the other.</tspan><tspan x="28.0" dy="14.4">In the other order (first the win, then the loss) the poorer one comes out at 96 as well.</tspan></text>
</svg>
