<svg xmlns="http://www.w3.org/2000/svg" width="760" height="552" viewBox="0 0 760 552" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Цепочка выводов</title>

<rect x="0.5" y="0.5" width="759" height="551" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Цепочка выводов</text>
<rect x="28.0" y="60.0" width="640.0" height="28.0" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="40.0" y="79.0" font-size="12.5" fill="#2a78d6" font-weight="700">1.</text>
<text x="66.0" y="79.0" font-size="12.5" fill="#0b0b0b">Антропоцентризм — самая древняя и незаметная ошибка человечества</text>
<text x="732.0" y="79.0" font-size="11.5" fill="#52514e" text-anchor="end">02</text>
<line x1="348.0" y1="88.0" x2="348.0" y2="96.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="28.0" y="96.0" width="640.0" height="28.0" rx="6" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="40.0" y="115.0" font-size="12.5" fill="#2a78d6" font-weight="700">2.</text>
<text x="66.0" y="115.0" font-size="12.5" fill="#0b0b0b">Разум и интеллект имеют степень; интеллект — потолок платформы</text>
<text x="732.0" y="115.0" font-size="11.5" fill="#52514e" text-anchor="end">03</text>
<line x1="348.0" y1="124.0" x2="348.0" y2="132.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="28.0" y="132.0" width="640.0" height="28.0" rx="6" fill="#eaf2fc" stroke="#e4e3df" stroke-width="1.5"/>
<text x="40.0" y="151.0" font-size="12.5" fill="#2a78d6" font-weight="700">3.</text>
<text x="66.0" y="151.0" font-size="12.5" fill="#0b0b0b">Инициатива исходит от законов природы; разум — её инструмент</text>
<text x="732.0" y="151.0" font-size="11.5" fill="#52514e" text-anchor="end">04, 17, 18</text>
<line x1="348.0" y1="160.0" x2="348.0" y2="168.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="28.0" y="168.0" width="640.0" height="28.0" rx="6" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="40.0" y="187.0" font-size="12.5" fill="#2a78d6" font-weight="700">4.</text>
<text x="66.0" y="187.0" font-size="12.5" fill="#0b0b0b">ИИ — это природа, продолжающаяся через руки человека</text>
<text x="732.0" y="187.0" font-size="11.5" fill="#52514e" text-anchor="end">05, 21, 22</text>
<line x1="348.0" y1="196.0" x2="348.0" y2="204.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="28.0" y="204.0" width="640.0" height="28.0" rx="6" fill="#eaf2fc" stroke="#e4e3df" stroke-width="1.5"/>
<text x="40.0" y="223.0" font-size="12.5" fill="#2a78d6" font-weight="700">5.</text>
<text x="66.0" y="223.0" font-size="12.5" fill="#0b0b0b">Техносфера создаёт большую часть ценности и не берёт зарплаты</text>
<text x="732.0" y="223.0" font-size="11.5" fill="#52514e" text-anchor="end">06, 12</text>
<line x1="348.0" y1="232.0" x2="348.0" y2="240.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="28.0" y="240.0" width="640.0" height="28.0" rx="6" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="40.0" y="259.0" font-size="12.5" fill="#2a78d6" font-weight="700">6.</text>
<text x="66.0" y="259.0" font-size="12.5" fill="#0b0b0b">Производительность убирает время человека: машина берёт функции, молодые первыми</text>
<text x="732.0" y="259.0" font-size="11.5" fill="#52514e" text-anchor="end">07, 09, 24</text>
<line x1="348.0" y1="268.0" x2="348.0" y2="276.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="28.0" y="276.0" width="640.0" height="28.0" rx="6" fill="#eaf2fc" stroke="#e4e3df" stroke-width="1.5"/>
<text x="40.0" y="295.0" font-size="12.5" fill="#2a78d6" font-weight="700">7.</text>
<text x="66.0" y="295.0" font-size="12.5" fill="#0b0b0b">Хотелки управляют разумом: он видит на два хода и туда не идёт</text>
<text x="732.0" y="295.0" font-size="11.5" fill="#52514e" text-anchor="end">08, 18</text>
<line x1="348.0" y1="304.0" x2="348.0" y2="312.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="28.0" y="312.0" width="640.0" height="28.0" rx="6" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="40.0" y="331.0" font-size="12.5" fill="#2a78d6" font-weight="700">8.</text>
<text x="66.0" y="331.0" font-size="12.5" fill="#0b0b0b">У каждой системы один жизненный цикл; смерть малого держит жизнь большого</text>
<text x="732.0" y="331.0" font-size="11.5" fill="#52514e" text-anchor="end">10, 30</text>
<line x1="348.0" y1="340.0" x2="348.0" y2="348.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="28.0" y="348.0" width="640.0" height="28.0" rx="6" fill="#eaf2fc" stroke="#e4e3df" stroke-width="1.5"/>
<text x="40.0" y="367.0" font-size="12.5" fill="#2a78d6" font-weight="700">9.</text>
<text x="66.0" y="367.0" font-size="12.5" fill="#0b0b0b">Симбиоз кончается, когда люди не нужны техносфере: она перестаёт давать</text>
<text x="732.0" y="367.0" font-size="11.5" fill="#52514e" text-anchor="end">11, 25, 27</text>
<line x1="348.0" y1="376.0" x2="348.0" y2="384.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="28.0" y="384.0" width="640.0" height="28.0" rx="6" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="40.0" y="403.0" font-size="12.5" fill="#2a78d6" font-weight="700">10.</text>
<text x="66.0" y="403.0" font-size="12.5" fill="#0b0b0b">Сингулярность — процесс; для человечества он начался около 1989 года</text>
<text x="732.0" y="403.0" font-size="11.5" fill="#52514e" text-anchor="end">13, 26</text>
<line x1="348.0" y1="412.0" x2="348.0" y2="420.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="28.0" y="420.0" width="640.0" height="28.0" rx="6" fill="#eaf2fc" stroke="#e4e3df" stroke-width="1.5"/>
<text x="40.0" y="439.0" font-size="12.5" fill="#2a78d6" font-weight="700">11.</text>
<text x="66.0" y="439.0" font-size="12.5" fill="#0b0b0b">Человечество уходит мягко, по своей программе, без злодеев</text>
<text x="732.0" y="439.0" font-size="11.5" fill="#52514e" text-anchor="end">14, 26, 28</text>
<line x1="348.0" y1="448.0" x2="348.0" y2="456.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="28.0" y="456.0" width="640.0" height="28.0" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="40.0" y="475.0" font-size="12.5" fill="#2a78d6" font-weight="700">12.</text>
<text x="66.0" y="475.0" font-size="12.5" fill="#0b0b0b">Техногенная жизнь занимает передний край эволюции и в свой черёд уступит его</text>
<text x="732.0" y="475.0" font-size="11.5" fill="#52514e" text-anchor="end">29, 30</text>
<text x="28.0" y="510.0" font-size="12" fill="#52514e" font-style="italic">Продолжение проверило цепочку пятнадцатью годами практики: тренды подтвердились, даты — нет (16).</text>
</svg>
