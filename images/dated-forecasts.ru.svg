<svg xmlns="http://www.w3.org/2000/svg" width="808" height="622" viewBox="0 0 808 622" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Отметки для проверки</title>

<rect x="0.5" y="0.5" width="807" height="621" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Отметки для проверки</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Прогнозы Андрея с датами, осень 2026 года, и его шансы. Тренд лучше всего, дата хуже.</text>
<rect x="232.0" y="82.0" width="176.0" height="24.0" rx="6" fill="#2a78d6" fill-opacity="0.12"/>
<text x="320.0" y="99.0" font-size="13" fill="#2a78d6" text-anchor="middle" font-weight="700">к осени 2031</text>
<rect x="416.0" y="82.0" width="176.0" height="24.0" rx="6" fill="#eb6834" fill-opacity="0.12"/>
<text x="504.0" y="99.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="700">к осени 2036</text>
<rect x="600.0" y="82.0" width="176.0" height="24.0" rx="6" fill="#4a3aa7" fill-opacity="0.12"/>
<text x="688.0" y="99.0" font-size="13" fill="#4a3aa7" text-anchor="middle" font-weight="700">к осени 2041</text>
<rect x="28.0" y="112.0" width="752.0" height="58.0" rx="4" fill="#f1f0ec"/>
<text x="36.0" y="131.0" font-size="12.5" fill="#0b0b0b" font-weight="600">Что машина делает одна</text>
<text x="36.0" y="163.0" font-size="10.5" fill="#52514e" font-style="italic">≈ 3 ч, 4 из 5 (2026)</text>
<circle cx="240.0" cy="130.0" r="3.5" fill="#2a78d6"/>
<text x="250.0" y="134.0" font-size="11.5" fill="#0b0b0b"><tspan x="250.0" dy="0.0">задача на месяц,</tspan><tspan x="250.0" dy="14.4">4 раза из 5 · 3 к 1</tspan></text>
<text x="36.0" y="189.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="36.0" dy="0.0">Доля труда</tspan><tspan x="36.0" dy="15.6">в мировом доходе</tspan></text>
<text x="36.0" y="221.0" font-size="10.5" fill="#52514e" font-style="italic">52,4% (2024)</text>
<circle cx="240.0" cy="197.0" r="3.5" fill="#2a78d6"/>
<text x="250.0" y="201.0" font-size="11.5" fill="#0b0b0b">ниже 51,5% · 3 к 1</text>
<circle cx="424.0" cy="197.0" r="3.5" fill="#eb6834"/>
<text x="434.0" y="201.0" font-size="11.5" fill="#0b0b0b">ниже половины · 2 к 1</text>
<circle cx="608.0" cy="197.0" r="3.5" fill="#4a3aa7"/>
<text x="618.0" y="201.0" font-size="11.5" fill="#0b0b0b">ниже 47%</text>
<rect x="28.0" y="228.0" width="752.0" height="58.0" rx="4" fill="#f1f0ec"/>
<text x="36.0" y="247.0" font-size="12.5" fill="#0b0b0b" font-weight="600">Мировая безработица</text>
<text x="36.0" y="279.0" font-size="10.5" fill="#52514e" font-style="italic">≈ 5% (2025)</text>
<circle cx="240.0" cy="246.0" r="3.5" fill="#2a78d6"/>
<text x="250.0" y="250.0" font-size="11.5" fill="#0b0b0b"><tspan x="250.0" dy="0.0">ниже 6,5%: ледник,</tspan><tspan x="250.0" dy="14.4">а не лавина · 3 к 1</tspan></text>
<text x="36.0" y="305.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="36.0" dy="0.0">Электричество центров</tspan><tspan x="36.0" dy="15.6">обработки данных</tspan></text>
<text x="36.0" y="337.0" font-size="10.5" fill="#52514e" font-style="italic">415 ТВт·ч (2024)</text>
<circle cx="240.0" cy="304.0" r="3.5" fill="#2a78d6"/>
<text x="250.0" y="308.0" font-size="11.5" fill="#0b0b0b"><tspan x="250.0" dy="0.0">больше 1000 ТВт·ч,</tspan><tspan x="250.0" dy="14.4">как вся Япония</tspan></text>
<circle cx="608.0" cy="304.0" r="3.5" fill="#4a3aa7"/>
<text x="618.0" y="308.0" font-size="11.5" fill="#0b0b0b"><tspan x="618.0" dy="0.0">больше, чем все дома</tspan><tspan x="618.0" dy="14.4">США и ЕС · 3 к 2</tspan></text>
<rect x="28.0" y="344.0" width="752.0" height="58.0" rx="4" fill="#f1f0ec"/>
<text x="36.0" y="363.0" font-size="12.5" fill="#0b0b0b" font-weight="600">Руки</text>
<text x="36.0" y="395.0" font-size="10.5" fill="#52514e" font-style="italic">4,66 млн роботов (2024)</text>
<circle cx="240.0" cy="362.0" r="3.5" fill="#2a78d6"/>
<text x="250.0" y="366.0" font-size="11.5" fill="#0b0b0b"><tspan x="250.0" dy="0.0">больше 8 млн промышл.</tspan><tspan x="250.0" dy="14.4">роботов в работе</tspan></text>
<circle cx="424.0" cy="362.0" r="3.5" fill="#eb6834"/>
<text x="434.0" y="366.0" font-size="11.5" fill="#0b0b0b"><tspan x="434.0" dy="0.0">1 млн универсальных</tspan><tspan x="434.0" dy="14.4">роботов в год · 2 к 1</tspan></text>
<circle cx="608.0" cy="362.0" r="3.5" fill="#4a3aa7"/>
<text x="618.0" y="366.0" font-size="11.5" fill="#0b0b0b"><tspan x="618.0" dy="0.0">ЦОД, построенный</tspan><tspan x="618.0" dy="14.4">без рабочих · 1 из 2</tspan></text>
<text x="36.0" y="421.0" font-size="12.5" fill="#0b0b0b" font-weight="600">Рождения</text>
<text x="36.0" y="453.0" font-size="10.5" fill="#52514e" font-style="italic">2,25 на женщину (2024)</text>
<circle cx="424.0" cy="420.0" r="3.5" fill="#eb6834"/>
<text x="434.0" y="424.0" font-size="11.5" fill="#0b0b0b"><tspan x="434.0" dy="0.0">мир ниже 2,1</tspan><tspan x="434.0" dy="14.4">(ООН ждёт ≈ 2050) · 2 к 1</tspan></text>
<circle cx="608.0" cy="420.0" r="3.5" fill="#4a3aa7"/>
<text x="618.0" y="424.0" font-size="11.5" fill="#0b0b0b"><tspan x="618.0" dy="0.0">прирост меньше 45 млн</tspan><tspan x="618.0" dy="14.4">(ООН: ≈ 55 млн) · 2 к 1</tspan></text>
<rect x="28.0" y="460.0" width="752.0" height="58.0" rx="4" fill="#f1f0ec"/>
<text x="36.0" y="479.0" font-size="12.5" fill="#0b0b0b" font-weight="600">Закон и гонка</text>
<circle cx="240.0" cy="478.0" r="3.5" fill="#2a78d6"/>
<text x="250.0" y="482.0" font-size="11.5" fill="#0b0b0b"><tspan x="250.0" dy="0.0">ни один подписант</tspan><tspan x="250.0" dy="14.4">не остановится · 9 к 1</tspan></text>
<circle cx="424.0" cy="478.0" r="3.5" fill="#eb6834"/>
<text x="434.0" y="482.0" font-size="11.5" fill="#0b0b0b"><tspan x="434.0" dy="0.0">базовая выплата</tspan><tspan x="434.0" dy="14.4">в богатой стране · 1 из 2</tspan></text>
<text x="36.0" y="537.0" font-size="12.5" fill="#0b0b0b" font-weight="600">Разум и небо</text>
<circle cx="424.0" cy="536.0" r="3.5" fill="#eb6834"/>
<text x="434.0" y="540.0" font-size="11.5" fill="#0b0b0b"><tspan x="434.0" dy="0.0">задача тысячелетия,</tspan><tspan x="434.0" dy="14.4">решённая машиной · 1 из 2</tspan></text>
<circle cx="608.0" cy="536.0" r="3.5" fill="#4a3aa7"/>
<text x="618.0" y="540.0" font-size="11.5" fill="#0b0b0b"><tspan x="618.0" dy="0.0">нет сигнала с неба,</tspan><tspan x="618.0" dy="14.4">нет войны машин · 9 к 1</tspan></text>
<text x="28.0" y="602.0" font-size="11.5" fill="#52514e" font-style="italic">Не в списке: даты шестого и седьмого шагов (статьи 27, 30). Обвал акций ИИ до 2031 года: 1 из 2.</text>
</svg>
