<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>One description, read twice</title>

<rect x="0.5" y="0.5" width="759" height="399" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">One description, read twice</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">How a thing carries the whole of its own drawing, and why the count does not run away.</text>
<text x="326.5" y="100.0" font-size="12.5" fill="#1c5aa6" text-anchor="middle" font-weight="600"><tspan x="326.5" dy="0.0">read as an order,</tspan><tspan x="326.5" dy="15.6">and carried out</tspan></text>
<text x="599.5" y="100.0" font-size="12.5" fill="#a8431a" text-anchor="middle" font-weight="600"><tspan x="599.5" dy="0.0">copied as a load,</tspan><tspan x="599.5" dy="15.6">not read</tspan></text>
<line x1="28.0" y1="130.0" x2="736.0" y2="130.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="151.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">the sentence</tspan><tspan x="34.0" dy="16.9">in the notebook</tspan></text>
<text x="34.0" y="185.0" font-size="11" fill="#8a8985">Oleg's pencil</text>
<rect x="195.0" y="136.0" width="263.0" height="56.0" rx="6" fill="#e8f0fb"/>
<text x="326.5" y="160.0" font-size="12" fill="#1c5aa6" text-anchor="middle">the words before the colon:</text>
<text x="326.5" y="176.0" font-size="12" fill="#1c5aa6" text-anchor="middle">"write the following twice..."</text>
<rect x="468.0" y="136.0" width="263.0" height="56.0" rx="6" fill="#fdeee6"/>
<text x="599.5" y="160.0" font-size="12" fill="#a8431a" text-anchor="middle">the same words in quotes:</text>
<text x="599.5" y="176.0" font-size="12" fill="#a8431a" text-anchor="middle">written down letter for letter</text>
<line x1="28.0" y1="198.0" x2="736.0" y2="198.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="219.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">the automaton</tspan><tspan x="34.0" dy="16.9">on paper</tspan></text>
<text x="34.0" y="253.0" font-size="11" fill="#8a8985">a lecture of 1948</text>
<rect x="195.0" y="204.0" width="263.0" height="56.0" rx="6" fill="#e8f0fb"/>
<text x="326.5" y="228.0" font-size="12" fill="#1c5aa6" text-anchor="middle">the builder reads the tape</text>
<text x="326.5" y="244.0" font-size="12" fill="#1c5aa6" text-anchor="middle">and builds by it</text>
<rect x="468.0" y="204.0" width="263.0" height="56.0" rx="6" fill="#fdeee6"/>
<text x="599.5" y="228.0" font-size="12" fill="#a8431a" text-anchor="middle">the copier copies the tape</text>
<text x="599.5" y="244.0" font-size="12" fill="#a8431a" text-anchor="middle">and does not look into it</text>
<line x1="28.0" y1="266.0" x2="736.0" y2="266.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="295.0" font-size="13.5" fill="#0b0b0b" font-weight="600">the cell</text>
<text x="34.0" y="313.0" font-size="11" fill="#8a8985">the double helix: 1953</text>
<rect x="195.0" y="272.0" width="263.0" height="56.0" rx="6" fill="#e8f0fb"/>
<text x="326.5" y="296.0" font-size="12" fill="#1c5aa6" text-anchor="middle">a gene is read,</text>
<text x="326.5" y="312.0" font-size="12" fill="#1c5aa6" text-anchor="middle">and a protein is built by it</text>
<rect x="468.0" y="272.0" width="263.0" height="56.0" rx="6" fill="#fdeee6"/>
<text x="599.5" y="296.0" font-size="12" fill="#a8431a" text-anchor="middle">the thread is copied whole</text>
<text x="599.5" y="312.0" font-size="12" fill="#a8431a" text-anchor="middle">for the daughter cell</text>
<line x1="28.0" y1="334.0" x2="736.0" y2="334.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="362.0" font-size="13" fill="#0b0b0b" font-weight="600">The description does not hold a description of itself. It is simply used twice.</text>
<text x="28.0" y="384.0" font-size="11" fill="#8a8985">A scheme of the evening. What is carried whole is the drawing: the recipe, not a picture of the finished thing on a scale of one to one.</text>
</svg>
