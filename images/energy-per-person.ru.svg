<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Сколько энергии нужно человеку и сколько проходит через техносферу</title>

<rect x="0.5" y="0.5" width="759" height="269" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Сколько энергии нужно человеку и сколько проходит через техносферу</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Ватт на человека. Тело работает на еде; всё сверх него течёт через техносферу.</text>
<text x="288.0" y="108.0" font-size="13" fill="#0b0b0b" text-anchor="end">Тело человека (≈ 2500 ккал в день)</text>
<rect x="300.0" y="93.0" width="4.0" height="24.0" rx="4" fill="#eb6834"/>
<text x="312.0" y="110.0" font-size="12.5" fill="#0b0b0b" font-weight="600">≈ 120 Вт</text>
<text x="288.0" y="152.0" font-size="13" fill="#0b0b0b" text-anchor="end">В среднем по миру, 2023</text>
<rect x="300.0" y="137.0" width="78.5" height="24.0" rx="4" fill="#2a78d6"/>
<text x="386.5" y="154.0" font-size="12.5" fill="#0b0b0b" font-weight="600">≈ 2400 Вт: тело ≈ 5%</text>
<text x="288.0" y="196.0" font-size="13" fill="#0b0b0b" text-anchor="end">США, 2023</text>
<rect x="300.0" y="181.0" width="300.0" height="24.0" rx="4" fill="#2a78d6"/>
<text x="608.0" y="198.0" font-size="12.5" fill="#0b0b0b" font-weight="600">≈ 9300 Вт: тело ≈ 1%</text>
<text x="28.0" y="252.0" font-size="11" fill="#8a8985">Источники: Energy Institute, Statistical Review of World Energy 2024 (620 ЭДж); EIA США (279 млн БТЕ на человека).</text>
</svg>
