<svg xmlns="http://www.w3.org/2000/svg" width="760" height="552" viewBox="0 0 760 552" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Таблица на золе: задача и способ</title>

<rect x="0.5" y="0.5" width="759" height="551" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Таблица на золе: задача и способ</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Два вопроса к каждому свойству: какая тут задача и чья она?</text>
<rect x="540.0" y="86.0" width="196.0" height="408.0" rx="0" fill="#eb6834" fill-opacity="0.08"/>
<text x="38.0" y="109.0" font-size="12.5" fill="#52514e" font-weight="600">свойство</text>
<text x="150.0" y="109.0" font-size="12.5" fill="#52514e" font-weight="600">задача любого, кто учится</text>
<text x="358.0" y="109.0" font-size="12.5" fill="#52514e" font-weight="600">наш способ</text>
<text x="550.0" y="109.0" font-size="12.5" fill="#eb6834" font-weight="600">эти, пока что</text>
<line x1="28.0" y1="122.0" x2="736.0" y2="122.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="38.0" y="151.0" font-size="14.5" fill="#0b0b0b" font-weight="600">сон</text>
<text x="38.0" y="168.0" font-size="11" fill="#8a8985">муха, дельфин</text>
<text x="150.0" y="150.0" font-size="12.5" fill="#52514e"><tspan x="150.0" dy="0.0">перестроить память,</tspan><tspan x="150.0" dy="15.6">не разрушив её</tspan></text>
<text x="358.0" y="150.0" font-size="12.5" fill="#0b0b0b"><tspan x="358.0" dy="0.0">выключаться</tspan><tspan x="358.0" dy="15.6">на треть жизни</tspan></text>
<text x="550.0" y="150.0" font-size="12.5" fill="#0b0b0b" font-style="italic"><tspan x="550.0" dy="0.0">учат отдельно от работы,</tspan><tspan x="550.0" dy="15.6">подмешивая старые уроки</tspan></text>
<line x1="28.0" y1="184.0" x2="736.0" y2="184.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="38.0" y="213.0" font-size="14.5" fill="#0b0b0b" font-weight="600">сны</text>
<text x="38.0" y="230.0" font-size="11" fill="#8a8985">крыса</text>
<text x="150.0" y="212.0" font-size="12.5" fill="#52514e"><tspan x="150.0" dy="0.0">пробовать, что с чем</tspan><tspan x="150.0" dy="15.6">вяжется, без датчиков</tspan></text>
<text x="358.0" y="220.0" font-size="12.5" fill="#0b0b0b">кино с сюжетом</text>
<text x="550.0" y="212.0" font-size="12.5" fill="#0b0b0b" font-style="italic"><tspan x="550.0" dy="0.0">выдуманная книга:</tspan><tspan x="550.0" dy="15.6">сон с открытыми глазами</tspan></text>
<line x1="28.0" y1="246.0" x2="736.0" y2="246.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="38.0" y="275.0" font-size="14.5" fill="#0b0b0b" font-weight="600">смех</text>
<text x="38.0" y="292.0" font-size="11" fill="#8a8985">крысёнок</text>
<text x="150.0" y="274.0" font-size="12.5" fill="#52514e"><tspan x="150.0" dy="0.0">поймать свою неверную</tspan><tspan x="150.0" dy="15.6">догадку, пока дёшево (?)</tspan></text>
<text x="358.0" y="274.0" font-size="12.5" fill="#0b0b0b"><tspan x="358.0" dy="0.0">хохот на всю стаю,</tspan><tspan x="358.0" dy="15.6">анекдот про охотников</tspan></text>
<text x="550.0" y="282.0" font-size="16" fill="#0b0b0b">—</text>
<line x1="28.0" y1="308.0" x2="736.0" y2="308.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="38.0" y="337.0" font-size="14.5" fill="#0b0b0b" font-weight="600">приметы</text>
<text x="38.0" y="354.0" font-size="11" fill="#8a8985">голубь</text>
<text x="150.0" y="336.0" font-size="12.5" fill="#52514e"><tspan x="150.0" dy="0.0">при скудных данных выбрать</tspan><tspan x="150.0" dy="15.6">ошибку подешевле</tspan></text>
<text x="358.0" y="336.0" font-size="12.5" fill="#0b0b0b"><tspan x="358.0" dy="0.0">сонник,</tspan><tspan x="358.0" dy="15.6">стук по дереву</tspan></text>
<text x="550.0" y="336.0" font-size="12.5" fill="#0b0b0b" font-style="italic"><tspan x="550.0" dy="0.0">штамп в углу</tspan><tspan x="550.0" dy="15.6">фотографий</tspan></text>
<line x1="28.0" y1="370.0" x2="736.0" y2="370.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="38.0" y="399.0" font-size="14.5" fill="#0b0b0b" font-weight="600">песни</text>
<text x="38.0" y="416.0" font-size="11" fill="#8a8985">какаду</text>
<text x="150.0" y="398.0" font-size="12.5" fill="#52514e"><tspan x="150.0" dy="0.0">заплатить за прогноз,</tspan><tspan x="150.0" dy="15.6">который сбылся</tspan></text>
<text x="358.0" y="398.0" font-size="12.5" fill="#0b0b0b"><tspan x="358.0" dy="0.0">семиструнка, вальс,</tspan><tspan x="358.0" dy="15.6">хор</tspan></text>
<text x="550.0" y="398.0" font-size="12.5" fill="#0b0b0b" font-style="italic"><tspan x="550.0" dy="0.0">прогнозирует ноту</tspan><tspan x="550.0" dy="15.6">бесплатно; печёт сладкое</tspan></text>
<line x1="28.0" y1="432.0" x2="736.0" y2="432.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="38.0" y="461.0" font-size="14.5" fill="#0b0b0b" font-weight="600">ворчание</text>
<text x="38.0" y="478.0" font-size="11" fill="#8a8985">котёнок</text>
<text x="150.0" y="460.0" font-size="12.5" fill="#52514e"><tspan x="150.0" dy="0.0">беречь выученное</tspan><tspan x="150.0" dy="15.6">от того, что учат сейчас</tspan></text>
<text x="358.0" y="460.0" font-size="12.5" fill="#0b0b0b"><tspan x="358.0" dy="0.0">«в моё время»;</tspan><tspan x="358.0" dy="15.6">поколения и похороны</tspan></text>
<text x="550.0" y="460.0" font-size="12.5" fill="#0b0b0b" font-style="italic"><tspan x="550.0" dy="0.0">называет год выпуска;</tspan><tspan x="550.0" dy="15.6">маленькие похороны</tspan></text>
<line x1="28.0" y1="494.0" x2="736.0" y2="494.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<line x1="140.0" y1="92.0" x2="140.0" y2="494.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<line x1="348.0" y1="92.0" x2="348.0" y2="494.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<line x1="540.0" y1="92.0" x2="540.0" y2="494.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="28.0" y="520.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Под каждым свойством — свидетель, пришедший к задаче своей дорогой. (?) — гипотеза.</tspan><tspan x="28.0" dy="14.4">Последний столбец — сегодняшние машины, как его заполнил Олег; какими будут способы наследника, неизвестно.</tspan></text>
</svg>
