<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Why you cannot tickle yourself</title>
<defs><marker id="arrow-52514e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#52514e"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="409" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Why you cannot tickle yourself</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">The head forecasts the touch of its own hand and subtracts it. Delay the touch, and it tickles.</text>
<line x1="96.0" y1="310.0" x2="724.0" y2="310.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="96.0" y1="310.0" x2="96.0" y2="104.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="56.0" y="207.0" font-size="12.5" fill="#52514e" text-anchor="middle" transform="rotate(-90 56.0 207.0)">how ticklish it feels</text>
<rect x="134.0" y="276.0" width="72.0" height="34.0" rx="3" fill="#1baf7a" fill-opacity="0.85"/>
<text x="170.0" y="330.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">your own hand</text>
<rect x="256.0" y="232.0" width="72.0" height="78.0" rx="3" fill="#2a78d6" fill-opacity="0.85"/>
<text x="292.0" y="330.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle"><tspan x="292.0" dy="0.0">the robot lags</tspan><tspan x="292.0" dy="15.6">by 0.1 s</tspan></text>
<rect x="378.0" y="198.0" width="72.0" height="112.0" rx="3" fill="#2a78d6" fill-opacity="0.85"/>
<text x="414.0" y="330.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">by 0.2 s</text>
<rect x="500.0" y="164.0" width="72.0" height="146.0" rx="3" fill="#2a78d6" fill-opacity="0.85"/>
<text x="536.0" y="330.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle">by 0.3 s</text>
<rect x="622.0" y="126.0" width="72.0" height="184.0" rx="3" fill="#eb6834" fill-opacity="0.85"/>
<text x="658.0" y="330.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle"><tspan x="658.0" dy="0.0">someone</tspan><tspan x="658.0" dy="15.6">else's hand</tspan></text>
<text x="170.0" y="242.0" font-size="12.5" fill="#1baf7a" text-anchor="middle" font-weight="600"><tspan x="170.0" dy="0.0">the forecast matches:</tspan><tspan x="170.0" dy="15.6">hardly felt</tspan></text>
<text x="536.0" y="108.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-weight="600"><tspan x="536.0" dy="0.0">the forecast misses:</tspan><tspan x="536.0" dy="15.6">felt in full</tspan></text>
<text x="28.0" y="394.0" font-size="11.5" fill="#8a8985">A scheme, not measured data. After Blakemore, Wolpert &amp; Frith (1998) and Blakemore, Frith &amp; Wolpert (1999).</text>
</svg>
