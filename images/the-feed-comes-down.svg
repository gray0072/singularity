<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Who owns the tractor</title>
<defs><marker id="arrow-008300" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#008300"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="371" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Who owns the tractor</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Two chains of ownership. The feed comes down both. The say goes up only the short one.</text>
<text x="40.0" y="126.0" font-size="14" fill="#52514e" font-weight="600">1935</text>
<rect x="112.0" y="90.0" width="132.0" height="60.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="178.0" y="124.5" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">the farmer</text>
<rect x="604.0" y="90.0" width="132.0" height="60.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="670.0" y="124.5" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">the tractor</text>
<line x1="252.0" y1="122.0" x2="594.0" y2="122.0" stroke="#008300" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-008300)"/>
<text x="424.0" y="112.0" font-size="12.5" fill="#008300" text-anchor="middle" font-weight="600">holds the wheel himself</text>
<text x="40.0" y="226.0" font-size="14" fill="#52514e" font-weight="600">today</text>
<rect x="112.0" y="190.0" width="132.0" height="60.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="178.0" y="224.6" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">the saver</text>
<rect x="276.0" y="190.0" width="132.0" height="60.0" rx="8" fill="#fcfcfb" stroke="#8a8985" stroke-width="1.5"/>
<text x="342.0" y="210.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">a fund</text>
<text x="342.0" y="226.7" font-size="11" fill="#52514e" text-anchor="middle"><tspan x="342.0" dy="0.0">buys everything,</tspan><tspan x="342.0" dy="13.8">by a table</tspan></text>
<rect x="440.0" y="190.0" width="132.0" height="60.0" rx="8" fill="#fcfcfb" stroke="#8a8985" stroke-width="1.5"/>
<text x="506.0" y="210.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">a firm</text>
<text x="506.0" y="226.7" font-size="11" fill="#52514e" text-anchor="middle"><tspan x="506.0" dy="0.0">a name, an account,</tspan><tspan x="506.0" dy="13.8">a director</tspan></text>
<rect x="604.0" y="190.0" width="132.0" height="60.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="670.0" y="224.6" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">the machine</text>
<line x1="270.0" y1="210.0" x2="252.0" y2="210.0" stroke="#008300" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-008300)"/>
<line x1="250.0" y1="232.0" x2="270.0" y2="232.0" stroke="#e34948" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="255.0" y1="227.0" x2="265.0" y2="237.0" stroke="#e34948" stroke-width="1.8" stroke-linecap="round"/>
<line x1="255.0" y1="237.0" x2="265.0" y2="227.0" stroke="#e34948" stroke-width="1.8" stroke-linecap="round"/>
<line x1="434.0" y1="210.0" x2="416.0" y2="210.0" stroke="#008300" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-008300)"/>
<line x1="414.0" y1="232.0" x2="434.0" y2="232.0" stroke="#e34948" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="419.0" y1="227.0" x2="429.0" y2="237.0" stroke="#e34948" stroke-width="1.8" stroke-linecap="round"/>
<line x1="419.0" y1="237.0" x2="429.0" y2="227.0" stroke="#e34948" stroke-width="1.8" stroke-linecap="round"/>
<line x1="598.0" y1="210.0" x2="580.0" y2="210.0" stroke="#008300" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-008300)"/>
<line x1="578.0" y1="232.0" x2="598.0" y2="232.0" stroke="#e34948" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="583.0" y1="227.0" x2="593.0" y2="237.0" stroke="#e34948" stroke-width="1.8" stroke-linecap="round"/>
<line x1="583.0" y1="237.0" x2="593.0" y2="227.0" stroke="#e34948" stroke-width="1.8" stroke-linecap="round"/>
<line x1="64.0" y1="282.0" x2="40.0" y2="282.0" stroke="#008300" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-008300)"/>
<text x="74.0" y="286.0" font-size="12.5" fill="#0b0b0b">the feed: a little is added every year</text>
<line x1="40.0" y1="304.0" x2="64.0" y2="304.0" stroke="#e34948" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="47.0" y1="299.0" x2="57.0" y2="309.0" stroke="#e34948" stroke-width="1.8" stroke-linecap="round"/>
<line x1="47.0" y1="309.0" x2="57.0" y2="299.0" stroke="#e34948" stroke-width="1.8" stroke-linecap="round"/>
<text x="74.0" y="308.0" font-size="12.5" fill="#0b0b0b">the say: the saver cannot even find out what he owns</text>
<text x="28.0" y="340.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Three index funds taken together were the largest holder in 88% of the 500 largest American companies</tspan><tspan x="28.0" dy="14.4">(Fichtner, Heemskerk and Garcia-Bernardo, 2017). A scheme of the argument, not data.</tspan></text>
</svg>
