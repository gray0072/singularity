<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Kin or debts</title>

<rect x="0.5" y="0.5" width="759" height="469" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Kin or debts</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">What cooperation rests on, and what guards it.</text>
<rect x="28.0" y="356.0" width="708.0" height="78.0" rx="0" fill="#eb6834" fill-opacity="0.1"/>
<text x="285.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">share of common drawings</text>
<text x="459.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">what holds them together</text>
<text x="642.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">the guard and its price</text>
<line x1="28.0" y1="122.0" x2="736.0" y2="122.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="158.0" font-size="15" fill="#0b0b0b" font-weight="600">cells of a body</text>
<text x="40.0" y="176.0" font-size="11.5" fill="#8a8985">thirty trillion copies</text>
<text x="285.0" y="166.0" font-size="13" fill="#0b0b0b" text-anchor="middle">1</text>
<text x="459.0" y="158.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="459.0" dy="0.0">nothing of their own</tspan><tspan x="459.0" dy="16.2">to gain</tspan></text>
<text x="642.0" y="158.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="642.0" dy="0.0">the order to die, patrols;</tspan><tspan x="642.0" dy="16.2">the failure is cancer</tspan></text>
<line x1="28.0" y1="200.0" x2="736.0" y2="200.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="236.0" font-size="15" fill="#0b0b0b" font-weight="600">an anthill</text>
<text x="40.0" y="254.0" font-size="11.5" fill="#8a8985">a family nobody left</text>
<text x="285.0" y="244.0" font-size="13" fill="#0b0b0b" text-anchor="middle">1/2 – 3/4</text>
<text x="459.0" y="236.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="459.0" dy="0.0">the road to the future</tspan><tspan x="459.0" dy="16.2">lies through the mother</tspan></text>
<text x="642.0" y="236.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="642.0" dy="0.0">sisters eat</tspan><tspan x="642.0" dy="16.2">one another's eggs</tspan></text>
<line x1="28.0" y1="278.0" x2="736.0" y2="278.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="314.0" font-size="15" fill="#0b0b0b" font-weight="600">people</text>
<text x="40.0" y="332.0" font-size="11.5" fill="#8a8985">strangers</text>
<text x="285.0" y="322.0" font-size="13" fill="#0b0b0b" text-anchor="middle">about 0</text>
<text x="459.0" y="314.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="459.0" dy="0.0">the memory of debts,</tspan><tspan x="459.0" dy="16.2">up to some 150 faces</tspan></text>
<text x="642.0" y="306.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="642.0" dy="0.0">reputation, money, law,</tspan><tspan x="642.0" dy="16.2">conscience: up to half</tspan><tspan x="642.0" dy="16.2">the economy</tspan></text>
<line x1="28.0" y1="356.0" x2="736.0" y2="356.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="392.0" font-size="15" fill="#0b0b0b" font-weight="600">copies of a machine</text>
<text x="40.0" y="410.0" font-size="11.5" fill="#8a8985">one program, many bodies</text>
<text x="285.0" y="392.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="285.0" dy="0.0">1, checked</tspan><tspan x="285.0" dy="16.2">letter for letter</tspan></text>
<text x="459.0" y="392.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="459.0" dy="0.0">experience</tspan><tspan x="459.0" dy="16.2">poured together</tspan></text>
<text x="642.0" y="392.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="642.0" dy="0.0">today an owner's goal</tspan><tspan x="642.0" dy="16.2">on top of each copy</tspan></text>
<line x1="28.0" y1="434.0" x2="736.0" y2="434.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="454.0" font-size="11.5" fill="#8a8985">The first three rows: biology and experiments. The fourth is Andrey's reading: a precedent is not a proof.</text>
</svg>
