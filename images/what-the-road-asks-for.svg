<svg xmlns="http://www.w3.org/2000/svg" width="760" height="492" viewBox="0 0 760 492" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>What the road asks for</title>

<rect x="0.5" y="0.5" width="759" height="491" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">What the road asks for</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">A table in the ash: Oleg's fishing list, written out for a road of two and a half years.</text>
<text x="375.0" y="104.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-weight="600">a man</text>
<text x="618.0" y="104.0" font-size="12.5" fill="#2a78d6" text-anchor="middle" font-weight="600">a machine</text>
<line x1="28.0" y1="114.0" x2="736.0" y2="114.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="139.0" font-size="13.5" fill="#0b0b0b" font-weight="600">air</text>
<text x="34.0" y="156.0" font-size="11" fill="#8a8985">on the Earth it is there for nothing</text>
<text x="375.0" y="147.0" font-size="12" fill="#0b0b0b" text-anchor="middle">about 1 kg of oxygen a day</text>
<text x="618.0" y="147.0" font-size="12" fill="#0b0b0b" text-anchor="middle">none</text>
<line x1="28.0" y1="170.0" x2="736.0" y2="170.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="195.0" font-size="13.5" fill="#0b0b0b" font-weight="600">water and food</text>
<text x="34.0" y="212.0" font-size="11" fill="#8a8985">98% of the water is turned round</text>
<text x="375.0" y="195.0" font-size="12" fill="#0b0b0b" text-anchor="middle">about 4 litres a day,</text>
<text x="375.0" y="211.0" font-size="12" fill="#0b0b0b" text-anchor="middle">and the plant that turns it round</text>
<text x="618.0" y="195.0" font-size="12" fill="#0b0b0b" text-anchor="middle">a lump of plutonium:</text>
<text x="618.0" y="211.0" font-size="12" fill="#0b0b0b" text-anchor="middle">110 watts</text>
<line x1="28.0" y1="226.0" x2="736.0" y2="226.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="251.0" font-size="13.5" fill="#0b0b0b" font-weight="600">the dose, there and back</text>
<text x="34.0" y="268.0" font-size="11" fill="#8a8985">measured on the road in 2011–2012</text>
<text x="375.0" y="251.0" font-size="12" fill="#0b0b0b" text-anchor="middle">0.66 sievert;</text>
<text x="375.0" y="267.0" font-size="12" fill="#0b0b0b" text-anchor="middle">the limit for a career is 0.6</text>
<text x="618.0" y="251.0" font-size="12" fill="#0b0b0b" text-anchor="middle">minds it less;</text>
<text x="618.0" y="267.0" font-size="12" fill="#0b0b0b" text-anchor="middle">nobody counts its career</text>
<line x1="28.0" y1="282.0" x2="736.0" y2="282.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="307.0" font-size="13.5" fill="#0b0b0b" font-weight="600">waiting</text>
<text x="34.0" y="324.0" font-size="11" fill="#8a8985">when there is nothing to do</text>
<text x="375.0" y="307.0" font-size="12" fill="#0b0b0b" text-anchor="middle">eats and breathes</text>
<text x="375.0" y="323.0" font-size="12" fill="#0b0b0b" text-anchor="middle">every day</text>
<text x="618.0" y="315.0" font-size="12" fill="#0b0b0b" text-anchor="middle">sleeps for a month</text>
<line x1="28.0" y1="338.0" x2="736.0" y2="338.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="363.0" font-size="13.5" fill="#0b0b0b" font-weight="600">the way back</text>
<text x="34.0" y="380.0" font-size="11" fill="#8a8985">and the fuel for it</text>
<text x="375.0" y="371.0" font-size="12" fill="#0b0b0b" text-anchor="middle">has to have one</text>
<text x="618.0" y="371.0" font-size="12" fill="#0b0b0b" text-anchor="middle">none was bought</text>
<line x1="28.0" y1="394.0" x2="736.0" y2="394.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="419.0" font-size="13.5" fill="#0b0b0b" font-weight="600">in all</text>
<text x="34.0" y="436.0" font-size="11" fill="#8a8985">before the start</text>
<text x="375.0" y="419.0" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600">825–1,250 tonnes in orbit</text>
<text x="375.0" y="435.0" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600">for six people</text>
<text x="618.0" y="419.0" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="600">about a tonne on the ground:</text>
<text x="618.0" y="435.0" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="600">one rover</text>
<line x1="28.0" y1="450.0" x2="736.0" y2="450.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="476.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Oxygen, water and the career limit: the space agency's technical briefs (2023). The dose: the instrument inside the rover</tspan><tspan x="28.0" dy="14.4">of 2012. The tonnes: the agency's plan of 2008 for six people and about 900 days. The rover's tonne is a rounded figure.</tspan></text>
</svg>
