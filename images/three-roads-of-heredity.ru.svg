<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" viewBox="0 0 760 396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Три дороги наследственности</title>

<rect x="0.5" y="0.5" width="759" height="395" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Три дороги наследственности</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Что переходит к следующему, кто вносит поправку и сколько это занимает.</text>
<rect x="28.0" y="266.0" width="708.0" height="72.0" rx="0" fill="#eb6834" fill-opacity="0.1"/>
<text x="311.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">что переходит</text>
<text x="488.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">кто вносит поправку</text>
<text x="658.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">сколько это занимает</text>
<line x1="28.0" y1="122.0" x2="736.0" y2="122.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="155.0" font-size="15" fill="#0b0b0b" font-weight="600">чертежи</text>
<text x="40.0" y="173.0" font-size="11.5" fill="#8a8985">Дарвин</text>
<text x="311.0" y="163.0" font-size="13" fill="#0b0b0b" text-anchor="middle">устройство</text>
<text x="488.0" y="155.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="488.0" dy="0.0">смерти тех,</tspan><tspan x="488.0" dy="16.2">у кого поправки не было</tspan></text>
<text x="658.0" y="163.0" font-size="13" fill="#0b0b0b" text-anchor="middle">много поколений</text>
<line x1="28.0" y1="194.0" x2="736.0" y2="194.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="227.0" font-size="15" fill="#0b0b0b" font-weight="600">речь и школа</text>
<text x="40.0" y="245.0" font-size="11.5" fill="#8a8985">Ламарк через соломинку</text>
<text x="311.0" y="227.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="311.0" dy="0.0">часть опыта,</tspan><tspan x="311.0" dy="16.2">39 бит в секунду</tspan></text>
<text x="488.0" y="227.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="488.0" dy="0.0">тот, кто научился;</tspan><tspan x="488.0" dy="16.2">ученик растит заново</tspan></text>
<text x="658.0" y="227.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="658.0" dy="0.0">двадцать лет</tspan><tspan x="658.0" dy="16.2">на каждую голову</tspan></text>
<line x1="28.0" y1="266.0" x2="736.0" y2="266.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="299.0" font-size="15" fill="#0b0b0b" font-weight="600">копия</text>
<text x="40.0" y="317.0" font-size="11.5" fill="#8a8985">Ламарк целиком</text>
<text x="311.0" y="299.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="311.0" dy="0.0">весь опыт,</tspan><tspan x="311.0" dy="16.2">как есть</tspan></text>
<text x="488.0" y="307.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic">тот, кто научился</text>
<text x="658.0" y="307.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic">минуты</text>
<line x1="28.0" y1="338.0" x2="736.0" y2="338.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="364.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Первые две строки — биология и лингвистика. Третья — инженерия, как её читает Андрей;</tspan><tspan x="28.0" dy="14.4">работает только между головами одинакового устройства.</tspan></text>
</svg>
