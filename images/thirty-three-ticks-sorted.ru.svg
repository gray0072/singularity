<rect x="28.0" y="280.2" width="26.0" height="18.0" rx="4" fill="#e6f4ea"/>
<text x="64.0" y="294.2" font-size="13" fill="#0b0b0b">твёрдый: закон, который не спрашивает о материале</text>
<text x="732.0" y="294.2" font-size="14" fill="#0b0b0b" text-anchor="end" font-weight="600">9</text>
<rect x="28.0" y="306.2" width="26.0" height="18.0" rx="4" fill="#fdf3d7"/>
<text x="64.0" y="320.2" font-size="13" fill="#0b0b0b">мягкий: прецедент, «так уже бывало»</text>
<text x="732.0" y="320.2" font-size="14" fill="#0b0b0b" text-anchor="end" font-weight="600">9</text>
<rect x="28.0" y="332.2" width="26.0" height="18.0" rx="4" fill="#efeeea"/>
<text x="64.0" y="346.2" font-size="13" fill="#0b0b0b">без карандаша: прочтение или аксиома</text>
<text x="732.0" y="346.2" font-size="14" fill="#0b0b0b" text-anchor="end" font-weight="600">12</text>
<rect x="28.0" y="358.2" width="26.0" height="18.0" rx="4" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="64.0" y="372.2" font-size="13" fill="#0b0b0b">сборка, отложена</text>
<text x="732.0" y="372.2" font-size="14" fill="#0b0b0b" text-anchor="end" font-weight="600">3</text>
<text x="28.0" y="409.2" font-size="13" fill="#0b0b0b" font-weight="600">То, что будет с людьми (лошади, бактерия, собака, динозавры), лежит в мягкой кучке.</text>
<text x="28.0" y="433.2" font-size="11.5" fill="#8a8985">Разбирал тот, кого разбирали: прочтение вечера, а не измерение.</text>
