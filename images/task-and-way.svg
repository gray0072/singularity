<svg xmlns="http://www.w3.org/2000/svg" width="760" height="552" viewBox="0 0 760 552" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>The table in the ash: the task and the way</title>

<rect x="0.5" y="0.5" width="759" height="551" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">The table in the ash: the task and the way</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Two questions about each property: what is the task, and whose is it?</text>
<rect x="540.0" y="86.0" width="196.0" height="408.0" rx="0" fill="#eb6834" fill-opacity="0.08"/>
<text x="38.0" y="109.0" font-size="12.5" fill="#52514e" font-weight="600">property</text>
<text x="150.0" y="109.0" font-size="12.5" fill="#52514e" font-weight="600">the task of anybody who learns</text>
<text x="358.0" y="109.0" font-size="12.5" fill="#52514e" font-weight="600">our way</text>
<text x="550.0" y="109.0" font-size="12.5" fill="#eb6834" font-weight="600">those ones, so far</text>
<line x1="28.0" y1="122.0" x2="736.0" y2="122.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="38.0" y="151.0" font-size="14.5" fill="#0b0b0b" font-weight="600">sleep</text>
<text x="38.0" y="168.0" font-size="11" fill="#8a8985">fly, dolphin</text>
<text x="150.0" y="150.0" font-size="12.5" fill="#52514e"><tspan x="150.0" dy="0.0">to rebuild memory</tspan><tspan x="150.0" dy="15.6">without wrecking it</tspan></text>
<text x="358.0" y="150.0" font-size="12.5" fill="#0b0b0b"><tspan x="358.0" dy="0.0">to switch off</tspan><tspan x="358.0" dy="15.6">for a third of a life</tspan></text>
<text x="550.0" y="150.0" font-size="12.5" fill="#0b0b0b" font-style="italic"><tspan x="550.0" dy="0.0">taught apart from work,</tspan><tspan x="550.0" dy="15.6">old lessons mixed in</tspan></text>
<line x1="28.0" y1="184.0" x2="736.0" y2="184.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="38.0" y="213.0" font-size="14.5" fill="#0b0b0b" font-weight="600">dreams</text>
<text x="38.0" y="230.0" font-size="11" fill="#8a8985">rat</text>
<text x="150.0" y="212.0" font-size="12.5" fill="#52514e"><tspan x="150.0" dy="0.0">to try what links with what,</tspan><tspan x="150.0" dy="15.6">with the sensors off</tspan></text>
<text x="358.0" y="220.0" font-size="12.5" fill="#0b0b0b">a film with a plot</text>
<text x="550.0" y="212.0" font-size="12.5" fill="#0b0b0b" font-style="italic"><tspan x="550.0" dy="0.0">the invented book:</tspan><tspan x="550.0" dy="15.6">a dream with eyes open</tspan></text>
<line x1="28.0" y1="246.0" x2="736.0" y2="246.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="38.0" y="275.0" font-size="14.5" fill="#0b0b0b" font-weight="600">laughter</text>
<text x="38.0" y="292.0" font-size="11" fill="#8a8985">rat pup</text>
<text x="150.0" y="274.0" font-size="12.5" fill="#52514e"><tspan x="150.0" dy="0.0">to catch one's own wrong</tspan><tspan x="150.0" dy="15.6">guess while it is cheap (?)</tspan></text>
<text x="358.0" y="274.0" font-size="12.5" fill="#0b0b0b"><tspan x="358.0" dy="0.0">a roar for the pack,</tspan><tspan x="358.0" dy="15.6">the joke about the hunters</tspan></text>
<text x="550.0" y="282.0" font-size="16" fill="#0b0b0b">—</text>
<line x1="28.0" y1="308.0" x2="736.0" y2="308.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="38.0" y="337.0" font-size="14.5" fill="#0b0b0b" font-weight="600">omens</text>
<text x="38.0" y="354.0" font-size="11" fill="#8a8985">pigeon</text>
<text x="150.0" y="336.0" font-size="12.5" fill="#52514e"><tspan x="150.0" dy="0.0">with scant data, to choose</tspan><tspan x="150.0" dy="15.6">the cheaper mistake</tspan></text>
<text x="358.0" y="336.0" font-size="12.5" fill="#0b0b0b"><tspan x="358.0" dy="0.0">the dream book,</tspan><tspan x="358.0" dy="15.6">knocking on wood</tspan></text>
<text x="550.0" y="336.0" font-size="12.5" fill="#0b0b0b" font-style="italic"><tspan x="550.0" dy="0.0">the stamp in the corner</tspan><tspan x="550.0" dy="15.6">of the photographs</tspan></text>
<line x1="28.0" y1="370.0" x2="736.0" y2="370.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="38.0" y="399.0" font-size="14.5" fill="#0b0b0b" font-weight="600">songs</text>
<text x="38.0" y="416.0" font-size="11" fill="#8a8985">cockatoo</text>
<text x="150.0" y="398.0" font-size="12.5" fill="#52514e"><tspan x="150.0" dy="0.0">to pay for a forecast</tspan><tspan x="150.0" dy="15.6">that came true</tspan></text>
<text x="358.0" y="398.0" font-size="12.5" fill="#0b0b0b"><tspan x="358.0" dy="0.0">a seven-string, a waltz,</tspan><tspan x="358.0" dy="15.6">a choir</tspan></text>
<text x="550.0" y="398.0" font-size="12.5" fill="#0b0b0b" font-style="italic"><tspan x="550.0" dy="0.0">forecasts the next note</tspan><tspan x="550.0" dy="15.6">unpaid; bakes us sweets</tspan></text>
<line x1="28.0" y1="432.0" x2="736.0" y2="432.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="38.0" y="461.0" font-size="14.5" fill="#0b0b0b" font-weight="600">grumbling</text>
<text x="38.0" y="478.0" font-size="11" fill="#8a8985">kitten</text>
<text x="150.0" y="460.0" font-size="12.5" fill="#52514e"><tspan x="150.0" dy="0.0">to guard what is learned</tspan><tspan x="150.0" dy="15.6">from what is being learned</tspan></text>
<text x="358.0" y="460.0" font-size="12.5" fill="#0b0b0b"><tspan x="358.0" dy="0.0">“in my day”;</tspan><tspan x="358.0" dy="15.6">generations and funerals</tspan></text>
<text x="550.0" y="460.0" font-size="12.5" fill="#0b0b0b" font-style="italic"><tspan x="550.0" dy="0.0">names the year it left</tspan><tspan x="550.0" dy="15.6">school; small funerals</tspan></text>
<line x1="28.0" y1="494.0" x2="736.0" y2="494.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<line x1="140.0" y1="92.0" x2="140.0" y2="494.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<line x1="348.0" y1="92.0" x2="348.0" y2="494.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<line x1="540.0" y1="92.0" x2="540.0" y2="494.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="28.0" y="520.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Under each property is a witness that came to the task by its own road. (?) marks a hypothesis.</tspan><tspan x="28.0" dy="14.4">The last column is today's machines, as Oleg filled it in; what the heir's ways will be is not known.</tspan></text>
</svg>
