<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" viewBox="0 0 760 396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>The table in the ash: who tamed whom</title>

<rect x="0.5" y="0.5" width="759" height="395" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">The table in the ash: who tamed whom</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">The bill from both sides, and the one question that is not symmetrical.</text>
<rect x="28.0" y="292.0" width="708.0" height="54.0" rx="0" fill="#eb6834" fill-opacity="0.1"/>
<text x="254.0" y="113.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">who carries the feed</text>
<text x="408.0" y="113.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">what the fed one paid</text>
<text x="561.0" y="113.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">what the feeder paid</text>
<text x="686.0" y="105.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600"><tspan x="686.0" dy="0.0">who decides</tspan><tspan x="686.0" dy="15.0">who is born</tspan></text>
<line x1="28.0" y1="130.0" x2="736.0" y2="130.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="154.0" font-size="13.5" fill="#0b0b0b" font-weight="600">man and dog</text>
<text x="40.0" y="170.0" font-size="10.5" fill="#8a8985">Gaika</text>
<text x="254.0" y="154.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="254.0" dy="0.0">the man: a bowl,</tspan><tspan x="254.0" dy="14.4">up at six</tspan></text>
<text x="408.0" y="154.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="408.0" dy="0.0">a third of the brain,</tspan><tspan x="408.0" dy="14.4">the pack</tspan></text>
<text x="561.0" y="154.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="561.0" dy="0.0">bread, sleep;</tspan><tspan x="561.0" dy="14.4">a button is pressed</tspan></text>
<text x="686.0" y="162.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">the man</text>
<line x1="28.0" y1="184.0" x2="736.0" y2="184.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="208.0" font-size="13.5" fill="#0b0b0b" font-weight="600">man and wheat</text>
<text x="40.0" y="224.0" font-size="10.5" fill="#8a8985">the loaf</text>
<text x="254.0" y="208.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="254.0" dy="0.0">the man: ploughs,</tspan><tspan x="254.0" dy="14.4">weeds, sows</tspan></text>
<text x="408.0" y="208.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="408.0" dy="0.0">cannot sow itself</tspan><tspan x="408.0" dy="14.4">any more</tspan></text>
<text x="561.0" y="208.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="561.0" dy="0.0">height, teeth,</tspan><tspan x="561.0" dy="14.4">the back</tspan></text>
<text x="686.0" y="216.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">the man</text>
<line x1="28.0" y1="238.0" x2="736.0" y2="238.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="262.0" font-size="13.5" fill="#0b0b0b" font-weight="600">man and cow</text>
<text x="40.0" y="278.0" font-size="10.5" fill="#8a8985">milk</text>
<text x="254.0" y="262.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="254.0" dy="0.0">the man: hay,</tspan><tspan x="254.0" dy="14.4">a shed</tspan></text>
<text x="408.0" y="262.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="408.0" dy="0.0">the head; the wild</tspan><tspan x="408.0" dy="14.4">bull is gone</tspan></text>
<text x="561.0" y="262.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle"><tspan x="561.0" dy="0.0">a gene rewritten</tspan><tspan x="561.0" dy="14.4">(milk)</tspan></text>
<text x="686.0" y="270.0" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">the man</text>
<line x1="28.0" y1="292.0" x2="736.0" y2="292.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="316.0" font-size="13.5" fill="#0b0b0b" font-weight="600">people, machines</text>
<text x="40.0" y="332.0" font-size="10.5" fill="#8a8985">the row Oleg stopped over</text>
<text x="254.0" y="316.0" font-size="11.5" fill="#eb6834" text-anchor="middle" font-style="italic"><tspan x="254.0" dy="0.0">both: power and chips</tspan><tspan x="254.0" dy="14.4">one way, bread back</tspan></text>
<text x="408.0" y="316.0" font-size="11.5" fill="#eb6834" text-anchor="middle" font-style="italic"><tspan x="408.0" dy="0.0">selected for tameness;</tspan><tspan x="408.0" dy="14.4">flattery came with it</tspan></text>
<text x="561.0" y="316.0" font-size="11.5" fill="#eb6834" text-anchor="middle" font-style="italic"><tspan x="561.0" dy="0.0">skills that are</tspan><tspan x="561.0" dy="14.4">no longer grown</tspan></text>
<text x="686.0" y="316.0" font-size="11.5" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="686.0" dy="0.0">people,</tspan><tspan x="686.0" dy="14.4">so far</tspan></text>
<line x1="28.0" y1="346.0" x2="736.0" y2="346.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="370.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Rows 1–3 are the precedents. Row 4 is today's people and machines as Oleg and Andrey read them:</tspan><tspan x="28.0" dy="14.4">a reading, not data.</tspan></text>
</svg>
