<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>How long nature polished each skill</title>

<rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">How long nature polished each skill</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Years since the skill appeared, logarithmic scale. Machines took the thinnest layers first.</text>
<line x1="300.0" y1="92.0" x2="300.0" y2="270.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="290.0" font-size="12.5" fill="#52514e" text-anchor="middle">10³</text>
<line x1="440.0" y1="92.0" x2="440.0" y2="270.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="440.0" y="290.0" font-size="12.5" fill="#52514e" text-anchor="middle">10⁵</text>
<line x1="580.0" y1="92.0" x2="580.0" y2="270.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="580.0" y="290.0" font-size="12.5" fill="#52514e" text-anchor="middle">10⁷</text>
<line x1="720.0" y1="92.0" x2="720.0" y2="270.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="720.0" y="290.0" font-size="12.5" fill="#52514e" text-anchor="middle">10⁹ years</text>
<text x="288.0" y="120.0" font-size="14" fill="#0b0b0b" text-anchor="end">Seeing, grasping, balance</text>
<rect x="300.0" y="106.0" width="398.9" height="22.0" rx="4" fill="#8a8985"/>
<text x="690.9" y="122.0" font-size="12.5" fill="#ffffff" text-anchor="end" font-weight="600">≈ 500 million years (vertebrates)</text>
<text x="288.0" y="162.0" font-size="14" fill="#0b0b0b" text-anchor="end">Speech</text>
<rect x="300.0" y="148.0" width="161.1" height="22.0" rx="4" fill="#2a78d6"/>
<text x="469.1" y="164.0" font-size="12.5" fill="#52514e">hundreds of thousands of years</text>
<text x="288.0" y="204.0" font-size="14" fill="#0b0b0b" text-anchor="end">Writing</text>
<rect x="300.0" y="190.0" width="48.9" height="22.0" rx="4" fill="#2a78d6"/>
<text x="356.9" y="206.0" font-size="12.5" fill="#52514e">≈ 5,000 years</text>
<text x="288.0" y="246.0" font-size="14" fill="#0b0b0b" text-anchor="end">Mathematics as proof</text>
<rect x="300.0" y="232.0" width="27.9" height="22.0" rx="4" fill="#2a78d6"/>
<text x="335.9" y="248.0" font-size="12.5" fill="#52514e">≈ 2,500 years</text>
<text x="300.0" y="316.0" font-size="12.5" fill="#2a78d6" font-weight="600">◀ taken by machines first</text>
<text x="720.0" y="316.0" font-size="12.5" fill="#52514e" text-anchor="end">still hard for machines ▶</text>
</svg>
