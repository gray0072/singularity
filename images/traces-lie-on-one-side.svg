<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Traces lie on one side</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">A scheme in the ash: the pages of the printed book, from the end where all is by suits to the shuffled end.</text>
