<text x="74.0" y="302.0" font-size="12.5" fill="#0b0b0b"><tspan x="74.0" dy="0.0">Traces: a print, shards, a dirty plate, a recollection.</tspan><tspan x="74.0" dy="15.6">Made by the event itself; bought with a clean place and paid for with heat.</tspan></text>
<line x1="28.0" y1="346.0" x2="62.0" y2="346.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arrow-2a78d6)"/>
<text x="74.0" y="350.0" font-size="12.5" fill="#0b0b0b"><tspan x="74.0" dy="0.0">A forecast: made by the head, out of the same traces and a rule.</tspan><tspan x="74.0" dy="15.6">It costs nothing extra, and it can be wrong.</tspan></text>
<text x="28.0" y="400.0" font-size="13" fill="#0b0b0b" font-weight="600">The side the solid arrows come from is the one people named the past.</text>
<text x="28.0" y="424.0" font-size="11.5" fill="#8a8985">A scheme of the argument, not data. Why one end of the row lay by suits is not explained by anybody.</text>
</svg>
