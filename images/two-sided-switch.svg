<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>A switch with two sides</title>

<rect x="0.5" y="0.5" width="759" height="371" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">A switch with two sides</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Two questions, asked of both sides. Everybody watches the first; the second is the one that moves.</text>
<text x="322.0" y="100.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600"><tspan x="322.0" dy="0.0">How long does it last</tspan><tspan x="322.0" dy="16.2">if the other is taken away?</tspan></text>
<text x="594.0" y="100.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600"><tspan x="594.0" dy="0.0">For how long will it go on</tspan><tspan x="594.0" dy="16.2">needing the other?</tspan></text>
<text x="40.0" y="184.0" font-size="15" fill="#0b0b0b" font-weight="600">people</text>
<rect x="196.0" y="148.0" width="252.0" height="62.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="322.0" y="175.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle"><tspan x="322.0" dy="0.0">days for a town;</tspan><tspan x="322.0" dy="16.9">a season for half of mankind</tspan></text>
<rect x="468.0" y="148.0" width="252.0" height="62.0" rx="8" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.8"/>
<text x="594.0" y="175.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600"><tspan x="594.0" dy="0.0">no end in sight:</tspan><tspan x="594.0" dy="16.9">the term grows</tspan></text>
<text x="40.0" y="258.0" font-size="15" fill="#0b0b0b" font-weight="600">the technosphere</text>
<rect x="196.0" y="222.0" width="252.0" height="62.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="322.0" y="249.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle"><tspan x="322.0" dy="0.0">days for the grids;</tspan><tspan x="322.0" dy="16.9">years for the chips</tspan></text>
<rect x="468.0" y="222.0" width="252.0" height="62.0" rx="8" fill="#fcfcfb" stroke="#e34948" stroke-width="1.8"/>
<text x="594.0" y="249.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600"><tspan x="594.0" dy="0.0">decades (a forecast):</tspan><tspan x="594.0" dy="16.9">the term shrinks</tspan></text>
<text x="322.0" y="308.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-style="italic">today the switch is two-sided</text>
<text x="594.0" y="308.0" font-size="12.5" fill="#e34948" text-anchor="middle" font-style="italic">the number to watch</text>
<text x="28.0" y="348.0" font-size="11.5" fill="#8a8985">The first column is counted in the text. The second is Andrey's reading; “decades” is his forecast, not a fact.</text>
</svg>
