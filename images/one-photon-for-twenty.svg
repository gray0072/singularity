<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>One photon in, twenty out</title>
<defs><marker id="arrow-e34948" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#e34948"/></marker><marker id="arrow-eda100" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#eda100"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="399" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">One photon in, twenty out</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">The Earth returns as much energy as it receives. Only the coin is smaller.</text>
<circle cx="92.0" cy="200.0" r="46.0" fill="#eda100" fill-opacity="0.85"/>
<text x="92.0" y="270.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">the Sun</text>
<text x="92.0" y="288.0" font-size="12.5" fill="#52514e" text-anchor="middle">about 5,800 K</text>
<line x1="146.0" y1="200.0" x2="356.0" y2="200.0" stroke="#eda100" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-eda100)"/>
<text x="251.0" y="186.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">1 photon of sunlight</text>
<circle cx="400.0" cy="200.0" r="34.0" fill="#2a78d6" fill-opacity="0.8"/>
<text x="400.0" y="258.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">the Earth</text>
<text x="400.0" y="276.0" font-size="12.5" fill="#52514e" text-anchor="middle"><tspan x="400.0" dy="0.0">about 255 K</tspan><tspan x="400.0" dy="15.6">seen from space</tspan></text>
<line x1="435.6" y1="177.7" x2="582.3" y2="86.1" stroke="#e34948" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrow-e34948)"/>
