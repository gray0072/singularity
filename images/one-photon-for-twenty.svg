<line x1="442.0" y1="198.8" x2="614.9" y2="193.7" stroke="#e34948" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrow-e34948)"/>
<line x1="442.0" y1="201.2" x2="614.9" y2="206.3" stroke="#e34948" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrow-e34948)"/>
<line x1="441.8" y1="203.7" x2="614.2" y2="218.9" stroke="#e34948" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrow-e34948)"/>
