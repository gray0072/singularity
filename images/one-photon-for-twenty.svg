<line x1="435.6" y1="222.3" x2="582.3" y2="313.9" stroke="#e34948" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrow-e34948)"/>
<text x="728.0" y="334.0" font-size="13" fill="#e34948" text-anchor="end" font-weight="600">about 20 infrared photons</text>
<text x="728.0" y="352.0" font-size="12.5" fill="#52514e" text-anchor="end">to the cold sky</text>
<text x="250.0" y="318.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-style="italic"><tspan x="250.0" dy="0.0">between the one and the twenty:</tspan><tspan x="250.0" dy="16.2">the wind, the rivers, the grass, you and I</tspan></text>
<text x="28.0" y="372.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Rough arithmetic: a photon's energy goes with the temperature of the body that sent it;</tspan><tspan x="28.0" dy="14.4">5,800 / 255 ≈ 23, say twenty.</tspan></text>
</svg>
