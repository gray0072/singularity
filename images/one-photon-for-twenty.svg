<line x1="441.1" y1="208.6" x2="610.5" y2="243.9" stroke="#e34948" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrow-e34948)"/>
<line x1="440.5" y1="211.0" x2="607.5" y2="256.2" stroke="#e34948" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrow-e34948)"/>
<line x1="439.8" y1="213.3" x2="603.9" y2="268.3" stroke="#e34948" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrow-e34948)"/>
