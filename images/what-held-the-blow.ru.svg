<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Что удерживало удар</title>

<rect x="0.5" y="0.5" width="759" height="371" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Что удерживало удар</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Три опоры баланса между оружием и тормозом, и что происходит с каждой.</text>
<text x="334.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">на чём стоит</text>
<text x="481.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">где держит</text>
<text x="646.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">что с ней происходит</text>
<line x1="28.0" y1="114.0" x2="736.0" y2="114.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="145.0" font-size="14" fill="#0b0b0b" font-weight="600">ответный удар</text>
<text x="40.0" y="162.0" font-size="11" fill="#8a8985">волчий тормоз</text>
<text x="334.0" y="144.5" font-size="12" fill="#0b0b0b" text-anchor="middle">каждый спасает</text>
<text x="334.0" y="161.5" font-size="12" fill="#0b0b0b" text-anchor="middle">свою шкуру</text>
<text x="481.0" y="153.0" font-size="12" fill="#0b0b0b" text-anchor="middle">между вооружёнными</text>
<text x="646.0" y="144.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">держит; безоружных</text>
<text x="646.0" y="161.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">не прикрывал никогда</text>
<line x1="28.0" y1="182.0" x2="736.0" y2="182.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="213.0" font-size="14" fill="#0b0b0b" font-weight="600">потребность</text>
<text x="40.0" y="230.0" font-size="11" fill="#8a8985">потребность людей в людях</text>
<text x="334.0" y="212.5" font-size="12" fill="#0b0b0b" text-anchor="middle">нужного</text>
<text x="334.0" y="229.5" font-size="12" fill="#0b0b0b" text-anchor="middle">не бьют</text>
<text x="481.0" y="212.5" font-size="12" fill="#0b0b0b" text-anchor="middle">между теми, кто</text>
<text x="481.0" y="229.5" font-size="12" fill="#0b0b0b" text-anchor="middle">друг другу нужен</text>
<text x="646.0" y="212.5" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600">уходит вместе</text>
<text x="646.0" y="229.5" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600">с потребностью</text>
<line x1="28.0" y1="250.0" x2="736.0" y2="250.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="281.0" font-size="14" fill="#0b0b0b" font-weight="600">руки</text>
<text x="40.0" y="298.0" font-size="11" fill="#8a8985">те, кто между желанием и ударом</text>
<text x="334.0" y="280.5" font-size="12" fill="#0b0b0b" text-anchor="middle">тысяча голов,</text>
<text x="334.0" y="297.5" font-size="12" fill="#0b0b0b" text-anchor="middle">в каждой тормоз</text>
<text x="481.0" y="280.5" font-size="12" fill="#0b0b0b" text-anchor="middle">там, где</text>
<text x="481.0" y="297.5" font-size="12" fill="#0b0b0b" text-anchor="middle">видно лицо</text>
<text x="646.0" y="280.5" font-size="12" fill="#e34948" text-anchor="middle" font-weight="600">с каждым новым оружием</text>
<text x="646.0" y="297.5" font-size="12" fill="#e34948" text-anchor="middle" font-weight="600">рук на удар всё меньше</text>
<line x1="28.0" y1="318.0" x2="736.0" y2="318.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="342.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Опоры 1 и 2 — возражение Олега, которое Андрей принимает (вторая — вечера 47 и 49). Опора 3 — прочтение</tspan><tspan x="28.0" dy="14.4">этого вечера, а не измерение: то, что исполняет, встаёт на место тех, кому приходилось смотреть.</tspan></text>
</svg>
