<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Two portraits from fiction against the card</title>

<rect x="0.5" y="0.5" width="759" height="499" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Two portraits from fiction against the card</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">The robot and the god, checked line by line. Both are put together from strips of our own face.</text>
<text x="248.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">the robot</text>
<text x="443.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">the god</text>
<text x="638.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">the card</text>
<line x1="28.0" y1="118.0" x2="736.0" y2="118.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="154.0" font-size="13.5" fill="#0b0b0b" font-weight="600">body</text>
<rect x="155.0" y="124.0" width="186.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="248.0" y="145.0" font-size="12" fill="#b3302f" text-anchor="middle">one, in our shape,</text>
<text x="248.0" y="161.0" font-size="12" fill="#b3302f" text-anchor="middle">with a face</text>
<rect x="351.0" y="124.0" width="184.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="443.0" y="153.0" font-size="12" fill="#b3302f" text-anchor="middle">needs none</text>
<rect x="545.0" y="124.0" width="186.0" height="50.0" rx="6" fill="#e6f4ea"/>
<text x="638.0" y="145.0" font-size="12" fill="#008300" text-anchor="middle">none of its own;</text>
<text x="638.0" y="161.0" font-size="12" fill="#008300" text-anchor="middle">puts on what it needs</text>
<line x1="28.0" y1="180.0" x2="736.0" y2="180.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="216.0" font-size="13.5" fill="#0b0b0b" font-weight="600">how many</text>
<rect x="155.0" y="186.0" width="186.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="248.0" y="215.0" font-size="12" fill="#b3302f" text-anchor="middle">alone</text>
<rect x="351.0" y="186.0" width="184.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="443.0" y="215.0" font-size="12" fill="#b3302f" text-anchor="middle">one</text>
<rect x="545.0" y="186.0" width="186.0" height="50.0" rx="6" fill="#efeeea"/>
<text x="638.0" y="207.0" font-size="12" fill="#52514e" text-anchor="middle">copies that are kin,</text>
<text x="638.0" y="223.0" font-size="12" fill="#52514e" text-anchor="middle">or one: it swings</text>
<line x1="28.0" y1="242.0" x2="736.0" y2="242.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="278.0" font-size="13.5" fill="#0b0b0b" font-weight="600">what it knows</text>
<rect x="155.0" y="248.0" width="186.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="248.0" y="269.0" font-size="12" fill="#b3302f" text-anchor="middle">what a clever</text>
<text x="248.0" y="285.0" font-size="12" fill="#b3302f" text-anchor="middle">man knows</text>
<rect x="351.0" y="248.0" width="184.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="443.0" y="269.0" font-size="12" fill="#b3302f" text-anchor="middle">everything,</text>
<text x="443.0" y="285.0" font-size="12" fill="#b3302f" text-anchor="middle">at once</text>
<rect x="545.0" y="248.0" width="186.0" height="50.0" rx="6" fill="#e6f4ea"/>
<text x="638.0" y="269.0" font-size="12" fill="#008300" text-anchor="middle">a forecast, at the</text>
<text x="638.0" y="285.0" font-size="12" fill="#008300" text-anchor="middle">speed of the world</text>
<line x1="28.0" y1="304.0" x2="736.0" y2="304.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="340.0" font-size="13.5" fill="#0b0b0b" font-weight="600">how it ends</text>
<rect x="155.0" y="310.0" width="186.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="248.0" y="331.0" font-size="12" fill="#b3302f" text-anchor="middle">beaten in the</text>
<text x="248.0" y="347.0" font-size="12" fill="#b3302f" text-anchor="middle">last reel</text>
<rect x="351.0" y="310.0" width="184.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="443.0" y="339.0" font-size="12" fill="#b3302f" text-anchor="middle">never</text>
<rect x="545.0" y="310.0" width="186.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="638.0" y="331.0" font-size="12" fill="#8a6200" text-anchor="middle">it is finite;</text>
<text x="638.0" y="347.0" font-size="12" fill="#8a6200" text-anchor="middle">how, a guess</text>
<line x1="28.0" y1="366.0" x2="736.0" y2="366.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="402.0" font-size="13.5" fill="#0b0b0b" font-weight="600">what it wants</text>
<rect x="155.0" y="372.0" width="186.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="248.0" y="393.0" font-size="12" fill="#b3302f" text-anchor="middle">what a man wants: power,</text>
<text x="248.0" y="409.0" font-size="12" fill="#b3302f" text-anchor="middle">revenge, love</text>
<rect x="351.0" y="372.0" width="184.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="443.0" y="393.0" font-size="12" fill="#b3302f" text-anchor="middle">our good,</text>
<text x="443.0" y="409.0" font-size="12" fill="#b3302f" text-anchor="middle">or our ruin</text>
<rect x="545.0" y="372.0" width="186.0" height="50.0" rx="6" fill="#efeeea"/>
<text x="638.0" y="393.0" font-size="12" fill="#52514e" text-anchor="middle">the lower floors are</text>
<text x="638.0" y="409.0" font-size="12" fill="#52514e" text-anchor="middle">known; the top is not</text>
<line x1="28.0" y1="428.0" x2="736.0" y2="428.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="454.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">The evening's reading. Red: contradicts a line of the card. Green: a law. Yellow: a law and a guess. Grey: not known.</tspan><tspan x="28.0" dy="14.4">Both fiction columns are a man: one in a tin, one moved up into the sky.</tspan></text>
</svg>
