<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>The same sugar, two ways to live on it</title>

<rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">The same sugar, two ways to live on it</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">What a cell gets from one molecule of glucose, in molecules of ATP. The scale is linear.</text>
<text x="202.0" y="118.0" font-size="13" fill="#0b0b0b" text-anchor="end"><tspan x="202.0" dy="0.0">fermentation,</tspan><tspan x="202.0" dy="16.2">without oxygen</tspan></text>
<rect x="216.0" y="104.0" width="33.3" height="30.0" rx="2" fill="#8a8985" fill-opacity="0.85"/>
<text x="259.3" y="124.0" font-size="13.5" fill="#0b0b0b" font-weight="600">2</text>
<text x="202.0" y="184.0" font-size="13" fill="#0b0b0b" text-anchor="end"><tspan x="202.0" dy="0.0">respiration,</tspan><tspan x="202.0" dy="16.2">with oxygen</tspan></text>
<rect x="216.0" y="170.0" width="500.0" height="30.0" rx="2" fill="#eb6834" fill-opacity="0.85"/>
<text x="230.0" y="190.0" font-size="13.5" fill="#ffffff" font-weight="600">about 30: fifteen times more</text>
<line x1="216.0" y1="94.0" x2="216.0" y2="216.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="252.0" font-size="12.5" fill="#0b0b0b"><tspan x="28.0" dy="0.0">The poison turned out to be the best fuel there is,</tspan><tspan x="28.0" dy="15.6">for whoever learned to keep it in a stove.</tspan></text>
<text x="28.0" y="310.0" font-size="11.5" fill="#8a8985">Rounded figures: today's textbooks give 30–32 for respiration, older ones 36–38.</text>
</svg>
