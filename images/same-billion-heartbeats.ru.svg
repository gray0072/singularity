<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Тот же миллиард</title>

<rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Тот же миллиард</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Удары сердца за жизнь: удары в минуту, умноженные на минуты жизни. Счёт Олега.</text>
<line x1="232.0" y1="88.0" x2="232.0" y2="266.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="232.0" y="284.0" font-size="11.5" fill="#8a8985" text-anchor="middle">0</text>
<line x1="363.2" y1="88.0" x2="363.2" y2="266.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="363.2" y="284.0" font-size="11.5" fill="#8a8985" text-anchor="middle">1 миллиард</text>
<line x1="494.4" y1="88.0" x2="494.4" y2="266.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="494.4" y="284.0" font-size="11.5" fill="#8a8985" text-anchor="middle">2 миллиарда</text>
<text x="218.0" y="114.0" font-size="13.5" fill="#0b0b0b" text-anchor="end" font-weight="600">мышь, 25 граммов</text>
<text x="218.0" y="132.0" font-size="12" fill="#52514e" text-anchor="end">600 в минуту × 2,5 года</text>
<rect x="232.0" y="104.0" width="103.6" height="26.0" rx="3" fill="#1baf7a" fill-opacity="0.85"/>
<text x="343.6" y="122.0" font-size="13" fill="#0b0b0b" font-weight="600">около 0,8 миллиарда</text>
<text x="218.0" y="172.0" font-size="13.5" fill="#0b0b0b" text-anchor="end" font-weight="600">слон, 5 тонн</text>
<text x="218.0" y="190.0" font-size="12" fill="#52514e" text-anchor="end">30 в минуту × 65 лет</text>
<rect x="232.0" y="162.0" width="133.8" height="26.0" rx="3" fill="#1baf7a" fill-opacity="0.85"/>
<text x="373.8" y="180.0" font-size="13" fill="#0b0b0b" font-weight="600">около 1 миллиарда</text>
<text x="218.0" y="230.0" font-size="13.5" fill="#0b0b0b" text-anchor="end" font-weight="600">Олег, 62 года</text>
<text x="218.0" y="248.0" font-size="12" fill="#52514e" text-anchor="end">70 в минуту × 62 года</text>
<rect x="232.0" y="220.0" width="299.1" height="26.0" rx="3" fill="#eb6834" fill-opacity="0.85"/>
<text x="539.1" y="238.0" font-size="13" fill="#0b0b0b" font-weight="600">около 2,3 миллиарда, счёт идёт</text>
<text x="28.0" y="312.0" font-size="11.5" fill="#8a8985">Круглые цифры пульса и срока жизни; они дают порядок, не больше. Люди и летучие мыши живут дольше, чем положено по весу.</text>
</svg>
