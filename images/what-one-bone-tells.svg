<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>What one bone tells</title>

<rect x="0.5" y="0.5" width="759" height="391" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">What one bone tells</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Three ways of drawing a beast that nobody has seen, and how far each can be trusted.</text>
<text x="371.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">what it gives</text>
<text x="626.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">the pencil</text>
<line x1="28.0" y1="118.0" x2="736.0" y2="118.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="143.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">by a law that does not</tspan><tspan x="34.0" dy="16.9">care about the material</tspan></text>
<text x="34.0" y="176.0" font-size="11" fill="#8a8985">the drawing of 1638; the tape measure</text>
<text x="371.0" y="150.0" font-size="12" fill="#0b0b0b" text-anchor="middle">the weight, from the thickness of the bone;</text>
<text x="371.0" y="166.0" font-size="12" fill="#0b0b0b" text-anchor="middle">then roughly the food and the pace of life</text>
<rect x="521.0" y="124.0" width="210.0" height="60.0" rx="6" fill="#e6f4ea"/>
<text x="626.0" y="150.0" font-size="12" fill="#008300" text-anchor="middle">hard: it does not ask</text>
<text x="626.0" y="166.0" font-size="12" fill="#008300" text-anchor="middle">whose family</text>
<line x1="28.0" y1="190.0" x2="736.0" y2="190.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="215.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">by likeness</tspan><tspan x="34.0" dy="16.9">to a relative</tspan></text>
<text x="34.0" y="248.0" font-size="11" fill="#8a8985">the pouch bones of 1804</text>
<text x="371.0" y="222.0" font-size="12" fill="#0b0b0b" text-anchor="middle">the teeth, the pouch, the diet:</text>
<text x="371.0" y="238.0" font-size="12" fill="#0b0b0b" text-anchor="middle">what went together in every beast seen</text>
<rect x="521.0" y="196.0" width="210.0" height="60.0" rx="6" fill="#fdf3d7"/>
<text x="626.0" y="222.0" font-size="12" fill="#8a6200" text-anchor="middle">soft: right inside the family,</text>
<text x="626.0" y="238.0" font-size="12" fill="#8a6200" text-anchor="middle">wrong on the claws of 1822</text>
<line x1="28.0" y1="262.0" x2="736.0" y2="262.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="303.0" font-size="13.5" fill="#0b0b0b" font-weight="600">not at all</text>
<text x="371.0" y="294.0" font-size="12" fill="#0b0b0b" text-anchor="middle">the colour, the voice, the temper,</text>
<text x="371.0" y="310.0" font-size="12" fill="#0b0b0b" text-anchor="middle">the face</text>
<rect x="521.0" y="268.0" width="210.0" height="60.0" rx="6" fill="#efeeea"/>
<text x="626.0" y="302.0" font-size="12" fill="#52514e" text-anchor="middle">none</text>
<line x1="28.0" y1="334.0" x2="736.0" y2="334.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="360.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">The claws and the teeth from Eppelsheim stood in the books as two animals from 1833 to 1890.</tspan><tspan x="28.0" dy="14.4">The third column is the evening's reading.</tspan></text>
</svg>
