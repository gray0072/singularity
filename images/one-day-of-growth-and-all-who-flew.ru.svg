<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Один день прироста и все, кто когда-либо летал</title>

<rect x="0.5" y="0.5" width="759" height="355" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Один день прироста и все, кто когда-либо летал</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Люди, логарифмическая шкала: каждый шаг вправо — в десять раз больше.</text>
<line x1="300.0" y1="90.0" x2="300.0" y2="252.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="270.0" font-size="11" fill="#8a8985">10</text>
<line x1="384.0" y1="90.0" x2="384.0" y2="252.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="384.0" y="270.0" font-size="11" fill="#8a8985" text-anchor="middle">100</text>
<line x1="468.0" y1="90.0" x2="468.0" y2="252.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="468.0" y="270.0" font-size="11" fill="#8a8985" text-anchor="middle">1000</text>
<line x1="552.0" y1="90.0" x2="552.0" y2="252.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="552.0" y="270.0" font-size="11" fill="#8a8985" text-anchor="middle">10 000</text>
<line x1="636.0" y1="90.0" x2="636.0" y2="252.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="636.0" y="270.0" font-size="11" fill="#8a8985" text-anchor="middle">100 000</text>
<line x1="720.0" y1="90.0" x2="720.0" y2="252.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="720.0" y="270.0" font-size="11" fill="#8a8985" text-anchor="end">миллион</text>
<text x="28.0" y="118.0" font-size="13" fill="#0b0b0b" font-weight="600">прибавилось людей за один день</text>
<text x="28.0" y="134.0" font-size="11" fill="#8a8985">2026: 363 тысячи родились, 174 тысячи умерли</text>
<rect x="300.0" y="109.0" width="359.2" height="20.0" rx="3" fill="#e34948"/>
<text x="651.2" y="124.0" font-size="12" fill="#ffffff" text-anchor="end" font-weight="600">189 000</text>
<text x="28.0" y="170.0" font-size="13" fill="#0b0b0b" font-weight="600">побывали на орбите за все 65 лет</text>
<text x="28.0" y="186.0" font-size="11" fill="#8a8985">с апреля 1961-го по ноябрь 2026-го</text>
<rect x="300.0" y="161.0" width="152.3" height="20.0" rx="3" fill="#eb6834"/>
<text x="460.3" y="176.0" font-size="12" fill="#0b0b0b" font-weight="600">около 650</text>
<text x="28.0" y="222.0" font-size="13" fill="#0b0b0b" font-weight="600">запущено на орбиту за год</text>
<text x="28.0" y="238.0" font-size="11" fill="#8a8985">2025, восемь полётов</text>
<rect x="300.0" y="213.0" width="37.6" height="20.0" rx="3" fill="#eb6834"/>
<text x="345.6" y="228.0" font-size="12" fill="#0b0b0b" font-weight="600">28</text>
<text x="28.0" y="302.0" font-size="13" fill="#0b0b0b" font-weight="600">Чтобы остановить рост вывозом, верхняя полоса должна стартовать каждый день.</text>
<text x="28.0" y="332.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Рождения и смерти — прогноз ООН (пересмотр 2024 года, средний вариант). Побывавшие на орбите — подсчёт на середину</tspan><tspan x="28.0" dy="14.4">ноября 2026 года. 2025 год — счёт пилотируемых орбитальных полётов.</tspan></text>
</svg>
