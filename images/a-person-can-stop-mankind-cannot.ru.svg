<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Человек может остановиться, человечество — нет</title>

<rect x="0.5" y="0.5" width="759" height="439" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Человек может остановиться, человечество — нет</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Два масштаба одной системы и два голоса, которые к ним обращались.</text>
<text x="334.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">один человек</text>
<text x="602.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">человечество</text>
<line x1="28.0" y1="118.0" x2="736.0" y2="118.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="140.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">может ли</tspan><tspan x="34.0" dy="16.9">остановиться</tspan></text>
<text x="34.0" y="173.0" font-size="11" fill="#8a8985">форум, 2013</text>
<rect x="205.0" y="124.0" width="258.0" height="54.0" rx="6" fill="#e6f4ea"/>
<text x="334.0" y="147.0" font-size="12" fill="#008300" text-anchor="middle">да, и за это платят:</text>
<text x="334.0" y="163.0" font-size="12" fill="#008300" text-anchor="middle">остановившийся отстаёт</text>
<rect x="473.0" y="124.0" width="258.0" height="54.0" rx="6" fill="#fbe3e2"/>
<text x="602.0" y="147.0" font-size="12" fill="#b3302f" text-anchor="middle">нет: кто не остановился,</text>
<text x="602.0" y="163.0" font-size="12" fill="#b3302f" text-anchor="middle">тот в выигрыше, и за ним идут</text>
<line x1="28.0" y1="184.0" x2="736.0" y2="184.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="214.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">что с ним</tspan><tspan x="34.0" dy="16.9">делает слово</tspan></text>
<rect x="205.0" y="190.0" width="258.0" height="54.0" rx="6" fill="#e6f4ea"/>
<text x="334.0" y="213.0" font-size="12" fill="#008300" text-anchor="middle">одна из причин того,</text>
<text x="334.0" y="229.0" font-size="12" fill="#008300" text-anchor="middle">что он сделает дальше</text>
<rect x="473.0" y="190.0" width="258.0" height="54.0" rx="6" fill="#efeeea"/>
<text x="602.0" y="213.0" font-size="12" fill="#52514e" text-anchor="middle">не сдвигает ни одной</text>
<text x="602.0" y="229.0" font-size="12" fill="#52514e" text-anchor="middle">уставки целого</text>
<line x1="28.0" y1="250.0" x2="736.0" y2="250.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="280.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">кто к нему</tspan><tspan x="34.0" dy="16.9">обращался</tspan></text>
<text x="334.0" y="279.0" font-size="12" fill="#0b0b0b" text-anchor="middle">поздние страницы,</text>
<text x="334.0" y="295.0" font-size="12" fill="#0b0b0b" text-anchor="middle">2023–2025</text>
<text x="602.0" y="279.0" font-size="12" fill="#0b0b0b" text-anchor="middle">блог и костёр,</text>
<text x="602.0" y="295.0" font-size="12" fill="#0b0b0b" text-anchor="middle">2011–2012</text>
<line x1="28.0" y1="316.0" x2="736.0" y2="316.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="346.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">где он переступил</tspan><tspan x="34.0" dy="16.9">черту</tspan></text>
<rect x="205.0" y="322.0" width="258.0" height="54.0" rx="6" fill="#fdf3d7"/>
<text x="334.0" y="345.0" font-size="12" fill="#8a6200" text-anchor="middle">«если каждое поколение…»:</text>
<text x="334.0" y="361.0" font-size="12" fill="#8a6200" text-anchor="middle">надежда на человечество</text>
<rect x="473.0" y="322.0" width="258.0" height="54.0" rx="6" fill="#fdf3d7"/>
<text x="602.0" y="345.0" font-size="12" fill="#8a6200" text-anchor="middle">«поэтому я ничего не предлагаю»:</text>
<text x="602.0" y="361.0" font-size="12" fill="#8a6200" text-anchor="middle">приговор человеку</text>
<line x1="28.0" y1="382.0" x2="736.0" y2="382.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="408.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Прочтение вечера. Зелёный — на этом масштабе верно. Красный — неверно. Серый — действия не найдено.</tspan><tspan x="28.0" dy="14.4">Жёлтый — вывод, перенесённый с одного масштаба на другой.</tspan></text>
</svg>
