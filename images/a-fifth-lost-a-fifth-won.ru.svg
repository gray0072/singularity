<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Проиграл пятую часть, выиграл пятую часть</title>
<defs><marker id="arrow-52514e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#52514e"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="355" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Проиграл пятую часть, выиграл пятую часть</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">У каждого один проигрыш и один выигрыш, монета честная. Ставка — пятая часть меньшей кучки.</text>
<text x="40.0" y="146.0" font-size="14" fill="#0b0b0b" font-weight="600">тот, кто беднее</text>
<rect x="200.0" y="118.0" width="96.0" height="46.0" rx="8" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="248.0" y="146.5" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">100</text>
<rect x="400.0" y="118.0" width="96.0" height="46.0" rx="8" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="448.0" y="146.5" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">80</text>
<rect x="600.0" y="118.0" width="96.0" height="46.0" rx="8" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="648.0" y="146.5" font-size="17" fill="#eb6834" text-anchor="middle" font-weight="600">96</text>
<line x1="302.0" y1="141.0" x2="392.0" y2="141.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="347.0" y="106.0" font-size="11.5" fill="#52514e" text-anchor="middle"><tspan x="347.0" dy="0.0">проиграл пятую</tspan><tspan x="347.0" dy="14.4">часть от 100: −20</tspan></text>
<line x1="502.0" y1="141.0" x2="592.0" y2="141.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="547.0" y="106.0" font-size="11.5" fill="#52514e" text-anchor="middle"><tspan x="547.0" dy="0.0">выиграл пятую</tspan><tspan x="547.0" dy="14.4">часть от 80: +16</tspan></text>
<text x="648.0" y="182.0" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600">осталось 96%</text>
<text x="40.0" y="240.0" font-size="14" fill="#0b0b0b" font-weight="600">тот, кто богаче</text>
<rect x="200.0" y="212.0" width="96.0" height="46.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="248.0" y="240.5" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">1000</text>
<rect x="400.0" y="212.0" width="96.0" height="46.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="448.0" y="240.5" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">1020</text>
<rect x="600.0" y="212.0" width="96.0" height="46.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="648.0" y="240.5" font-size="17" fill="#2a78d6" text-anchor="middle" font-weight="600">1004</text>
<line x1="302.0" y1="235.0" x2="392.0" y2="235.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="347.0" y="200.0" font-size="11.5" fill="#52514e" text-anchor="middle"><tspan x="347.0" dy="0.0">выиграл те же</tspan><tspan x="347.0" dy="14.4">20 спичек</tspan></text>
<line x1="502.0" y1="235.0" x2="592.0" y2="235.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="547.0" y="200.0" font-size="11.5" fill="#52514e" text-anchor="middle"><tspan x="547.0" dy="0.0">проиграл те же</tspan><tspan x="547.0" dy="14.4">16 спичек</tspan></text>
<text x="648.0" y="276.0" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="600">четыре спички перешли сюда</text>
<text x="28.0" y="316.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Одни и те же двадцать спичек — пятая часть одной кучки и пятидесятая другой.</tspan><tspan x="28.0" dy="14.4">В обратном порядке (сначала выигрыш, потом проигрыш) у бедного выйдет те же 96.</tspan></text>
</svg>
