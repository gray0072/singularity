<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Что стоит там, где стоит слово «наблюдатель»</title>

<rect x="0.5" y="0.5" width="759" height="439" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Что стоит там, где стоит слово «наблюдатель»</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Таблица на золе: четыре места в науке, что сказано в предложении и что там на самом деле.</text>
<text x="299.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">в предложении сказано</text>
<text x="468.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">что там на самом деле</text>
<text x="648.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">пример</text>
<line x1="28.0" y1="114.0" x2="736.0" y2="114.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="145.0" font-size="14" fill="#0b0b0b" font-weight="600">теория относительности</text>
<text x="40.0" y="162.0" font-size="11" fill="#8a8985">с 1905 года</text>
<text x="299.0" y="144.5" font-size="12" fill="#0b0b0b" text-anchor="middle">наблюдатель</text>
<text x="299.0" y="161.5" font-size="12" fill="#0b0b0b" text-anchor="middle">на перроне</text>
<text x="468.0" y="153.0" font-size="12" fill="#0b0b0b" text-anchor="middle">часы и линейка</text>
<text x="648.0" y="144.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">четверо атомных часов</text>
<text x="648.0" y="161.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">в креслах самолёта, 1971</text>
<line x1="28.0" y1="182.0" x2="736.0" y2="182.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="213.0" font-size="14" fill="#0b0b0b" font-weight="600">техника</text>
<text x="40.0" y="230.0" font-size="11" fill="#8a8985">с 1964 года</text>
<text x="299.0" y="212.5" font-size="12" fill="#0b0b0b" text-anchor="middle">наблюдатель</text>
<text x="299.0" y="229.5" font-size="12" fill="#0b0b0b" text-anchor="middle">состояния</text>
<text x="468.0" y="212.5" font-size="12" fill="#0b0b0b" text-anchor="middle">формула, которая вычисляет</text>
<text x="468.0" y="229.5" font-size="12" fill="#0b0b0b" text-anchor="middle">то, чего не измерить</text>
<text x="648.0" y="212.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">в компьютере корабля,</text>
<text x="648.0" y="229.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">летавшего на Луну</text>
<line x1="28.0" y1="250.0" x2="736.0" y2="250.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="281.0" font-size="14" fill="#0b0b0b" font-weight="600">квантовая механика</text>
<text x="40.0" y="298.0" font-size="11" fill="#8a8985">с 1920-х годов</text>
<text x="299.0" y="280.5" font-size="12" fill="#0b0b0b" text-anchor="middle">за электроном</text>
<text x="299.0" y="297.5" font-size="12" fill="#0b0b0b" text-anchor="middle">наблюдают</text>
<text x="468.0" y="280.5" font-size="12" fill="#0b0b0b" text-anchor="middle">что-то хранит след</text>
<text x="468.0" y="297.5" font-size="12" fill="#0b0b0b" text-anchor="middle">пути</text>
<text x="648.0" y="280.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">свет, ушедший</text>
<text x="648.0" y="297.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">в стенку, 2004</text>
<line x1="28.0" y1="318.0" x2="736.0" y2="318.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="349.0" font-size="14" fill="#0b0b0b" font-weight="600">космология</text>
<text x="40.0" y="366.0" font-size="11" fill="#8a8985">с 1973 года</text>
<text x="299.0" y="348.5" font-size="12" fill="#0b0b0b" text-anchor="middle">Вселенная, пригодная</text>
<text x="299.0" y="365.5" font-size="12" fill="#0b0b0b" text-anchor="middle">для наблюдателей</text>
<text x="468.0" y="348.5" font-size="12" fill="#0b0b0b" text-anchor="middle">тот, кто оказался на месте</text>
<text x="468.0" y="365.5" font-size="12" fill="#0b0b0b" text-anchor="middle">и задал вопрос</text>
<text x="648.0" y="348.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">на встрече выпускников</text>
<text x="648.0" y="365.5" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">все живы</text>
<line x1="28.0" y1="386.0" x2="736.0" y2="386.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="410.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">В каждой строке слово можно вынуть и поставить вещь, и ни одна формула не изменится.</tspan><tspan x="28.0" dy="14.4">Строки — прочтение этого вечера: Эйнштейн (1905), Люенбергер (1964), Цее (1970), Картер (1973).</tspan></text>
</svg>
