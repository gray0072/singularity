<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Писк, которого мы не слышим</title>

<rect x="0.5" y="0.5" width="759" height="389" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Писк, которого мы не слышим</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Частота звука, шкала логарифмическая. Наш слух кончается примерно на 20 килогерцах.</text>
<line x1="200.0" y1="100.0" x2="200.0" y2="324.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="200.0" y="342.0" font-size="11.5" fill="#8a8985" text-anchor="middle">20 Гц</text>
<line x1="298.3" y1="100.0" x2="298.3" y2="324.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="298.3" y="342.0" font-size="11.5" fill="#8a8985" text-anchor="middle">100 Гц</text>
<line x1="438.8" y1="100.0" x2="438.8" y2="324.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="438.8" y="342.0" font-size="11.5" fill="#8a8985" text-anchor="middle">1 кГц</text>
<line x1="579.4" y1="100.0" x2="579.4" y2="324.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="579.4" y="342.0" font-size="11.5" fill="#8a8985" text-anchor="middle">10 кГц</text>
<line x1="720.0" y1="100.0" x2="720.0" y2="324.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="720.0" y="342.0" font-size="11.5" fill="#8a8985" text-anchor="middle">100 кГц</text>
<line x1="621.7" y1="90.0" x2="621.7" y2="324.0" stroke="#e34948" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="613.7" y="96.0" font-size="12" fill="#e34948" text-anchor="end">здесь кончается наш слух</text>
<text x="186.0" y="131.0" font-size="13" fill="#0b0b0b" text-anchor="end">слух человека</text>
<text x="186.0" y="167.0" font-size="13" fill="#0b0b0b" text-anchor="end"><tspan x="186.0" dy="0.0">смех человека,</tspan><tspan x="186.0" dy="16.2">основной тон</tspan></text>
<text x="186.0" y="219.0" font-size="13" fill="#0b0b0b" text-anchor="end">слух крысы</text>
<text x="186.0" y="263.0" font-size="13" fill="#0b0b0b" text-anchor="end">тревожный крик крысы</text>
<text x="186.0" y="299.0" font-size="13" fill="#0b0b0b" text-anchor="end"><tspan x="186.0" dy="0.0">писк крысы в игре</tspan><tspan x="186.0" dy="16.2">и при щекотке</tspan></text>
<rect x="200.0" y="115.0" width="421.7" height="22.0" rx="3" fill="#1baf7a" fill-opacity="0.85"/>
<text x="631.7" y="130.5" font-size="12.5" fill="#0b0b0b" font-weight="600">20 Гц – 20 кГц</text>
<rect x="354.2" y="159.0" width="42.3" height="22.0" rx="3" fill="#1baf7a" fill-opacity="0.85"/>
<text x="406.5" y="174.5" font-size="12.5" fill="#0b0b0b" font-weight="600">несколько сотен герц</text>
<rect x="354.2" y="203.0" width="352.2" height="22.0" rx="3" fill="#2a78d6" fill-opacity="0.85"/>
<text x="366.2" y="218.5" font-size="12.5" fill="#ffffff" font-weight="600">примерно 250 Гц – 80 кГц</text>
<circle cx="627.6" cy="258.0" r="7.0" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="613.6" y="262.5" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">около 22 кГц</text>
<circle cx="677.7" cy="302.0" r="7.0" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="663.7" y="306.5" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">около 50 кГц</text>
<line x1="200.0" y1="100.0" x2="200.0" y2="324.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="374.0" font-size="11.5" fill="#8a8985">Цифры округлены; границы слуха приблизительны. Звуки крыс: Панксепп и Бургдорф (2003).</text>
</svg>
