<rect x="221.6" y="172.9" width="28.0" height="22.0" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="2.2"/>
<circle cx="230.6" cy="167.9" r="6.0" fill="#eb6834"/>
<text x="94.4" y="222.1" font-size="12.5" fill="#008300" text-anchor="middle" font-weight="600">ходит</text>
<text x="239.6" y="213.9" font-size="12.5" fill="#eb6834" text-anchor="middle" font-weight="600"><tspan x="239.6" dy="0.0">едет</tspan><tspan x="239.6" dy="15.6">в корзинке</tspan></text>
<text x="168.0" y="358.0" font-size="11.5" fill="#8a8985" text-anchor="middle">барабан с полосатыми стенками</text>
<text x="566.0" y="104.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">ходил</text>
<text x="668.0" y="104.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600">возили</text>
<line x1="336.0" y1="120.0" x2="732.0" y2="120.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="340.0" y="145.0" font-size="12.5" fill="#0b0b0b"><tspan x="340.0" dy="0.0">вытягивает лапы</tspan><tspan x="340.0" dy="15.6">навстречу поверхности</tspan></text>
<text x="566.0" y="153.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">все 8</text>
<text x="668.0" y="153.0" font-size="13" fill="#e34948" text-anchor="middle" font-weight="600">ни один из 8</text>
<line x1="336.0" y1="178.0" x2="732.0" y2="178.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="340.0" y="203.0" font-size="12.5" fill="#0b0b0b"><tspan x="340.0" dy="0.0">моргает на руку,</tspan><tspan x="340.0" dy="15.6">летящую к морде</tspan></text>
<text x="566.0" y="211.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">да</text>
<text x="668.0" y="211.0" font-size="13" fill="#e34948" text-anchor="middle" font-weight="600">нет</text>
<line x1="336.0" y1="236.0" x2="732.0" y2="236.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="340.0" y="261.0" font-size="12.5" fill="#0b0b0b"><tspan x="340.0" dy="0.0">сходит со стекла над обрывом</tspan><tspan x="340.0" dy="15.6">на мелкую сторону</tspan></text>
<text x="566.0" y="269.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">12 раз из 12</text>
<text x="668.0" y="269.0" font-size="13" fill="#e34948" text-anchor="middle" font-weight="600">от 4 до 8 из 12</text>
<line x1="336.0" y1="294.0" x2="732.0" y2="294.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="388.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="28.0" dy="0.0">Котята, которых возили, слепыми не были: зрачок сужался, глаз следил за рукой.</tspan><tspan x="28.0" dy="15.6">После двух суток свободной беготни в освещённой комнате они прошли те же проверки.</tspan></text>
<text x="28.0" y="432.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Хелд и Хайн (1963): восемь пар выращены в темноте до 8–12 недель, затем по три часа в день в установке,</tspan><tspan x="28.0" dy="14.4">всего от 9 до 63 часов (в среднем около 30); пару проверяли, когда ходивший котёнок впервые вытягивал лапы.</tspan></text>
</svg>
