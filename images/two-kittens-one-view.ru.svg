<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Два котёнка, одна картина</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Карусель 1963 года, вид сверху: один котёнок ходит, другого возят, и оба видят одни и те же полосы.</text>
