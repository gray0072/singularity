<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Arithmetic on the knee: the price of everything written</title>

<rect x="0.5" y="0.5" width="759" height="371" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Arithmetic on the knee: the price of everything written</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Billions of dollars. The scale is linear.</text>
<text x="236.0" y="106.0" font-size="12.5" fill="#0b0b0b" text-anchor="end"><tspan x="236.0" dy="0.0">every book ever counted,</tspan><tspan x="236.0" dy="15.6">at the rate of the settlement</tspan></text>
<rect x="250.0" y="94.0" width="249.0" height="30.0" rx="2" fill="#eb6834" fill-opacity="0.9"/>
<text x="262.0" y="114.0" font-size="13" fill="#ffffff" font-weight="600">390: 129.9 million books × 3,000 dollars</text>
<text x="236.0" y="164.0" font-size="12.5" fill="#0b0b0b" text-anchor="end"><tspan x="236.0" dy="0.0">data centres and chips,</tspan><tspan x="236.0" dy="15.6">four companies, 2025</tspan></text>
<rect x="250.0" y="152.0" width="263.6" height="30.0" rx="2" fill="#8a8985" fill-opacity="0.9"/>
<text x="262.0" y="172.0" font-size="13" fill="#ffffff" font-weight="600">about 413</text>
<text x="236.0" y="222.0" font-size="12.5" fill="#0b0b0b" text-anchor="end"><tspan x="236.0" dy="0.0">the same four,</tspan><tspan x="236.0" dy="15.6">the plan for 2026</tspan></text>
<rect x="250.0" y="210.0" width="466.0" height="30.0" rx="2" fill="#8a8985" fill-opacity="0.9"/>
<text x="262.0" y="230.0" font-size="13" fill="#ffffff" font-weight="600">about 730</text>
<line x1="250.0" y1="86.0" x2="250.0" y2="252.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="278.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="28.0" dy="0.0">Paid once. And the 3,000 dollars is not a price for learning: it is what the settlement paid</tspan><tspan x="28.0" dy="15.6">for a copy taken without paying. The court called the learning itself fair use.</tspan></text>
<text x="28.0" y="332.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Google Books (2010: 129,864,880 books, counted by editions); the settlement in Bartz v. Anthropic (approved in July</tspan><tspan x="28.0" dy="14.4">2026); the reports of Amazon, Alphabet, Microsoft and Meta of October 2026 (capital spending; the bases differ).</tspan></text>
</svg>
