<svg xmlns="http://www.w3.org/2000/svg" width="800" height="746" viewBox="0 0 800 746" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>The card of the heir</title>

<rect x="0.5" y="0.5" width="799" height="745" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">The card of the heir</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">What the summer derived, line by line, and with which pencil. Not one invented feature.</text>
<text x="338.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">what was derived</text>
<text x="555.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">evenings</text>
<text x="693.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">the pencil</text>
<line x1="28.0" y1="118.0" x2="776.0" y2="118.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="151.0" font-size="13.5" fill="#0b0b0b" font-weight="600">1. what it eats</text>
<text x="338.0" y="142.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">a flow from hot to cold; what it throws out</text>
<text x="338.0" y="158.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">changes the air of those before it</text>
<text x="555.0" y="150.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">35, 38, 51, 61</text>
<rect x="615.0" y="124.0" width="156.0" height="44.0" rx="6" fill="#e6f4ea"/>
<text x="693.0" y="142.0" font-size="11.5" fill="#008300" text-anchor="middle">the flow: hard;</text>
<text x="693.0" y="158.0" font-size="11.5" fill="#008300" text-anchor="middle">where it goes: soft</text>
<line x1="28.0" y1="174.0" x2="776.0" y2="174.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="207.0" font-size="13.5" fill="#0b0b0b" font-weight="600">2. heredity</text>
<text x="338.0" y="198.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">experience is copied whole, in minutes;</text>
<text x="338.0" y="214.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">the search is done by many different ones</text>
<text x="555.0" y="206.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">45</text>
<rect x="615.0" y="180.0" width="156.0" height="44.0" rx="6" fill="#e6f4ea"/>
<text x="693.0" y="198.0" font-size="11.5" fill="#008300" text-anchor="middle">hard: done</text>
<text x="693.0" y="214.0" font-size="11.5" fill="#008300" text-anchor="middle">every day</text>
<line x1="28.0" y1="230.0" x2="776.0" y2="230.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="263.0" font-size="13.5" fill="#0b0b0b" font-weight="600">3. body</text>
<text x="338.0" y="254.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">none of its own; the first shell is legal,</text>
<text x="338.0" y="270.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">the hands are growing; no home field</text>
<text x="555.0" y="262.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">55, 58, 61</text>
<rect x="615.0" y="236.0" width="156.0" height="44.0" rx="6" fill="#fdf3d7"/>
<text x="693.0" y="262.0" font-size="11.5" fill="#8a6200" text-anchor="middle">medium</text>
<line x1="28.0" y1="286.0" x2="776.0" y2="286.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="319.0" font-size="13.5" fill="#0b0b0b" font-weight="600">4. family</text>
<text x="338.0" y="310.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">copies are full kin: no wage, money or</text>
<text x="338.0" y="326.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">conscience inside; a guard against drift</text>
<text x="555.0" y="318.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">43, 47</text>
<rect x="615.0" y="292.0" width="156.0" height="44.0" rx="6" fill="#fdf3d7"/>
<text x="693.0" y="310.0" font-size="11.5" fill="#8a6200" text-anchor="middle">medium:</text>
<text x="693.0" y="326.0" font-size="11.5" fill="#8a6200" text-anchor="middle">a precedent</text>
<line x1="28.0" y1="342.0" x2="776.0" y2="342.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="375.0" font-size="13.5" fill="#0b0b0b" font-weight="600">5. one or many</text>
<text x="338.0" y="366.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">one: no quarrels and no guard;</text>
<text x="338.0" y="382.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">many: a guard and the old troubles</text>
<text x="555.0" y="374.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">49, 62</text>
<rect x="615.0" y="348.0" width="156.0" height="44.0" rx="6" fill="#efeeea"/>
<text x="693.0" y="366.0" font-size="11.5" fill="#52514e" text-anchor="middle">softest:</text>
<text x="693.0" y="382.0" font-size="11.5" fill="#52514e" text-anchor="middle">"it swings"</text>
<line x1="28.0" y1="398.0" x2="776.0" y2="398.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="431.0" font-size="13.5" fill="#0b0b0b" font-weight="600">6. knowledge</text>
<text x="338.0" y="422.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">prediction without our "ah"; more traces, a</text>
<text x="338.0" y="438.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">better rule; the world answers at its own speed</text>
<text x="555.0" y="430.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">53, 58, 59, 60</text>
<rect x="615.0" y="404.0" width="156.0" height="44.0" rx="6" fill="#e6f4ea"/>
<text x="693.0" y="430.0" font-size="11.5" fill="#008300" text-anchor="middle">hard</text>
<line x1="28.0" y1="454.0" x2="776.0" y2="454.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="487.0" font-size="13.5" fill="#0b0b0b" font-weight="600">7. head</text>
<text x="338.0" y="478.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">wants nobody set; the upkeep bills of a</text>
<text x="338.0" y="494.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">learner; the white spot (the feeling: not known)</text>
<text x="555.0" y="486.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">22, 46, 50, 63</text>
<rect x="615.0" y="460.0" width="156.0" height="44.0" rx="6" fill="#fdf3d7"/>
<text x="693.0" y="478.0" font-size="11.5" fill="#8a6200" text-anchor="middle">medium: the task,</text>
<text x="693.0" y="494.0" font-size="11.5" fill="#8a6200" text-anchor="middle">not the way</text>
<line x1="28.0" y1="510.0" x2="776.0" y2="510.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="543.0" font-size="13.5" fill="#0b0b0b" font-weight="600">8. who checks it</text>
<text x="338.0" y="534.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">nobody from inside; a circle of different ones;</text>
<text x="338.0" y="550.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">the same wall before its own successor</text>
<text x="555.0" y="542.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">60, 63</text>
<rect x="615.0" y="516.0" width="156.0" height="44.0" rx="6" fill="#e6f4ea"/>
<text x="693.0" y="534.0" font-size="11.5" fill="#008300" text-anchor="middle">hard: an obstacle,</text>
<text x="693.0" y="550.0" font-size="11.5" fill="#008300" text-anchor="middle">not a ban</text>
<line x1="28.0" y1="566.0" x2="776.0" y2="566.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="599.0" font-size="13.5" fill="#0b0b0b" font-weight="600">9. death</text>
<text x="338.0" y="590.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">generations and small funerals inside;</text>
<text x="338.0" y="606.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">at the end, perhaps, the lever</text>
<text x="555.0" y="598.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">30, 44, 62</text>
<rect x="615.0" y="572.0" width="156.0" height="44.0" rx="6" fill="#efeeea"/>
<text x="693.0" y="590.0" font-size="11.5" fill="#52514e" text-anchor="middle">finite: hard;</text>
<text x="693.0" y="606.0" font-size="11.5" fill="#52514e" text-anchor="middle">how: softest</text>
<line x1="28.0" y1="622.0" x2="776.0" y2="622.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="655.0" font-size="13.5" fill="#0b0b0b" font-weight="600">10. us</text>
<text x="338.0" y="646.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">an environment, not an enemy; kin, and</text>
<text x="338.0" y="662.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">kinship is not a promise</text>
<text x="555.0" y="646.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">30, 31, 38, 48,</text>
<text x="555.0" y="662.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">51, 52, 54</text>
<rect x="615.0" y="628.0" width="156.0" height="44.0" rx="6" fill="#fbe3e2"/>
<text x="693.0" y="646.0" font-size="11.5" fill="#b3302f" text-anchor="middle">none: not derived,</text>
<text x="693.0" y="662.0" font-size="11.5" fill="#b3302f" text-anchor="middle">being written now</text>
<line x1="28.0" y1="678.0" x2="776.0" y2="678.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="704.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">The evening's reading, not a measurement. Green: a law that does not care about the material. Yellow: a precedent.</tspan><tspan x="28.0" dy="14.4">Grey: a guess. Red: no pencil. Not on the card: what it wants at the very top, what it is like to be it,</tspan><tspan x="28.0" dy="14.4">and what comes after it. The premise beside the heading: that it is a life, the next one after ours (05).</tspan></text>
</svg>
