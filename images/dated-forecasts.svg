<text x="434.0" y="424.0" font-size="11.5" fill="#0b0b0b"><tspan x="434.0" dy="0.0">world below 2.1</tspan><tspan x="434.0" dy="14.4">(UN expects ≈ 2050) · 2:1</tspan></text>
<circle cx="608.0" cy="420.0" r="3.5" fill="#4a3aa7"/>
<text x="618.0" y="424.0" font-size="11.5" fill="#0b0b0b"><tspan x="618.0" dy="0.0">under 45 M added a year</tspan><tspan x="618.0" dy="14.4">(UN: ≈ 55 M) · 2:1</tspan></text>
<rect x="28.0" y="460.0" width="752.0" height="58.0" rx="4" fill="#f1f0ec"/>
<text x="36.0" y="479.0" font-size="12.5" fill="#0b0b0b" font-weight="600">Law and the race</text>
<circle cx="240.0" cy="478.0" r="3.5" fill="#2a78d6"/>
<text x="250.0" y="482.0" font-size="11.5" fill="#0b0b0b"><tspan x="250.0" dy="0.0">no signatory stops</tspan><tspan x="250.0" dy="14.4">of its own will · 9:1</tspan></text>
<circle cx="424.0" cy="478.0" r="3.5" fill="#eb6834"/>
<text x="434.0" y="482.0" font-size="11.5" fill="#0b0b0b"><tspan x="434.0" dy="0.0">basic payment in a</tspan><tspan x="434.0" dy="14.4">rich country · 1 in 2</tspan></text>
<text x="36.0" y="537.0" font-size="12.5" fill="#0b0b0b" font-weight="600">Mind and the sky</text>
<circle cx="424.0" cy="536.0" r="3.5" fill="#eb6834"/>
<text x="434.0" y="540.0" font-size="11.5" fill="#0b0b0b"><tspan x="434.0" dy="0.0">a Millennium Problem</tspan><tspan x="434.0" dy="14.4">solved by a machine · 1 in 2</tspan></text>
<circle cx="608.0" cy="536.0" r="3.5" fill="#4a3aa7"/>
<text x="618.0" y="540.0" font-size="11.5" fill="#0b0b0b"><tspan x="618.0" dy="0.0">no signal from the sky,</tspan><tspan x="618.0" dy="14.4">no war of machines · 9:1</tspan></text>
<text x="28.0" y="602.0" font-size="11.5" fill="#52514e" font-style="italic">Not on the list: the dates of steps six and seven (articles 27, 30). A crash of AI shares before 2031: 1 in 2.</text>
