<text x="250.0" y="366.0" font-size="11.5" fill="#0b0b0b"><tspan x="250.0" dy="0.0">over 8 M industrial</tspan><tspan x="250.0" dy="14.4">robots at work</tspan></text>
<circle cx="424.0" cy="362.0" r="3.5" fill="#eb6834"/>
<text x="434.0" y="366.0" font-size="11.5" fill="#0b0b0b"><tspan x="434.0" dy="0.0">1 M general-purpose</tspan><tspan x="434.0" dy="14.4">robots a year · 2:1</tspan></text>
<circle cx="608.0" cy="362.0" r="3.5" fill="#4a3aa7"/>
<text x="618.0" y="366.0" font-size="11.5" fill="#0b0b0b"><tspan x="618.0" dy="0.0">a data centre built</tspan><tspan x="618.0" dy="14.4">without workers · 1 in 2</tspan></text>
<text x="36.0" y="421.0" font-size="12.5" fill="#0b0b0b" font-weight="600">Births</text>
<text x="36.0" y="453.0" font-size="10.5" fill="#52514e" font-style="italic">2.25 per woman (2024)</text>
