<text x="250.0" y="250.0" font-size="11.5" fill="#0b0b0b"><tspan x="250.0" dy="0.0">below 6.5%: a glacier,</tspan><tspan x="250.0" dy="14.4">not an avalanche · 3:1</tspan></text>
<text x="36.0" y="305.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="36.0" dy="0.0">Electricity of</tspan><tspan x="36.0" dy="15.6">data centres</tspan></text>
<text x="36.0" y="337.0" font-size="10.5" fill="#52514e" font-style="italic">415 TWh (2024)</text>
