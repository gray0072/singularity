<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Two mistakes and their prices</title>

<rect x="0.5" y="0.5" width="759" height="399" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Two mistakes and their prices</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Something rustles in the grass. The four squares Andrey drew in the ash.</text>
<text x="329.0" y="111.0" font-size="13.5" fill="#52514e" text-anchor="middle" font-weight="600">it was the wind</text>
<text x="595.0" y="111.0" font-size="13.5" fill="#52514e" text-anchor="middle" font-weight="600">it was a snake</text>
<text x="180.0" y="171.0" font-size="13.5" fill="#52514e" text-anchor="end" font-weight="600">jumped away</text>
<rect x="201.0" y="129.0" width="256.0" height="74.0" rx="8" fill="#eb6834" stroke="#eb6834" stroke-width="1.2" fill-opacity="0.14"/>
<text x="329.0" y="161.0" font-size="15.5" fill="#eb6834" text-anchor="middle" font-weight="700">a false alarm</text>
<text x="329.0" y="183.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">a minute lost</text>
<rect x="467.0" y="129.0" width="256.0" height="74.0" rx="8" fill="#1baf7a" stroke="#1baf7a" stroke-width="1.2" fill-opacity="0.07"/>
<text x="595.0" y="161.0" font-size="13" fill="#52514e" text-anchor="middle">right</text>
<text x="595.0" y="183.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle">alive</text>
<text x="180.0" y="255.0" font-size="13.5" fill="#52514e" text-anchor="end" font-weight="600">stayed</text>
<rect x="201.0" y="213.0" width="256.0" height="74.0" rx="8" fill="#1baf7a" stroke="#1baf7a" stroke-width="1.2" fill-opacity="0.07"/>
<text x="329.0" y="245.0" font-size="13" fill="#52514e" text-anchor="middle">right</text>
<text x="329.0" y="267.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle">nothing lost</text>
<rect x="467.0" y="213.0" width="256.0" height="74.0" rx="8" fill="#e34948" stroke="#e34948" stroke-width="1.2" fill-opacity="0.14"/>
<text x="595.0" y="245.0" font-size="15.5" fill="#e34948" text-anchor="middle" font-weight="700">a miss</text>
<text x="595.0" y="267.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">a life lost</text>
<text x="28.0" y="326.0" font-size="13" fill="#0b0b0b" font-weight="600"><tspan x="28.0" dy="0.0">If a life is worth 100,000 such minutes, it pays to jump</tspan><tspan x="28.0" dy="16.2">even when only one rustle in 10,000 is a snake.</tspan></text>
<text x="28.0" y="384.0" font-size="11.5" fill="#8a8985">A scheme. The smoke detector principle: Nesse (2001). Selection for links that are not there: Foster &amp; Kokko (2009).</text>
</svg>
