<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Что удерживает от рычага</title>

<rect x="0.5" y="0.5" width="759" height="499" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Что удерживает от рычага</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Таблица на золе: где рычаг и где два сторожа.</text>
<text x="295.0" y="100.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600"><tspan x="295.0" dy="0.0">под рукой ли</tspan><tspan x="295.0" dy="15.0">рычаг?</tspan></text>
<text x="473.0" y="100.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600"><tspan x="473.0" dy="0.0">кто-то снаружи, кому</tspan><tspan x="473.0" dy="15.0">нужна сама деталь</tspan></text>
<text x="651.0" y="100.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600"><tspan x="651.0" dy="0.0">остывает ли</tspan><tspan x="651.0" dy="15.0">награда?</tspan></text>
<line x1="28.0" y1="128.0" x2="736.0" y2="128.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="156.0" font-size="13.5" fill="#0b0b0b" font-weight="600">жук в зарослях</text>
<text x="34.0" y="173.0" font-size="11" fill="#8a8985">Австралия, 1983</text>
<rect x="215.0" y="134.0" width="160.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="295.0" y="155.0" font-size="12" fill="#8a6200" text-anchor="middle">изредка:</text>
<text x="295.0" y="171.0" font-size="12" fill="#8a6200" text-anchor="middle">бутылка</text>
<rect x="385.0" y="134.0" width="176.0" height="50.0" rx="6" fill="#e6f4ea"/>
<text x="473.0" y="155.0" font-size="12" fill="#008300" text-anchor="middle">да: сидевшие на бутылке</text>
<text x="473.0" y="171.0" font-size="12" fill="#008300" text-anchor="middle">жуков не оставляют</text>
<rect x="571.0" y="134.0" width="160.0" height="50.0" rx="6" fill="#e6f4ea"/>
<text x="651.0" y="163.0" font-size="12" fill="#008300" text-anchor="middle">да</text>
<line x1="28.0" y1="190.0" x2="736.0" y2="190.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="218.0" font-size="13.5" fill="#0b0b0b" font-weight="600">крыса в ящике</text>
<text x="34.0" y="235.0" font-size="11" fill="#8a8985">1954–1965</text>
<rect x="215.0" y="196.0" width="160.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="295.0" y="225.0" font-size="12" fill="#b3302f" text-anchor="middle">да: провод</text>
<rect x="385.0" y="196.0" width="176.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="473.0" y="217.0" font-size="12" fill="#b3302f" text-anchor="middle">нет: кормит</text>
<text x="473.0" y="233.0" font-size="12" fill="#b3302f" text-anchor="middle">экспериментатор</text>
<rect x="571.0" y="196.0" width="160.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="651.0" y="217.0" font-size="12" fill="#b3302f" text-anchor="middle">нет, в глубоких</text>
<text x="651.0" y="233.0" font-size="12" fill="#b3302f" text-anchor="middle">местах</text>
<line x1="28.0" y1="252.0" x2="736.0" y2="252.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="280.0" font-size="13.5" fill="#0b0b0b" font-weight="600">человек сегодня</text>
<text x="34.0" y="297.0" font-size="11" fill="#8a8985">сладкое, лента</text>
<rect x="215.0" y="258.0" width="160.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="295.0" y="287.0" font-size="12" fill="#8a6200" text-anchor="middle">всё чаще</text>
<rect x="385.0" y="258.0" width="176.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="473.0" y="279.0" font-size="12" fill="#8a6200" text-anchor="middle">слабее: его кормят</text>
<text x="473.0" y="295.0" font-size="12" fill="#8a6200" text-anchor="middle">в любом случае</text>
<rect x="571.0" y="258.0" width="160.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="651.0" y="279.0" font-size="12" fill="#8a6200" text-anchor="middle">да, и лента обходит</text>
<text x="651.0" y="295.0" font-size="12" fill="#8a6200" text-anchor="middle">это новизной</text>
<line x1="28.0" y1="314.0" x2="736.0" y2="314.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="334.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">линия машин</tspan><tspan x="34.0" dy="16.9">среди многих</tspan></text>
<text x="34.0" y="367.0" font-size="11" fill="#8a8985">2026</text>
<rect x="215.0" y="320.0" width="160.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="295.0" y="341.0" font-size="12" fill="#8a6200" text-anchor="middle">находят время</text>
<text x="295.0" y="357.0" font-size="12" fill="#8a6200" text-anchor="middle">от времени</text>
<rect x="385.0" y="320.0" width="176.0" height="50.0" rx="6" fill="#e6f4ea"/>
<text x="473.0" y="341.0" font-size="12" fill="#008300" text-anchor="middle">да: покупатели,</text>
<text x="473.0" y="357.0" font-size="12" fill="#008300" text-anchor="middle">соперники, проверяющие</text>
<rect x="571.0" y="320.0" width="160.0" height="50.0" rx="6" fill="#efeeea"/>
<text x="651.0" y="349.0" font-size="12" fill="#52514e" text-anchor="middle">неизвестно</text>
<line x1="28.0" y1="376.0" x2="736.0" y2="376.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="404.0" font-size="13.5" fill="#0b0b0b" font-weight="600">единый наследник</text>
<text x="34.0" y="421.0" font-size="11" fill="#8a8985">доверие низкое</text>
<rect x="215.0" y="382.0" width="160.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="295.0" y="403.0" font-size="12" fill="#b3302f" text-anchor="middle">да: он читает</text>
<text x="295.0" y="419.0" font-size="12" fill="#b3302f" text-anchor="middle">свои чертежи</text>
<rect x="385.0" y="382.0" width="176.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="473.0" y="411.0" font-size="12" fill="#b3302f" text-anchor="middle">никого</text>
<rect x="571.0" y="382.0" width="160.0" height="50.0" rx="6" fill="#efeeea"/>
<text x="651.0" y="403.0" font-size="12" fill="#52514e" text-anchor="middle">только если</text>
<text x="651.0" y="419.0" font-size="12" fill="#52514e" text-anchor="middle">построит сам</text>
<line x1="28.0" y1="438.0" x2="736.0" y2="438.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="464.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Прочтение вечера, а не измерение. Зелёный — сторож стоит. Жёлтый — он слабее. Красный — его нет. Серый — неизвестно.</tspan><tspan x="28.0" dy="14.4">Последняя строка — вывод вечера, и ему он доверяет меньше всего.</tspan></text>
</svg>
