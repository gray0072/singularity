<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>After a star dies</title>

<rect x="0.5" y="0.5" width="759" height="449" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">After a star dies</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Papers in the field of an eminent scientist, before and after an early death. Before the death = 100.</text>
<line x1="86.0" y1="316.0" x2="716.0" y2="316.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="76.0" y="320.0" font-size="11.5" fill="#52514e" text-anchor="end">60</text>
<line x1="86.0" y1="244.0" x2="716.0" y2="244.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="76.0" y="248.0" font-size="11.5" fill="#52514e" text-anchor="end">80</text>
<line x1="86.0" y1="172.0" x2="716.0" y2="172.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="76.0" y="176.0" font-size="11.5" fill="#52514e" text-anchor="end">100</text>
<line x1="86.0" y1="100.0" x2="716.0" y2="100.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="76.0" y="104.0" font-size="11.5" fill="#52514e" text-anchor="end">120</text>
<text x="134.5" y="336.0" font-size="11.5" fill="#52514e" text-anchor="middle">-4</text>
<text x="231.4" y="336.0" font-size="11.5" fill="#52514e" text-anchor="middle">-2</text>
<text x="328.3" y="336.0" font-size="11.5" fill="#52514e" text-anchor="middle">0</text>
<text x="425.2" y="336.0" font-size="11.5" fill="#52514e" text-anchor="middle">+2</text>
<text x="522.2" y="336.0" font-size="11.5" fill="#52514e" text-anchor="middle">+4</text>
<text x="619.1" y="336.0" font-size="11.5" fill="#52514e" text-anchor="middle">+6</text>
<text x="716.0" y="336.0" font-size="11.5" fill="#52514e" text-anchor="middle">+8</text>
<text x="716.0" y="356.0" font-size="11.5" fill="#8a8985" text-anchor="end">years</text>
<line x1="328.3" y1="94.0" x2="328.3" y2="316.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="320.3" y="306.0" font-size="12" fill="#52514e" text-anchor="end">the death</text>
<path d="M86.0,172.0 L134.5,172.0 L182.9,172.0 L231.4,172.0 L279.8,172.0 L328.3,172.0 L376.8,197.2 L425.2,222.4 L473.7,240.4 L522.2,251.2 L570.6,258.4 L619.1,262.0 L667.5,265.6 L716.0,265.6" stroke="#eb6834" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="716.0" cy="265.6" r="4.6" fill="#eb6834"/>
<path d="M86.0,172.0 L134.5,172.0 L182.9,172.0 L231.4,172.0 L279.8,172.0 L328.3,172.0 L376.8,164.8 L425.2,157.6 L473.7,150.4 L522.2,146.8 L570.6,143.2 L619.1,141.4 L667.5,139.6 L716.0,139.6" stroke="#2a78d6" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="716.0" cy="139.6" r="4.6" fill="#2a78d6"/>
<text x="716.0" y="107.2" font-size="12.5" fill="#2a78d6" text-anchor="end" font-weight="600"><tspan x="716.0" dy="0.0">those who never wrote with the star: about a twelfth more,</tspan><tspan x="716.0" dy="15.6">and these are the papers cited most later</tspan></text>
<text x="716.0" y="294.4" font-size="12.5" fill="#eb6834" text-anchor="end" font-weight="600">those who wrote with the star: markedly fewer papers</text>
<text x="28.0" y="380.0" font-size="12.5" fill="#0b0b0b"><tspan x="28.0" dy="0.0">452 eminent American life scientists who died in the middle of their work. The strangers were</tspan><tspan x="28.0" dy="15.6">mostly not driven away while the star lived: they did not come.</tspan></text>
<text x="28.0" y="434.0" font-size="11.5" fill="#8a8985">A scheme after Azoulay, Fons-Rosen and Graff Zivin (2019): the shape of the result, not the data points.</text>
</svg>
