<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Three things in one banknote</title>

<rect x="0.5" y="0.5" width="759" height="399" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Three things in one banknote</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">What a banknote holds, what each thing rests on, and what happens when that is gone.</text>
<rect x="28.0" y="274.0" width="708.0" height="76.0" rx="0" fill="#1baf7a" fill-opacity="0.1"/>
<text x="335.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">what it rests on</text>
<text x="588.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">when that is gone</text>
<line x1="28.0" y1="122.0" x2="736.0" y2="122.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="148.0" font-size="15" fill="#0b0b0b" font-weight="600">the record</text>
<text x="40.0" y="167.0" font-size="11.5" fill="#52514e" font-style="italic"><tspan x="40.0" dy="0.0">“the bearer has given and</tspan><tspan x="40.0" dy="14.4">has not yet received”</tspan></text>
<text x="335.0" y="157.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="335.0" dy="0.0">strangers: no kinship,</tspan><tspan x="335.0" dy="16.2">no common book</tspan></text>
<text x="588.0" y="157.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="588.0" dy="0.0">the record is not needed: a family,</tspan><tspan x="588.0" dy="16.2">a firm inside, a body, copies of a machine</tspan></text>
<line x1="28.0" y1="198.0" x2="736.0" y2="198.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="224.0" font-size="15" fill="#0b0b0b" font-weight="600">its value</text>
<text x="40.0" y="243.0" font-size="11.5" fill="#52514e" font-style="italic"><tspan x="40.0" dy="0.0">somebody will give</tspan><tspan x="40.0" dy="14.4">something for it</tspan></text>
<text x="335.0" y="233.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="335.0" dy="0.0">people's need</tspan><tspan x="335.0" dy="16.2">for one another</tspan></text>
<text x="588.0" y="233.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="588.0" dy="0.0">the record is worth nothing: whoever</tspan><tspan x="588.0" dy="16.2">nobody needs cannot earn it</tspan></text>
<line x1="28.0" y1="274.0" x2="736.0" y2="274.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="300.0" font-size="15" fill="#0b0b0b" font-weight="600">the measure</text>
<text x="40.0" y="319.0" font-size="11.5" fill="#52514e" font-style="italic"><tspan x="40.0" dy="0.0">how much of everything</tspan><tspan x="40.0" dy="14.4">else must be given up</tspan></text>
<text x="335.0" y="309.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="335.0" dy="0.0">something is short and</tspan><tspan x="335.0" dy="16.2">has more than one use</tspan></text>
<text x="588.0" y="309.0" font-size="13" fill="#1baf7a" text-anchor="middle" font-weight="600"><tspan x="588.0" dy="0.0">never gone: the number falls out of the</tspan><tspan x="588.0" dy="16.2">task with no bazaar; an account in kind</tspan></text>
<line x1="28.0" y1="350.0" x2="736.0" y2="350.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="376.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Row 2 is the author's definition of 2017. Row 3 is Kantorovich's valuations; that the measure</tspan><tspan x="28.0" dy="14.4">is all the heir keeps of money is Andrey's reading.</tspan></text>
</svg>
