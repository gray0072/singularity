<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>How long one thought takes to cross a mind</title>

<rect x="0.5" y="0.5" width="759" height="299" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">How long one thought takes to cross a mind</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Seconds, logarithmic scale. The bigger the mind, the slower it thinks as a whole.</text>
<line x1="322.2" y1="88.0" x2="322.2" y2="262.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="322.2" y="280.0" font-size="11" fill="#52514e" text-anchor="middle">1 ms</text>
<line x1="388.9" y1="88.0" x2="388.9" y2="262.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="388.9" y="280.0" font-size="11" fill="#52514e" text-anchor="middle">1 s</text>
<line x1="467.9" y1="88.0" x2="467.9" y2="262.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="467.9" y="280.0" font-size="11" fill="#52514e" text-anchor="middle">1 hour</text>
<line x1="555.5" y1="88.0" x2="555.5" y2="262.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="555.5" y="280.0" font-size="11" fill="#52514e" text-anchor="middle">1 year</text>
<line x1="622.2" y1="88.0" x2="622.2" y2="262.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="622.2" y="280.0" font-size="11" fill="#52514e" text-anchor="middle">1,000 years</text>
<line x1="688.9" y1="88.0" x2="688.9" y2="262.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="688.9" y="280.0" font-size="11" fill="#52514e" text-anchor="middle">1 million years</text>
<text x="288.0" y="111.0" font-size="13" fill="#0b0b0b" text-anchor="end">A human brain, 15 cm, nerves</text>
<rect x="300.0" y="96.0" width="26.1" height="22.0" rx="4" fill="#eb6834"/>
<text x="334.1" y="112.0" font-size="12.5" fill="#0b0b0b" font-weight="600">≈ 1.5 ms</text>
<text x="288.0" y="153.0" font-size="13" fill="#0b0b0b" text-anchor="end">A mind the size of the Earth, fibre</text>
<rect x="300.0" y="138.0" width="66.7" height="22.0" rx="4" fill="#2a78d6"/>
<text x="374.7" y="154.0" font-size="12.5" fill="#0b0b0b" font-weight="600">≈ 0.1 s</text>
<text x="288.0" y="195.0" font-size="13" fill="#0b0b0b" text-anchor="end">The Solar System, 40 AU, light</text>
<rect x="300.0" y="180.0" width="184.5" height="22.0" rx="4" fill="#2a78d6"/>
<text x="492.5" y="196.0" font-size="12.5" fill="#0b0b0b" font-weight="600">≈ 5.5 hours</text>
<text x="288.0" y="237.0" font-size="13" fill="#0b0b0b" text-anchor="end">The Galaxy, light</text>
<rect x="300.0" y="222.0" width="366.8" height="22.0" rx="4" fill="#2a78d6"/>
<text x="658.8" y="238.0" font-size="12.5" fill="#ffffff" text-anchor="end" font-weight="600">≈ 100,000 years</text>
</svg>
