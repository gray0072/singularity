<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Сколько одна мысль пересекает разум</title>

<rect x="0.5" y="0.5" width="759" height="299" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Сколько одна мысль пересекает разум</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Секунды, логарифмическая шкала. Чем больше разум, тем медленнее он думает как целое.</text>
<line x1="322.2" y1="88.0" x2="322.2" y2="262.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="322.2" y="280.0" font-size="11" fill="#52514e" text-anchor="middle">1 мс</text>
<line x1="388.9" y1="88.0" x2="388.9" y2="262.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="388.9" y="280.0" font-size="11" fill="#52514e" text-anchor="middle">1 с</text>
<line x1="467.9" y1="88.0" x2="467.9" y2="262.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="467.9" y="280.0" font-size="11" fill="#52514e" text-anchor="middle">1 час</text>
<line x1="555.5" y1="88.0" x2="555.5" y2="262.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="555.5" y="280.0" font-size="11" fill="#52514e" text-anchor="middle">1 год</text>
<line x1="622.2" y1="88.0" x2="622.2" y2="262.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="622.2" y="280.0" font-size="11" fill="#52514e" text-anchor="middle">1000 лет</text>
<line x1="688.9" y1="88.0" x2="688.9" y2="262.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="688.9" y="280.0" font-size="11" fill="#52514e" text-anchor="middle">1 млн лет</text>
<text x="288.0" y="111.0" font-size="13" fill="#0b0b0b" text-anchor="end">Мозг человека, 15 см, нервы</text>
<rect x="300.0" y="96.0" width="26.1" height="22.0" rx="4" fill="#eb6834"/>
<text x="334.1" y="112.0" font-size="12.5" fill="#0b0b0b" font-weight="600">≈ 1,5 мс</text>
<text x="288.0" y="153.0" font-size="13" fill="#0b0b0b" text-anchor="end">Разум размером с Землю, оптоволокно</text>
<rect x="300.0" y="138.0" width="66.7" height="22.0" rx="4" fill="#2a78d6"/>
<text x="374.7" y="154.0" font-size="12.5" fill="#0b0b0b" font-weight="600">≈ 0,1 с</text>
<text x="288.0" y="195.0" font-size="13" fill="#0b0b0b" text-anchor="end">Солнечная система, 40 а. е., свет</text>
<rect x="300.0" y="180.0" width="184.5" height="22.0" rx="4" fill="#2a78d6"/>
<text x="492.5" y="196.0" font-size="12.5" fill="#0b0b0b" font-weight="600">≈ 5,5 часа</text>
<text x="288.0" y="237.0" font-size="13" fill="#0b0b0b" text-anchor="end">Галактика, свет</text>
<rect x="300.0" y="222.0" width="366.8" height="22.0" rx="4" fill="#2a78d6"/>
<text x="658.8" y="238.0" font-size="12.5" fill="#ffffff" text-anchor="end" font-weight="600">≈ 100 000 лет</text>
</svg>
