<svg xmlns="http://www.w3.org/2000/svg" width="760" height="492" viewBox="0 0 760 492" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Что просит дорога</title>

<rect x="0.5" y="0.5" width="759" height="491" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Что просит дорога</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Таблица на золе: рыбацкий список Олега, расписанный на дорогу в два с половиной года.</text>
<text x="375.0" y="104.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-weight="600">человек</text>
<text x="618.0" y="104.0" font-size="12.5" fill="#2a78d6" text-anchor="middle" font-weight="600">машина</text>
<line x1="28.0" y1="114.0" x2="736.0" y2="114.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="139.0" font-size="13.5" fill="#0b0b0b" font-weight="600">воздух</text>
<text x="34.0" y="156.0" font-size="11" fill="#8a8985">на Земле он даром</text>
<text x="375.0" y="147.0" font-size="12" fill="#0b0b0b" text-anchor="middle">около 1 кг кислорода в сутки</text>
<text x="618.0" y="147.0" font-size="12" fill="#0b0b0b" text-anchor="middle">не нужен</text>
<line x1="28.0" y1="170.0" x2="736.0" y2="170.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="195.0" font-size="13.5" fill="#0b0b0b" font-weight="600">вода и еда</text>
<text x="34.0" y="212.0" font-size="11" fill="#8a8985">98% воды идёт по кругу</text>
<text x="375.0" y="195.0" font-size="12" fill="#0b0b0b" text-anchor="middle">около 4 литров в сутки</text>
<text x="375.0" y="211.0" font-size="12" fill="#0b0b0b" text-anchor="middle">и установка, которая гонит по кругу</text>
<text x="618.0" y="195.0" font-size="12" fill="#0b0b0b" text-anchor="middle">кусок плутония:</text>
<text x="618.0" y="211.0" font-size="12" fill="#0b0b0b" text-anchor="middle">110 ватт</text>
<line x1="28.0" y1="226.0" x2="736.0" y2="226.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="251.0" font-size="13.5" fill="#0b0b0b" font-weight="600">доза, туда и обратно</text>
<text x="34.0" y="268.0" font-size="11" fill="#8a8985">измерена в дороге в 2011–2012 годах</text>
<text x="375.0" y="251.0" font-size="12" fill="#0b0b0b" text-anchor="middle">0,66 зиверта;</text>
<text x="375.0" y="267.0" font-size="12" fill="#0b0b0b" text-anchor="middle">предел на всю карьеру — 0,6</text>
<text x="618.0" y="251.0" font-size="12" fill="#0b0b0b" text-anchor="middle">переносит легче;</text>
<text x="618.0" y="267.0" font-size="12" fill="#0b0b0b" text-anchor="middle">карьеру ей не считают</text>
<line x1="28.0" y1="282.0" x2="736.0" y2="282.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="307.0" font-size="13.5" fill="#0b0b0b" font-weight="600">ожидание</text>
<text x="34.0" y="324.0" font-size="11" fill="#8a8985">когда делать нечего</text>
<text x="375.0" y="307.0" font-size="12" fill="#0b0b0b" text-anchor="middle">ест и дышит</text>
<text x="375.0" y="323.0" font-size="12" fill="#0b0b0b" text-anchor="middle">каждый день</text>
<text x="618.0" y="315.0" font-size="12" fill="#0b0b0b" text-anchor="middle">спит месяц</text>
<line x1="28.0" y1="338.0" x2="736.0" y2="338.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="363.0" font-size="13.5" fill="#0b0b0b" font-weight="600">дорога назад</text>
<text x="34.0" y="380.0" font-size="11" fill="#8a8985">и топливо на неё</text>
<text x="375.0" y="371.0" font-size="12" fill="#0b0b0b" text-anchor="middle">обязательна</text>
<text x="618.0" y="371.0" font-size="12" fill="#0b0b0b" text-anchor="middle">билет не покупали</text>
<line x1="28.0" y1="394.0" x2="736.0" y2="394.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="419.0" font-size="13.5" fill="#0b0b0b" font-weight="600">итого</text>
<text x="34.0" y="436.0" font-size="11" fill="#8a8985">до старта</text>
<text x="375.0" y="419.0" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600">825–1250 тонн на орбите</text>
<text x="375.0" y="435.0" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600">на шестерых</text>
<text x="618.0" y="419.0" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="600">около тонны на грунте:</text>
<text x="618.0" y="435.0" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="600">один марсоход</text>
<line x1="28.0" y1="450.0" x2="736.0" y2="450.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="476.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Кислород, вода и предел на карьеру — технические записки космического агентства (2023). Доза — прибор внутри марсохода</tspan><tspan x="28.0" dy="14.4">2012 года. Тонны — план агентства 2008 года на шестерых и около 900 суток. Тонна марсохода — округление.</tspan></text>
</svg>
