<text x="720.0" y="161.5" font-size="12.5" fill="#2a78d6" text-anchor="end" font-weight="600">старый опыт проигрывают вперемешку с новым</text>
<text x="720.0" y="250.0" font-size="12.5" fill="#e34948" text-anchor="end" font-weight="600"><tspan x="720.0" dy="0.0">без проигрывания:</tspan><tspan x="720.0" dy="15.6">катастрофическое забывание</tspan></text>
<text x="28.0" y="366.0" font-size="11.5" fill="#8a8985">Схема, а не измеренные данные. По Макклоски и Коэну (1989) и Лину (1992).</text>
