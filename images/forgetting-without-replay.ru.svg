<text x="80.0" y="314.0" font-size="12" fill="#52514e" text-anchor="end">0</text>
<text x="80.0" y="114.0" font-size="12" fill="#52514e" text-anchor="end">100%</text>
<text x="40.0" y="210.0" font-size="12.5" fill="#52514e" text-anchor="middle" transform="rotate(-90 40.0 210.0)">умение в старой задаче</text>
<text x="247.5" y="332.0" font-size="12.5" fill="#52514e" text-anchor="middle">уроки: старая задача</text>
<text x="562.5" y="332.0" font-size="12.5" fill="#52514e" text-anchor="middle">уроки: новая задача</text>
