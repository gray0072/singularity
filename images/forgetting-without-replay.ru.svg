<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Сеть, которую учат новому, забывает старое</title>

<rect x="0.5" y="0.5" width="759" height="379" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Сеть, которую учат новому, забывает старое</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Умение решать старую задачу, пока сеть учат новой: с проигрыванием и без него.</text>
