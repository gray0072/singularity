<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Обратной дороги к чертежам нет</title>
<defs><marker id="arrow-2a78d6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#2a78d6"/></marker><marker id="arrow-52514e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#52514e"/></marker><marker id="arrow-e34948" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#e34948"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="439" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Обратной дороги к чертежам нет</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Где записан опыт и что достаётся следующему.</text>
<line x1="410.0" y1="92.0" x2="410.0" y2="388.0" stroke="#e9e8e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="214.0" y="104.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600">живое тело</text>
<text x="585.0" y="104.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600">машина</text>
<rect x="44.0" y="126.0" width="150.0" height="62.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="119.0" y="154.1" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">чертежи</text>
<text x="119.0" y="171.6" font-size="12" fill="#52514e" text-anchor="middle">в половых клетках</text>
<rect x="250.0" y="126.0" width="134.0" height="62.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="317.0" y="154.1" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">тело</text>
<text x="317.0" y="171.6" font-size="12" fill="#52514e" text-anchor="middle">руки, голова</text>
<line x1="196.0" y1="157.0" x2="246.0" y2="157.0" stroke="#52514e" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="221.0" y="148.0" font-size="11.5" fill="#52514e" text-anchor="middle">строят</text>
<text x="392.0" y="212.0" font-size="12.5" fill="#eb6834" text-anchor="end" font-weight="600"><tspan x="392.0" dy="0.0">молот утолщает кожу ладони:</tspan><tspan x="392.0" dy="15.6">опыт записан здесь</tspan></text>
<path d="M317,240 C317,292 139,292 139,194" stroke="#e34948" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow-e34948)"/>
<line x1="214.0" y1="270.0" x2="232.0" y2="288.0" stroke="#e34948" stroke-width="2.6" stroke-linecap="round"/>
<line x1="232.0" y1="270.0" x2="214.0" y2="288.0" stroke="#e34948" stroke-width="2.6" stroke-linecap="round"/>
<text x="223.0" y="312.0" font-size="12.5" fill="#e34948" text-anchor="middle" font-weight="600">нет переводчика, нет адреса</text>
<rect x="236.0" y="332.0" width="160.0" height="56.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="316.0" y="357.4" font-size="13" fill="#0b0b0b" text-anchor="middle">сын</text>
<text x="316.0" y="373.6" font-size="11" fill="#52514e" text-anchor="middle">получает только чертежи</text>
<path d="M70,190 C70,372 140,360 232,360" stroke="#52514e" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<rect x="450.0" y="126.0" width="270.0" height="62.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="585.0" y="154.1" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">веса</text>
<text x="585.0" y="171.6" font-size="12" fill="#52514e" text-anchor="middle">чему научилась = что копируют</text>
<rect x="450.0" y="320.0" width="80.0" height="46.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="490.0" y="347.2" font-size="13" fill="#0b0b0b" text-anchor="middle">копия</text>
<line x1="525.0" y1="192.0" x2="490.0" y2="314.0" stroke="#2a78d6" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-2a78d6)"/>
<rect x="545.0" y="320.0" width="80.0" height="46.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="585.0" y="347.2" font-size="13" fill="#0b0b0b" text-anchor="middle">копия</text>
<line x1="585.0" y1="192.0" x2="585.0" y2="314.0" stroke="#2a78d6" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-2a78d6)"/>
<rect x="640.0" y="320.0" width="80.0" height="46.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="680.0" y="347.2" font-size="13" fill="#0b0b0b" text-anchor="middle">копия</text>
<line x1="645.0" y1="192.0" x2="680.0" y2="314.0" stroke="#2a78d6" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-2a78d6)"/>
<rect x="505.0" y="244.0" width="160.0" height="22.0" rx="3" fill="#fcfcfb"/>
<text x="585.0" y="260.0" font-size="12.5" fill="#2a78d6" text-anchor="middle" font-weight="600">целиком, за минуты</text>
<text x="28.0" y="424.0" font-size="11.5" fill="#8a8985">Схема барьера Вейсмана (1880–1890-е) и копирования обученной сети. Правая половина — как её читает Андрей.</text>
</svg>
