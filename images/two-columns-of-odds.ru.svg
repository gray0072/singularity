<svg xmlns="http://www.w3.org/2000/svg" width="760" height="668" viewBox="0 0 760 668" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Два столбца шансов</title>

<rect x="0.5" y="0.5" width="759" height="667" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Два столбца шансов</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Те же отметки: шансы, которые Андрей назвал у костра, и шансы того, кто писал его реплики.</text>
<text x="425.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">Андрей, у костра</text>
<text x="628.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">пишущий, 28 ноября 2026 года</text>
<line x1="28.0" y1="118.0" x2="736.0" y2="118.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="138.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">машина одна доводит до конца четыре</tspan><tspan x="34.0" dy="15.6">задачи из пяти длиной в месяц</tspan></text>
<text x="34.0" y="171.0" font-size="11" fill="#8a8985">осень 2031-го · отметка 30-го вечера</text>
<text x="425.0" y="153.0" font-size="12" fill="#0b0b0b" text-anchor="middle">три к одному</text>
<rect x="525.0" y="124.0" width="206.0" height="50.0" rx="6" fill="#e6f4ea"/>
<text x="628.0" y="153.0" font-size="12" fill="#008300" text-anchor="middle">четыре к одному</text>
<line x1="28.0" y1="180.0" x2="736.0" y2="180.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="200.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">доля труда в мировом доходе</tspan><tspan x="34.0" dy="15.6">ниже 51,5%</tspan></text>
<text x="34.0" y="233.0" font-size="11" fill="#8a8985">осень 2031-го · отметка 27-го и 30-го</text>
<text x="425.0" y="215.0" font-size="12" fill="#0b0b0b" text-anchor="middle">три к одному</text>
<rect x="525.0" y="186.0" width="206.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="628.0" y="215.0" font-size="12" fill="#8a6200" text-anchor="middle">один шанс из трёх</text>
<line x1="28.0" y1="242.0" x2="736.0" y2="242.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="262.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">машины, которые продают всем,</tspan><tspan x="34.0" dy="15.6">учатся на ходу, в голову</tspan></text>
<text x="34.0" y="295.0" font-size="11" fill="#8a8985">осень 2031-го · отметка 64-го вечера</text>
<text x="425.0" y="277.0" font-size="12" fill="#0b0b0b" text-anchor="middle">один к одному</text>
<rect x="525.0" y="248.0" width="206.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="628.0" y="277.0" font-size="12" fill="#8a6200" text-anchor="middle">один шанс из трёх</text>
<line x1="28.0" y1="304.0" x2="736.0" y2="304.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="324.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">молодые (22–25) в затронутых профессиях</tspan><tspan x="34.0" dy="15.6">отстают больше чем на четверть</tspan></text>
<text x="34.0" y="357.0" font-size="11" fill="#8a8985">осень 2031-го · своя отметка пишущего; сейчас больше десятой (16)</text>
<text x="425.0" y="339.0" font-size="12" fill="#0b0b0b" text-anchor="middle">отметки нет</text>
<rect x="525.0" y="310.0" width="206.0" height="50.0" rx="6" fill="#efeeea"/>
<text x="628.0" y="339.0" font-size="12" fill="#52514e" text-anchor="middle">два к одному</text>
<line x1="28.0" y1="366.0" x2="736.0" y2="366.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="386.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">доля труда в мировом доходе</tspan><tspan x="34.0" dy="15.6">ниже 50%</tspan></text>
<text x="34.0" y="419.0" font-size="11" fill="#8a8985">осень 2036-го · отметка 27-го и 30-го</text>
<text x="425.0" y="401.0" font-size="12" fill="#0b0b0b" text-anchor="middle">два к одному</text>
<rect x="525.0" y="372.0" width="206.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="628.0" y="401.0" font-size="12" fill="#8a6200" text-anchor="middle">один шанс из трёх</text>
<line x1="28.0" y1="428.0" x2="736.0" y2="428.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="448.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">миллион универсальных роботов,</tspan><tspan x="34.0" dy="15.6">сделанных за один год</tspan></text>
<text x="34.0" y="481.0" font-size="11" fill="#8a8985">осень 2036-го · отметка 27-го и 30-го</text>
<text x="425.0" y="463.0" font-size="12" fill="#0b0b0b" text-anchor="middle">два к одному</text>
<rect x="525.0" y="434.0" width="206.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="628.0" y="463.0" font-size="12" fill="#8a6200" text-anchor="middle">один к одному</text>
<line x1="28.0" y1="490.0" x2="736.0" y2="490.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="510.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">задача тысячелетия решена</tspan><tspan x="34.0" dy="15.6">в основном машиной</tspan></text>
<text x="34.0" y="543.0" font-size="11" fill="#8a8985">осень 2036-го · отметка 30-го вечера</text>
<text x="425.0" y="525.0" font-size="12" fill="#0b0b0b" text-anchor="middle">один шанс из двух</text>
<rect x="525.0" y="496.0" width="206.0" height="50.0" rx="6" fill="#e6f4ea"/>
<text x="628.0" y="525.0" font-size="12" fill="#008300" text-anchor="middle">три к двум</text>
<line x1="28.0" y1="552.0" x2="736.0" y2="552.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="572.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">посторонние в слепом испытании каждый</tspan><tspan x="34.0" dy="15.6">раз находят подсаженную хотелку</tspan></text>
<text x="34.0" y="605.0" font-size="11" fill="#8a8985">осень 2036-го · своя отметка пишущего; полгалочки Олега из 63-го</text>
<text x="425.0" y="587.0" font-size="12" fill="#0b0b0b" text-anchor="middle">шансы не названы</text>
<rect x="525.0" y="558.0" width="206.0" height="50.0" rx="6" fill="#efeeea"/>
<text x="628.0" y="587.0" font-size="12" fill="#52514e" text-anchor="middle">один шанс из четырёх</text>
<line x1="28.0" y1="614.0" x2="736.0" y2="614.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="640.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Зелёный — пишущий ставит шансы выше. Жёлтый — ниже. Серый — его собственная отметка. Отметки Андрея остаются как есть;</tspan><tspan x="28.0" dy="14.4">второй столбец стоит на тех же цифрах, и проверять его надо рядом с первым.</tspan></text>
</svg>
