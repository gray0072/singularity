<text x="28.0" y="409.2" font-size="13" fill="#0b0b0b" font-weight="600">What becomes of people (horses, the bacterium, the dog, the dinosaurs) lies in the soft pile.</text>
<text x="28.0" y="433.2" font-size="11.5" fill="#8a8985">The sorting was done by the one who was being sorted: the evening's reading, not a measurement.</text>
