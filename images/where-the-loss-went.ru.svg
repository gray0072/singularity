<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Куда ушли тридцать миллиардов долларов убытков</title>
<defs><marker id="arrow-2a78d6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#2a78d6"/></marker><marker id="arrow-8a8985" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#8a8985"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="419" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Куда ушли тридцать миллиардов долларов убытков</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">У денег инвесторов было три получателя. Двое свою долю потратили.</text>
<rect x="28.0" y="168.0" width="176.0" height="104.0" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
<text x="116.0" y="191.1" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600"><tspan x="116.0" dy="0.0">деньги</tspan><tspan x="116.0" dy="18.8">инвесторов</tspan></text>
<text x="116.0" y="228.6" font-size="13" fill="#52514e" text-anchor="middle"><tspan x="116.0" dy="0.0">больше 30 миллиардов</tspan><tspan x="116.0" dy="16.2">долларов убытков</tspan><tspan x="116.0" dy="16.2">до 2023 года</tspan></text>
<path d="M204,220 C246,220 246,128 284,128" stroke="#8a8985" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-8a8985)"/>
<rect x="290.0" y="96.0" width="226.0" height="64.0" rx="8" fill="none" stroke="#8a8985" stroke-width="1.5"/>
<text x="403.0" y="124.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle"><tspan x="403.0" dy="0.0">пассажиры:</tspan><tspan x="403.0" dy="16.9">поездки ниже себестоимости</tspan></text>
<line x1="520.0" y1="128.0" x2="546.0" y2="128.0" stroke="#8a8985" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-8a8985)"/>
<text x="556.0" y="123.0" font-size="13" fill="#8a8985"><tspan x="556.0" dy="0.0">потрачено:</tspan><tspan x="556.0" dy="16.2">поездка кончилась</tspan></text>
<path d="M204,220 C246,220 246,222 284,222" stroke="#8a8985" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-8a8985)"/>
<rect x="290.0" y="190.0" width="226.0" height="64.0" rx="8" fill="none" stroke="#8a8985" stroke-width="1.5"/>
<text x="403.0" y="217.9" font-size="13.5" fill="#0b0b0b" text-anchor="middle"><tspan x="403.0" dy="0.0">водители:</tspan><tspan x="403.0" dy="16.9">премии</tspan></text>
<line x1="520.0" y1="222.0" x2="546.0" y2="222.0" stroke="#8a8985" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-8a8985)"/>
<text x="556.0" y="217.0" font-size="13" fill="#8a8985"><tspan x="556.0" dy="0.0">потрачено:</tspan><tspan x="556.0" dy="16.2">бензин, еда, машина</tspan></text>
<path d="M204,220 C246,220 246,316 284,316" stroke="#2a78d6" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-2a78d6)"/>
<rect x="290.0" y="284.0" width="226.0" height="64.0" rx="8" fill="#2a78d6" fill-opacity="0.1"/>
<rect x="290.0" y="284.0" width="226.0" height="64.0" rx="8" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
<text x="403.0" y="311.9" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600"><tspan x="403.0" dy="0.0">программа, карты,</tspan><tspan x="403.0" dy="16.9">записи о поездках</tspan></text>
<line x1="520.0" y1="316.0" x2="546.0" y2="316.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-2a78d6)"/>
<text x="556.0" y="306.0" font-size="16" fill="#2a78d6" font-weight="700">осталось</text>
<text x="556.0" y="326.0" font-size="12" fill="#52514e"><tspan x="556.0" dy="0.0">а с ним привычка примерно</tspan><tspan x="556.0" dy="15.0">150 миллионов человек в месяц</tspan><tspan x="556.0" dy="15.0">нажимать кнопку</tspan></text>
<text x="28.0" y="388.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Схема: как деньги разделились между тремя долями, не показано.</tspan><tspan x="28.0" dy="14.4">Uber: основан в 2009 году, первая годовая операционная прибыль в 2023-м.</tspan></text>
</svg>
