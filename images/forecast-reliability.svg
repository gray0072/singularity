<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>What a local forecaster can foretell</title>

<rect x="0.5" y="0.5" width="759" height="279" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">What a local forecaster can foretell</text>
<text x="28.0" y="78.0" font-size="12.5" fill="#8a8985" font-weight="600">Question</text>
<text x="330.0" y="78.0" font-size="12.5" fill="#8a8985" font-weight="600">Reliability</text>
<text x="500.0" y="78.0" font-size="12.5" fill="#8a8985" font-weight="600">The vet and the cow</text>
<line x1="28.0" y1="88.0" x2="732.0" y2="88.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="28.0" y="122.0" font-size="15" fill="#0b0b0b" font-weight="600">What will happen</text>
<text x="28.0" y="140.0" font-size="12.5" fill="#52514e">the trend</text>
<circle cx="340.0" cy="118.0" r="9.0" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="366.0" cy="118.0" r="9.0" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="392.0" cy="118.0" r="9.0" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="500.0" y="122.0" font-size="14" fill="#52514e" font-style="italic">she will calve</text>
<line x1="28.0" y1="150.0" x2="732.0" y2="150.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="28.0" y="168.0" font-size="15" fill="#0b0b0b" font-weight="600">When</text>
<text x="28.0" y="186.0" font-size="12.5" fill="#52514e">the date</text>
<circle cx="340.0" cy="164.0" r="9.0" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="366.0" cy="164.0" r="9.0" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="392.0" cy="164.0" r="9.0" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
<text x="500.0" y="168.0" font-size="14" fill="#52514e" font-style="italic">roughly in March</text>
<line x1="28.0" y1="196.0" x2="732.0" y2="196.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="28.0" y="214.0" font-size="15" fill="#0b0b0b" font-weight="600">Exactly how, to whom</text>
<text x="28.0" y="232.0" font-size="12.5" fill="#52514e">the details</text>
<circle cx="340.0" cy="210.0" r="9.0" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="366.0" cy="210.0" r="9.0" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="392.0" cy="210.0" r="9.0" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
<text x="500.0" y="214.0" font-size="14" fill="#52514e" font-style="italic">the colour of the calf</text>
<line x1="28.0" y1="242.0" x2="732.0" y2="242.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="28.0" y="262.0" font-size="12.5" fill="#52514e">A trend is the law of the whole gas cylinder; a name on a patent is one molecule.</text>
</svg>
