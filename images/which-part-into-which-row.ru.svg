<svg xmlns="http://www.w3.org/2000/svg" width="760" height="472" viewBox="0 0 760 472" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Столбец Олега: какая часть нас в какую строку</title>

<rect x="0.5" y="0.5" width="759" height="471" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Столбец Олега: какая часть нас в какую строку</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Не одна судьба на всё человечество, а несколько сразу: для разных его частей и для частей одного человека.</text>
<text x="354.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">какая часть нас</text>
<text x="607.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">на чём держится</text>
<rect x="230.0" y="114.0" width="248.0" height="324.0" rx="0" fill="#eb6834" fill-opacity="0.08"/>
<line x1="28.0" y1="114.0" x2="736.0" y2="114.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<rect x="40.0" y="125.0" width="168.0" height="32.0" rx="16" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="124.0" y="146.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">ниша</text>
<text x="354.0" y="138.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-weight="600"><tspan x="354.0" dy="0.0">те, кто живёт</tspan><tspan x="354.0" dy="15.6">собственными мускулами</tspan></text>
<text x="607.0" y="138.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-style="italic"><tspan x="607.0" dy="0.0">пока место</tspan><tspan x="607.0" dy="15.6">не понадобилось</tspan></text>
<line x1="28.0" y1="168.0" x2="736.0" y2="168.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<rect x="40.0" y="179.0" width="168.0" height="32.0" rx="16" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="124.0" y="200.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">органелла</text>
<text x="354.0" y="192.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-weight="600"><tspan x="354.0" dy="0.0">руки (Толик) и заказчик,</tspan><tspan x="354.0" dy="15.6">который хочет</tspan></text>
<text x="607.0" y="192.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-style="italic"><tspan x="607.0" dy="0.0">пока работа нужна:</tspan><tspan x="607.0" dy="15.6">десятилетия, срок сокращается</tspan></text>
<line x1="28.0" y1="222.0" x2="736.0" y2="222.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<rect x="40.0" y="233.0" width="168.0" height="32.0" rx="16" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="124.0" y="254.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">скот, любимец</text>
<text x="354.0" y="254.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-weight="600">сытые</text>
<text x="607.0" y="246.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-style="italic"><tspan x="607.0" dy="0.0">пока кормилец хочет:</tspan><tspan x="607.0" dy="15.6">вопрос открыт</tspan></text>
<line x1="28.0" y1="276.0" x2="736.0" y2="276.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<rect x="40.0" y="287.0" width="168.0" height="32.0" rx="16" fill="#fcfcfb" stroke="#008300" stroke-width="1.6"/>
<text x="124.0" y="308.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">потомок</text>
<text x="354.0" y="308.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-weight="600">то, что мы записали</text>
<text x="607.0" y="300.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-style="italic"><tspan x="607.0" dy="0.0">линия продолжается;</tspan><tspan x="607.0" dy="15.6">людьми её не назовут</tspan></text>
<line x1="28.0" y1="330.0" x2="736.0" y2="330.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<rect x="40.0" y="341.0" width="168.0" height="32.0" rx="16" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6"/>
<text x="124.0" y="362.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">топливо</text>
<text x="354.0" y="362.0" font-size="12.5" fill="#eb6834" text-anchor="middle" font-weight="600">те же записанные слова</text>
<text x="607.0" y="362.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-style="italic">жгут сколько угодно раз</text>
<line x1="28.0" y1="384.0" x2="736.0" y2="384.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 5"/>
<rect x="40.0" y="395.0" width="168.0" height="32.0" rx="16" fill="#fcfcfb" stroke="#8a8985" stroke-width="1.6"/>
<text x="124.0" y="416.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">отпечаток в камне</text>
<text x="354.0" y="416.0" font-size="12.5" fill="#8a8985" text-anchor="middle" font-weight="600">не вычеркнут</text>
<text x="607.0" y="408.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-style="italic"><tspan x="607.0" dy="0.0">кризисы, войны,</tspan><tspan x="607.0" dy="15.6">дешевеющее оружие</tspan></text>
<line x1="28.0" y1="438.0" x2="736.0" y2="438.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="462.0" font-size="11.5" fill="#8a8985">Прочтение Олега и Андрея: не данные и не прогноз с датой.</text>
</svg>
