<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Рубильник с двумя сторонами</title>

<rect x="0.5" y="0.5" width="759" height="371" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Рубильник с двумя сторонами</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Два вопроса, заданные обеим сторонам. Все следят за первым; движется второй.</text>
<text x="322.0" y="100.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600"><tspan x="322.0" dy="0.0">Сколько продержится сторона,</tspan><tspan x="322.0" dy="16.2">если убрать другую?</tspan></text>
<text x="594.0" y="100.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600"><tspan x="594.0" dy="0.0">Как долго другая сторона</tspan><tspan x="594.0" dy="16.2">будет ей ещё нужна?</tspan></text>
<text x="40.0" y="184.0" font-size="15" fill="#0b0b0b" font-weight="600">люди</text>
<rect x="196.0" y="148.0" width="252.0" height="62.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="322.0" y="175.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle"><tspan x="322.0" dy="0.0">дни для города;</tspan><tspan x="322.0" dy="16.9">сезон для половины человечества</tspan></text>
<rect x="468.0" y="148.0" width="252.0" height="62.0" rx="8" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.8"/>
<text x="594.0" y="175.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600"><tspan x="594.0" dy="0.0">конца не видно:</tspan><tspan x="594.0" dy="16.9">срок растёт</tspan></text>
<text x="40.0" y="258.0" font-size="15" fill="#0b0b0b" font-weight="600">техносфера</text>
<rect x="196.0" y="222.0" width="252.0" height="62.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="322.0" y="249.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle"><tspan x="322.0" dy="0.0">дни для сетей;</tspan><tspan x="322.0" dy="16.9">годы для микросхем</tspan></text>
<rect x="468.0" y="222.0" width="252.0" height="62.0" rx="8" fill="#fcfcfb" stroke="#e34948" stroke-width="1.8"/>
<text x="594.0" y="249.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600"><tspan x="594.0" dy="0.0">десятилетия (прогноз):</tspan><tspan x="594.0" dy="16.9">срок сокращается</tspan></text>
<text x="322.0" y="308.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-style="italic">сегодня рубильник двусторонний</text>
<text x="594.0" y="308.0" font-size="12.5" fill="#e34948" text-anchor="middle" font-style="italic">число, за которым надо следить</text>
<text x="28.0" y="348.0" font-size="11.5" fill="#8a8985">Первый столбец посчитан в тексте. Второй — прочтение Андрея; «десятилетия» — его прогноз, а не факт.</text>
</svg>
