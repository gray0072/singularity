<svg xmlns="http://www.w3.org/2000/svg" width="760" height="378" viewBox="0 0 760 378" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>A form with the column “who”</title>

<rect x="0.5" y="0.5" width="759" height="377" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">A form with the column “who”</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">A sentence is a form in which the column “who” is printed beforehand. It is not accepted empty.</text>
<text x="40.0" y="98.0" font-size="12" fill="#8a8985" font-weight="600">what is said</text>
<text x="232.0" y="98.0" font-size="12" fill="#8a8985" font-weight="600">the column “who”</text>
<text x="430.0" y="98.0" font-size="12" fill="#8a8985" font-weight="600">what is there</text>
<line x1="28.0" y1="112.0" x2="732.0" y2="112.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="40.0" y="139.0" font-size="14" fill="#0b0b0b" font-style="italic">“It rains”</text>
<rect x="224.0" y="120.0" width="176.0" height="28.0" rx="4" fill="#fcfcfb" stroke="#e34948" stroke-width="1.4"/>
<text x="312.0" y="139.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">it</text>
<text x="430.0" y="139.0" font-size="13" fill="#52514e">nobody: an empty word</text>
<line x1="28.0" y1="156.0" x2="732.0" y2="156.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="40.0" y="183.0" font-size="14" fill="#0b0b0b" font-style="italic">“The wind blows”</text>
<rect x="224.0" y="164.0" width="176.0" height="28.0" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.4"/>
<text x="312.0" y="183.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">the wind</text>
<text x="430.0" y="183.0" font-size="13" fill="#52514e">the blowing itself, named twice</text>
<line x1="28.0" y1="200.0" x2="732.0" y2="200.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="40.0" y="227.0" font-size="14" fill="#0b0b0b" font-style="italic">“The sun sets”</text>
<rect x="224.0" y="208.0" width="176.0" height="28.0" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.4"/>
<text x="312.0" y="227.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">the sun</text>
<text x="430.0" y="227.0" font-size="13" fill="#52514e">the Earth turning</text>
<line x1="28.0" y1="244.0" x2="732.0" y2="244.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="40.0" y="271.0" font-size="14" fill="#0b0b0b" font-style="italic">“The crisis struck”</text>
<rect x="224.0" y="252.0" width="176.0" height="28.0" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.4"/>
<text x="312.0" y="271.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">the crisis</text>
<text x="430.0" y="271.0" font-size="13" fill="#52514e">millions of deals, and nobody who struck</text>
<line x1="28.0" y1="288.0" x2="732.0" y2="288.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="40.0" y="315.0" font-size="14" fill="#0b0b0b" font-style="italic">“I decided”</text>
<rect x="224.0" y="296.0" width="176.0" height="28.0" rx="4" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.4"/>
<text x="312.0" y="315.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">I</text>
<text x="430.0" y="315.0" font-size="13" fill="#52514e">a report drawn up after the deed</text>
<line x1="28.0" y1="332.0" x2="732.0" y2="332.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="28.0" y="356.0" font-size="11.5" fill="#8a8985">The first three rows are grammar. The last two are Andrey's reading; the text says where the proof ends.</text>
</svg>
