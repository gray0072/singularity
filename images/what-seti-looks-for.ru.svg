<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Что мы ищем и что может там быть</title>

<rect x="0.5" y="0.5" width="759" height="319" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Что мы ищем и что может там быть</text>
<rect x="28.0" y="64.0" width="340.0" height="210.0" rx="10" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/>
<rect x="392.0" y="64.0" width="340.0" height="210.0" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="44.0" y="90.0" font-size="14" fill="#eb6834" font-weight="600">SETI ищет цивилизацию вроде нашей</text>
<text x="408.0" y="90.0" font-size="14" fill="#2a78d6" font-weight="600">Постсингулярная жизнь может быть</text>
<text x="44.0" y="126.0" font-size="12.5" fill="#0b0b0b">— на тёплой планете с кислородом и водой</text>
<text x="44.0" y="164.0" font-size="12.5" fill="#0b0b0b">— с радиомаяками и большой инженерией</text>
<text x="44.0" y="202.0" font-size="12.5" fill="#0b0b0b">— медленной, с простыми избыточными сигналами</text>
<text x="44.0" y="240.0" font-size="12.5" fill="#0b0b0b">— желающей поговорить с соседями</text>
<text x="408.0" y="126.0" font-size="12.5" fill="#0b0b0b">— в холоде и темноте, где вычисления дешевле всего</text>
<text x="408.0" y="164.0" font-size="12.5" fill="#0b0b0b">— рассеянной, как разумная космическая пыль</text>
<text x="408.0" y="202.0" font-size="12.5" fill="#0b0b0b">— с сигналами, сжатыми до неотличимости от шума</text>
<text x="408.0" y="240.0" font-size="12.5" fill="#0b0b0b">— без причин звать биологических соседей</text>
<text x="28.0" y="302.0" font-size="12.5" fill="#52514e" font-style="italic">Обыскано пока примерно столько, сколько ванна-джакузи от океана (Wright et al., 2018).</text>
</svg>
