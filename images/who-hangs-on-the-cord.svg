<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Who hangs on the cord</title>

<rect x="0.5" y="0.5" width="759" height="419" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Who hangs on the cord</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">A large town with no current and no help from outside: what stops, and when.</text>
<line x1="104.0" y1="114.0" x2="104.0" y2="330.0" stroke="#e9e8e4" stroke-width="2" stroke-linecap="round"/>
<rect x="40.0" y="98.0" width="128.0" height="32.0" rx="16" fill="#fcfcfb" stroke="#e34948" stroke-width="1.6"/>
<text x="104.0" y="119.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">at once</text>
<text x="192.0" y="111.0" font-size="13.5" fill="#0b0b0b"><tspan x="192.0" dy="0.0">lifts, traffic lights, trains, tills and card machines,</tspan><tspan x="192.0" dy="16.9">the pumps of filling stations</tspan></text>
<rect x="40.0" y="152.0" width="128.0" height="32.0" rx="16" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.6"/>
<text x="104.0" y="173.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">in hours</text>
<text x="192.0" y="165.0" font-size="13.5" fill="#0b0b0b"><tspan x="192.0" dy="0.0">mobile masts (they stand on batteries), water on the upper floors,</tspan><tspan x="192.0" dy="16.9">the refrigerator (about 4 hours)</tspan></text>
<rect x="40.0" y="206.0" width="128.0" height="32.0" rx="16" fill="#fcfcfb" stroke="#eda100" stroke-width="1.6"/>
<text x="104.0" y="227.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">in 2 days</text>
<text x="192.0" y="227.0" font-size="13.5" fill="#0b0b0b">the freezer; a missed session of dialysis</text>
<rect x="40.0" y="260.0" width="128.0" height="32.0" rx="16" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.6"/>
<text x="104.0" y="281.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">in 2–4 days</text>
<text x="192.0" y="281.0" font-size="13.5" fill="#0b0b0b">the diesel of a hospital's generator; the shelves of the shops</text>
<rect x="40.0" y="314.0" width="128.0" height="32.0" rx="16" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="104.0" y="335.0" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">in a season</text>
<text x="192.0" y="335.0" font-size="13.5" fill="#0b0b0b">the harvest, if the plants that take nitrogen from the air stand too</text>
<text x="28.0" y="384.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Orders of magnitude, not a timetable. Every real blackout so far (2003, 2021, 2025) was an island</tspan><tspan x="28.0" dy="14.4">in a working sea: the crews, the diesel and the bread came from outside.</tspan></text>
</svg>
