<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>The same problem with the other sign</title>

<rect x="0.5" y="0.5" width="759" height="419" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">The same problem with the other sign</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Oleg's notebook. Petya, his wage and his lathe are the same on both pages.</text>
<rect x="36.0" y="84.0" width="336.0" height="262.0" rx="4" fill="#ffffff" stroke="#e4e3df" stroke-width="1.5"/>
<line x1="50.0" y1="136.0" x2="358.0" y2="136.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<line x1="50.0" y1="166.0" x2="358.0" y2="166.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<line x1="50.0" y1="196.0" x2="358.0" y2="196.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="116.0" font-size="14" fill="#0b0b0b" font-weight="600">Given: the capitalist made a profit</text>
<text x="70.0" y="156.0" font-size="14" fill="#0b0b0b">on Petya</text>
<text x="338.0" y="156.0" font-size="15" fill="#1baf7a" text-anchor="end" font-weight="600">+50</text>
<text x="70.0" y="186.0" font-size="14" fill="#0b0b0b">on Vasya</text>
<text x="338.0" y="186.0" font-size="15" fill="#1baf7a" text-anchor="end" font-weight="600">+150</text>
<text x="70.0" y="216.0" font-size="14" fill="#0b0b0b">on Kolya</text>
<text x="338.0" y="216.0" font-size="15" fill="#1baf7a" text-anchor="end" font-weight="600">+200</text>
<line x1="58.0" y1="226.0" x2="350.0" y2="226.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="70.0" y="248.0" font-size="14" fill="#0b0b0b" font-weight="600">in all, roubles</text>
<text x="338.0" y="248.0" font-size="17" fill="#1baf7a" text-anchor="end" font-weight="700">+400</text>
<text x="58.0" y="280.0" font-size="13" fill="#52514e"><tspan x="58.0" dy="0.0">Find: whom should he sack</tspan><tspan x="58.0" dy="16.2">for the profit to grow?</tspan></text>
<text x="58.0" y="328.0" font-size="13.5" fill="#0b0b0b" font-style="italic">Nobody. Yet owners do sack.</text>
<rect x="388.0" y="84.0" width="336.0" height="262.0" rx="4" fill="#ffffff" stroke="#e4e3df" stroke-width="1.5"/>
<line x1="402.0" y1="136.0" x2="710.0" y2="136.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<line x1="402.0" y1="166.0" x2="710.0" y2="166.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<line x1="402.0" y1="196.0" x2="710.0" y2="196.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="410.0" y="116.0" font-size="14" fill="#0b0b0b" font-weight="600">Given: the capitalist made a loss</text>
<text x="422.0" y="156.0" font-size="14" fill="#0b0b0b">on Petya</text>
<text x="690.0" y="156.0" font-size="15" fill="#e34948" text-anchor="end" font-weight="600">−50</text>
<text x="422.0" y="186.0" font-size="14" fill="#0b0b0b">on Vasya</text>
<text x="690.0" y="186.0" font-size="15" fill="#e34948" text-anchor="end" font-weight="600">−150</text>
<text x="422.0" y="216.0" font-size="14" fill="#0b0b0b">on Kolya</text>
<text x="690.0" y="216.0" font-size="15" fill="#e34948" text-anchor="end" font-weight="600">−200</text>
<line x1="410.0" y1="226.0" x2="702.0" y2="226.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="422.0" y="248.0" font-size="14" fill="#0b0b0b" font-weight="600">in all, roubles</text>
<text x="690.0" y="248.0" font-size="17" fill="#e34948" text-anchor="end" font-weight="700">−400</text>
<text x="410.0" y="288.0" font-size="13" fill="#52514e">Find: who exploited whom?</text>
<text x="410.0" y="328.0" font-size="13.5" fill="#0b0b0b" font-style="italic">Petya, Vasya and Kolya, the capitalist?</text>
<text x="380.0" y="374.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">The same on both pages: the wage, the lathe, the eight hours. Only the sign in the owner's line differs.</text>
<text x="28.0" y="402.0" font-size="11.5" fill="#8a8985">The problem: the author on the forum, 4 June 2017. The question with the minus: the author under article 06, 14 December 2011.</text>
</svg>
