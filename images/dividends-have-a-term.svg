<svg xmlns="http://www.w3.org/2000/svg" width="760" height="424" viewBox="0 0 760 424" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>For how long the law pays the one who made it</title>

<rect x="0.5" y="0.5" width="759" height="423" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">For how long the law pays the one who made it</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Years of exclusive right. When the term runs out, the thing belongs to everybody.</text>
<line x1="262.0" y1="88.0" x2="262.0" y2="336.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="262.0" y="354.0" font-size="11.5" fill="#8a8985" text-anchor="middle">0</text>
<line x1="326.5" y1="88.0" x2="326.5" y2="336.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="326.5" y="354.0" font-size="11.5" fill="#8a8985" text-anchor="middle">20</text>
<line x1="391.0" y1="88.0" x2="391.0" y2="336.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="391.0" y="354.0" font-size="11.5" fill="#8a8985" text-anchor="middle">40</text>
<line x1="455.5" y1="88.0" x2="455.5" y2="336.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="455.5" y="354.0" font-size="11.5" fill="#8a8985" text-anchor="middle">60</text>
<line x1="520.0" y1="88.0" x2="520.0" y2="336.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="520.0" y="354.0" font-size="11.5" fill="#8a8985" text-anchor="middle">80 years</text>
<text x="248.0" y="112.0" font-size="13.5" fill="#0b0b0b" text-anchor="end" font-weight="600">the wheel</text>
<text x="248.0" y="128.0" font-size="11" fill="#8a8985" text-anchor="end">about 5,500 years ago</text>
<rect x="260.0" y="102.0" width="4.0" height="24.0" rx="1" fill="#8a8985"/>
<text x="272.0" y="119.0" font-size="12.5" fill="#0b0b0b" font-weight="600">nobody, never</text>
<text x="248.0" y="162.0" font-size="13.5" fill="#0b0b0b" text-anchor="end" font-weight="600">a new book, England, 1710</text>
<text x="248.0" y="178.0" font-size="11" fill="#8a8985" text-anchor="end">the first copyright law</text>
<rect x="262.0" y="152.0" width="45.1" height="24.0" rx="2" fill="#eb6834" fill-opacity="0.9"/>
<rect x="307.1" y="152.0" width="45.1" height="24.0" rx="2" fill="#eb6834" fill-opacity="0.4"/>
<text x="362.3" y="169.0" font-size="12.5" fill="#0b0b0b" font-weight="600">14 years, and 14 more if the author is alive</text>
<text x="248.0" y="212.0" font-size="13.5" fill="#0b0b0b" text-anchor="end" font-weight="600">an invention, today</text>
<text x="248.0" y="228.0" font-size="11" fill="#8a8985" text-anchor="end">a patent</text>
<rect x="262.0" y="202.0" width="64.5" height="24.0" rx="2" fill="#eb6834" fill-opacity="0.9"/>
<text x="336.5" y="219.0" font-size="12.5" fill="#0b0b0b" font-weight="600">20 years from the application</text>
<text x="248.0" y="262.0" font-size="13.5" fill="#0b0b0b" text-anchor="end" font-weight="600">Pushkin</text>
<text x="248.0" y="278.0" font-size="11" fill="#8a8985" text-anchor="end">died in 1837</text>
<rect x="262.0" y="252.0" width="161.2" height="24.0" rx="2" fill="#eb6834" fill-opacity="0.9"/>
<text x="433.2" y="269.0" font-size="12.5" fill="#0b0b0b" font-weight="600">50 years after his death: until 1887</text>
<text x="248.0" y="318.0" font-size="13.5" fill="#0b0b0b" text-anchor="end" font-weight="600">a book, today</text>
<rect x="262.0" y="302.0" width="225.8" height="24.0" rx="2" fill="#eb6834" fill-opacity="0.9"/>
<text x="497.8" y="319.0" font-size="12.5" fill="#0b0b0b" font-weight="600">the author's life and 70 years more</text>
<line x1="262.0" y1="88.0" x2="262.0" y2="336.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="372.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">The Statute of Anne (1710); article 33 of the TRIPS agreement; the Russian law of 1857; the term of today in the</tspan><tspan x="28.0" dy="14.4">United States, the European Union and Russia. Counted from publication (1710), from the application (a patent)</tspan><tspan x="28.0" dy="14.4">or from the author's death (Pushkin, a book today).</tspan></text>
</svg>
