<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Чем дальше лицо, тем слабее тормоз</title>

<rect x="0.5" y="0.5" width="759" height="371" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Чем дальше лицо, тем слабее тормоз</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Сколько человек из 40 дошли по приказу до последнего рубильника: 450 вольт.</text>
<line x1="684.0" y1="84.0" x2="684.0" y2="316.0" stroke="#e9e8e4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="684.0" y="332.0" font-size="11.5" fill="#8a8985" text-anchor="middle">40</text>
<text x="40.0" y="103.0" font-size="12.5" fill="#0b0b0b"><tspan x="40.0" dy="0.0">ученик за стеной:</tspan><tspan x="40.0" dy="15.6">слышен только стук</tspan></text>
<rect x="268.0" y="90.0" width="270.4" height="30.0" rx="2" fill="#e34948" fill-opacity="0.9"/>
<text x="548.4" y="110.0" font-size="13.5" fill="#0b0b0b" font-weight="600">26 из 40</text>
<text x="40.0" y="161.0" font-size="12.5" fill="#0b0b0b"><tspan x="40.0" dy="0.0">за стеной:</tspan><tspan x="40.0" dy="15.6">слышен голос</tspan></text>
<rect x="268.0" y="148.0" width="260.0" height="30.0" rx="2" fill="#e34948" fill-opacity="0.9"/>
<text x="538.0" y="168.0" font-size="13.5" fill="#0b0b0b" font-weight="600">25 из 40</text>
<text x="40.0" y="219.0" font-size="12.5" fill="#0b0b0b"><tspan x="40.0" dy="0.0">в той же комнате,</tspan><tspan x="40.0" dy="15.6">на расстоянии руки</tspan></text>
<rect x="268.0" y="206.0" width="166.4" height="30.0" rx="2" fill="#eb6834" fill-opacity="0.9"/>
<text x="444.4" y="226.0" font-size="13.5" fill="#0b0b0b" font-weight="600">16 из 40</text>
<text x="40.0" y="277.0" font-size="12.5" fill="#0b0b0b"><tspan x="40.0" dy="0.0">руку ученика надо самому</tspan><tspan x="40.0" dy="15.6">прижимать к пластине</tspan></text>
<rect x="268.0" y="264.0" width="124.8" height="30.0" rx="2" fill="#eda100" fill-opacity="0.9"/>
<text x="402.8" y="284.0" font-size="13.5" fill="#0b0b0b" font-weight="600">12 из 40</text>
<line x1="268.0" y1="84.0" x2="268.0" y2="316.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="340.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Милгрэм (1963, 1965): четыре серии по 40 человек в американском университете; ученик был актёром, тока</tspan><tspan x="28.0" dy="14.4">не было. Одна лаборатория, и спорят о ней до сих пор: читать надо наклон, а не проценты.</tspan></text>
</svg>
