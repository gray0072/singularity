<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Where does “what is observed” end and “who observes” begin?</title>

<rect x="0.5" y="0.5" width="759" height="371" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Where does “what is observed” end and “who observes” begin?</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">The line can be drawn after any link of the chain, and the numbers come out the same (von Neumann, 1932).</text>
<rect x="28.0" y="150.0" width="82.0" height="54.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="69.0" y="173.2" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600"><tspan x="69.0" dy="0.0">the</tspan><tspan x="69.0" dy="15.6">molecule</tspan></text>
<line x1="120.8" y1="128.0" x2="120.8" y2="226.0" stroke="#008300" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<rect x="131.7" y="150.0" width="82.0" height="54.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="172.7" y="173.2" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600"><tspan x="172.7" dy="0.0">a grain</tspan><tspan x="172.7" dy="15.6">of light</tspan></text>
<line x1="224.5" y1="128.0" x2="224.5" y2="226.0" stroke="#8a8985" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<rect x="235.3" y="150.0" width="82.0" height="54.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="276.3" y="173.2" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600"><tspan x="276.3" dy="0.0">the wall,</tspan><tspan x="276.3" dy="15.6">a counter</tspan></text>
<line x1="328.2" y1="128.0" x2="328.2" y2="226.0" stroke="#8a8985" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<rect x="339.0" y="150.0" width="82.0" height="54.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="380.0" y="181.1" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">the record</text>
<line x1="431.8" y1="128.0" x2="431.8" y2="226.0" stroke="#8a8985" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<rect x="442.7" y="150.0" width="82.0" height="54.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="483.7" y="181.1" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">the eye</text>
<line x1="535.5" y1="128.0" x2="535.5" y2="226.0" stroke="#8a8985" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<rect x="546.3" y="150.0" width="82.0" height="54.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="587.3" y="181.1" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">the brain</text>
<line x1="639.2" y1="128.0" x2="639.2" y2="226.0" stroke="#e34948" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<rect x="650.0" y="150.0" width="82.0" height="54.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="691.0" y="181.1" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">“I”</text>
<text x="128.8" y="104.0" font-size="12" fill="#008300" font-weight="600"><tspan x="128.8" dy="0.0">the stripes go here:</tspan><tspan x="128.8" dy="15.0">the heated molecule, 2004</tspan></text>
<text x="631.2" y="104.0" font-size="12" fill="#e34948" text-anchor="end" font-weight="600"><tspan x="631.2" dy="0.0">the popular article</tspan><tspan x="631.2" dy="15.0">draws the line here</tspan></text>
<line x1="130.8" y1="248.0" x2="629.2" y2="248.0" stroke="#8a8985" stroke-width="1.4" stroke-linecap="round"/>
<line x1="130.8" y1="242.0" x2="130.8" y2="254.0" stroke="#8a8985" stroke-width="1.4" stroke-linecap="round"/>
<line x1="629.2" y1="242.0" x2="629.2" y2="254.0" stroke="#8a8985" stroke-width="1.4" stroke-linecap="round"/>
<text x="380.0" y="270.0" font-size="12" fill="#52514e" text-anchor="middle">between the first link and the last no laboratory has found anything to happen</text>
<text x="28.0" y="312.0" font-size="13" fill="#0b0b0b" font-weight="600">Not solved: why the molecule lands in one place. That is the measurement problem, and it is open.</text>
<text x="28.0" y="344.0" font-size="11.5" fill="#8a8985">A scheme of the argument, not data. The chain is von Neumann's, with the links of the two-slit experiment.</text>
</svg>
