<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Кто выдыхает на этой планете</title>

<rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Кто выдыхает на этой планете</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Углекислый газ, отданный за год, миллиардов тонн. Шкала линейная.</text>
<text x="202.0" y="118.0" font-size="13" fill="#0b0b0b" text-anchor="end"><tspan x="202.0" dy="0.0">все люди,</tspan><tspan x="202.0" dy="16.2">8,2 миллиарда</tspan></text>
<rect x="216.0" y="104.0" width="40.5" height="30.0" rx="2" fill="#1baf7a" fill-opacity="0.85"/>
<text x="266.5" y="124.0" font-size="13.5" fill="#0b0b0b" font-weight="600">около 3</text>
<text x="202.0" y="184.0" font-size="13" fill="#0b0b0b" text-anchor="end"><tspan x="202.0" dy="0.0">трубы и</tspan><tspan x="202.0" dy="16.2">выхлопы</tspan></text>
<rect x="216.0" y="170.0" width="500.0" height="30.0" rx="2" fill="#e34948" fill-opacity="0.85"/>
<text x="230.0" y="190.0" font-size="13.5" fill="#ffffff" font-weight="600">около 37 (2024): в двенадцать раз больше</text>
<line x1="216.0" y1="94.0" x2="216.0" y2="216.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="252.0" font-size="12.5" fill="#0b0b0b"><tspan x="28.0" dy="0.0">Углерод нашего выдоха взят из воздуха прошлогодним урожаем: круг.</tspan><tspan x="28.0" dy="15.6">Углерод из труб взят из-под земли.</tspan></text>
<text x="28.0" y="310.0" font-size="11.5" fill="#8a8985">Арифметика на коленке: около килограмма углекислого газа на человека в сутки. Топливо и цемент: Global Carbon Budget 2024.</text>
</svg>
