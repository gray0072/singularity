<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Three ways to rebuild memory without destroying it</title>
<defs><marker id="arrow-52514e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#52514e"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="419" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Three ways to rebuild memory without destroying it</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">The task is the same for any mind that learns; the way belongs to the platform.</text>
<rect x="28.0" y="86.0" width="14.0" height="14.0" rx="3" fill="#fbe1d5" stroke="#eb6834" stroke-width="1"/>
<text x="50.0" y="98.0" font-size="12" fill="#52514e">serves: takes in images, answers the world</text>
<rect x="400.0" y="86.0" width="14.0" height="14.0" rx="3" fill="#2a78d6"/>
<text x="422.0" y="98.0" font-size="12" fill="#52514e">rebuilds: replays, sorts, writes off</text>
<text x="28.0" y="144.0" font-size="14" fill="#0b0b0b" font-weight="600">A human</text>
<text x="28.0" y="162.5" font-size="11.5" fill="#52514e">one network</text>
<rect x="283.0" y="130.0" width="324.7" height="36.0" rx="4" fill="#fbe1d5"/>
<text x="445.3" y="152.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">awake</text>
<rect x="609.7" y="130.0" width="161.3" height="36.0" rx="4" fill="#2a78d6"/>
<text x="690.3" y="152.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600">asleep</text>
<line x1="28.0" y1="190.0" x2="772.0" y2="190.0" stroke="#e9e8e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="222.0" font-size="14" fill="#0b0b0b" font-weight="600">A dolphin</text>
<text x="28.0" y="240.5" font-size="11.5" fill="#52514e">two halves of the brain</text>
<text x="272.0" y="223.0" font-size="11" fill="#52514e" text-anchor="end">left half</text>
<rect x="283.0" y="208.0" width="38.8" height="22.0" rx="4" fill="#fbe1d5"/>
<rect x="323.8" y="208.0" width="38.8" height="22.0" rx="4" fill="#2a78d6"/>
<rect x="364.7" y="208.0" width="120.5" height="22.0" rx="4" fill="#fbe1d5"/>
<rect x="487.2" y="208.0" width="38.8" height="22.0" rx="4" fill="#2a78d6"/>
<rect x="528.0" y="208.0" width="120.5" height="22.0" rx="4" fill="#fbe1d5"/>
<rect x="650.5" y="208.0" width="38.8" height="22.0" rx="4" fill="#2a78d6"/>
<rect x="691.3" y="208.0" width="79.7" height="22.0" rx="4" fill="#fbe1d5"/>
<text x="272.0" y="251.0" font-size="11" fill="#52514e" text-anchor="end">right half</text>
<rect x="283.0" y="236.0" width="120.5" height="22.0" rx="4" fill="#fbe1d5"/>
<rect x="405.5" y="236.0" width="38.8" height="22.0" rx="4" fill="#2a78d6"/>
<rect x="446.3" y="236.0" width="120.5" height="22.0" rx="4" fill="#fbe1d5"/>
<rect x="568.8" y="236.0" width="38.8" height="22.0" rx="4" fill="#2a78d6"/>
<rect x="609.7" y="236.0" width="120.5" height="22.0" rx="4" fill="#fbe1d5"/>
<rect x="732.2" y="236.0" width="38.8" height="22.0" rx="4" fill="#2a78d6"/>
<line x1="28.0" y1="280.0" x2="772.0" y2="280.0" stroke="#e9e8e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="312.0" font-size="14" fill="#0b0b0b" font-weight="600"><tspan x="28.0" dy="0.0">A machine with</tspan><tspan x="28.0" dy="17.5">spare resources</tspan></text>
<text x="28.0" y="348.0" font-size="11.5" fill="#52514e">copies of one network</text>
<text x="272.0" y="313.0" font-size="11" fill="#52514e" text-anchor="end">copy 1</text>
<rect x="283.0" y="298.0" width="243.0" height="22.0" rx="4" fill="#fbe1d5"/>
<text x="404.5" y="313.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">works</text>
<rect x="528.0" y="298.0" width="243.0" height="22.0" rx="4" fill="#2a78d6"/>
<text x="649.5" y="313.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600">is rebuilt</text>
<text x="272.0" y="341.0" font-size="11" fill="#52514e" text-anchor="end">copy 2</text>
<rect x="283.0" y="326.0" width="243.0" height="22.0" rx="4" fill="#2a78d6"/>
<text x="404.5" y="341.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600">is rebuilt</text>
<rect x="528.0" y="326.0" width="243.0" height="22.0" rx="4" fill="#fbe1d5"/>
<text x="649.5" y="341.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">works</text>
<line x1="282.0" y1="384.0" x2="772.0" y2="384.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="772.0" y="402.0" font-size="11.5" fill="#52514e" text-anchor="end">time</text>
