<svg xmlns="http://www.w3.org/2000/svg" width="760" height="634" viewBox="0 0 760 634" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>What must not happen</title>

<rect x="0.5" y="0.5" width="759" height="633" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">What must not happen</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">The page from Oleg's notebook: six prohibitions, written before the outcome. The clauses are judged by Oleg.</text>
<text x="425.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">where the needle stands in 2026</text>
<text x="662.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">the first day to come</text>
<line x1="28.0" y1="118.0" x2="736.0" y2="118.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="144.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">1. labour's share of world</tspan><tspan x="34.0" dy="15.6">income rises ten years in a row</tspan></text>
<text x="34.0" y="177.0" font-size="11" fill="#8a8985">against 12, 27</text>
<rect x="267.0" y="124.0" width="316.0" height="62.0" rx="6" fill="#fdf3d7"/>
<text x="425.0" y="151.0" font-size="12" fill="#8a6200" text-anchor="middle">up three years running:</text>
<text x="425.0" y="167.0" font-size="12" fill="#8a6200" text-anchor="middle">52.1% in 2022, 52.7% in 2025</text>
<text x="662.0" y="151.0" font-size="12" fill="#0b0b0b" text-anchor="middle">the figure</text>
<text x="662.0" y="167.0" font-size="12" fill="#0b0b0b" text-anchor="middle">for 2032</text>
<line x1="28.0" y1="192.0" x2="736.0" y2="192.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="218.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">2. the birth rate of the rich</tspan><tspan x="34.0" dy="15.6">returns above 2.1 for ten years</tspan></text>
<text x="34.0" y="251.0" font-size="11" fill="#8a8985">no coercion; against 11, 26</text>
<rect x="267.0" y="198.0" width="316.0" height="62.0" rx="6" fill="#fdf3d7"/>
<text x="425.0" y="225.0" font-size="12" fill="#8a6200" text-anchor="middle">about 1.5; Korea up two years;</text>
<text x="425.0" y="241.0" font-size="12" fill="#8a6200" text-anchor="middle">Israel never fell; Kazakhstan came back</text>
<text x="662.0" y="225.0" font-size="12" fill="#0b0b0b" text-anchor="middle">not before</text>
<text x="662.0" y="241.0" font-size="12" fill="#0b0b0b" text-anchor="middle">the 2040s</text>
<line x1="28.0" y1="266.0" x2="736.0" y2="266.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="292.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">3. the age of a first discovery</tspan><tspan x="34.0" dy="15.6">falls, the authors are people</tspan></text>
<text x="34.0" y="325.0" font-size="11" fill="#8a8985">against 53</text>
<rect x="267.0" y="272.0" width="316.0" height="62.0" rx="6" fill="#efeeea"/>
<text x="425.0" y="299.0" font-size="12" fill="#52514e" text-anchor="middle">rising; the teams</text>
<text x="425.0" y="315.0" font-size="12" fill="#52514e" text-anchor="middle">are growing</text>
<text x="662.0" y="307.0" font-size="12" fill="#0b0b0b" text-anchor="middle">autumn 2041</text>
<line x1="28.0" y1="340.0" x2="736.0" y2="340.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="366.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">4. machines stay below a man</tspan><tspan x="34.0" dy="15.6">for fifteen years more</tspan></text>
<text x="34.0" y="399.0" font-size="11" fill="#8a8985">computing grows; against 05, 16</text>
<rect x="267.0" y="346.0" width="316.0" height="62.0" rx="6" fill="#efeeea"/>
<text x="425.0" y="373.0" font-size="12" fill="#52514e" text-anchor="middle">computing 4–5 times a year;</text>
<text x="425.0" y="389.0" font-size="12" fill="#52514e" text-anchor="middle">an office still needs its people</text>
<text x="662.0" y="381.0" font-size="12" fill="#0b0b0b" text-anchor="middle">autumn 2041</text>
<line x1="28.0" y1="414.0" x2="736.0" y2="414.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="440.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">5. a large country gives up a</tspan><tspan x="34.0" dy="15.6">technology, and the others follow</tspan></text>
<text x="34.0" y="473.0" font-size="11" fill="#8a8985">of its own will; against 27, 28, 65</text>
<rect x="267.0" y="420.0" width="316.0" height="62.0" rx="6" fill="#efeeea"/>
<text x="425.0" y="447.0" font-size="12" fill="#52514e" text-anchor="middle">countries have given up;</text>
<text x="425.0" y="463.0" font-size="12" fill="#52514e" text-anchor="middle">nobody followed</text>
<text x="662.0" y="455.0" font-size="12" fill="#0b0b0b" text-anchor="middle">any morning</text>
<line x1="28.0" y1="488.0" x2="736.0" y2="488.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="514.0" font-size="12.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">6. people with an improved brain</tspan><tspan x="34.0" dy="15.6">overtake pure machines</tspan></text>
<text x="34.0" y="547.0" font-size="11" fill="#8a8985">in open work; against 11, 42</text>
<rect x="267.0" y="494.0" width="316.0" height="62.0" rx="6" fill="#fdf3d7"/>
<text x="425.0" y="521.0" font-size="12" fill="#8a6200" text-anchor="middle">a chip: about 11 bits a second;</text>
<text x="425.0" y="537.0" font-size="12" fill="#8a6200" text-anchor="middle">a healthy head: about 10</text>
<text x="662.0" y="529.0" font-size="12" fill="#0b0b0b" text-anchor="middle">autumn 2041</text>
<line x1="28.0" y1="562.0" x2="736.0" y2="562.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="588.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Under the line, outside the list, what forbids nothing: global determinism (an axiom, 17); that the heir is a life (05);</tspan><tspan x="28.0" dy="14.4">that everything has a mind to a degree (03). Yellow: the needle is moving against Andrey. Figures as printed in 2026.</tspan></text>
</svg>
