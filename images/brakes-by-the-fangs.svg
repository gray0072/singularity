<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>The brake is issued according to the fangs</title>

<rect x="0.5" y="0.5" width="759" height="371" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">The brake is issued according to the fangs</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">A table in the ash: with what one kills one's own, whether there is a brake, and what saves the loser.</text>
<text x="320.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">kills its own with</text>
<text x="476.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">the brake</text>
<text x="642.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">what saves the loser</text>
<line x1="28.0" y1="114.0" x2="736.0" y2="114.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="145.0" font-size="14" fill="#0b0b0b" font-weight="600">the dove, the hare</text>
<text x="40.0" y="162.0" font-size="11" fill="#8a8985">unarmed</text>
<text x="320.0" y="153.0" font-size="12" fill="#0b0b0b" text-anchor="middle">a day of work</text>
<text x="476.0" y="153.0" font-size="12" fill="#0b0b0b" text-anchor="middle">none</text>
<text x="642.0" y="144.5" font-size="12" fill="#008300" text-anchor="middle" font-weight="600">the sky, the legs</text>
<text x="642.0" y="161.5" font-size="12" fill="#e34948" text-anchor="middle">but not in a cage</text>
<line x1="28.0" y1="182.0" x2="736.0" y2="182.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="213.0" font-size="14" fill="#0b0b0b" font-weight="600">the wolf, the raven</text>
<text x="40.0" y="230.0" font-size="11" fill="#8a8985">armed</text>
<text x="320.0" y="221.0" font-size="12" fill="#0b0b0b" text-anchor="middle">one blow</text>
<text x="476.0" y="212.5" font-size="12" fill="#0b0b0b" text-anchor="middle">there is one:</text>
<text x="476.0" y="229.5" font-size="12" fill="#0b0b0b" text-anchor="middle">for its own</text>
<text x="642.0" y="212.5" font-size="12" fill="#008300" text-anchor="middle" font-weight="600">the neck held out</text>
<text x="642.0" y="229.5" font-size="12" fill="#e34948" text-anchor="middle">but not on the border of the pack</text>
<line x1="28.0" y1="250.0" x2="736.0" y2="250.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="281.0" font-size="14" fill="#0b0b0b" font-weight="600">man</text>
<text x="40.0" y="298.0" font-size="11" fill="#8a8985">unarmed in body, armed in hand</text>
<text x="320.0" y="280.5" font-size="12" fill="#0b0b0b" text-anchor="middle">the body: a day of work</text>
<text x="320.0" y="297.5" font-size="12" fill="#0b0b0b" text-anchor="middle">the hand: one blow</text>
<text x="476.0" y="280.5" font-size="12" fill="#0b0b0b" text-anchor="middle">on hot anger:</text>
<text x="476.0" y="297.5" font-size="12" fill="#0b0b0b" text-anchor="middle">answers to a face</text>
<text x="642.0" y="280.5" font-size="12" fill="#008300" text-anchor="middle" font-weight="600">a face at arm's length</text>
<text x="642.0" y="297.5" font-size="12" fill="#e34948" text-anchor="middle">but not at a distance</text>
<line x1="28.0" y1="318.0" x2="736.0" y2="318.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="342.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Rows 1 and 2: Lorenz (1949), with two corrections: the wolves of Yellowstone, 1995–2015 (two thirds of natural</tspan><tspan x="28.0" dy="14.4">deaths are the work of wolves of other packs), and Maynard Smith and Price (1973). Row 3 is Andrey's reading.</tspan></text>
</svg>
