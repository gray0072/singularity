<text x="28.0" y="418.0" font-size="11" fill="#8a8985"><tspan x="28.0" dy="0.0">tools/yard_sale.py, seed 49. Left to play on, the first game ends with one hundred players holding</tspan><tspan x="28.0" dy="13.8">everything; the second stops with the richest hundred at about a third and the poorer half at about a seventh.</tspan></text>
