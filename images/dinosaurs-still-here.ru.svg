<svg xmlns="http://www.w3.org/2000/svg" width="760" height="404" viewBox="0 0 760 404" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Динозавры, которые никуда не делись</title>
<defs><marker id="arrow-2a78d6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#2a78d6"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="403" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Динозавры, которые никуда не делись</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Одна ветвь прошла через камень 66 миллионов лет назад. Мы зовём её птицами.</text>
<line x1="100.0" y1="108.0" x2="308.7" y2="236.0" stroke="#52514e" stroke-width="2" stroke-linecap="round"/>
<line x1="527.8" y1="90.0" x2="527.8" y2="248.0" stroke="#e34948" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5"/>
<line x1="100.0" y1="108.0" x2="527.8" y2="108.0" stroke="#52514e" stroke-width="2" stroke-linecap="round"/>
<circle cx="527.8" cy="108.0" r="4.0" fill="#52514e"/>
<text x="114.0" y="101.0" font-size="12.5" fill="#52514e">трёхрогие и их родня</text>
<line x1="152.2" y1="140.0" x2="527.8" y2="140.0" stroke="#52514e" stroke-width="2" stroke-linecap="round"/>
<circle cx="527.8" cy="140.0" r="4.0" fill="#52514e"/>
<text x="166.2" y="133.0" font-size="12.5" fill="#52514e">длинношеие гиганты</text>
<line x1="204.3" y1="172.0" x2="527.8" y2="172.0" stroke="#52514e" stroke-width="2" stroke-linecap="round"/>
<circle cx="527.8" cy="172.0" r="4.0" fill="#52514e"/>
<text x="218.3" y="165.0" font-size="12.5" fill="#52514e">тираннозавры</text>
<line x1="256.5" y1="204.0" x2="527.8" y2="204.0" stroke="#52514e" stroke-width="2" stroke-linecap="round"/>
<circle cx="527.8" cy="204.0" r="4.0" fill="#52514e"/>
<text x="270.5" y="197.0" font-size="12.5" fill="#52514e">мелкие пернатые охотники</text>
<line x1="308.7" y1="236.0" x2="700.0" y2="236.0" stroke="#2a78d6" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-2a78d6)"/>
<text x="322.7" y="228.0" font-size="14" fill="#2a78d6" font-weight="600">птицы</text>
<text x="308.7" y="266.0" font-size="11.5" fill="#8a8985" text-anchor="middle">около 150 млн лет назад</text>
<text x="527.8" y="266.0" font-size="11.5" fill="#e34948" text-anchor="middle">камень: 66 млн лет назад</text>
<text x="716.0" y="266.0" font-size="11.5" fill="#8a8985" text-anchor="end">сегодня</text>
<line x1="28.0" y1="282.0" x2="732.0" y2="282.0" stroke="#e9e8e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="250.0" y="311.0" font-size="12.5" fill="#52514e" text-anchor="end">видов птиц сегодня</text>
<rect x="262.0" y="296.0" width="360.0" height="20.0" rx="3" fill="#2a78d6"/>
<text x="632.0" y="311.0" font-size="13" fill="#0b0b0b" font-weight="600">около 11 000</text>
<text x="250.0" y="341.0" font-size="12.5" fill="#52514e" text-anchor="end">видов млекопитающих сегодня</text>
<rect x="262.0" y="326.0" width="212.7" height="20.0" rx="3" fill="#eb6834"/>
<text x="484.7" y="341.0" font-size="13" fill="#0b0b0b" font-weight="600">около 6 500</text>
<text x="28.0" y="376.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Схема: в масштабе только порядок ветвления и две даты.</tspan><tspan x="28.0" dy="14.4">Числа видов округлены и зависят от того, кто считает.</tspan></text>
</svg>
