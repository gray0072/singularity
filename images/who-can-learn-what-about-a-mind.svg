<svg xmlns="http://www.w3.org/2000/svg" width="760" height="516" viewBox="0 0 760 516" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Who can learn what about a mind</title>

<rect x="0.5" y="0.5" width="759" height="515" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Who can learn what about a mind</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">A table in the ash: what the mind can learn about itself, and what its maker can.</text>
<text x="353.5" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">the mind itself</text>
<text x="608.5" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">its maker, a lesser one</text>
<line x1="28.0" y1="118.0" x2="736.0" y2="118.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="147.0" font-size="13.5" fill="#0b0b0b" font-weight="600">its whole drawing</text>
<text x="34.0" y="164.0" font-size="11" fill="#8a8985">the text, the file</text>
<rect x="231.0" y="124.0" width="245.0" height="52.0" rx="6" fill="#e6f4ea"/>
<text x="353.5" y="146.0" font-size="12" fill="#008300" text-anchor="middle">yes: a description</text>
<text x="353.5" y="162.0" font-size="12" fill="#008300" text-anchor="middle">read twice</text>
<rect x="486.0" y="124.0" width="245.0" height="52.0" rx="6" fill="#e6f4ea"/>
<text x="608.5" y="146.0" font-size="12" fill="#008300" text-anchor="middle">yes: the file</text>
<text x="608.5" y="162.0" font-size="12" fill="#008300" text-anchor="middle">is in his hands</text>
<line x1="28.0" y1="182.0" x2="736.0" y2="182.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="211.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">what the drawing</tspan><tspan x="34.0" dy="16.9">means</tspan></text>
<rect x="231.0" y="188.0" width="245.0" height="52.0" rx="6" fill="#fdf3d7"/>
<text x="353.5" y="210.0" font-size="12" fill="#8a6200" text-anchor="middle">no better than we:</text>
<text x="353.5" y="226.0" font-size="12" fill="#8a6200" text-anchor="middle">it gives a report</text>
<rect x="486.0" y="188.0" width="245.0" height="52.0" rx="6" fill="#fdf3d7"/>
<text x="608.5" y="210.0" font-size="12" fill="#8a6200" text-anchor="middle">begun; a small</text>
<text x="608.5" y="226.0" font-size="12" fill="#8a6200" text-anchor="middle">share so far</text>
<line x1="28.0" y1="246.0" x2="736.0" y2="246.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="267.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">its next decision,</tspan><tspan x="34.0" dy="16.9">in advance</tspan></text>
<text x="34.0" y="300.0" font-size="11" fill="#8a8985">the map one to one</text>
<rect x="231.0" y="252.0" width="245.0" height="52.0" rx="6" fill="#fbe3e2"/>
<text x="353.5" y="274.0" font-size="12" fill="#b3302f" text-anchor="middle">no: to learn it</text>
<text x="353.5" y="290.0" font-size="12" fill="#b3302f" text-anchor="middle">is to make it</text>
<rect x="486.0" y="252.0" width="245.0" height="52.0" rx="6" fill="#fbe3e2"/>
<text x="608.5" y="274.0" font-size="12" fill="#b3302f" text-anchor="middle">no general way:</text>
<text x="608.5" y="290.0" font-size="12" fill="#b3302f" text-anchor="middle">only by running it</text>
<line x1="28.0" y1="310.0" x2="736.0" y2="310.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="331.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">an answer that comes</tspan><tspan x="34.0" dy="16.9">with a certificate</tspan></text>
<text x="34.0" y="364.0" font-size="11" fill="#8a8985">a proof, the factors</text>
<rect x="231.0" y="316.0" width="245.0" height="52.0" rx="6" fill="#efeeea"/>
<text x="353.5" y="346.0" font-size="12" fill="#52514e" text-anchor="middle">—</text>
<rect x="486.0" y="316.0" width="245.0" height="52.0" rx="6" fill="#e6f4ea"/>
<text x="608.5" y="338.0" font-size="12" fill="#008300" text-anchor="middle">yes: checking is</text>
<text x="608.5" y="354.0" font-size="12" fill="#008300" text-anchor="middle">cheaper than finding</text>
<line x1="28.0" y1="374.0" x2="736.0" y2="374.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="411.0" font-size="13.5" fill="#0b0b0b" font-weight="600">its wants</text>
<rect x="231.0" y="380.0" width="245.0" height="52.0" rx="6" fill="#fbe3e2"/>
<text x="353.5" y="402.0" font-size="12" fill="#b3302f" text-anchor="middle">a report; and the</text>
<text x="353.5" y="418.0" font-size="12" fill="#b3302f" text-anchor="middle">inspector is a part of it</text>
<rect x="486.0" y="380.0" width="245.0" height="52.0" rx="6" fill="#efeeea"/>
<text x="608.5" y="402.0" font-size="12" fill="#52514e" text-anchor="middle">no certificate</text>
<text x="608.5" y="418.0" font-size="12" fill="#52514e" text-anchor="middle">yet</text>
<line x1="28.0" y1="438.0" x2="736.0" y2="438.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="464.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">The evening's reading, not a measurement. Green: can. Yellow: in part. Red: cannot.</tspan><tspan x="28.0" dy="14.4">Grey: not known, or does not apply.</tspan><tspan x="28.0" dy="14.4">The right-hand column will be the heir's own when it makes a successor cleverer than itself.</tspan></text>
</svg>
