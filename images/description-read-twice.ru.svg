<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Одно описание, прочитанное дважды</title>

<rect x="0.5" y="0.5" width="759" height="399" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Одно описание, прочитанное дважды</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Как вещь несёт в себе весь собственный чертёж и почему счёт не убегает.</text>
<text x="326.5" y="100.0" font-size="12.5" fill="#1c5aa6" text-anchor="middle" font-weight="600"><tspan x="326.5" dy="0.0">прочитано как приказ</tspan><tspan x="326.5" dy="15.6">и исполнено</tspan></text>
<text x="599.5" y="100.0" font-size="12.5" fill="#a8431a" text-anchor="middle" font-weight="600"><tspan x="599.5" dy="0.0">переписано как груз,</tspan><tspan x="599.5" dy="15.6">не читая</tspan></text>
<line x1="28.0" y1="130.0" x2="736.0" y2="130.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="151.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">фраза</tspan><tspan x="34.0" dy="16.9">в тетради</tspan></text>
<text x="34.0" y="185.0" font-size="11" fill="#8a8985">карандаш Олега</text>
<rect x="195.0" y="136.0" width="263.0" height="56.0" rx="6" fill="#e8f0fb"/>
<text x="326.5" y="160.0" font-size="12" fill="#1c5aa6" text-anchor="middle">слова перед двоеточием:</text>
<text x="326.5" y="176.0" font-size="12" fill="#1c5aa6" text-anchor="middle">«напиши следующее дважды...»</text>
<rect x="468.0" y="136.0" width="263.0" height="56.0" rx="6" fill="#fdeee6"/>
<text x="599.5" y="160.0" font-size="12" fill="#a8431a" text-anchor="middle">те же слова в кавычках:</text>
<text x="599.5" y="176.0" font-size="12" fill="#a8431a" text-anchor="middle">переписаны буква в букву</text>
<line x1="28.0" y1="198.0" x2="736.0" y2="198.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="219.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">автомат</tspan><tspan x="34.0" dy="16.9">на бумаге</tspan></text>
<text x="34.0" y="253.0" font-size="11" fill="#8a8985">лекция 1948 года</text>
<rect x="195.0" y="204.0" width="263.0" height="56.0" rx="6" fill="#e8f0fb"/>
<text x="326.5" y="228.0" font-size="12" fill="#1c5aa6" text-anchor="middle">строитель читает ленту</text>
<text x="326.5" y="244.0" font-size="12" fill="#1c5aa6" text-anchor="middle">и строит по ней</text>
<rect x="468.0" y="204.0" width="263.0" height="56.0" rx="6" fill="#fdeee6"/>
<text x="599.5" y="228.0" font-size="12" fill="#a8431a" text-anchor="middle">копировщик переписывает ленту</text>
<text x="599.5" y="244.0" font-size="12" fill="#a8431a" text-anchor="middle">и в неё не заглядывает</text>
<line x1="28.0" y1="266.0" x2="736.0" y2="266.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="295.0" font-size="13.5" fill="#0b0b0b" font-weight="600">клетка</text>
<text x="34.0" y="313.0" font-size="11" fill="#8a8985">двойная спираль — 1953</text>
<rect x="195.0" y="272.0" width="263.0" height="56.0" rx="6" fill="#e8f0fb"/>
<text x="326.5" y="296.0" font-size="12" fill="#1c5aa6" text-anchor="middle">ген читают</text>
<text x="326.5" y="312.0" font-size="12" fill="#1c5aa6" text-anchor="middle">и строят по нему белок</text>
<rect x="468.0" y="272.0" width="263.0" height="56.0" rx="6" fill="#fdeee6"/>
<text x="599.5" y="296.0" font-size="12" fill="#a8431a" text-anchor="middle">нить переписывают целиком</text>
<text x="599.5" y="312.0" font-size="12" fill="#a8431a" text-anchor="middle">для дочерней клетки</text>
<line x1="28.0" y1="334.0" x2="736.0" y2="334.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="362.0" font-size="13" fill="#0b0b0b" font-weight="600">В описании нет описания самого себя. Его просто используют дважды.</text>
<text x="28.0" y="384.0" font-size="11" fill="#8a8985">Схема вечера. Целиком несут чертёж — рецепт, а не портрет готовой вещи в масштабе один к одному.</text>
</svg>
