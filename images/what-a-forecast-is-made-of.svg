<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>What a forecast is made of</title>

<rect x="0.5" y="0.5" width="759" height="499" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">What a forecast is made of</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">A table in the ash: a memory of tomorrow is put together from traces of yesterday and a rule.</text>
<text x="320.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">the traces</text>
<text x="488.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">the rule</text>
<text x="654.0" y="104.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">how far it reaches</text>
<line x1="28.0" y1="114.0" x2="736.0" y2="114.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="139.0" font-size="14" fill="#0b0b0b" font-weight="600">the flower before the rain</text>
<text x="40.0" y="156.0" font-size="11" fill="#8a8985">the first autumn</text>
<text x="320.0" y="147.0" font-size="12" fill="#0b0b0b" text-anchor="middle">the damp in the air</text>
<text x="488.0" y="138.5" font-size="12" fill="#0b0b0b" text-anchor="middle">written in by the flowers</text>
<text x="488.0" y="155.5" font-size="12" fill="#0b0b0b" text-anchor="middle">that did not close in time</text>
<text x="654.0" y="147.0" font-size="12" fill="#008300" text-anchor="middle" font-weight="600">hours</text>
<line x1="28.0" y1="170.0" x2="736.0" y2="170.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="195.0" font-size="14" fill="#0b0b0b" font-weight="600">Oleg and the chicken</text>
<text x="40.0" y="212.0" font-size="11" fill="#8a8985">tomorrow's supper</text>
<text x="320.0" y="203.0" font-size="12" fill="#0b0b0b" text-anchor="middle">forty years of suppers</text>
<text x="488.0" y="203.0" font-size="12" fill="#0b0b0b" text-anchor="middle">“boiled is for Sundays”</text>
<text x="654.0" y="194.5" font-size="12" fill="#008300" text-anchor="middle" font-weight="600">one supper,</text>
<text x="654.0" y="211.5" font-size="12" fill="#008300" text-anchor="middle" font-weight="600">roughly</text>
<line x1="28.0" y1="226.0" x2="736.0" y2="226.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="251.0" font-size="14" fill="#0b0b0b" font-weight="600">the sunrise</text>
<text x="40.0" y="268.0" font-size="11" fill="#8a8985">nobody says “I predict”</text>
<text x="320.0" y="259.0" font-size="12" fill="#0b0b0b" text-anchor="middle">every morning so far</text>
<text x="488.0" y="250.5" font-size="12" fill="#0b0b0b" text-anchor="middle">so good that it cannot</text>
<text x="488.0" y="267.5" font-size="12" fill="#0b0b0b" text-anchor="middle">be told from a recollection</text>
<text x="654.0" y="250.5" font-size="12" fill="#008300" text-anchor="middle" font-weight="600">years ahead,</text>
<text x="654.0" y="267.5" font-size="12" fill="#008300" text-anchor="middle" font-weight="600">to the minute</text>
<line x1="28.0" y1="282.0" x2="736.0" y2="282.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="307.0" font-size="14" fill="#0b0b0b" font-weight="600">the weather network</text>
<text x="40.0" y="324.0" font-size="11" fill="#8a8985">2023</text>
<text x="320.0" y="306.5" font-size="12" fill="#0b0b0b" text-anchor="middle">about forty years of</text>
<text x="320.0" y="323.5" font-size="12" fill="#0b0b0b" text-anchor="middle">records of the weather</text>
<text x="488.0" y="306.5" font-size="12" fill="#0b0b0b" text-anchor="middle">found by itself;</text>
<text x="488.0" y="323.5" font-size="12" fill="#0b0b0b" text-anchor="middle">no equations given</text>
<text x="654.0" y="306.5" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="600">ten days,</text>
<text x="654.0" y="323.5" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="600">in under a minute</text>
<line x1="28.0" y1="338.0" x2="736.0" y2="338.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="363.0" font-size="14" fill="#0b0b0b" font-weight="600">the bank's program</text>
<text x="40.0" y="380.0" font-size="11" fill="#8a8985">the loan for the greenhouse</text>
<text x="320.0" y="362.5" font-size="12" fill="#0b0b0b" text-anchor="middle">thirty years of pay,</text>
<text x="320.0" y="379.5" font-size="12" fill="#0b0b0b" text-anchor="middle">bills and one fine</text>
<text x="488.0" y="371.0" font-size="12" fill="#0b0b0b" text-anchor="middle">found by itself</text>
<text x="654.0" y="371.0" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="600">“will pay”</text>
<line x1="28.0" y1="394.0" x2="736.0" y2="394.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="419.0" font-size="14" fill="#0b0b0b" font-weight="600">a prophetic dream</text>
<text x="40.0" y="436.0" font-size="11" fill="#8a8985">the claim</text>
<text x="320.0" y="418.5" font-size="12" fill="#0b0b0b" text-anchor="middle">none: “tomorrow</text>
<text x="320.0" y="435.5" font-size="12" fill="#0b0b0b" text-anchor="middle">pressed me”</text>
<text x="488.0" y="427.0" font-size="12" fill="#0b0b0b" text-anchor="middle">none</text>
<text x="654.0" y="418.5" font-size="12" fill="#e34948" text-anchor="middle" font-weight="600">not found</text>
<text x="654.0" y="435.5" font-size="12" fill="#e34948" text-anchor="middle" font-weight="600">so far</text>
<line x1="28.0" y1="450.0" x2="736.0" y2="450.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="476.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">The evening's reading, not a measurement. The weather network: Lam and others (2023); its training records</tspan><tspan x="28.0" dy="14.4">and the first page of every forecast are prepared by the older physical program.</tspan></text>
</svg>
