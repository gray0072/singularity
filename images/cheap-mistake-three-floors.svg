<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>One cheap mistake on three floors</title>

<rect x="0.5" y="0.5" width="759" height="399" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">One cheap mistake on three floors</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Andrey's guess, not an accepted theory: what laughter marks in play, in tickling and in a joke.</text>
<rect x="478.0" y="86.0" width="130.0" height="266.0" rx="0" fill="#1baf7a" fill-opacity="0.1"/>
<rect x="608.0" y="86.0" width="128.0" height="266.0" rx="0" fill="#e34948" fill-opacity="0.09"/>
<text x="257.0" y="113.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">the forecast said</text>
<text x="407.0" y="113.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">what came</text>
<text x="543.0" y="113.0" font-size="12.5" fill="#1baf7a" text-anchor="middle" font-weight="600">the mistake is cheap</text>
<text x="672.0" y="105.0" font-size="12.5" fill="#e34948" text-anchor="middle" font-weight="600"><tspan x="672.0" dy="0.0">the same mistake,</tspan><tspan x="672.0" dy="15.6">expensive</tspan></text>
<line x1="28.0" y1="130.0" x2="736.0" y2="130.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="160.0" font-size="15" fill="#0b0b0b" font-weight="600">play</text>
<text x="28.0" y="178.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">rats, wolves,</tspan><tspan x="28.0" dy="14.4">apes, us</tspan></text>
<text x="257.0" y="172.0" font-size="13" fill="#0b0b0b" text-anchor="middle">a bite</text>
<text x="407.0" y="164.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="407.0" dy="0.0">a bite that</tspan><tspan x="407.0" dy="16.2">is not a bite</tspan></text>
<text x="543.0" y="164.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="543.0" dy="0.0">a chirp, a bow,</tspan><tspan x="543.0" dy="16.2">panting</tspan></text>
<text x="672.0" y="172.0" font-size="13" fill="#0b0b0b" text-anchor="middle">a fight</text>
<line x1="28.0" y1="204.0" x2="736.0" y2="204.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="234.0" font-size="15" fill="#0b0b0b" font-weight="600">tickling</text>
<text x="28.0" y="252.0" font-size="11.5" fill="#8a8985">rats, apes, us</text>
<text x="257.0" y="238.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="257.0" dy="0.0">an attack on the neck</tspan><tspan x="257.0" dy="16.2">and the belly</tspan></text>
<text x="407.0" y="238.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="407.0" dy="0.0">one of your own,</tspan><tspan x="407.0" dy="16.2">and no harm</tspan></text>
<text x="543.0" y="246.0" font-size="13" fill="#0b0b0b" text-anchor="middle">laughter</text>
<text x="672.0" y="238.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="672.0" dy="0.0">a predator:</tspan><tspan x="672.0" dy="16.2">fear</tspan></text>
<line x1="28.0" y1="278.0" x2="736.0" y2="278.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="308.0" font-size="15" fill="#0b0b0b" font-weight="600">a joke</text>
<text x="28.0" y="326.0" font-size="11.5" fill="#8a8985">us</text>
<text x="257.0" y="312.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="257.0" dy="0.0">one meaning</tspan><tspan x="257.0" dy="16.2">of the words</tspan></text>
<text x="407.0" y="320.0" font-size="13" fill="#0b0b0b" text-anchor="middle">another meaning</text>
<text x="543.0" y="312.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="543.0" dy="0.0">mirth:</tspan><tspan x="543.0" dy="16.2">the bonus</tspan></text>
<text x="672.0" y="312.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="672.0" dy="0.0">a heavy image:</tspan><tspan x="672.0" dy="16.2">an offence</tspan></text>
<line x1="28.0" y1="352.0" x2="736.0" y2="352.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="384.0" font-size="11.5" fill="#8a8985">A scheme, not measured data. The bonus for a mistake found: Hurley, Dennett &amp; Adams (2011).</text>
</svg>
