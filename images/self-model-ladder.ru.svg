<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Лестница, а не выключатель</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Признаки модели самого себя, снизу вверх. Где включается «настоящее» сознание?</text>
