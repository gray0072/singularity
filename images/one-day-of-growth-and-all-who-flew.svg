<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>One day of growth, and everybody who ever flew</title>

<rect x="0.5" y="0.5" width="759" height="355" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">One day of growth, and everybody who ever flew</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">People, a logarithmic scale: every step to the right is ten times more.</text>
<line x1="300.0" y1="90.0" x2="300.0" y2="252.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="270.0" font-size="11" fill="#8a8985">10</text>
<line x1="384.0" y1="90.0" x2="384.0" y2="252.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="384.0" y="270.0" font-size="11" fill="#8a8985" text-anchor="middle">100</text>
<line x1="468.0" y1="90.0" x2="468.0" y2="252.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="468.0" y="270.0" font-size="11" fill="#8a8985" text-anchor="middle">1,000</text>
<line x1="552.0" y1="90.0" x2="552.0" y2="252.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="552.0" y="270.0" font-size="11" fill="#8a8985" text-anchor="middle">10,000</text>
<line x1="636.0" y1="90.0" x2="636.0" y2="252.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="636.0" y="270.0" font-size="11" fill="#8a8985" text-anchor="middle">100,000</text>
<line x1="720.0" y1="90.0" x2="720.0" y2="252.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="720.0" y="270.0" font-size="11" fill="#8a8985" text-anchor="end">a million</text>
<text x="28.0" y="118.0" font-size="13" fill="#0b0b0b" font-weight="600">added to mankind in one day</text>
<text x="28.0" y="134.0" font-size="11" fill="#8a8985">2026: 363 thousand born, 174 thousand died</text>
<rect x="300.0" y="109.0" width="359.2" height="20.0" rx="3" fill="#e34948"/>
<text x="651.2" y="124.0" font-size="12" fill="#ffffff" text-anchor="end" font-weight="600">189,000</text>
<text x="28.0" y="170.0" font-size="13" fill="#0b0b0b" font-weight="600">reached orbit in all 65 years</text>
<text x="28.0" y="186.0" font-size="11" fill="#8a8985">from April 1961 to November 2026</text>
<rect x="300.0" y="161.0" width="152.3" height="20.0" rx="3" fill="#eb6834"/>
<text x="460.3" y="176.0" font-size="12" fill="#0b0b0b" font-weight="600">about 650</text>
<text x="28.0" y="222.0" font-size="13" fill="#0b0b0b" font-weight="600">launched into orbit in a year</text>
<text x="28.0" y="238.0" font-size="11" fill="#8a8985">2025, eight flights</text>
<rect x="300.0" y="213.0" width="37.6" height="20.0" rx="3" fill="#eb6834"/>
<text x="345.6" y="228.0" font-size="12" fill="#0b0b0b" font-weight="600">28</text>
<text x="28.0" y="302.0" font-size="13" fill="#0b0b0b" font-weight="600">To stop the growth by carrying people away, the upper bar would have to lift off every day.</text>
<text x="28.0" y="332.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Births and deaths: the United Nations' projection (2024 revision, medium variant). Those who reached orbit: a tally of</tspan><tspan x="28.0" dy="14.4">mid-November 2026. The year 2025: a count of crewed orbital flights.</tspan></text>
</svg>
