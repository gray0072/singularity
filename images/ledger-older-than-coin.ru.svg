<text x="241.4" y="210.0" font-size="11" fill="#8a8985" text-anchor="middle">2000 до н. э.</text>
<line x1="355.7" y1="190.0" x2="355.7" y2="195.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="355.7" y="210.0" font-size="11" fill="#8a8985" text-anchor="middle">1000 до н. э.</text>
<line x1="470.1" y1="190.0" x2="470.1" y2="195.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="470.1" y="210.0" font-size="11" fill="#8a8985" text-anchor="middle">1 н. э.</text>
<line x1="584.3" y1="190.0" x2="584.3" y2="195.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="584.3" y="210.0" font-size="11" fill="#8a8985" text-anchor="middle">1000</text>
<line x1="698.6" y1="190.0" x2="698.6" y2="195.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="698.6" y="210.0" font-size="11" fill="#8a8985" text-anchor="middle">2000</text>
<line x1="92.9" y1="190.0" x2="92.9" y2="150.0" stroke="#eb6834" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="92.9" cy="190.0" r="5.0" fill="#eb6834"/>
<text x="62.0" y="104.0" font-size="14" fill="#0b0b0b" font-weight="600">глиняные таблички Урука</text>
<text x="62.0" y="122.0" font-size="12" fill="#52514e">учёт: ячмень, пиво, овцы</text>
<text x="62.0" y="140.0" font-size="12" fill="#eb6834" font-weight="600">около 3300 до н. э.</text>
<line x1="398.0" y1="190.0" x2="398.0" y2="150.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="398.0" cy="190.0" r="5.0" fill="#2a78d6"/>
<text x="398.0" y="104.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">первые монеты</text>
<text x="398.0" y="122.0" font-size="12" fill="#52514e" text-anchor="middle">Лидия</text>
<text x="398.0" y="140.0" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="600">около 630 до н. э.</text>
<line x1="701.5" y1="190.0" x2="701.5" y2="150.0" stroke="#1baf7a" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="701.5" cy="190.0" r="5.0" fill="#1baf7a"/>
<text x="716.0" y="104.0" font-size="14" fill="#0b0b0b" text-anchor="end" font-weight="600">цифра в книге банка</text>
<text x="716.0" y="122.0" font-size="12" fill="#52514e" text-anchor="end">большая часть денег не была бумагой</text>
<text x="716.0" y="140.0" font-size="12" fill="#1baf7a" text-anchor="end" font-weight="600">сегодня</text>
<line x1="96.9" y1="236.0" x2="394.0" y2="236.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
