<text x="245.4" y="256.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">27 веков</text>
<line x1="402.0" y1="236.0" x2="697.5" y2="236.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<line x1="402.0" y1="230.0" x2="402.0" y2="242.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<line x1="697.5" y1="230.0" x2="697.5" y2="242.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="549.8" y="256.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">26 веков</text>
<text x="28.0" y="286.0" font-size="11.5" fill="#8a8985">Даты округлены. Между соседями та же книга ведётся в двух головах, безо всякой глины.</text>
