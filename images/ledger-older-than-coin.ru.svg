<svg xmlns="http://www.w3.org/2000/svg" width="760" height="306" viewBox="0 0 760 306" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Учётная книга старше монеты</title>

<rect x="0.5" y="0.5" width="759" height="305" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Учётная книга старше монеты</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">На чём вели запись о том, кто кому что дал.</text>
<line x1="60.0" y1="190.0" x2="716.0" y2="190.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
