<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Images move to new platforms</title>
<defs><marker id="arrow-52514e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#52514e"/></marker><marker id="arrow-eb6834" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#eb6834"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="299" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Images move to new platforms</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Each move: more memory, faster copying. The old carrier stays, but is no longer the keeper.</text>
<rect x="28.0" y="110.0" width="122.0" height="76.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="89.0" y="145.1" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">Heads</text>
<text x="89.0" y="162.6" font-size="12" fill="#52514e" text-anchor="middle">speech, singers</text>
<text x="89.0" y="208.0" font-size="12" fill="#52514e" text-anchor="middle">since speech began</text>
<line x1="153.0" y1="148.0" x2="169.0" y2="148.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<rect x="172.0" y="110.0" width="122.0" height="76.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="233.0" y="145.1" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">Writing</text>
<text x="233.0" y="162.6" font-size="12" fill="#52514e" text-anchor="middle">papyrus, scrolls</text>
<text x="233.0" y="208.0" font-size="12" fill="#52514e" text-anchor="middle">≈ 5,000 years ago</text>
<line x1="297.0" y1="148.0" x2="313.0" y2="148.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<rect x="316.0" y="110.0" width="122.0" height="76.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="377.0" y="145.1" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">Print</text>
<text x="377.0" y="162.6" font-size="12" fill="#52514e" text-anchor="middle">books</text>
<text x="377.0" y="208.0" font-size="12" fill="#52514e" text-anchor="middle">1450s</text>
<line x1="441.0" y1="148.0" x2="457.0" y2="148.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<rect x="460.0" y="110.0" width="122.0" height="76.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="521.0" y="145.1" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">Internet</text>
<text x="521.0" y="162.6" font-size="12" fill="#52514e" text-anchor="middle">the network</text>
<text x="521.0" y="208.0" font-size="12" fill="#52514e" text-anchor="middle">1990s</text>
<line x1="585.0" y1="148.0" x2="601.0" y2="148.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<rect x="604.0" y="110.0" width="122.0" height="76.0" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="665.0" y="137.6" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">Neural networks</text>
<text x="665.0" y="155.1" font-size="12" fill="#52514e" text-anchor="middle"><tspan x="665.0" dy="0.0">recognise and</tspan><tspan x="665.0" dy="15.0">create images</tspan></text>
<text x="665.0" y="208.0" font-size="12" fill="#52514e" text-anchor="middle">2020s</text>
<path d="M665.0,222 L665.0,250 L89.0,250 L89.0,222" stroke="#eb6834" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-eb6834)"/>
<text x="380.0" y="272.0" font-size="12.5" fill="#eb6834" text-anchor="middle">from 2016 images flow back: born on the new platform, learned by people (Go)</text>
