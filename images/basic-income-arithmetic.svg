<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>A basic income for America, on the back of an envelope</title>

<rect x="0.5" y="0.5" width="759" height="289" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">A basic income for America, on the back of an envelope</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Trillions of dollars a year, 2025.</text>
<text x="288.0" y="104.0" font-size="13.5" fill="#0b0b0b" text-anchor="end">The whole economy (GDP)</text>
<rect x="300.0" y="89.0" width="338.8" height="24.0" rx="4" fill="#8a8985"/>
<text x="646.8" y="106.0" font-size="12.5" fill="#0b0b0b" font-weight="600">30.8 trillion</text>
<text x="288.0" y="148.0" font-size="13.5" fill="#0b0b0b" text-anchor="end">All federal spending</text>
<rect x="300.0" y="133.0" width="77.0" height="24.0" rx="4" fill="#8a8985"/>
<text x="385.0" y="150.0" font-size="12.5" fill="#0b0b0b" font-weight="600">7.0 trillion</text>
<text x="288.0" y="192.0" font-size="13.5" fill="#0b0b0b" text-anchor="end">$1,000 a month × 260 million adults</text>
<rect x="300.0" y="177.0" width="34.1" height="24.0" rx="4" fill="#eb6834"/>
<text x="342.1" y="194.0" font-size="12.5" fill="#0b0b0b" font-weight="600">3.1 trillion</text>
<text x="300.0" y="224.0" font-size="12.5" fill="#eb6834">≈ a tenth of the economy, nearly half of the budget</text>
<text x="28.0" y="276.0" font-size="11" fill="#8a8985">Sources: BEA, CBO (fiscal year 2025); the sum of the OpenResearch experiment, 2020–2023.</text>
</svg>
