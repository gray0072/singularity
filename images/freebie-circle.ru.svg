<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Круг халявы</title>
<defs><marker id="arrow-2a78d6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#2a78d6"/></marker><marker id="arrow-52514e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#52514e"/></marker><marker id="arrow-eb6834" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#eb6834"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="399" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Круг халявы</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Техносфера платит людям, чтобы люди платили ей, — пока ей нужен покупатель-человек.</text>
<rect x="300.0" y="92.0" width="160.0" height="52.0" rx="8" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/>
<text x="380.0" y="122.9" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">Техносфера</text>
<rect x="560.0" y="250.0" width="140.0" height="50.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="630.0" y="279.9" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">Государство</text>
<rect x="60.0" y="250.0" width="140.0" height="50.0" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="130.0" y="279.9" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">Люди</text>
<path d="M460,124 C560,140 620,190 630,246" stroke="#52514e" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="590.0" y="170.0" font-size="12.5" fill="#52514e">налоги</text>
<path d="M558,286 C450,320 310,320 204,286" stroke="#52514e" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="380.0" y="330.0" font-size="12.5" fill="#52514e" text-anchor="middle">базовый доход</text>
<path d="M130,248 C140,190 200,140 298,124" stroke="#2a78d6" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-2a78d6)"/>
<text x="150.0" y="170.0" font-size="12.5" fill="#2a78d6" text-anchor="end">покупки</text>
<path d="M340,146 C320,215 440,215 420,146" stroke="#eb6834" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-eb6834)"/>
<text x="380.0" y="232.0" font-size="12" fill="#eb6834" text-anchor="middle"><tspan x="380.0" dy="0.0">машины покупают у машин:</tspan><tspan x="380.0" dy="15.0">чипы, ЦОДы, электричество</tspan></text>
<text x="380.0" y="382.0" font-size="12" fill="#52514e" text-anchor="middle" font-style="italic">Когда внутренний круг перерастёт внешний, покупатель-человек станет необязательным.</text>
</svg>
