<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Где кончается «то, за чем наблюдают» и начинается «тот, кто наблюдает»?</title>

<rect x="0.5" y="0.5" width="759" height="371" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="17.5" fill="#0b0b0b" font-weight="600">Где кончается «то, за чем наблюдают» и начинается «тот, кто наблюдает»?</text>
<text x="28.0" y="64.0" font-size="13" fill="#52514e">Черту можно провести после любого звена цепочки, и числа выйдут те же (фон Нейман, 1932).</text>
<rect x="28.0" y="150.0" width="82.0" height="54.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="69.0" y="181.1" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">молекула</text>
<line x1="120.8" y1="128.0" x2="120.8" y2="226.0" stroke="#008300" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<rect x="131.7" y="150.0" width="82.0" height="54.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="172.7" y="173.2" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600"><tspan x="172.7" dy="0.0">крупинка</tspan><tspan x="172.7" dy="15.6">света</tspan></text>
<line x1="224.5" y1="128.0" x2="224.5" y2="226.0" stroke="#8a8985" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<rect x="235.3" y="150.0" width="82.0" height="54.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="276.3" y="173.2" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600"><tspan x="276.3" dy="0.0">стенка,</tspan><tspan x="276.3" dy="15.6">счётчик</tspan></text>
<line x1="328.2" y1="128.0" x2="328.2" y2="226.0" stroke="#8a8985" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<rect x="339.0" y="150.0" width="82.0" height="54.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="380.0" y="181.1" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">запись</text>
<line x1="431.8" y1="128.0" x2="431.8" y2="226.0" stroke="#8a8985" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<rect x="442.7" y="150.0" width="82.0" height="54.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="483.7" y="181.1" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">глаз</text>
<line x1="535.5" y1="128.0" x2="535.5" y2="226.0" stroke="#8a8985" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<rect x="546.3" y="150.0" width="82.0" height="54.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="587.3" y="181.1" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">мозг</text>
<line x1="639.2" y1="128.0" x2="639.2" y2="226.0" stroke="#e34948" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<rect x="650.0" y="150.0" width="82.0" height="54.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="691.0" y="181.1" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">«я»</text>
<text x="128.8" y="104.0" font-size="12" fill="#008300" font-weight="600"><tspan x="128.8" dy="0.0">полосы пропадают здесь:</tspan><tspan x="128.8" dy="15.0">нагретая молекула, 2004</tspan></text>
<text x="631.2" y="104.0" font-size="12" fill="#e34948" text-anchor="end" font-weight="600"><tspan x="631.2" dy="0.0">популярная статья</tspan><tspan x="631.2" dy="15.0">проводит черту здесь</tspan></text>
<line x1="130.8" y1="248.0" x2="629.2" y2="248.0" stroke="#8a8985" stroke-width="1.4" stroke-linecap="round"/>
<line x1="130.8" y1="242.0" x2="130.8" y2="254.0" stroke="#8a8985" stroke-width="1.4" stroke-linecap="round"/>
<line x1="629.2" y1="242.0" x2="629.2" y2="254.0" stroke="#8a8985" stroke-width="1.4" stroke-linecap="round"/>
<text x="380.0" y="270.0" font-size="12" fill="#52514e" text-anchor="middle">между первым звеном и последним ни одна лаборатория не нашла, чтобы что-то происходило</text>
<text x="28.0" y="312.0" font-size="13" fill="#0b0b0b" font-weight="600">Не решено: почему молекула попадает в одно место. Это проблема измерения, и она открыта.</text>
<text x="28.0" y="344.0" font-size="11.5" fill="#8a8985">Схема рассуждения, а не данные. Цепочка фон Неймана, со звеньями опыта с двумя щелями.</text>
</svg>
