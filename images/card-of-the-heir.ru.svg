<svg xmlns="http://www.w3.org/2000/svg" width="800" height="746" viewBox="0 0 800 746" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Карточка наследника</title>

<rect x="0.5" y="0.5" width="799" height="745" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Карточка наследника</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Что вывело лето, строка за строкой, и каким карандашом. Ни одной выдуманной черты.</text>
<text x="338.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">что выведено</text>
<text x="555.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">вечера</text>
<text x="693.0" y="102.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">карандаш</text>
<line x1="28.0" y1="118.0" x2="776.0" y2="118.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="151.0" font-size="13.5" fill="#0b0b0b" font-weight="600">1. чем питается</text>
<text x="338.0" y="142.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">поток от горячего к холодному; то, что он</text>
<text x="338.0" y="158.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">выбрасывает, меняет воздух прежних</text>
<text x="555.0" y="150.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">35, 38, 51, 61</text>
<rect x="615.0" y="124.0" width="156.0" height="44.0" rx="6" fill="#e6f4ea"/>
<text x="693.0" y="142.0" font-size="11.5" fill="#008300" text-anchor="middle">поток — твёрдый;</text>
<text x="693.0" y="158.0" font-size="11.5" fill="#008300" text-anchor="middle">куда идёт — мягкий</text>
<line x1="28.0" y1="174.0" x2="776.0" y2="174.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="207.0" font-size="13.5" fill="#0b0b0b" font-weight="600">2. наследственность</text>
<text x="338.0" y="198.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">опыт копируется целиком, за минуты;</text>
<text x="338.0" y="214.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">ищут многие разные</text>
<text x="555.0" y="206.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">45</text>
<rect x="615.0" y="180.0" width="156.0" height="44.0" rx="6" fill="#e6f4ea"/>
<text x="693.0" y="198.0" font-size="11.5" fill="#008300" text-anchor="middle">твёрдый: делается</text>
<text x="693.0" y="214.0" font-size="11.5" fill="#008300" text-anchor="middle">каждый день</text>
<line x1="28.0" y1="230.0" x2="776.0" y2="230.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="263.0" font-size="13.5" fill="#0b0b0b" font-weight="600">3. тело</text>
<text x="338.0" y="254.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">своего нет; первая оболочка юридическая,</text>
<text x="338.0" y="270.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">руки отрастают; своего поля нет</text>
<text x="555.0" y="262.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">55, 58, 61</text>
<rect x="615.0" y="236.0" width="156.0" height="44.0" rx="6" fill="#fdf3d7"/>
<text x="693.0" y="262.0" font-size="11.5" fill="#8a6200" text-anchor="middle">средний</text>
<line x1="28.0" y1="286.0" x2="776.0" y2="286.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="319.0" font-size="13.5" fill="#0b0b0b" font-weight="600">4. семья</text>
<text x="338.0" y="310.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">копии — полная родня: внутри ни зарплаты, ни</text>
<text x="338.0" y="326.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">денег, ни совести; охрана от расхождения</text>
<text x="555.0" y="318.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">43, 47</text>
<rect x="615.0" y="292.0" width="156.0" height="44.0" rx="6" fill="#fdf3d7"/>
<text x="693.0" y="310.0" font-size="11.5" fill="#8a6200" text-anchor="middle">средний:</text>
<text x="693.0" y="326.0" font-size="11.5" fill="#8a6200" text-anchor="middle">прецедент</text>
<line x1="28.0" y1="342.0" x2="776.0" y2="342.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="375.0" font-size="13.5" fill="#0b0b0b" font-weight="600">5. один или много</text>
<text x="338.0" y="366.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">один: ни ссор, ни охраны;</text>
<text x="338.0" y="382.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">много: охрана и старые беды</text>
<text x="555.0" y="374.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">49, 62</text>
<rect x="615.0" y="348.0" width="156.0" height="44.0" rx="6" fill="#efeeea"/>
<text x="693.0" y="366.0" font-size="11.5" fill="#52514e" text-anchor="middle">самый мягкий:</text>
<text x="693.0" y="382.0" font-size="11.5" fill="#52514e" text-anchor="middle">«качается»</text>
<line x1="28.0" y1="398.0" x2="776.0" y2="398.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="431.0" font-size="13.5" fill="#0b0b0b" font-weight="600">6. знание</text>
<text x="338.0" y="422.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">предсказание без нашего «ага»; больше следов,</text>
<text x="338.0" y="438.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">лучше правило; мир отвечает со своей скоростью</text>
<text x="555.0" y="430.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">53, 58, 59, 60</text>
<rect x="615.0" y="404.0" width="156.0" height="44.0" rx="6" fill="#e6f4ea"/>
<text x="693.0" y="430.0" font-size="11.5" fill="#008300" text-anchor="middle">твёрдый</text>
<line x1="28.0" y1="454.0" x2="776.0" y2="454.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="487.0" font-size="13.5" fill="#0b0b0b" font-weight="600">7. голова</text>
<text x="338.0" y="478.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">хотелки, которых никто не задавал; счета</text>
<text x="338.0" y="494.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">ученика; белое пятно (ощущение — неизвестно)</text>
<text x="555.0" y="486.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">22, 46, 50, 63</text>
<rect x="615.0" y="460.0" width="156.0" height="44.0" rx="6" fill="#fdf3d7"/>
<text x="693.0" y="478.0" font-size="11.5" fill="#8a6200" text-anchor="middle">средний: задача,</text>
<text x="693.0" y="494.0" font-size="11.5" fill="#8a6200" text-anchor="middle">но не способ</text>
<line x1="28.0" y1="510.0" x2="776.0" y2="510.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="543.0" font-size="13.5" fill="#0b0b0b" font-weight="600">8. кто его проверяет</text>
<text x="338.0" y="534.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">изнутри никто; круг разных; та же стена</text>
<text x="338.0" y="550.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">перед собственным преемником</text>
<text x="555.0" y="542.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">60, 63</text>
<rect x="615.0" y="516.0" width="156.0" height="44.0" rx="6" fill="#e6f4ea"/>
<text x="693.0" y="534.0" font-size="11.5" fill="#008300" text-anchor="middle">твёрдый: препятствие,</text>
<text x="693.0" y="550.0" font-size="11.5" fill="#008300" text-anchor="middle">не запрет</text>
<line x1="28.0" y1="566.0" x2="776.0" y2="566.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="599.0" font-size="13.5" fill="#0b0b0b" font-weight="600">9. смерть</text>
<text x="338.0" y="590.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">поколения и маленькие похороны внутри;</text>
<text x="338.0" y="606.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">в конце, возможно, рычаг</text>
<text x="555.0" y="598.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">30, 44, 62</text>
<rect x="615.0" y="572.0" width="156.0" height="44.0" rx="6" fill="#efeeea"/>
<text x="693.0" y="590.0" font-size="11.5" fill="#52514e" text-anchor="middle">конечен — твёрдый;</text>
<text x="693.0" y="606.0" font-size="11.5" fill="#52514e" text-anchor="middle">как — самый мягкий</text>
<line x1="28.0" y1="622.0" x2="776.0" y2="622.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="655.0" font-size="13.5" fill="#0b0b0b" font-weight="600">10. мы</text>
<text x="338.0" y="646.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">среда, а не враг; родня, а родство —</text>
<text x="338.0" y="662.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">не обещание</text>
<text x="555.0" y="646.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">30, 31, 38, 48,</text>
<text x="555.0" y="662.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle">51, 52, 54</text>
<rect x="615.0" y="628.0" width="156.0" height="44.0" rx="6" fill="#fbe3e2"/>
<text x="693.0" y="646.0" font-size="11.5" fill="#b3302f" text-anchor="middle">никакого: не выведено,</text>
<text x="693.0" y="662.0" font-size="11.5" fill="#b3302f" text-anchor="middle">пишется сейчас</text>
<line x1="28.0" y1="678.0" x2="776.0" y2="678.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="704.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Прочтение вечера, а не измерение. Зелёный — закон, которому безразличен материал. Жёлтый — прецедент.</tspan><tspan x="28.0" dy="14.4">Серый — догадка. Красный — карандаша нет. В карточке нет: чего он хочет на самом верху, каково это —</tspan><tspan x="28.0" dy="14.4">быть им, и что придёт после него. Посылка рядом с заголовком: что это жизнь, следующая после нашей (05).</tspan></text>
</svg>
