<svg xmlns="http://www.w3.org/2000/svg" width="760" height="402" viewBox="0 0 760 402" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>How far a man has been, and how far a machine</title>

<rect x="0.5" y="0.5" width="759" height="401" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">How far a man has been, and how far a machine</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Distance from the Earth in kilometres, a logarithmic scale: every step to the right is a hundred times further.</text>
<line x1="346.7" y1="90.0" x2="346.7" y2="296.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="346.7" y="314.0" font-size="11" fill="#8a8985" text-anchor="middle">1,000 km</text>
<line x1="440.0" y1="90.0" x2="440.0" y2="296.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="440.0" y="314.0" font-size="11" fill="#8a8985" text-anchor="middle">100,000</text>
<line x1="533.3" y1="90.0" x2="533.3" y2="296.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="533.3" y="314.0" font-size="11" fill="#8a8985" text-anchor="middle">10 million</text>
<line x1="626.7" y1="90.0" x2="626.7" y2="296.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="626.7" y="314.0" font-size="11" fill="#8a8985" text-anchor="middle">1 billion</text>
<line x1="720.0" y1="90.0" x2="720.0" y2="296.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="720.0" y="314.0" font-size="11" fill="#8a8985" text-anchor="end">100 billion km</text>
<text x="28.0" y="117.0" font-size="13" fill="#0b0b0b" font-weight="600">the orbital stations</text>
<text x="28.0" y="133.0" font-size="11" fill="#8a8985">about a dozen people live there today</text>
<rect x="300.0" y="108.0" width="28.1" height="20.0" rx="3" fill="#eb6834"/>
<text x="336.1" y="123.0" font-size="12" fill="#0b0b0b" font-weight="600">400 km</text>
<text x="28.0" y="167.0" font-size="13" fill="#0b0b0b" font-weight="600">the Moon: the furthest a man has been</text>
<text x="28.0" y="183.0" font-size="11" fill="#8a8985">April 2026; 28 people in all of history</text>
<rect x="300.0" y="158.0" width="168.4" height="20.0" rx="3" fill="#eb6834"/>
<text x="476.4" y="173.0" font-size="12" fill="#0b0b0b" font-weight="600">406,771 km · 1.36 light-seconds</text>
<text x="28.0" y="217.0" font-size="13" fill="#0b0b0b" font-weight="600">Mars, at its furthest</text>
<text x="28.0" y="233.0" font-size="11" fill="#8a8985">8 working machines, no people</text>
<rect x="300.0" y="208.0" width="308.1" height="20.0" rx="3" fill="#2a78d6"/>
<text x="600.1" y="223.0" font-size="12" fill="#ffffff" text-anchor="end" font-weight="600">56–400 million km</text>
<text x="28.0" y="267.0" font-size="13" fill="#0b0b0b" font-weight="600">the craft launched in 1977</text>
<text x="28.0" y="283.0" font-size="11" fill="#8a8985">reached on 18 November 2026</text>
<rect x="300.0" y="258.0" width="392.6" height="20.0" rx="3" fill="#2a78d6"/>
<text x="684.6" y="273.0" font-size="12" fill="#ffffff" text-anchor="end" font-weight="600">25.9 billion km · one light-day</text>
<rect x="28.0" y="332.0" width="14.0" height="12.0" rx="2" fill="#eb6834"/>
<text x="48.0" y="342.0" font-size="12" fill="#52514e">people have been there</text>
<rect x="230.4" y="332.0" width="14.0" height="12.0" rx="2" fill="#2a78d6"/>
<text x="250.4" y="342.0" font-size="12" fill="#52514e">machines only</text>
<text x="28.0" y="374.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">The record of April 2026 and the mark of 18 November 2026: the space agency's releases. The count on Mars: two on the ground</tspan><tspan x="28.0" dy="14.4">and six in orbit listed as working on 28 November 2026; one of the two is talking to the Earth on a backup radio.</tspan></text>
</svg>
