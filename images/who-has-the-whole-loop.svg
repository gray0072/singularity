<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Who has the whole loop</title>

<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Who has the whole loop</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">A table in the ash: the same four steps, and who is missing which.</text>
<text x="326.0" y="108.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">pokes</text>
<text x="442.0" y="99.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600"><tspan x="442.0" dy="0.0">gets an answer</tspan><tspan x="442.0" dy="15.0">to its own poke</tspan></text>
<text x="558.0" y="108.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">finds the link</text>
<text x="674.0" y="99.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600"><tspan x="674.0" dy="0.0">the head keeps</tspan><tspan x="674.0" dy="15.0">what it found</tspan></text>
<line x1="28.0" y1="124.0" x2="732.0" y2="124.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="149.0" font-size="13" fill="#0b0b0b" font-weight="600">the kitten that walked</text>
<text x="34.0" y="166.0" font-size="11" fill="#8a8985">1963</text>
<text x="326.0" y="157.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<text x="442.0" y="157.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<text x="558.0" y="157.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<text x="674.0" y="157.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<line x1="28.0" y1="180.0" x2="732.0" y2="180.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="205.0" font-size="13" fill="#0b0b0b" font-weight="600">the kitten in the basket</text>
<text x="34.0" y="222.0" font-size="11" fill="#8a8985">the same eyes, the same view</text>
<text x="326.0" y="199.0" font-size="13" fill="#e34948" text-anchor="middle" font-weight="600">no</text>
<text x="326.0" y="214.0" font-size="10.5" fill="#52514e" text-anchor="middle">it is carried</text>
<text x="442.0" y="199.0" font-size="13" fill="#e34948" text-anchor="middle" font-weight="600">no</text>
<text x="442.0" y="214.0" font-size="10.5" fill="#52514e" text-anchor="middle"><tspan x="442.0" dy="0.0">what it sees does</tspan><tspan x="442.0" dy="13.1">not depend on it</tspan></text>
<text x="558.0" y="199.0" font-size="13" fill="#e34948" text-anchor="middle" font-weight="600">no</text>
<text x="558.0" y="214.0" font-size="10.5" fill="#52514e" text-anchor="middle">nothing to link</text>
<text x="674.0" y="213.0" font-size="13" fill="#e34948" text-anchor="middle" font-weight="600">no</text>
<line x1="28.0" y1="236.0" x2="732.0" y2="236.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="261.0" font-size="13" fill="#0b0b0b" font-weight="600">the program of 1989</text>
<text x="34.0" y="278.0" font-size="11" fill="#8a8985">boards and their faults</text>
<text x="326.0" y="269.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<text x="442.0" y="269.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<text x="558.0" y="269.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<text x="674.0" y="269.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<line x1="28.0" y1="292.0" x2="732.0" y2="292.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="316.0" font-size="13" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">a talking machine,</tspan><tspan x="34.0" dy="16.2">while it learns from books</tspan></text>
<text x="326.0" y="311.0" font-size="13" fill="#e34948" text-anchor="middle" font-weight="600">no</text>
<text x="326.0" y="326.0" font-size="10.5" fill="#52514e" text-anchor="middle"><tspan x="326.0" dy="0.0">its guess changes</tspan><tspan x="326.0" dy="13.1">nothing in the book</tspan></text>
<text x="442.0" y="311.0" font-size="13" fill="#e34948" text-anchor="middle" font-weight="600">no</text>
<text x="442.0" y="326.0" font-size="10.5" fill="#52514e" text-anchor="middle"><tspan x="442.0" dy="0.0">the next word was</tspan><tspan x="442.0" dy="13.1">written long ago</tspan></text>
<text x="558.0" y="325.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<text x="674.0" y="325.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<line x1="28.0" y1="348.0" x2="732.0" y2="348.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="372.0" font-size="13" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">the same machine,</tspan><tspan x="34.0" dy="16.2">in a conversation</tspan></text>
<text x="326.0" y="381.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<text x="442.0" y="381.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<text x="558.0" y="381.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<text x="674.0" y="367.0" font-size="13" fill="#e34948" text-anchor="middle" font-weight="600">no</text>
<text x="674.0" y="382.0" font-size="10.5" fill="#52514e" text-anchor="middle"><tspan x="674.0" dy="0.0">the network itself</tspan><tspan x="674.0" dy="13.1">does not change</tspan></text>
<line x1="28.0" y1="404.0" x2="732.0" y2="404.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="421.0" font-size="13" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">a machine with tools, whose</tspan><tspan x="34.0" dy="16.2">experience goes back into learning</tspan></text>
<text x="34.0" y="454.0" font-size="11" fill="#8a8985">being built</text>
<text x="326.0" y="437.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<text x="442.0" y="437.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<text x="558.0" y="437.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<text x="674.0" y="437.0" font-size="13" fill="#008300" text-anchor="middle" font-weight="600">yes</text>
<line x1="28.0" y1="460.0" x2="732.0" y2="460.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="486.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">The evening's reading, not a measurement. The kittens: Held and Hein (1963). A talking machine can keep notes</tspan><tspan x="28.0" dy="14.4">between conversations; the row says only that the network which answers is not changed by the talk.</tspan></text>
</svg>
