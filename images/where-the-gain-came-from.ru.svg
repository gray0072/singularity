<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Откуда взялся рост и кому он достался</title>

<rect x="0.5" y="0.5" width="759" height="371" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Откуда взялся рост и кому он достался</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Два подсчёта экономистов; каждая полоса — целое, разделённое надвое.</text>
<text x="28.0" y="100.0" font-size="13" fill="#52514e">Выработка за час труда удвоилась (США, 1909–1949). Откуда это взялось:</text>
<rect x="28.0" y="112.0" width="88.0" height="34.0" rx="2" fill="#8a8985" fill-opacity="0.9"/>
<rect x="118.0" y="112.0" width="614.0" height="34.0" rx="2" fill="#2a78d6" fill-opacity="0.9"/>
<text x="132.0" y="134.0" font-size="13.5" fill="#ffffff" font-weight="600">⅞: всё остальное. Солоу назвал это «техническим прогрессом»</text>
<line x1="72.0" y1="146.0" x2="72.0" y2="158.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="174.0" font-size="12.5" fill="#0b0b0b" font-weight="600">⅛: больше машин на работника</text>
<text x="28.0" y="212.0" font-size="13" fill="#52514e">Выигрыш от новых изобретений (США, 1948–2001). Кому он достался:</text>
<rect x="28.0" y="224.0" width="15.5" height="34.0" rx="2" fill="#8a8985" fill-opacity="0.9"/>
<rect x="45.5" y="224.0" width="686.5" height="34.0" rx="2" fill="#008300" fill-opacity="0.9"/>
<text x="59.5" y="246.0" font-size="13.5" fill="#ffffff" font-weight="600">около 98%: всем остальным, дешевизной</text>
<line x1="35.7" y1="258.0" x2="35.7" y2="270.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="286.0" font-size="12.5" fill="#0b0b0b" font-weight="600">2,2%: тем, кто изобрёл</text>
<text x="28.0" y="318.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Солоу (1957); Нордхаус (2004), оценки которого лежат между 1,3% и 3,3%. Семь восьмых — это остаток:</tspan><tspan x="28.0" dy="14.4">то, чего не объясняет рост числа машин и отработанных часов. Коллега Солоу назвал его</tspan><tspan x="28.0" dy="14.4">«своего рода мерой нашего незнания».</tspan></text>
</svg>
