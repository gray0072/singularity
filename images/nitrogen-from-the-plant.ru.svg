<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Кого кормит азотный завод</title>

<rect x="0.5" y="0.5" width="759" height="379" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Кого кормит азотный завод</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Люди, которых кормит старый оборот (клевер, навоз, молния) и азот, взятый из воздуха на заводе.</text>
<rect x="110.0" y="84.0" width="14.0" height="14.0" rx="3" fill="#1baf7a"/>
<text x="132.0" y="96.0" font-size="12.5" fill="#52514e">старый оборот</text>
<rect x="300.0" y="84.0" width="14.0" height="14.0" rx="3" fill="#eb6834"/>
<text x="322.0" y="96.0" font-size="12.5" fill="#52514e">азот с завода</text>
<text x="40.0" y="141.0" font-size="15" fill="#0b0b0b" font-weight="600">1900</text>
<rect x="110.0" y="118.0" width="105.6" height="34.0" rx="3" fill="#1baf7a"/>
<text x="227.6" y="133.0" font-size="13.5" fill="#0b0b0b" font-weight="600">1,6 млрд</text>
<text x="227.6" y="150.0" font-size="12" fill="#52514e">все: таких заводов ещё не было</text>
<text x="40.0" y="201.0" font-size="15" fill="#0b0b0b" font-weight="600">2025</text>
<rect x="110.0" y="178.0" width="281.4" height="34.0" rx="3" fill="#1baf7a"/>
<rect x="391.4" y="178.0" width="259.8" height="34.0" rx="3" fill="#eb6834"/>
<text x="521.3" y="200.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">около половины</text>
<text x="661.2" y="201.0" font-size="13.5" fill="#0b0b0b" font-weight="600">8,2 млрд</text>
<line x1="28.0" y1="238.0" x2="732.0" y2="238.0" stroke="#e9e8e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="110.0" y="260.0" font-size="12.5" fill="#52514e">азот в теле человека, около 2 кг</text>
<rect x="110.0" y="270.0" width="150.0" height="22.0" rx="3" fill="#1baf7a"/>
<rect x="260.0" y="270.0" width="150.0" height="22.0" rx="3" fill="#eb6834"/>
<text x="422.0" y="286.0" font-size="13" fill="#0b0b0b" font-weight="600">около половины прошло через завод</text>
<text x="28.0" y="334.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Доля для 2025 года — те 48%, которые Эрисман и др. (2008) насчитали для 2008 года, приложенные</tspan><tspan x="28.0" dy="14.4">к нынешнему населению: грубая арифметика, для стола, какой накрыт сегодня. Первый завод: 1913.</tspan></text>
</svg>
