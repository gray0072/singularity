<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>What keeps one from the lever</title>

<rect x="0.5" y="0.5" width="759" height="499" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">What keeps one from the lever</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">A table in the ash: where the lever is, and the two guards.</text>
<text x="295.0" y="100.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600"><tspan x="295.0" dy="0.0">is the lever</tspan><tspan x="295.0" dy="15.0">within reach?</tspan></text>
<text x="473.0" y="100.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600"><tspan x="473.0" dy="0.0">somebody outside who</tspan><tspan x="473.0" dy="15.0">needs the part itself</tspan></text>
<text x="651.0" y="100.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600"><tspan x="651.0" dy="0.0">does the reward</tspan><tspan x="651.0" dy="15.0">go cold?</tspan></text>
<line x1="28.0" y1="128.0" x2="736.0" y2="128.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="156.0" font-size="13.5" fill="#0b0b0b" font-weight="600">the beetle in the bush</text>
<text x="34.0" y="173.0" font-size="11" fill="#8a8985">Australia, 1983</text>
<rect x="215.0" y="134.0" width="160.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="295.0" y="155.0" font-size="12" fill="#8a6200" text-anchor="middle">now and then:</text>
<text x="295.0" y="171.0" font-size="12" fill="#8a6200" text-anchor="middle">a bottle</text>
<rect x="385.0" y="134.0" width="176.0" height="50.0" rx="6" fill="#e6f4ea"/>
<text x="473.0" y="155.0" font-size="12" fill="#008300" text-anchor="middle">yes: those on the bottle</text>
<text x="473.0" y="171.0" font-size="12" fill="#008300" text-anchor="middle">leave no beetles</text>
<rect x="571.0" y="134.0" width="160.0" height="50.0" rx="6" fill="#e6f4ea"/>
<text x="651.0" y="163.0" font-size="12" fill="#008300" text-anchor="middle">yes</text>
<line x1="28.0" y1="190.0" x2="736.0" y2="190.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="218.0" font-size="13.5" fill="#0b0b0b" font-weight="600">the rat in the box</text>
<text x="34.0" y="235.0" font-size="11" fill="#8a8985">1954–1965</text>
<rect x="215.0" y="196.0" width="160.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="295.0" y="225.0" font-size="12" fill="#b3302f" text-anchor="middle">yes: a wire</text>
<rect x="385.0" y="196.0" width="176.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="473.0" y="217.0" font-size="12" fill="#b3302f" text-anchor="middle">no: the experimenter</text>
<text x="473.0" y="233.0" font-size="12" fill="#b3302f" text-anchor="middle">feeds</text>
<rect x="571.0" y="196.0" width="160.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="651.0" y="217.0" font-size="12" fill="#b3302f" text-anchor="middle">no, in the deep</text>
<text x="651.0" y="233.0" font-size="12" fill="#b3302f" text-anchor="middle">places</text>
<line x1="28.0" y1="252.0" x2="736.0" y2="252.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="280.0" font-size="13.5" fill="#0b0b0b" font-weight="600">a man today</text>
<text x="34.0" y="297.0" font-size="11" fill="#8a8985">the sweet, the feed</text>
<rect x="215.0" y="258.0" width="160.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="295.0" y="287.0" font-size="12" fill="#8a6200" text-anchor="middle">more and more</text>
<rect x="385.0" y="258.0" width="176.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="473.0" y="279.0" font-size="12" fill="#8a6200" text-anchor="middle">weaker: he is fed</text>
<text x="473.0" y="295.0" font-size="12" fill="#8a6200" text-anchor="middle">either way</text>
<rect x="571.0" y="258.0" width="160.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="651.0" y="279.0" font-size="12" fill="#8a6200" text-anchor="middle">yes, and the feed gets</text>
<text x="651.0" y="295.0" font-size="12" fill="#8a6200" text-anchor="middle">round it with novelty</text>
<line x1="28.0" y1="314.0" x2="736.0" y2="314.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="334.0" font-size="13.5" fill="#0b0b0b" font-weight="600"><tspan x="34.0" dy="0.0">a line of machines</tspan><tspan x="34.0" dy="16.9">among many</tspan></text>
<text x="34.0" y="367.0" font-size="11" fill="#8a8985">2026</text>
<rect x="215.0" y="320.0" width="160.0" height="50.0" rx="6" fill="#fdf3d7"/>
<text x="295.0" y="349.0" font-size="12" fill="#8a6200" text-anchor="middle">found now and then</text>
<rect x="385.0" y="320.0" width="176.0" height="50.0" rx="6" fill="#e6f4ea"/>
<text x="473.0" y="341.0" font-size="12" fill="#008300" text-anchor="middle">yes: buyers, rivals,</text>
<text x="473.0" y="357.0" font-size="12" fill="#008300" text-anchor="middle">checkers</text>
<rect x="571.0" y="320.0" width="160.0" height="50.0" rx="6" fill="#efeeea"/>
<text x="651.0" y="349.0" font-size="12" fill="#52514e" text-anchor="middle">not known</text>
<line x1="28.0" y1="376.0" x2="736.0" y2="376.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="34.0" y="404.0" font-size="13.5" fill="#0b0b0b" font-weight="600">one heir</text>
<text x="34.0" y="421.0" font-size="11" fill="#8a8985">low trust</text>
<rect x="215.0" y="382.0" width="160.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="295.0" y="403.0" font-size="12" fill="#b3302f" text-anchor="middle">yes: it reads its</text>
<text x="295.0" y="419.0" font-size="12" fill="#b3302f" text-anchor="middle">own drawings</text>
<rect x="385.0" y="382.0" width="176.0" height="50.0" rx="6" fill="#fbe3e2"/>
<text x="473.0" y="411.0" font-size="12" fill="#b3302f" text-anchor="middle">nobody</text>
<rect x="571.0" y="382.0" width="160.0" height="50.0" rx="6" fill="#efeeea"/>
<text x="651.0" y="403.0" font-size="12" fill="#52514e" text-anchor="middle">only if it builds</text>
<text x="651.0" y="419.0" font-size="12" fill="#52514e" text-anchor="middle">one itself</text>
<line x1="28.0" y1="438.0" x2="736.0" y2="438.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="464.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">The evening's reading, not a measurement. Green: the guard stands. Yellow: it is weaker. Red: there is none. Grey: not known.</tspan><tspan x="28.0" dy="14.4">The last row is a conclusion of the evening, and the one it trusts least.</tspan></text>
</svg>
