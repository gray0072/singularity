<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Печь, которая остывает, и печь, которая не остывает</title>
<defs><marker id="arrow-52514e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#52514e"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="429" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Печь, которая остывает, и печь, которая не остывает</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Сколько платит награда в зависимости от того, сколько раз её получили.</text>
<line x1="70.0" y1="310.0" x2="720.0" y2="310.0" stroke="#52514e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<line x1="70.0" y1="310.0" x2="70.0" y2="90.0" stroke="#52514e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow-52514e)"/>
<text x="56.0" y="205.0" font-size="12" fill="#52514e" text-anchor="middle" transform="rotate(-90 56.0 205.0)">сколько платит</text>
<text x="395.0" y="334.0" font-size="12" fill="#52514e" text-anchor="middle">сколько раз её получили</text>
<path d="M78.0,134.0 L84.2,140.7 L90.4,147.0 L96.6,153.2 L102.8,159.0 L109.0,164.7 L115.2,170.1 L121.4,175.2 L127.6,180.2 L133.8,185.0 L140.0,189.5 L146.2,193.9 L152.4,198.1 L158.6,202.1 L164.8,206.0 L171.0,209.7 L177.2,213.2 L183.4,216.6 L189.6,219.9 L195.8,223.0 L202.0,226.0 L208.2,228.9 L214.4,231.6 L220.6,234.3 L226.8,236.8 L233.0,239.3 L239.2,241.6 L245.4,243.8 L251.6,246.0 L257.8,248.0 L264.0,250.0 L270.2,251.9 L276.4,253.7 L282.6,255.4 L288.8,257.1 L295.0,258.7 L301.2,260.2 L307.4,261.7 L313.6,263.1 L319.8,264.4 L326.0,265.7 L332.2,267.0 L338.4,268.2 L344.6,269.3 L350.8,270.4 L357.0,271.5 L363.2,272.5 L369.4,273.4 L375.6,274.4 L381.8,275.2 L388.0,276.1 L394.2,276.9 L400.4,277.7 L406.6,278.4 L412.8,279.2 L419.0,279.8 L425.2,280.5 L431.4,281.1 L437.6,281.8 L443.8,282.3 L450.0,282.9 L456.2,283.4 L462.4,283.9 L468.6,284.4 L474.8,284.9 L481.0,285.4 L487.2,285.8 L493.4,286.2 L499.6,286.6 L505.8,287.0 L512.0,287.4 L518.2,287.7 L524.4,288.0 L530.6,288.4 L536.8,288.7 L543.0,289.0 L549.2,289.3 L555.4,289.5 L561.6,289.8 L567.8,290.1 L574.0,290.3 L580.2,290.5 L586.4,290.7 L592.6,291.0 L598.8,291.2 L605.0,291.4 L611.2,291.5 L617.4,291.7 L623.6,291.9 L629.8,292.1 L636.0,292.2 L642.2,292.4 L648.4,292.5 L654.6,292.7 L660.8,292.8 L667.0,292.9 L673.2,293.0 L679.4,293.2 L685.6,293.3 L691.8,293.4 L698.0,293.5" stroke="#2a78d6" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="78.0" y1="134.0" x2="698.0" y2="134.0" stroke="#e34948" stroke-width="2.6" stroke-linecap="round"/>
<text x="698.0" y="106.0" font-size="12.5" fill="#e34948" text-anchor="end" font-weight="600">провод в глубоких местах крысиного мозга</text>
<text x="698.0" y="123.0" font-size="11.5" fill="#52514e" text-anchor="end">платит столько же: крыса остаётся у рычага</text>
<text x="300.0" y="232.0" font-size="12.5" fill="#2a78d6" font-weight="600">обычная награда: еда, выигрыш, тёплая печь</text>
<text x="300.0" y="249.0" font-size="11.5" fill="#52514e">с каждым разом платит меньше: слезай и иди дальше</text>
<text x="28.0" y="372.0" font-size="13" fill="#0b0b0b" font-weight="600">Награда, которая не остывает, — это рычаг. Беличье колесо — замок на нём.</text>
<text x="28.0" y="396.0" font-size="11.5" fill="#8a8985"><tspan x="28.0" dy="0.0">Форма результата, а не измеренные точки. Сытости с проводом в гипоталамусе не увидели — статья 1958 года;</tspan><tspan x="28.0" dy="14.4">в других местах некоторую сытость видели. Остывание обычных наград — вечер хотелок.</tspan></text>
</svg>
