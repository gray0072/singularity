<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>The chirp we cannot hear</title>

<rect x="0.5" y="0.5" width="759" height="389" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">The chirp we cannot hear</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Sound frequency on a logarithmic scale. Our hearing ends at about 20 kilohertz.</text>
<line x1="200.0" y1="100.0" x2="200.0" y2="324.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="200.0" y="342.0" font-size="11.5" fill="#8a8985" text-anchor="middle">20 Hz</text>
<line x1="298.3" y1="100.0" x2="298.3" y2="324.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="298.3" y="342.0" font-size="11.5" fill="#8a8985" text-anchor="middle">100 Hz</text>
<line x1="438.8" y1="100.0" x2="438.8" y2="324.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="438.8" y="342.0" font-size="11.5" fill="#8a8985" text-anchor="middle">1 kHz</text>
<line x1="579.4" y1="100.0" x2="579.4" y2="324.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="579.4" y="342.0" font-size="11.5" fill="#8a8985" text-anchor="middle">10 kHz</text>
<line x1="720.0" y1="100.0" x2="720.0" y2="324.0" stroke="#e9e8e4" stroke-width="1" stroke-linecap="round"/>
<text x="720.0" y="342.0" font-size="11.5" fill="#8a8985" text-anchor="middle">100 kHz</text>
<line x1="621.7" y1="90.0" x2="621.7" y2="324.0" stroke="#e34948" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="613.7" y="96.0" font-size="12" fill="#e34948" text-anchor="end">our hearing ends here</text>
<text x="186.0" y="131.0" font-size="13" fill="#0b0b0b" text-anchor="end">human hearing</text>
<text x="186.0" y="167.0" font-size="13" fill="#0b0b0b" text-anchor="end"><tspan x="186.0" dy="0.0">human laughter,</tspan><tspan x="186.0" dy="16.2">the main tone</tspan></text>
<text x="186.0" y="219.0" font-size="13" fill="#0b0b0b" text-anchor="end">rat hearing</text>
<text x="186.0" y="263.0" font-size="13" fill="#0b0b0b" text-anchor="end">a rat's alarm call</text>
<text x="186.0" y="299.0" font-size="13" fill="#0b0b0b" text-anchor="end"><tspan x="186.0" dy="0.0">a rat's chirp in play</tspan><tspan x="186.0" dy="16.2">and under tickling</tspan></text>
<rect x="200.0" y="115.0" width="421.7" height="22.0" rx="3" fill="#1baf7a" fill-opacity="0.85"/>
<text x="631.7" y="130.5" font-size="12.5" fill="#0b0b0b" font-weight="600">20 Hz – 20 kHz</text>
<rect x="354.2" y="159.0" width="42.3" height="22.0" rx="3" fill="#1baf7a" fill-opacity="0.85"/>
<text x="406.5" y="174.5" font-size="12.5" fill="#0b0b0b" font-weight="600">a few hundred hertz</text>
<rect x="354.2" y="203.0" width="352.2" height="22.0" rx="3" fill="#2a78d6" fill-opacity="0.85"/>
<text x="366.2" y="218.5" font-size="12.5" fill="#ffffff" font-weight="600">about 250 Hz – 80 kHz</text>
<circle cx="627.6" cy="258.0" r="7.0" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="613.6" y="262.5" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">about 22 kHz</text>
<circle cx="677.7" cy="302.0" r="7.0" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="663.7" y="306.5" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">about 50 kHz</text>
<line x1="200.0" y1="100.0" x2="200.0" y2="324.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="374.0" font-size="11.5" fill="#8a8985">Rounded figures; the hearing ranges are approximate. The calls of rats: Panksepp &amp; Burgdorf (2003).</text>
</svg>
