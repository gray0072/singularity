<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Шесть строк, три задачи, одно слово</title>

<rect x="0.5" y="0.5" width="759" height="391" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Шесть строк, три задачи, одно слово</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">Шесть строк тетради, три задачи, к которым они сводятся, и одно слово из этих задач.</text>
<rect x="280.0" y="86.0" width="200.0" height="42.0" rx="8" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="380.0" y="112.5" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">учиться</text>
<line x1="380.0" y1="128.0" x2="138.0" y2="164.0" stroke="#52514e" stroke-width="1.3" stroke-linecap="round"/>
<rect x="28.0" y="164.0" width="220.0" height="80.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="138.0" y="192.6" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">сохранить</text>
<text x="138.0" y="211.4" font-size="13" fill="#52514e" text-anchor="middle"><tspan x="138.0" dy="0.0">выученное,</tspan><tspan x="138.0" dy="16.2">пока учишь новое</tspan></text>
<line x1="138.0" y1="244.0" x2="81.0" y2="272.0" stroke="#2a78d6" stroke-width="1.3" stroke-linecap="round"/>
<rect x="28.0" y="272.0" width="106.0" height="52.0" rx="8" fill="#2a78d6" fill-opacity="0.1"/>
<text x="81.0" y="294.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">сон</text>
<text x="81.0" y="312.0" font-size="11" fill="#52514e" text-anchor="middle">за ночь</text>
<line x1="138.0" y1="244.0" x2="195.0" y2="272.0" stroke="#2a78d6" stroke-width="1.3" stroke-linecap="round"/>
<rect x="142.0" y="272.0" width="106.0" height="52.0" rx="8" fill="#2a78d6" fill-opacity="0.1"/>
<text x="195.0" y="294.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">ворчание</text>
<text x="195.0" y="312.0" font-size="11" fill="#52514e" text-anchor="middle">за жизнь</text>
<line x1="380.0" y1="128.0" x2="380.0" y2="164.0" stroke="#52514e" stroke-width="1.3" stroke-linecap="round"/>
<rect x="270.0" y="164.0" width="220.0" height="80.0" rx="8" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.5"/>
<text x="380.0" y="192.6" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">связать</text>
<text x="380.0" y="211.4" font-size="13" fill="#52514e" text-anchor="middle"><tspan x="380.0" dy="0.0">то, что пришло вместе,</tspan><tspan x="380.0" dy="16.2">ещё не зная почему</tspan></text>
<line x1="380.0" y1="244.0" x2="323.0" y2="272.0" stroke="#1baf7a" stroke-width="1.3" stroke-linecap="round"/>
<rect x="270.0" y="272.0" width="106.0" height="52.0" rx="8" fill="#1baf7a" fill-opacity="0.1"/>
<text x="323.0" y="294.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">сны</text>
<text x="323.0" y="312.0" font-size="11" fill="#52514e" text-anchor="middle">без датчиков</text>
<line x1="380.0" y1="244.0" x2="437.0" y2="272.0" stroke="#1baf7a" stroke-width="1.3" stroke-linecap="round"/>
<rect x="384.0" y="272.0" width="106.0" height="52.0" rx="8" fill="#1baf7a" fill-opacity="0.1"/>
<text x="437.0" y="294.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">приметы</text>
<text x="437.0" y="312.0" font-size="11" fill="#52514e" text-anchor="middle">мало данных</text>
<line x1="380.0" y1="128.0" x2="622.0" y2="164.0" stroke="#52514e" stroke-width="1.3" stroke-linecap="round"/>
<rect x="512.0" y="164.0" width="220.0" height="80.0" rx="8" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="622.0" y="192.6" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">проверить</text>
<text x="622.0" y="211.4" font-size="13" fill="#52514e" text-anchor="middle"><tspan x="622.0" dy="0.0">свои прогнозы,</tspan><tspan x="622.0" dy="16.2">пока ошибка дёшева</tspan></text>
<line x1="622.0" y1="244.0" x2="565.0" y2="272.0" stroke="#eb6834" stroke-width="1.3" stroke-linecap="round"/>
<rect x="512.0" y="272.0" width="106.0" height="52.0" rx="8" fill="#eb6834" fill-opacity="0.1"/>
<text x="565.0" y="294.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">смех</text>
<text x="565.0" y="312.0" font-size="11" fill="#52514e" text-anchor="middle">пойманный промах</text>
<line x1="622.0" y1="244.0" x2="679.0" y2="272.0" stroke="#eb6834" stroke-width="1.3" stroke-linecap="round"/>
<rect x="626.0" y="272.0" width="106.0" height="52.0" rx="8" fill="#eb6834" fill-opacity="0.1"/>
<text x="679.0" y="294.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">песни</text>
<text x="679.0" y="312.0" font-size="11" fill="#52514e" text-anchor="middle">попадание</text>
<text x="28.0" y="360.0" font-size="11.5" fill="#8a8985">Строки — из вечеров 33, 36, 39, 41 и 44. Группировка по трём задачам — прочтение Андрея.</text>
</svg>
