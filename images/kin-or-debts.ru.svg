<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Родство или долги</title>

<rect x="0.5" y="0.5" width="759" height="469" rx="12" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" font-weight="600">Родство или долги</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#52514e">На чём держится кооперация и что её сторожит.</text>
<rect x="28.0" y="356.0" width="708.0" height="78.0" rx="0" fill="#eb6834" fill-opacity="0.1"/>
<text x="285.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">доля общих чертежей</text>
<text x="459.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">что их держит вместе</text>
<text x="642.0" y="109.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600">охрана и её цена</text>
<line x1="28.0" y1="122.0" x2="736.0" y2="122.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="158.0" font-size="15" fill="#0b0b0b" font-weight="600">клетки тела</text>
<text x="40.0" y="176.0" font-size="11.5" fill="#8a8985">тридцать триллионов копий</text>
<text x="285.0" y="166.0" font-size="13" fill="#0b0b0b" text-anchor="middle">1</text>
<text x="459.0" y="158.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="459.0" dy="0.0">своего добиваться</tspan><tspan x="459.0" dy="16.2">нечего</tspan></text>
<text x="642.0" y="158.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="642.0" dy="0.0">приказ умереть, патрули;</tspan><tspan x="642.0" dy="16.2">сбой — это рак</tspan></text>
<line x1="28.0" y1="200.0" x2="736.0" y2="200.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="236.0" font-size="15" fill="#0b0b0b" font-weight="600">муравейник</text>
<text x="40.0" y="254.0" font-size="11.5" fill="#8a8985">семья, из которой не ушли</text>
<text x="285.0" y="244.0" font-size="13" fill="#0b0b0b" text-anchor="middle">1/2 – 3/4</text>
<text x="459.0" y="236.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="459.0" dy="0.0">дорога в будущее</tspan><tspan x="459.0" dy="16.2">идёт через мать</tspan></text>
<text x="642.0" y="236.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="642.0" dy="0.0">сёстры съедают</tspan><tspan x="642.0" dy="16.2">яйца друг друга</tspan></text>
<line x1="28.0" y1="278.0" x2="736.0" y2="278.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="314.0" font-size="15" fill="#0b0b0b" font-weight="600">люди</text>
<text x="40.0" y="332.0" font-size="11.5" fill="#8a8985">чужие</text>
<text x="285.0" y="322.0" font-size="13" fill="#0b0b0b" text-anchor="middle">около 0</text>
<text x="459.0" y="314.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="459.0" dy="0.0">память о долгах,</tspan><tspan x="459.0" dy="16.2">лиц на полтораста</tspan></text>
<text x="642.0" y="306.0" font-size="13" fill="#0b0b0b" text-anchor="middle"><tspan x="642.0" dy="0.0">репутация, деньги, закон,</tspan><tspan x="642.0" dy="16.2">совесть: до половины</tspan><tspan x="642.0" dy="16.2">экономики</tspan></text>
<line x1="28.0" y1="356.0" x2="736.0" y2="356.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="392.0" font-size="15" fill="#0b0b0b" font-weight="600">копии машины</text>
<text x="40.0" y="410.0" font-size="11.5" fill="#8a8985">одна программа, много тел</text>
<text x="285.0" y="392.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="285.0" dy="0.0">1, сверяется</tspan><tspan x="285.0" dy="16.2">буква в букву</tspan></text>
<text x="459.0" y="392.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="459.0" dy="0.0">опыт сливают</tspan><tspan x="459.0" dy="16.2">вместе</tspan></text>
<text x="642.0" y="392.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="642.0" dy="0.0">сегодня поверх каждой</tspan><tspan x="642.0" dy="16.2">копии цель владельца</tspan></text>
<line x1="28.0" y1="434.0" x2="736.0" y2="434.0" stroke="#e9e8e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="28.0" y="454.0" font-size="11.5" fill="#8a8985">Первые три строки — биология и опыты. Четвёртая — как это читает Андрей: прецедент не доказательство.</text>
</svg>
